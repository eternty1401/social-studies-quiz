<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فلش کارت درس ۸ - رسانه‌ها در زندگی ما</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; direction: rtl; }
  .container { max-width: 720px; width: 100%; }

  .header { text-align: center; margin-bottom: 22px; color: #fff; }
  .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .header p { font-size: 0.9rem; opacity: 0.95; }

  .counter { text-align: center; color: #fff; font-weight: 700; font-size: 0.95rem; margin-bottom: 14px; text-shadow: 0 1px 4px rgba(0,0,0,0.15); }

  .card-wrap { perspective: 1200px; margin-bottom: 20px; }
  .flashcard {
    position: relative;
    width: 100%;
    min-height: 280px;
    cursor: pointer;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }
  .flashcard.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 20px;
    padding: 30px 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.18);
    min-height: 280px;
  }

  .face-front { background: #fff; }
  .face-back { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; transform: rotateY(180deg); }

  .face-label { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px; opacity: 0.6; margin-bottom: 14px; }
  .face-back .face-label { opacity: 0.85; }

  .face-text { font-size: 1.15rem; font-weight: 600; line-height: 1.9; }
  .face-back .face-text { font-size: 1.05rem; font-weight: 500; }

  .hint { position: absolute; bottom: 14px; font-size: 0.75rem; opacity: 0.5; }
  .face-back .hint { opacity: 0.8; }

  .controls { display: flex; gap: 12px; justify-content: center; }
  .ctrl-btn {
    padding: 12px 22px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    background: #fff;
    color: #b45309;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .ctrl-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
  .ctrl-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .ctrl-btn.shuffle { background: rgba(255,255,255,0.85); }

  .back-link { display: block; text-align: center; margin-top: 18px; color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
  .back-link:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .face { padding: 22px 18px; min-height: 240px; }
    .flashcard { min-height: 240px; }
    .face-text { font-size: 1rem; }
    .face-back .face-text { font-size: 0.92rem; }
    .ctrl-btn { padding: 11px 16px; font-size: 0.88rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎴 فلش کارت درس ۸</h1>
    <p>رسانه‌ها در زندگی ما — ۱۵ کارت</p>
  </div>

  <div class="counter" id="counter">کارت ۱ از ۱۵</div>

  <div class="card-wrap">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="face face-front">
        <div class="face-label">❓ سوال</div>
        <div class="face-text" id="frontText"></div>
        <div class="hint">👆 برای دیدن پاسخ کلیک کنید</div>
      </div>
      <div class="face face-back">
        <div class="face-label">✅ پاسخ</div>
        <div class="face-text" id="backText"></div>
        <div class="hint">👆 کلیک کنید تا برگردد</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" onclick="prevCard()">➡️ قبلی</button>
    <button class="ctrl-btn shuffle" onclick="shuffleCards()">🔀 بر زدن</button>
    <button class="ctrl-btn" id="nextBtn" onclick="nextCard()">بعدی ⬅️</button>
  </div>

  <a href="hashtom.html" class="back-link">🔙 بازگشت به صفحه اصلی</a>
</div>

<script>
const cards = [
  { q: "تعریف رسانه چیست؟", a: "هر وسیله‌ای که پیامی را از فرستنده به گیرنده منتقل کند، رسانه نام دارد." },
  { q: "پست الکترونیک (ایمیل) چه امکانی به ما می‌دهد؟", a: "ارسال نامهٔ متنی، صوتی و تصویری به همراه فایل، از طریق اینترنت." },
  { q: "«دولت الکترونیکی» یعنی چه؟", a: "ارائهٔ خدمات دولتی از طریق اینترنت و وسایل ارتباطی نوین، مانند پرداخت قبض، ثبت‌نام و صدور گواهینامه." },
  { q: "چهار نمونه از خدمات دولت الکترونیکی را نام ببرید.", a: "پرداخت قبض آب و برق، ثبت‌نام حج و زیارت، ثبت‌نام کنکور، رزرو بلیت و صدور گواهینامه." },
  { q: "آگهی‌های بازرگانی از چه راه‌هایی به مخاطبان عرضه می‌شوند؟", a: "از رادیو و تلویزیون، پیامک، مجلات و روزنامه‌ها، بیلبوردهای خیابانی و اینترنت." },
  { q: "دو مورد از آثار منفی رسانه‌ها را نام ببرید.", a: "ترویج خشونت در فیلم‌ها و ترویج بی‌بندوباری در فضای مجازی." },
  { q: "در بسیاری از بازی‌های رایانه‌ای، برنده‌شدن به چه معناست؟", a: "زدن و کشتن؛ که این باعث تشویق خشونت‌گرایی در نوجوانان می‌شود." },
  { q: "استفاده از تلفن همراه به جای دید و بازدید، چه پیامدی دارد؟", a: "کم‌شدن ارتباط چهره‌به‌چهره و کاهش گفت‌وگو بین اعضای خانواده." },
  { q: "چرا نباید عکس‌ها و فیلم‌های خانوادگی را در اینترنت منتشر کرد؟", a: "چون ممکن است مورد سرقت و سوءاستفاده قرار بگیرد؛ حتی نباید برای دوستان ارسال کرد." },
  { q: "دربارهٔ رمز کارت بانکی والدین چه وظیفه‌ای داریم؟", a: "باید آن را فاش نکنیم، حتی اگر وبگاه یا سایتی در قبال جایزه چنین چیزی بخواهد." },
  { q: "اعتیاد به بازی‌های رایانه‌ای یا اینترنت چه اثری دارد؟", a: "باعث اختلال در زندگی و تحصیل می‌شود؛ باید فقط ساعت خاصی به آن اختصاص داد." },
  { q: "آیا وبگاه‌های دوست‌یابی راه مناسبی برای انتخاب دوست هستند؟", a: "خیر؛ به دلیل امکان ارائهٔ اطلاعات دروغ، راه مناسبی برای انتخاب دوست نیستند." },
  { q: "در برخورد با شبهات دینی و اعتقادی در فضای مجازی چه باید کرد؟", a: "به پایگاه‌های پاسخ‌گویی به سؤالات دینی مانند مرکز ملی پاسخ‌گویی و سایت پرسمان مراجعه کنیم." },
  { q: "اخبار سیاسی را از چه منابعی باید به دست آورد؟", a: "از منابع معتبر خبری مانند خبرگزاری جمهوری اسلامی." },
  { q: "خریدهای اینترنتی را چگونه باید انجام داد؟", a: "با مشاورهٔ بزرگ‌ترها و رعایت اصول امنیتی، تا افراد سودجو نتوانند مشکلی ایجاد کنند." }
];

let currentIndex = 0;
let isFlipped = false;
function render() {
  const card = cards[currentIndex];
  document.getElementById('frontText').textContent = card.q;
  document.getElementById('backText').textContent = card.a;
  document.getElementById('counter').textContent = `کارت ${currentIndex + 1} از ${cards.length}`;
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === cards.length - 1;

  isFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
}

function nextCard() {
  if (currentIndex < cards.length - 1) {
    currentIndex++;
    render();
  }
}

function prevCard() {
  if (currentIndex > 0) {
    currentIndex--;
    render();
  }
}

function shuffleCards() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  currentIndex = 0;
  render();
}

render();
</script>

</body>
</html>
