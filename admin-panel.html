<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | مطالعات اجتماعی</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, Vazirmatn, sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    padding: 16px;
    line-height: 1.8;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 1.4rem;
    color: #2b6cb0;
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: #718096;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .stat-card {
    flex: 1;
    min-width: 140px;
    background: linear-gradient(135deg, #4299e1, #2b6cb0);
    color: #fff;
    padding: 14px;
    border-radius: 12px;
    text-align: center;
  }
  .stat-card .num {
    font-size: 1.8rem;
    font-weight: bold;
    display: block;
  }
  .stat-card .label {
    font-size: 0.85rem;
    opacity: 0.9;
  }
  .loader {
    display: none;
    width: 24px;
    height: 24px;
    border: 3px solid #bee3f8;
    border-top-color: #2b6cb0;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 10px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .actions-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .action-btn {
    flex: 1;
    min-width: 120px;
    padding: 10px;
    background: #4299e1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .action-btn:hover { background: #2b6cb0; }
  .action-btn.danger { background: #e53e3e; }
  .action-btn.danger:hover { background: #c53030; }

  .table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    min-width: 500px;
  }
  thead { background: #2b6cb0; color: #fff; }
  th, td {
    padding: 10px 6px;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
  }
  tbody tr:nth-child(even) { background: #f7fafc; }
  tbody tr:hover { background: #ebf8ff; }
  .email-cell {
    font-size: 0.75rem;
    color: #4a5568;
    direction: ltr;
    word-break: break-all;
  }
  .empty-msg { text-align: center; color: #888; padding: 20px; }
  .error-msg { text-align: center; color: #e53e3e; padding: 20px; }

  .delete-btn {
    background: #fed7d7;
    color: #c53030;
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: bold;
  }
  .delete-btn:hover { background: #fc8181; color: #fff; }

  .logout-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 10px;
    background: #e53e3e;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  .logout-btn:hover { background: #c53030; }

  .access-denied {
    text-align: center;
    padding: 40px 20px;
    color: #e53e3e;
  }
  .access-denied h2 { font-size: 1.3rem; margin-bottom: 12px; }
  .access-denied p { color: #4a5568; margin-bottom: 20px; }
  .access-denied a {
    display: inline-block;
    padding: 10px 24px;
    background: #4299e1;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📊 پنل مدیریت نمرات</h1>
  <p class="subtitle" id="teacherInfo">در حال بررسی دسترسی...</p>

  <!-- بخش اصلی — فقط برای معلم -->
  <div id="adminSection" style="display:none;">
    <div class="stats">
      <div class="stat-card">
        <span class="num" id="totalGrades">0</span>
        <span class="label">کل نمرات ثبت‌شده</span>
      </div>
      <div class="stat-card">
        <span class="num" id="avgScore">0</span>
        <span class="label">میانگین نمرات</span>
      </div>
    </div>

    <div class="actions-bar">
      <button class="action-btn" onclick="loadGrades()">🔄 بروزرسانی</button>
      <button class="action-btn danger" onclick="logout()">🚪 خروج</button>
    </div>

    <div class="loader" id="loading"></div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>نام</th>
            <th>ایمیل</th>
            <th>آزمون</th>
            <th>نمره</th>
            <th>تاریخ</th>
            <th>حذف</th>
          </tr>
        </thead>
        <tbody id="gradesList"></tbody>
      </table>
    </div>
  </div>

  <!-- بخش دسترسی رد شده -->
  <div id="accessDenied" class="access-denied" style="display:none;">
    <h2>⛔ دسترسی محدود</h2>
    <p>این صفحه فقط برای معلم قابل دسترسی است.</p>
    <a href="index.html">بازگشت به صفحه اصلی</a>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
// ==== 🔑 مهم: ایمیل معلم را اینجا وارد کن ====
const TEACHER_EMAIL = "blueking3478@gmail.com"; // ← این را با ایمیل خودت جایگزین کن!

// ==== تنظیمات Firebase (از login.html کپی شده) ====
const firebaseConfig = {
  apiKey: "AIzaSyAo0zfeqp_BfJEqAHLir6xiYD0N9NqQcvE",
  authDomain: "social-studies-app-6b600.firebaseapp.com",
  projectId: "social-studies-app-6b600",
  storageBucket: "social-studies-app-6b600.firebasestorage.app",
  messagingSenderId: "887286568529",
  appId: "1:887286568529:web:151feabe0c5c3c42a00a70",
  measurementId: "G-2ZZLN7ZB9N"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const db = firebase.firestore();

// ==== بررسی لاگین و دسترسی معلم ====
auth.onAuthStateChanged((user) => {
  const adminSection = document.getElementById("adminSection");
  const accessDenied = document.getElementById("accessDenied");
  const teacherInfo = document.getElementById("teacherInfo");

  if (!user) {
    // لاگین نکرده → به لاگین برو
    window.location.href = "login.html";
    return;
  }

  // بررسی ایمیل معلم
  if (user.email && user.email.toLowerCase() === TEACHER_EMAIL.toLowerCase()) {
    // ✅ معلم است
    teacherInfo.textContent = "👨‍🏫 خوش آمدی " + (user.displayName || user.email);
    adminSection.style.display = "block";
    accessDenied.style.display = "none";
    loadGrades();
  } else {
    // ❌ دانش‌آموز است
    teacherInfo.textContent = "دسترسی محدود";
    adminSection.style.display = "none";
    accessDenied.style.display = "block";
  }
});

// ==== بارگذاری همه نمرات ====
async function loadGrades() {
  const gradesList = document.getElementById("gradesList");
  const totalGradesEl = document.getElementById("totalGrades");
  const avgScoreEl = document.getElementById("avgScore");
  const loadingEl = document.getElementById("loading");

  if (loadingEl) loadingEl.style.display = "block";
  if (gradesList) gradesList.innerHTML = "";

  try {
    const snapshot = await db.collection("grades")
      .orderBy("timestamp", "desc")
      .get();

    const total = snapshot.size;
    if (totalGradesEl) totalGradesEl.textContent = total;

    if (snapshot.empty) {
      if (avgScoreEl) avgScoreEl.textContent = "0";
      gradesList.innerHTML = `<tr><td colspan="6" class="empty-msg">هنوز نمره‌ای ثبت نشده است.</td></tr>`;
      return;
    }

    let rowsHtml = "";
    let sum = 0;
    let count = 0;

    snapshot.forEach((doc) => {
      const data = doc.data() || {};
      const name = data.studentName || "بدون نام";
      const email = data.studentEmail || "—";
      const quiz = data.quizName || "—";
      const score = (typeof data.score === "number") ? data.score : "—";
      const date = (data.timestamp && data.timestamp.toDate)
        ? data.timestamp.toDate().toLocaleDateString("fa-IR")
        : "—";

      if (typeof data.score === "number") {
        sum += data.score;
        count++;
      }

      rowsHtml += `
        <tr>
          <td>${name}</td>
          <td class="email-cell">${email}</td>
          <td>${quiz}</td>
          <td>${score}</td>
          <td>${date}</td>
          <td><button class="delete-btn" onclick="deleteGrade('${doc.id}')">حذف</button></td>
        </tr>`;
    });

    gradesList.innerHTML = rowsHtml;
    const avg = count > 0 ? (sum / count).toFixed(1) : "0";
    if (avgScoreEl) avgScoreEl.textContent = avg;

  } catch (error) {
    console.error("خطا در بارگذاری نمرات:", error);
    let errMsg = error.message;
    if (error.code === "failed-precondition") {
      errMsg = "نیاز به ساخت Index در Firestore. لطفاً روی لینک داخل Console بزن.";
    }
    gradesList.innerHTML = `<tr><td colspan="6" class="error-msg">خطا: ${errMsg}</td></tr>`;
    if (totalGradesEl) totalGradesEl.textContent = "0";
    if (avgScoreEl) avgScoreEl.textContent = "0";
  } finally {
    if (loadingEl) loadingEl.style.display = "none";
  }
}

// ==== حذف یک نمره ====
async function deleteGrade(docId) {
  if (!confirm("آیا از حذف این نمره مطمئن هستی؟")) return;
  try {
    await db.collection("grades").doc(docId).delete();
    alert("✅ نمره حذف شد");
    loadGrades();
  } catch (error) {
    alert("خطا در حذف: " + error.message);
  }
}

// ==== خروج ====
function logout() {
  auth.signOut().then(() => {
    window.location.href = "login.html";
  }).catch((error) => {
    alert("خطا در خروج: " + error.message);
  });
}
</script>
</body>
</html>
