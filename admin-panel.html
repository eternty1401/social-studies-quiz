<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | مطالعات اجتماعی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background: #0f172a; color: #fff; min-height: 100vh; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
  }

  /* صفحه ورود */
  #login-screen {
    background: rgba(30, 41, 59, 0.7); border: 1px solid #475569;
    padding: 40px 30px; border-radius: 20px; width: 100%; max-width: 400px;
    text-align: center; margin-top: 10vh; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  #login-screen h1 { color: #38bdf8; margin-bottom: 15px; }
  #login-screen p { color: #94a3b8; margin-bottom: 30px; font-size: 0.95rem; line-height: 1.6; }
  
  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff; color: #333; border: none; padding: 15px; border-radius: 12px;
    font-family: inherit; font-size: 1rem; font-weight: 900; cursor: pointer;
    width: 100%; transition: 0.3s;
  }
  .google-btn:hover { background: #e2e8f0; transform: translateY(-2px); }

  /* صفحه پنل */
  #panel-screen { display: none; width: 100%; max-width: 900px; }
  
  .header-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(30, 41, 59, 0.7); border: 1px solid #475569;
    padding: 15px 25px; border-radius: 15px; margin-bottom: 20px;
  }
  .header-bar h2 { color: #38bdf8; font-size: 1.2rem; }
  .logout-btn {
    background: #ef4444; color: white; border: none; padding: 8px 15px;
    border-radius: 8px; font-family: inherit; cursor: pointer; font-weight: bold;
  }

  .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  
  .stat-card {
    background: rgba(30, 41, 59, 0.7); border: 1px solid #475569;
    padding: 20px; border-radius: 15px; text-align: center;
  }
  .stat-card .num { font-size: 2.5rem; font-weight: 900; color: #38bdf8; }
  .stat-card .lbl { color: #94a3b8; font-size: 0.9rem; margin-top: 5px; }

  /* فرم ثبت نمره */
  .form-card {
    background: rgba(30, 41, 59, 0.7); border: 1px solid #475569;
    padding: 25px; border-radius: 15px; margin-bottom: 20px;
  }
  .form-card h3 { color: #38bdf8; margin-bottom: 20px; font-size: 1.1rem; }
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 0.9rem; }
  .input-group input, .input-group select {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569;
    background: rgba(0,0,0,0.2); color: #fff; font-family: inherit; font-size: 1rem; outline: none;
  }
  .save-btn {
    background: #10b981; color: white; border: none; padding: 12px 20px;
    border-radius: 8px; font-family: inherit; font-size: 1rem; font-weight: 900;
    cursor: pointer; width: 100%; transition: 0.3s;
  }
  .save-btn:hover { background: #059669; }

  /* جدول نمرات */
  .table-card {
    background: rgba(30, 41, 59, 0.7); border: 1px solid #475569;
    padding: 25px; border-radius: 15px; overflow-x: auto;
  }
  .table-card h3 { color: #38bdf8; margin-bottom: 20px; font-size: 1.1rem; }
  table { width: 100%; border-collapse: collapse; text-align: right; }
  th, td { padding: 12px 15px; border-bottom: 1px solid #475569; font-size: 0.9rem; }
  th { color: #94a3b8; font-weight: normal; }
  tr:hover { background: rgba(255,255,255,0.05); }

  @media(max-width: 600px) {
    .dashboard-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <!-- صفحه ورود -->
  <div id="login-screen">
    <h1>🔐 پنل مدیریت</h1>
    <p>برای ورود به پنل مدیریت نمرات، لطفاً با حساب گوگل خود وارد شوید.</p>
    <button class="google-btn" onclick="signInWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="24" alt="Google">
      ورود با حساب گوگل
    </button>
  </div>

  <!-- صفحه پنل (بعد از لاگین) -->
  <div id="panel-screen">
    <div class="header-bar">
      <h2>👋 خوش آمدی، <span id="admin-name">مدیر</span></h2>
      <button class="logout-btn" onclick="logout()">خروج</button>
    </div>

    <div class="dashboard-grid">
      <div class="stat-card">
        <div class="num" id="total-students">۰</div>
        <div class="lbl">تعداد کل نمرات ثبت شده</div>
      </div>
      <div class="stat-card">
        <div class="num" id="avg-score">۰</div>
        <div class="lbl">میانگین نمرات (از ۲۰)</div>
      </div>
    </div>

    <div class="form-card">
      <h3>➕ ثبت نمره جدید</h3>
      <div class="input-group">
        <label>نام دانش‌آموز</label>
        <input type="text" id="studentName" placeholder="مثلاً: علی محمدی">
      </div>
      <div class="input-group">
        <label>نام آزمون</label>
        <input type="text" id="examName" placeholder="مثلاً: آزمون درس ۵">
      </div>
      <div class="input-group">
        <label>نمره (از ۲۰)</label>
        <input type="number" id="studentScore" min="0" max="20" placeholder="۱۸">
      </div>
      <button class="save-btn" onclick="saveGrade()">ذخیره در دیتابیس</button>
    </div>

    <div class="table-card">
      <h3>📊 آخرین نمرات ثبت شده</h3>
      <table>
        <thead>
          <tr>
            <th>نام دانش‌آموز</th>
            <th>آزمون</th>
            <th>نمره</th>
          </tr>
        </thead>
        <tbody id="grades-table-body">
          <!-- نمرات اینجا لود میشن -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- اسکریپت‌های Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // تنظیمات فایربیس (کلیدهای تو)
    const firebaseConfig = {
      apiKey: "AIzaSyAo0zfeqp_BfJEqAHLir6xiYD0N9NqQcvE",
      authDomain: "social-studies-app-6b600.firebaseapp.com",
      projectId: "social-studies-app-6b600",
      storageBucket: "social-studies-app-6b600.firebasestorage.app",
      messagingSenderId: "887286568529",
      appId: "1:887286568529:web:151feabe0c5c3c42a00a70",
      measurementId: "G-2ZZLN7ZB9N"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // ورود با گوگل
    window.signInWithGoogle = () => {
      signInWithPopup(auth, provider).catch((error) => {
        alert("خطا در ورود: " + error.message);
      });
    };

    // خروج
    window.logout = () => {
      signOut(auth);
    };

    // بررسی وضعیت لاگین
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('panel-screen').style.display = 'block';
        document.getElementById('admin-name').innerText = user.displayName || "مدیر";
        loadGrades();
      } else {
        document.getElementById('login-screen').style.display = 'block';
        document.getElementById('panel-screen').style.display = 'none';
      }
    });

    // ذخیره نمره جدید
    window.saveGrade = async () => {
      const name = document.getElementById('studentName').value.trim();
      const exam = document.getElementById('examName').value.trim();
      const score = parseFloat(document.getElementById('studentScore').value);

      if (!name || !exam || isNaN(score)) {
        alert("لطفاً همه فیلدها را پر کنید!");
        return;
      }

      try {
        await addDoc(collection(db, "grades"), {
          name: name,
          exam: exam,
          score: score,
          date: new Date().toLocaleDateString('fa-IR'),
          timestamp: new Date()
        });
        alert("✅ نمره با موفقیت ذخیره شد!");
        document.getElementById('studentName').value = '';
        document.getElementById('examName').value = '';
        document.getElementById('studentScore').value = '';
        loadGrades(); // آپدیت جدول
      } catch (e) {
        alert("❌ خطا در ذخیره: " + e.message);
      }
    };

    // خواندن نمرات از دیتابیس
    async function loadGrades() {
      const tbody = document.getElementById('grades-table-body');
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">در حال دریافت اطلاعات... ⏳</td></tr>';
      
      try {
        const querySnapshot = await getDocs(collection(db, "grades"));
        tbody.innerHTML = '';
        let total = 0;
        let count = 0;

        if (querySnapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">هنوز نمره‌ای ثبت نشده است.</td></tr>';
          document.getElementById('total-students').innerText = "۰";
          document.getElementById('avg-score').innerText = "۰";
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          total += data.score;
          count++;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${data.name}</td>
            <td>${data.exam}</td>
            <td style="color:#38bdf8; font-weight:bold;">${data.score}</td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById('total-students').innerText = count.toLocaleString('fa-IR');
        document.getElementById('avg-score').innerText = (total / count).toFixed(1);

      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#ef4444;">خطا در خواندن اطلاعات: ${e.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
