<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون تستی درس ۱۵: گردشگری چیست؟</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
  }
  
  /* صفحه شروع */
  #start-section { text-align: center; padding: 20px 0; }
  #start-section h1 { color: #00acc1; font-size: 1.6rem; margin-bottom: 15px; }
  #start-section p { color: #7f8c8d; margin-bottom: 30px; line-height: 1.8; }
  .name-input {
    width: 100%; max-width: 400px; padding: 15px; margin-bottom: 20px;
    border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit;
    font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #00acc1; box-shadow: 0 0 10px rgba(0,172,193,0.2); }
  .start-btn {
    background: #2ecc71; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
  }
  .start-btn:hover { background: #27ae60; transform: translateY(-2px); }

  /* هدر و تایمر */
  .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eef2f5; padding-bottom: 15px; margin-bottom: 25px; }
  .header-title h1 { color: #00acc1; font-size: 1.4rem; }
  .header-title p { color: #7f8c8d; font-size: 0.85rem; margin-top: 5px; }
  .timer-box {
    background: #fdedec; color: #e74c3c; padding: 8px 18px; border-radius: 50px;
    font-weight: 900; font-size: 1.1rem; border: 1px solid #fadbd8;
    display: flex; align-items: center; gap: 8px; direction: ltr;
  }
  .timer-box.warning { background: #fef9e7; color: #f39c12; border-color: #fae5d3; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* سوالات */
  .question-box {
    background: #fafbfc; border: 1px solid #eef2f5; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .q-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.6; }
  
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    cursor: pointer; transition: 0.2s; font-size: 0.95rem;
  }
  .option-label:hover { background: #e0f7fa; border-color: #00acc1; }
  .option-label input[type="radio"] { display: none; }
  .option-label.selected { background: #e0f7fa; border-color: #00acc1; font-weight: 700; color: #00838f; }
  
  .submit-btn {
    display: block; width: 100%; padding: 15px; margin-top: 30px;
    background: #00acc1; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer;
    transition: 0.3s;
  }
  .submit-btn:hover { background: #00838f; }

  /* کارنامه */
  .result-container { display: none; text-align: center; }
  .student-name-display {
    font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 20px;
    background: #ecf0f1; padding: 10px 20px; border-radius: 10px; display: inline-block;
  }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 8px solid #ecf0f1;
  }
  .score-circle.excellent { border-color: #2ecc71; color: #2ecc71; }
  .score-circle.good { border-color: #f39c12; color: #f39c12; }
  .score-circle.fail { border-color: #e74c3c; color: #e74c3c; }
  .score-num { font-size: 2.8rem; font-weight: 900; line-height: 1; }
  .score-text { font-size: 0.9rem; color: #7f8c8d; margin-top: 5px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .stat-box { padding: 15px 25px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
  .stat-box.correct { color: #2ecc71; background: #e8f8f5; }
  .stat-box.wrong { color: #e74c3c; background: #fdedec; }
  
  .review-btn {
    display: inline-block; background: #3498db; color: #fff; text-decoration: none;
    padding: 12px 30px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer;
    font-size: 1rem;
  }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .header-top { flex-direction: column; gap: 10px; text-align: center; }
    .result-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- صفحه شروع -->
  <div id="start-section">
    <h1>📝 آزمون تستی درس ۱۵</h1>
    <p>گردشگری چیست؟ — مطالعات اجتماعی پایه هفتم<br>لطفاً نام و نام خانوادگی خود را وارد کنید تا آزمون آغاز شود.</p>
    <input type="text" id="student-name" class="name-input" placeholder="مثلاً: علی محمدی">
    <br>
    <button class="start-btn" onclick="startQuiz()">شروع آزمون</button>
  </div>

  <!-- بخش آزمون -->
  <div id="quiz-section" style="display: none;">
    <div class="header-top">
      <div class="header-title">
        <h1>📝 آزمون تستی درس ۱۵</h1>
        <p>۱۵ سوال تصادفی از بانک ۴۰ سوالی</p>
      </div>
      <div class="timer-box" id="timer-display">⏱ ۱۰:۰۰</div>
    </div>
    
    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="submit" class="submit-btn" id="submit-btn">ثبت پاسخ‌ها و مشاهده کارنامه</button>
    </form>
  </div>

  <!-- بخش کارنامه -->
  <div id="result-section" class="result-container">
    <h2 style="color:#2c3e50; margin-bottom:20px; font-weight:900;">🎓 کارنامه شما</h2>
    <div class="student-name-display" id="display-student-name">نام دانش‌آموز</div>
    
    <div id="score-circle" class="score-circle">
      <div class="score-num" id="score-display">0</div>
      <div class="score-text">از ۱۰۰</div>
    </div>
    <p id="result-message" style="font-size:1.1rem; font-weight:700; margin-bottom:25px;"></p>
    <div class="result-stats">
      <div class="stat-box correct" id="stat-correct">تعداد درست: ۰</div>
      <div class="stat-box wrong" id="stat-wrong">تعداد غلط: ۰</div>
    </div>
    <a href="haftom.html" class="review-btn" style="background:#3498db; text-decoration:none;">🔙 بازگشت به دروس</a>
  </div>

</div>

<script>
  // ==========================================
  // بانک ۴۰ سوالی درس ۱۵ (گردشگری چیست؟)
  // ==========================================
  const questionBank = [
    { q: "گردشگر به چه کسانی گفته می‌شود؟", options: ["کسانی که محل اقامت یا کار خود را موقت ترک می‌کنند و به سفر می‌روند", "کسانی که در خانه می‌مانند", "کسانی که فقط کار می‌کنند", "کسانی که به خارج از کشور مهاجرت می‌کنند"], answer: 0 },
    { q: "زائر به چه کسانی گفته می‌شود؟", options: ["کسانی که به سفرهای زیارتی می‌روند", "کسانی که به سفرهای تفریحی می‌روند", "کسانی که به سفرهای کاری می‌روند", "کسانی که در خانه می‌مانند"], answer: 0 },
    { q: "کدام یک از انواع گردشگری است؟", options: ["گردشگری تفریحی", "گردشگری زیارتی", "گردشگری علمی", "همه موارد"], answer: 3 },
    { q: "گردش طبیعت (اکوتوریسم) چیست؟", options: ["سفر به طبیعت با حفظ محیط زیست", "سفر به شهرها", "سفر به مراکز خرید", "سفر به اماکن تاریخی"], answer: 0 },
    { q: "کدام یک از شغل‌های ایجاد شده در اثر گردشگری است؟", options: ["هتل‌داری", "دفاتر فروش بلیت", "فروش صنایع دستی", "همه موارد"], answer: 3 },
    { q: "گردشگری چه نقشی در اقتصاد یک منطقه دارد؟", options: ["افزایش درآمد و ایجاد شغل", "کاهش درآمد", "کاهش شغل", "بی‌تأثیر"], answer: 0 },
    { q: "یکی از وسایل مهمی که در سفر باید همراه داشته باشیم چیست؟", options: ["نقشه", "کتاب", "دفتر", "ماشین‌حساب"], answer: 0 },
    { q: "نقشه چه کمکی به ما می‌کند؟", options: ["مکان‌های جدید را بهتر پیدا می‌کنیم و سریع‌تر به آنجا می‌رسیم", "فقط برای زیبایی است", "برای خرید استفاده می‌شود", "برای نوشتن استفاده می‌شود"], answer: 0 },
    { q: "راهنمای نقشه چیست؟", options: ["نشانه‌ها و علامت‌هایی که برای درک نقشه به کار می‌روند", "نام نقشه", "رنگ نقشه", "اندازه نقشه"], answer: 0 },
    { q: "جهت‌های اصلی در نقشه کدام‌اند؟", options: ["شمال، جنوب، مشرق و مغرب", "بالا، پایین، چپ و راست", "شرق، غرب، شمال و جنوب شرقی", "شمال، جنوب، شرق و غرب"], answer: 0 },
    { q: "نقشه راه چه اطلاعاتی به ما می‌دهد؟", options: ["جاده‌های اصلی و فرعی و مکان‌های خدماتی", "فقط نام شهرها", "فقط فاصله‌ها", "فقط جهت‌ها"], answer: 0 },
    { q: "کدام یک از مکان‌های خدماتی روی نقشه راه مشخص می‌شود؟", options: ["رستوران، پمپ بنزین، تعمیرگاه و نمازخانه", "فقط بیمارستان", "فقط هتل", "فقط رستوران"], answer: 0 },
    { q: "با استفاده از مقیاس نقشه راه چه چیزی را می‌توان محاسبه کرد؟", options: ["فاصله بین مکان‌ها", "ارتفاع کوه‌ها", "عمق دریا", "تعداد جمعیت"], answer: 0 },
    { q: "چرا در سفرها باید نقشه همراه داشته باشیم؟", options: ["برای پیدا کردن مسیر درست و جلوگیری از اشتباه", "برای تزئین", "برای نوشتن خاطرات", "برای ارتباط با دوستان"], answer: 0 },
    { q: "گردشگری چه تأثیری بر فرهنگ یک منطقه دارد؟", options: ["آشنایی گردشگران با فرهنگ و تاریخ آن منطقه", "تخریب فرهنگ", "بی‌تأثیر", "کاهش فرهنگ"], answer: 0 },
    { q: "چرا با گردشگران خارجی باید با احترام برخورد کنیم؟", options: ["چون بر اساس فرهنگ و ارزش‌های دینی ما، مهمان عزیز هستند", "چون پول زیادی دارند", "چون فقط برای تجارت می‌آیند", "چون باید از آن‌ها پول بگیریم"], answer: 0 },
    { q: "کدام یک از انواع گردشگری برای آشنایی با آثار تاریخی است؟", options: ["گردشگری تاریخی-فرهنگی", "گردشگری زیارتی", "گردش طبیعت", "گردشگری علمی"], answer: 0 },
    { q: "کدام یک از انواع گردشگری برای حضور در همایش‌های علمی است؟", options: ["گردشگری علمی", "گردشگری زیارتی", "گردشگری تفریحی", "گردش طبیعت"], answer: 0 },
    { q: "در گذشته تعداد گردشگران چگونه بود؟", options: ["بسیار کم", "بسیار زیاد", "بیشتر از امروز", "به اندازه امروز"], answer: 0 },
    { q: "امروزه چند نفر از مردم جهان در سال سفر می‌کنند؟", options: ["میلیون‌ها نفر", "چند هزار نفر", "چند صد نفر", "چند میلیون نفر"], answer: 0 },
    { q: "کدام یک از مشاغل زیر در اثر گردشگری به وجود نمی‌آید؟", options: ["کارمند بانک مرکزی", "هتل‌داری", "دفاتر فروش بلیت", "فروش صنایع دستی"], answer: 0 },
    { q: "نقشه گردشگری چه ویژگی دارد؟", options: ["مکان‌های دیدنی و جاذبه‌های گردشگری را نشان می‌دهد", "فقط جاده‌ها را نشان می‌دهد", "فقط جمعیت را نشان می‌دهد", "فقط کوه‌ها را نشان می‌دهد"], answer: 0 },
    { q: "چرا گردشگری برای یک کشور مفید است؟", options: ["با ایجاد شغل و درآمد به اقتصاد کمک می‌کند", "فقط برای تفریح است", "هیچ فایده‌ای ندارد", "باعث کاهش جمعیت می‌شود"], answer: 0 },
    { q: "کدام یک از انواع گردشگری با زیارت اماکن مقدس مرتبط است؟", options: ["گردشگری زیارتی", "گردشگری تفریحی", "گردشگری تاریخی", "گردشگری علمی"], answer: 0 },
    { q: "کدام یک از انواع گردشگری با استراحت و تفریح مرتبط است؟", options: ["گردشگری تفریحی", "گردشگری زیارتی", "گردشگری علمی", "گردش طبیعت"], answer: 0 },
    { q: "نقشه چیست؟", options: ["تصویری از یک مکان که به ما برای پیدا کردن مسیر کمک می‌کند", "نوعی کتاب", "نوعی عکس", "نوعی نامه"], answer: 0 },
    { q: "جهت‌های اصلی در نقشه چه کاربردی دارند؟", options: ["برای تشخیص جهت‌ها در نقشه", "برای اندازه‌گیری", "برای رنگ‌آمیزی", "برای نوشتن"], answer: 0 },
    { q: "کدام یک از موارد زیر از فواید گردشگری نیست؟", options: ["کاهش درآمد مردم منطقه", "ایجاد شغل", "افزایش درآمد", "آشنایی با فرهنگ‌ها"], answer: 0 },
    { q: "مقیاس در نقشه چه کاربردی دارد؟", options: ["محاسبه فاصله واقعی مکان‌ها", "تشخیص جهت", "تشخیص رنگ", "اندازه‌گیری عمق"], answer: 0 },
    { q: "چرا گردشگری در ایران در سال‌های اخیر افزایش یافته است؟", options: ["به دلیل توسعه امکانات و توجه بیشتر به گردشگری", "به دلیل کاهش جمعیت", "به دلیل کاهش قیمت‌ها", "به دلیل کاهش سفرها"], answer: 0 },
    { q: "گردشگران هنگام سفر به یک منطقه، چه چیزی را می‌توانند بیاموزند؟", options: ["آداب و رسوم، فرهنگ و تاریخ آن منطقه", "فقط زبان آن منطقه", "فقط غذاهای آن منطقه", "فقط موسیقی آن منطقه"], answer: 0 },
    { q: "کدام یک از انواع گردشگری در ایران، به دلیل وجود اماکن مذهبی، اهمیت زیادی دارد؟", options: ["گردشگری زیارتی", "گردشگری علمی", "گردش طبیعت", "گردشگری تفریحی"], answer: 0 },
    { q: "چرا در سفرها باید به محیط زیست احترام بگذاریم؟", options: ["چون گردش طبیعت بدون آسیب به محیط زیست معنا دارد", "چون قانون ما را مجبور کرده", "چون هزینه دارد", "چون دیگران این کار را می‌کنند"], answer: 0 },
    { q: "کدام یک از انواع گردشگری به عنوان اکوتوریسم شناخته می‌شود؟", options: ["گردش طبیعت", "گردشگری زیارتی", "گردشگری علمی", "گردشگری تفریحی"], answer: 0 },
    { q: "کدام یک از مکان‌های زیر روی نقشه گردشگری مشخص می‌شود؟", options: ["مکان‌های دیدنی و جاذبه‌های گردشگری", "فقط بیمارستان‌ها", "فقط مدارس", "فقط ادارات"], answer: 0 },
    { q: "چرا گردشگران با سفر به مناطق مختلف، به رونق اقتصادی آن منطقه کمک می‌کنند؟", options: ["چون هزینه‌هایی برای اقامت، غذا، خرید و تفریح می‌پردازند", "چون مالیات می‌دهند", "چون کار می‌کنند", "چون سرمایه‌گذاری می‌کنند"], answer: 0 },
    { q: "کدام یک از انواع گردشگری با رفتن به نمایشگاه‌ها و همایش‌ها مرتبط است؟", options: ["گردشگری علمی", "گردشگری زیارتی", "گردشگری تفریحی", "گردش طبیعت"], answer: 0 },
    { q: "کدام یک از موارد زیر از مشاغل مرتبط با گردشگری است؟", options: ["آژانس هواپیمایی", "کارخانه فولاد", "مزرعه کشاورزی", "کارگاه نجاری"], answer: 0 },
    { q: "چرا نقشه در سفر برای گردشگران ضروری است؟", options: ["برای پیدا کردن مکان‌های جدید و رسیدن سریع‌تر به مقصد", "فقط برای یادگاری است", "برای خرید استفاده می‌شود", "برای نوشتن خاطرات است"], answer: 0 },
    { q: "کدام یک از انواع گردشگری در ایران به دلیل وجود جاذبه‌های طبیعی فراوان، رشد کرده است؟", options: ["گردش طبیعت", "گردشگری زیارتی", "گردشگری علمی", "گردشگری تفریحی"], answer: 0 }
  ];

  const numQuestionsToShow = 15; 
  const totalTime = 600; // ۱۰ دقیقه
  
  let selectedQuestions = [];
  let timerInterval;
  let timeLeft = totalTime;
  let studentName = "";

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    if (studentName === "") {
      alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      return;
    }
    
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    
    initQuiz();
  }

  function initQuiz() {
    const shuffledBank = shuffle([...questionBank]);
    selectedQuestions = shuffledBank.slice(0, numQuestionsToShow);

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((item, index) => {
      const correctAnswerText = item.options[item.answer];
      const shuffledOptions = shuffle([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
      
      selectedQuestions[index].options = shuffledOptions;
      selectedQuestions[index].answer = newCorrectIndex;

      let optionsHTML = '';
      shuffledOptions.forEach((opt, i) => {
        optionsHTML += `
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="q${index}" value="${i}">
            <span>${opt}</span>
          </label>
        `;
      });

      const qBox = document.createElement('div');
      qBox.className = 'question-box';
      qBox.innerHTML = `
        <div class="q-title">${index + 1}. ${item.q}</div>
        <div class="options">${optionsHTML}</div>
      `;
      container.appendChild(qBox);
    });

    startTimer();
  }

  function startTimer() {
    const display = document.getElementById('timer-display');
    
    timerInterval = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      
      display.innerHTML = `⏱ ${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

      if (timeLeft <= 60) {
        display.classList.add('warning');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        display.innerHTML = `⏱ ۰۰:۰۰`;
        document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
      }
    }, 1000);
  }

  function selectOption(label) {
    const name = label.querySelector('input').name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.parentElement.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;

    selectedQuestions.forEach((item, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (!selected) {
        wrongCount++; 
      } else if (parseInt(selected.value) === item.answer) {
        correctCount++;
      } else {
        wrongCount++;
      }
    });

    const score = Math.round((correctCount / selectedQuestions.length) * 100);

    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    document.getElementById('display-student-name').innerText = `دانش‌آموز: ${studentName}`;
    
    document.getElementById('score-display').innerText = score;
    document.getElementById('stat-correct').innerText = `تعداد درست: ${correctCount}`;
    document.getElementById('stat-wrong').innerText = `تعداد غلط: ${wrongCount}`;

    const circle = document.getElementById('score-circle');
    const msg = document.getElementById('result-message');
    
    circle.className = 'score-circle';
    if (score >= 80) {
      circle.classList.add('excellent');
      msg.innerText = "🌟 عالی بود! شما درس را به خوبی یاد گرفته‌اید.";
      msg.style.color = "#2ecc71";
    } else if (score >= 50) {
      circle.classList.add('good');
      msg.innerText = "👍 خوب بود، اما با کمی مطالعه بیشتر می‌توانید بهتر شوید.";
      msg.style.color = "#f39c12";
    } else {
      circle.classList.add('fail');
      msg.innerText = "📚 نیاز به مطالعه بیشتر دارید. ناامید نشوید و درسنامه را دوباره بخوانید.";
      msg.style.color = "#e74c3c";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
