<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون تستی درس ۱۸: قدیمی‌ترین سکونتگاه‌های ایران</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
  }
  
  /* صفحه شروع */
  #start-section { text-align: center; padding: 20px 0; }
  #start-section h1 { color: #546e7a; font-size: 1.6rem; margin-bottom: 15px; }
  #start-section p { color: #7f8c8d; margin-bottom: 30px; line-height: 1.8; }
  .name-input {
    width: 100%; max-width: 400px; padding: 15px; margin-bottom: 20px;
    border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit;
    font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #546e7a; box-shadow: 0 0 10px rgba(84,110,122,0.2); }
  .start-btn {
    background: #2ecc71; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
  }
  .start-btn:hover { background: #27ae60; transform: translateY(-2px); }

  /* هدر و تایمر */
  .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eef2f5; padding-bottom: 15px; margin-bottom: 25px; }
  .header-title h1 { color: #546e7a; font-size: 1.4rem; }
  .header-title p { color: #7f8c8d; font-size: 0.85rem; margin-top: 5px; }
  .timer-box {
    background: #fdedec; color: #e74c3c; padding: 8px 18px; border-radius: 50px;
    font-weight: 900; font-size: 1.1rem; border: 1px solid #fadbd8;
    display: flex; align-items: center; gap: 8px; direction: ltr;
  }
  .timer-box.warning { background: #fef9e7; color: #f39c12; border-color: #fae5d3; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* سوالات */
  .question-box {
    background: #fafbfc; border: 1px solid #eef2f5; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .q-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.6; }
  
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    cursor: pointer; transition: 0.2s; font-size: 0.95rem;
  }
  .option-label:hover { background: #eceff1; border-color: #546e7a; }
  .option-label input[type="radio"] { display: none; }
  .option-label.selected { background: #eceff1; border-color: #546e7a; font-weight: 700; color: #37474f; }
  
  .submit-btn {
    display: block; width: 100%; padding: 15px; margin-top: 30px;
    background: #546e7a; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer;
    transition: 0.3s;
  }
  .submit-btn:hover { background: #37474f; }

  /* کارنامه */
  .result-container { display: none; text-align: center; }
  .student-name-display {
    font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 20px;
    background: #ecf0f1; padding: 10px 20px; border-radius: 10px; display: inline-block;
  }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 8px solid #ecf0f1;
  }
  .score-circle.excellent { border-color: #2ecc71; color: #2ecc71; }
  .score-circle.good { border-color: #f39c12; color: #f39c12; }
  .score-circle.fail { border-color: #e74c3c; color: #e74c3c; }
  .score-num { font-size: 2.8rem; font-weight: 900; line-height: 1; }
  .score-text { font-size: 0.9rem; color: #7f8c8d; margin-top: 5px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .stat-box { padding: 15px 25px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
  .stat-box.correct { color: #2ecc71; background: #e8f8f5; }
  .stat-box.wrong { color: #e74c3c; background: #fdedec; }
  
  .review-btn {
    display: inline-block; background: #3498db; color: #fff; text-decoration: none;
    padding: 12px 30px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer;
    font-size: 1rem;
  }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .header-top { flex-direction: column; gap: 10px; text-align: center; }
    .result-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- صفحه شروع -->
  <div id="start-section">
    <h1>📝 آزمون تستی درس ۱۸</h1>
    <p>قدیمی‌ترین سکونتگاه‌های ایران — مطالعات اجتماعی پایه هفتم<br>لطفاً نام و نام خانوادگی خود را وارد کنید تا آزمون آغاز شود.</p>
    <input type="text" id="student-name" class="name-input" placeholder="مثلاً: علی محمدی">
    <br>
    <button class="start-btn" onclick="startQuiz()">شروع آزمون</button>
  </div>

  <!-- بخش آزمون -->
  <div id="quiz-section" style="display: none;">
    <div class="header-top">
      <div class="header-title">
        <h1>📝 آزمون تستی درس ۱۸</h1>
        <p>۱۵ سوال تصادفی از بانک ۴۰ سوالی</p>
      </div>
      <div class="timer-box" id="timer-display">⏱ ۱۰:۰۰</div>
    </div>
    
    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="submit" class="submit-btn" id="submit-btn">ثبت پاسخ‌ها و مشاهده کارنامه</button>
    </form>
  </div>

  <!-- بخش کارنامه -->
  <div id="result-section" class="result-container">
    <h2 style="color:#2c3e50; margin-bottom:20px; font-weight:900;">🎓 کارنامه شما</h2>
    <div class="student-name-display" id="display-student-name">نام دانش‌آموز</div>
    
    <div id="score-circle" class="score-circle">
      <div class="score-num" id="score-display">0</div>
      <div class="score-text">از ۱۰۰</div>
    </div>
    <p id="result-message" style="font-size:1.1rem; font-weight:700; margin-bottom:25px;"></p>
    <div class="result-stats">
      <div class="stat-box correct" id="stat-correct">تعداد درست: ۰</div>
      <div class="stat-box wrong" id="stat-wrong">تعداد غلط: ۰</div>
    </div>
    <a href="haftom.html" class="review-btn" style="background:#3498db; text-decoration:none;">🔙 بازگشت به دروس</a>
  </div>

</div>

<script>
  // ==========================================
  // بانک ۴۰ سوالی درس ۱۸ (قدیمی‌ترین سکونتگاه‌های ایران)
  // ==========================================
  const questionBank = [
    { q: "تاریخ ایران به چند دوره تقسیم می‌شود؟", options: ["دو دوره (پیش از اسلام و اسلامی)", "سه دوره", "چهار دوره", "یک دوره"], answer: 0 },
    { q: "دوره ایران باستان به چه دوره‌ای گفته می‌شود؟", options: ["تاریخ ایران قبل از اسلام", "تاریخ ایران بعد از اسلام", "دوره معاصر", "دوره قاجار"], answer: 0 },
    { q: "نمودار خط زمان برای چه چیزی استفاده می‌شود؟", options: ["نشان دادن رویدادها به ترتیب زمانی", "محاسبه فاصله", "نشان دادن نقشه", "نشان دادن آب و هوا"], answer: 0 },
    { q: "انسان‌های نخستین از چه ابزاری استفاده می‌کردند؟", options: ["ابزار سنگی", "ابزار آهنی", "ابزار فولادی", "ابزار پلاستیکی"], answer: 0 },
    { q: "انسان‌های نخستین برای محافظت از خود به کجا پناه می‌بردند؟", options: ["غارها", "خانه‌های خشتی", "چادر", "قلعه"], answer: 0 },
    { q: "غار هوتو (هاتر) در کدام منطقه قرار دارد؟", options: ["نزدیکی بهشهر", "لرستان", "کرمانشاه", "خوزستان"], answer: 0 },
    { q: "نقاشی‌های درون غار دوشه در کدام استان قرار دارد؟", options: ["لرستان", "خوزستان", "کرمان", "فارس"], answer: 0 },
    { q: "کشاورزی چه تأثیری بر زندگی انسان‌ها داشت؟", options: ["موجب یکجانشینی و شکل‌گیری روستاها شد", "باعث کوچ نشینی شد", "باعث کاهش جمعیت شد", "باعث جنگ شد"], answer: 0 },
    { q: "تپه سیلک در کدام شهر قرار دارد؟", options: ["کاشان", "نقده", "شوش", "جیرفت"], answer: 0 },
    { q: "تپه حسن‌لو در کدام استان قرار دارد؟", options: ["آذربایجان غربی", "خوزستان", "کرمان", "فارس"], answer: 0 },
    { q: "کدام یک از ویژگی‌های یک تمدن است؟", options: ["حکومت و قوانین", "خط و عقاید مذهبی", "شهرسازی و هنر معماری", "همه موارد"], answer: 3 },
    { q: "شهر سوخته در کدام استان قرار دارد؟", options: ["سیستان و بلوچستان", "کرمان", "خوزستان", "فارس"], answer: 0 },
    { q: "شهر سوخته حدوداً چند سال قدمت دارد؟", options: ["حدود ۵ هزار سال", "حدود ۱ هزار سال", "حدود ۱۰ هزار سال", "حدود ۳ هزار سال"], answer: 0 },
    { q: "چرا شهر سوخته به این نام خوانده می‌شود؟", options: ["چون ظاهراً در اثر آتش‌سوزی از بین رفته است", "چون در آنجا آتشکده بوده", "چون هوای آن گرم است", "چون مردم آن آتش‌پرست بودند"], answer: 0 },
    { q: "چشم مصنوعی و ظرف سفالی با نقش بز (نخستین انیمیشن دنیا) در کدام تمدن پیدا شده است؟", options: ["شهر سوخته", "تمدن ایلام", "تمدن جیرفت", "تپه سیلک"], answer: 0 },
    { q: "مهم‌ترین اثر به جای مانده از تمدن ایلام کدام است؟", options: ["چغازنبیل", "شهر سوخته", "تپه سیلک", "تخت جمشید"], answer: 0 },
    { q: "چغازنبیل در کدام استان قرار دارد؟", options: ["خوزستان", "کرمان", "فارس", "سیستان و بلوچستان"], answer: 0 },
    { q: "تمدن ایلام حدود چند سال قدمت دارد؟", options: ["حدود ۳ هزار سال", "حدود ۵ هزار سال", "حدود ۱ هزار سال", "حدود ۱۰ هزار سال"], answer: 0 },
    { q: "تمدن جیرفت در کدام استان قرار دارد؟", options: ["کرمان", "خوزستان", "فارس", "سیستان و بلوچستان"], answer: 0 },
    { q: "تمدن جیرفت در کنار کدام رود شکل گرفت؟", options: ["هلیل", "کارون", "زاینده‌رود", "کرخه"], answer: 0 },
    { q: "چرا خداوند پیامبران را فرستاد؟", options: ["برای هدایت مردم و نجات آنها از گمراهی و ظلم", "برای ساخت شهرها", "برای کشاورزی", "برای تجارت"], answer: 0 },
    { q: "حضرت نوح و حضرت ابراهیم در کدام منطقه زندگی می‌کردند؟", options: ["بین‌النهرین", "مصر", "فلسطین", "ایران"], answer: 0 },
    { q: "حضرت یوسف و حضرت موسی در کدام منطقه زندگی می‌کردند؟", options: ["مصر", "بین‌النهرین", "فلسطین", "ایران"], answer: 0 },
    { q: "حضرت عیسی در کدام منطقه به دنیا آمد؟", options: ["فلسطین", "مصر", "بین‌النهرین", "ایران"], answer: 0 },
    { q: "آخرین پیامبر الهی کیست؟", options: ["حضرت محمد (ص)", "حضرت عیسی (ع)", "حضرت موسی (ع)", "حضرت ابراهیم (ع)"], answer: 0 },
    { q: "کدام یک از ویژگی‌های تمدن‌های بین‌النهرین و مصر نبود؟", options: ["پرستش خدای یکتا", "ظلم فرمانروایان", "پرستش بت‌ها", "خرافات و گمراهی"], answer: 0 },
    { q: "یکی از مهم‌ترین پیشرفت‌های مردم اولین روستاها چه بود؟", options: ["اختراع خط", "اختراع هواپیما", "اختراع رایانه", "اختراع تلفن"], answer: 0 },
    { q: "ظروف سفالی مردم اولین روستاها ابتدا چگونه بود؟", options: ["ساده و بدون نقش", "با نقش و نگار", "از جنس طلا", "از جنس شیشه"], answer: 0 },
    { q: "چرا برخی از سکونتگاه‌ها به شهر تبدیل شدند؟", options: ["به دلیل افزایش جمعیت و پیشرفت", "به دلیل کاهش جمعیت", "به دلیل جنگ", "به دلیل قحطی"], answer: 0 },
    { q: "چند مورد از ویژگی‌های یک تمدن را نام ببرید.", options: ["حکومت، قوانین، خط، عقاید مذهبی", "فقط حکومت", "فقط خط", "فقط قوانین"], answer: 0 },
    { q: "باستان‌شناسان در شهر سوخته چه چیزی کشف کردند؟", options: ["چشم مصنوعی و ظرف سفالی با نقش بز", "تخت جمشید", "چغازنبیل", "مجسمه خدایان"], answer: 0 },
    { q: "ایلامی‌ها چه چیزی را می‌پرستیدند؟", options: ["خدایان متعددی مثل خدای خورشید و خدای آب", "خدای یکتا", "بت‌ها", "آتش"], answer: 0 },
    { q: "زیگورات چیست؟", options: ["معبدی خشتی و پلکانی در تمدن‌های باستانی", "نوعی خانه", "نوعی ابزار", "نوعی غذا"], answer: 0 },
    { q: "با کشف خط، چه اتفاقی در زندگی مردم افتاد؟", options: ["رسیدگی به کارها، نوشتن و محاسبه آسان‌تر شد", "جنگ بیشتر شد", "کشاورزی متوقف شد", "شهرها از بین رفتند"], answer: 0 },
    { q: "چرا پیامبران با حاکمان ستمگر مبارزه می‌کردند؟", options: ["چون حاکمان به مردم ظلم می‌کردند و از دستورات خدا سرپیچی می‌کردند", "چون می‌خواستند خودشان حکومت کنند", "چون به ثروت آن‌ها نیاز داشتند", "چون با آن‌ها دشمنی شخصی داشتند"], answer: 0 },
    { q: "کدام یک از پیامبران الهی در بین‌النهرین زندگی کرده است؟", options: ["حضرت نوح (ع)", "حضرت موسی (ع)", "حضرت عیسی (ع)", "همه موارد"], answer: 0 },
    { q: "قدیمی‌ترین تمدن‌های ایران در کدام مناطق شکل گرفتند؟", options: ["شهر سوخته، ایلام و جیرفت", "تخت جمشید و پاسارگاد", "شوش و همدان", "اصفهان و شیراز"], answer: 0 },
    { q: "ویژگی مشترک تمدن ایلام و جیرفت چیست؟", options: ["هر دو از تمدن‌های کهن ایران هستند", "هر دو در یک منطقه هستند", "هر دو به دست یک قوم ساخته شدند", "هر دو در یک دوره از بین رفتند"], answer: 0 },
    { q: "باستان‌شناسان برای کشف آثار باستانی از چه ابزاری استفاده می‌کنند؟", options: ["ابزارهای خاص حفاری", "فقط دست", "ماشین‌های سنگین", "فقط بیل مکانیکی"], answer: 0 },
    { q: "ویژگی مهم تمدن جیرفت چیست؟", options: ["احتمال داشتن یکی از قدیمی‌ترین خطوط دنیا", "ساخت تخت جمشید", "ساخت چغازنبیل", "ساخت اهرام"], answer: 0 }
  ];

  const numQuestionsToShow = 15; 
  const totalTime = 600; // ۱۰ دقیقه
  
  let selectedQuestions = [];
  let timerInterval;
  let timeLeft = totalTime;
  let studentName = "";

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    if (studentName === "") {
      alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      return;
    }
    
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    
    initQuiz();
  }

  function initQuiz() {
    const shuffledBank = shuffle([...questionBank]);
    selectedQuestions = shuffledBank.slice(0, numQuestionsToShow);

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((item, index) => {
      const correctAnswerText = item.options[item.answer];
      const shuffledOptions = shuffle([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
      
      selectedQuestions[index].options = shuffledOptions;
      selectedQuestions[index].answer = newCorrectIndex;

      let optionsHTML = '';
      shuffledOptions.forEach((opt, i) => {
        optionsHTML += `
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="q${index}" value="${i}">
            <span>${opt}</span>
          </label>
        `;
      });

      const qBox = document.createElement('div');
      qBox.className = 'question-box';
      qBox.innerHTML = `
        <div class="q-title">${index + 1}. ${item.q}</div>
        <div class="options">${optionsHTML}</div>
      `;
      container.appendChild(qBox);
    });

    startTimer();
  }

  function startTimer() {
    const display = document.getElementById('timer-display');
    
    timerInterval = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      
      display.innerHTML = `⏱ ${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

      if (timeLeft <= 60) {
        display.classList.add('warning');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        display.innerHTML = `⏱ ۰۰:۰۰`;
        document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
      }
    }, 1000);
  }

  function selectOption(label) {
    const name = label.querySelector('input').name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.parentElement.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;

    selectedQuestions.forEach((item, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (!selected) {
        wrongCount++; 
      } else if (parseInt(selected.value) === item.answer) {
        correctCount++;
      } else {
        wrongCount++;
      }
    });

    const score = Math.round((correctCount / selectedQuestions.length) * 100);

    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    document.getElementById('display-student-name').innerText = `دانش‌آموز: ${studentName}`;
    
    document.getElementById('score-display').innerText = score;
    document.getElementById('stat-correct').innerText = `تعداد درست: ${correctCount}`;
    document.getElementById('stat-wrong').innerText = `تعداد غلط: ${wrongCount}`;

    const circle = document.getElementById('score-circle');
    const msg = document.getElementById('result-message');
    
    circle.className = 'score-circle';
    if (score >= 80) {
      circle.classList.add('excellent');
      msg.innerText = "🌟 عالی بود! شما درس را به خوبی یاد گرفته‌اید.";
      msg.style.color = "#2ecc71";
    } else if (score >= 50) {
      circle.classList.add('good');
      msg.innerText = "👍 خوب بود، اما با کمی مطالعه بیشتر می‌توانید بهتر شوید.";
      msg.style.color = "#f39c12";
    } else {
      circle.classList.add('fail');
      msg.innerText = "📚 نیاز به مطالعه بیشتر دارید. ناامید نشوید و درسنامه را دوباره بخوانید.";
      msg.style.color = "#e74c3c";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>

</body>
</html>
