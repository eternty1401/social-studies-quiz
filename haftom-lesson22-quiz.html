 <script src="telegram.js"></script>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون تستی درس ۲۲: اوضاع اقتصادی در ایران باستان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
  }
  
  /* صفحه شروع */
  #start-section { text-align: center; padding: 20px 0; }
  #start-section h1 { color: #bf360c; font-size: 1.6rem; margin-bottom: 15px; }
  #start-section p { color: #7f8c8d; margin-bottom: 30px; line-height: 1.8; }
  .name-input {
    width: 100%; max-width: 400px; padding: 15px; margin-bottom: 20px;
    border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit;
    font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #bf360c; box-shadow: 0 0 10px rgba(191,54,12,0.2); }
  .start-btn {
    background: #2ecc71; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
  }
  .start-btn:hover { background: #27ae60; transform: translateY(-2px); }

  /* هدر و تایمر */
  .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eef2f5; padding-bottom: 15px; margin-bottom: 25px; }
  .header-title h1 { color: #bf360c; font-size: 1.4rem; }
  .header-title p { color: #7f8c8d; font-size: 0.85rem; margin-top: 5px; }
  .timer-box {
    background: #fdedec; color: #e74c3c; padding: 8px 18px; border-radius: 50px;
    font-weight: 900; font-size: 1.1rem; border: 1px solid #fadbd8;
    display: flex; align-items: center; gap: 8px; direction: ltr;
  }
  .timer-box.warning { background: #fef9e7; color: #f39c12; border-color: #fae5d3; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* سوالات */
  .question-box {
    background: #fafbfc; border: 1px solid #eef2f5; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .q-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.6; }
  
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    cursor: pointer; transition: 0.2s; font-size: 0.95rem;
  }
  .option-label:hover { background: #fbe9e7; border-color: #bf360c; }
  .option-label input[type="radio"] { display: none; }
  .option-label.selected { background: #fbe9e7; border-color: #bf360c; font-weight: 700; color: #8d2409; }
  
  .submit-btn {
    display: block; width: 100%; padding: 15px; margin-top: 30px;
    background: #bf360c; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer;
    transition: 0.3s;
  }
  .submit-btn:hover { background: #8d2409; }

  /* کارنامه */
  .result-container { display: none; text-align: center; }
  .student-name-display {
    font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 20px;
    background: #ecf0f1; padding: 10px 20px; border-radius: 10px; display: inline-block;
  }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 8px solid #ecf0f1;
  }
  .score-circle.excellent { border-color: #2ecc71; color: #2ecc71; }
  .score-circle.good { border-color: #f39c12; color: #f39c12; }
  .score-circle.fail { border-color: #e74c3c; color: #e74c3c; }
  .score-num { font-size: 2.8rem; font-weight: 900; line-height: 1; }
  .score-text { font-size: 0.9rem; color: #7f8c8d; margin-top: 5px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .stat-box { padding: 15px 25px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
  .stat-box.correct { color: #2ecc71; background: #e8f8f5; }
  .stat-box.wrong { color: #e74c3c; background: #fdedec; }
  
  .review-btn {
    display: inline-block; background: #3498db; color: #fff; text-decoration: none;
    padding: 12px 30px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer;
    font-size: 1rem;
  }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .header-top { flex-direction: column; gap: 10px; text-align: center; }
    .result-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- صفحه شروع -->
  <div id="start-section">
    <h1>📝 آزمون تستی درس ۲۲</h1>
    <p>اوضاع اقتصادی در ایران باستان — مطالعات اجتماعی پایه هفتم<br>لطفاً نام و نام خانوادگی خود را وارد کنید تا آزمون آغاز شود.</p>
    <input type="text" id="student-name" class="name-input" placeholder="مثلاً: علی محمدی">

  <!-- بخش آزمون -->

    <div class="header-top">

      <div class="timer-box" id="timer-display">⏱ ۱۰:۰۰</div>

    <form id="quiz-form">

  <!-- بخش کارنامه -->
  <div id="result-section" class="result-container">
    <h2 style="color:#2c3e50; margin-bottom:20px; font-weight:900;">🎓 کارنامه شما</h2>
    <div class="student-name-display" id="display-student-name">نام دانش‌آموز</div>
    
    <div id="score-circle" class="score-circle">

      <div class="score-text">از ۱۰۰</div>
<p id="out-of-20-text" style="font-size:1.2rem; font-weight:700; color:#00838f; margin-bottom:15px;"></p>
<p id="out-of-20-text" style="font-size:1.2rem; font-weight:700; color:#00838f; margin-bottom:15px;"></p>>
    </div>
    <p id="result-message" style="font-size:1.1rem; font-weight:700; margin-bottom:25px;"></p>
    <div class="result-stats">
      <div class="stat-box correct" id="stat-correct">تعداد درست: ۰</div>

    <a href="haftom.html" class="review-btn" style="background:#3498db; text-decoration:none;">🔙 بازگشت به دروس</a>

</div>

<script>
  // ==========================================
  // بانک ۴۰ سوالی درس ۲۲ (اوضاع اقتصادی در ایران باستان)
  // ==========================================
  const questionBank = [
    { q: "مهم‌ترین پیشه و وسیله معیشت در ایران باستان چه بود؟", options: ["کشاورزی", "صنعت", "تجارت", "معدن‌کاری"], answer: 0 },
    { q: "مهم‌ترین محصول زراعی ایران باستان چه بود؟", options: ["گندم و جو", "برنج و پنبه", "چای و نیشکر", "زیتون و خرما"], answer: 0 },
    { q: "کشت کدام محصول در نواحی مستعد ایران باستان رواج داشت؟", options: ["پنبه", "برنج", "چای", "نیشکر"], answer: 0 },
    { q: "کدام یک از صنایع ایران باستان به ظرافت و زیبایی مشهور بود؟", options: ["پارچه‌بافی", "کشتی‌سازی", "هواپیماسازی", "رایانه‌سازی"], answer: 0 },
    { q: "جاده شاهی به فرمان کدام پادشاه ساخته شد؟", options: ["داریوش اول", "کوروش", "خشایارشا", "اردشیر بابکان"], answer: 0 },
    { q: "جاده ابریشم چه مناطقی را به هم متصل می‌کرد؟", options: ["چین و هند در شرق را به اروپا در غرب", "ایران را به آفریقا", "روم را به مصر", "یونان را به ایران"], answer: 0 },
    { q: "ارزشمندترین و پرسودترین کالای تجاری در جاده ابریشم چه بود؟", options: ["ابریشم", "طلا", "ادویه", "قالی"], answer: 0 },
    { q: "اولین سکه زرین در زمان کدام پادشاه و با چه نامی ضرب شد؟", options: ["داریوش - دِریک", "کوروش - کوروشی", "خشایارشا - خشایاری", "اردشیر - اردشیری"], answer: 0 },
    { q: "سکه‌های زرین در ایران باستان فقط به فرمان چه کسی ضرب می‌شد؟", options: ["پادشاه", "بزرگان", "موبدان", "بازرگانان"], answer: 0 },
    { q: "منبع اصلی درآمد حکومت در ایران باستان چه بود؟", options: ["مالیات", "تجارت", "جنگ", "هدایا"], answer: 0 },
    { q: "بیشترین حجم مالیات را چه کسانی می‌پرداختند؟", options: ["کشاورزان", "بازرگانان", "پیشه‌وران", "درباریان"], answer: 0 },
    { q: "مالیات سرانه از چه کسانی گرفته می‌شد؟", options: ["فقط از عامه مردم", "از همه مردم", "از بزرگان", "از بازرگانان"], answer: 0 },
    { q: "آیا بزرگان و اشراف در ایران باستان مالیات می‌پرداختند؟", options: ["خیر، از پرداخت مالیات معاف بودند", "بله، مالیات سنگین", "بله، اما کم", "فقط در زمان جنگ"], answer: 0 },
    { q: "بخش زیادی از درآمدهای حکومت ایران باستان صرف چه چیزی می‌شد؟", options: ["جنگ با دشمنان", "ساخت مدرسه", "کمک به فقرا", "ساخت بیمارستان"], answer: 0 },
    { q: "قسمت دیگری از درآمدهای حکومت ایران باستان به چه مصارفی می‌رسید؟", options: ["مصارف شخصی شاه، شاهزادگان و درباریان و ساختن کاخ‌های مجلل", "ساخت پل و جاده", "کمک به کشاورزان", "ساخت مسجد"], answer: 0 },
    { q: "ایرانیان باستان در کدام زمینه مهارت داشتند و به تجارت دریایی روی آوردند؟", options: ["دریانوردی", "هواپیمایی", "معدن‌کاری", "کشاورزی"], answer: 0 },
    { q: "تجارت دریایی در کدام دوره رونق گرفت؟", options: ["ساسانیان", "مادها", "هخامنشیان", "اشکانیان"], answer: 0 },
    { q: "بنادر خلیج فارس در ایران باستان چه نقشی داشتند؟", options: ["لنگرگاه کشتی‌هایی بودند که به کشورهای دور و نزدیک رفت و آمد می‌کردند", "فقط برای ماهیگیری بودند", "فقط برای جنگ بودند", "فقط برای تفریح بودند"], answer: 0 },
    { q: "کشور ایران در مسیر جاده ابریشم چه موقعیتی داشت؟", options: ["پل ارتباطی بین شرق و غرب", "در حاشیه جاده", "دور از جاده", "در ابتدای جاده"], answer: 0 },
    { q: "حکومت ساسانی در مورد تجارت ابریشم چه سیاستی داشت؟", options: ["مانع از ارتباط مستقیم تجاری میان چین و روم می‌شد", "اجازه می‌داد چین و روم مستقیماً تجارت کنند", "ابریشم را از چین نمی‌خرید", "ابریشم را به چین می‌فروخت"], answer: 0 },
    { q: "ایران در ایران باستان چه کالاهایی صادر می‌کرد؟", options: ["سنگ‌های قیمتی، پارچه، قالی و محصولات کشاورزی", "فقط ابریشم", "فقط طلا", "فقط ادویه"], answer: 0 },
    { q: "مأموران مالیاتی در ایران باستان چگونه رفتار می‌کردند؟", options: ["نسبت به مردم سخت‌گیری و ستم می‌کردند و بیش از مقدار مقرر طلب می‌نمودند", "با مردم مهربان بودند", "مالیات نمی‌گرفتند", "فقط از ثروتمندان می‌گرفتند"], answer: 0 },
    { q: "در چه مواقعی فشار برای گرفتن مالیات در ایران باستان کمتر می‌شد؟", options: ["به سبب جلوگیری از شورش مردم یا بروز خشکسالی", "در زمان جنگ", "در زمان جشن", "در زمان صلح"], answer: 0 },
    { q: "ایرانیان باستان برای تجارت از چه طریقی غیر از راه‌های زمینی استفاده می‌کردند؟", options: ["تجارت دریایی", "تجارت هوایی", "تجارت ریلی", "تجارت فضایی"], answer: 0 },
    { q: "در دوره ساسانی، بیشتر تجارت از طریق کدام راه انجام می‌شد؟", options: ["جاده ابریشم", "جاده شاهی", "راه دریایی", "راه هوایی"], answer: 0 },
    { q: "شاهان پارس برای تشویق کشاورزی چه کاری انجام می‌دادند؟", options: ["یونانی‌ها از تلاش‌های کشاورزی تشویق می‌شدند و شاهان حسرت می‌خوردند", "به کشاورزان پول می‌دادند", "کشاورزان را به جنگ می‌فرستادند", "کشاورزی را ممنوع می‌کردند"], answer: 0 },
    { q: "در ایران باستان، کارگاه‌های پنبه‌ریسی یکی از صادرات مهم چه چیزی بودند؟", options: ["بعضی ایالت‌ها", "فقط پایتخت", "فقط شهرهای بزرگ", "فقط روستاها"], answer: 0 },
    { q: "کدام یک از پیشه‌های صنعتی ایران باستان بود؟", options: ["نساجی، فلزکاری و شیشه‌گری", "هواپیماسازی", "رایانه‌سازی", "ماشین‌سازی"], answer: 0 },
    { q: "ایرانیان در ساخت چه چیزهایی در صنعت پیشرفت کرده بودند؟", options: ["شمشیر، زره، ابزار کشاورزی", "هواپیما", "تلویزیون", "ماشین"], answer: 0 },
    { q: "هدف از ضرب سکه در ایران باستان چه بود؟", options: ["رونق تجارت و آسان شدن مبادله", "کاهش تجارت", "جنگ با دشمنان", "ساخت کاخ"], answer: 0 },
    { q: "در زمان هخامنشیان، سکه‌های نقره‌ای و مسی چه کسانی می‌توانستند ضرب کنند؟", options: ["حاکمان با اجازه پادشاه", "همه مردم", "فقط بازرگانان", "فقط کشاورزان"], answer: 0 },
    { q: "در ایران باستان، علاوه بر مالیات، چه منبع درآمد دیگری برای حکومت وجود داشت؟", options: ["هدایایی که در جشن‌ها به پادشاه تقدیم می‌شد", "فقط مالیات", "فقط تجارت", "فقط جنگ"], answer: 0 },
    { q: "ایرانیان باستان برای آبیاری زمین‌های کشاورزی از چه چیزی استفاده می‌کردند؟", options: ["قنات و نهر", "آب دریا", "آب باران فقط", "آب چاه فقط"], answer: 0 },
    { q: "در ایران باستان، بخشی از درآمد حکومت صرف چه چیزی می‌شد؟", options: ["احداث قنات‌ها، کاروانسراها و سدها", "ساخت هواپیما", "ساخت رایانه", "ساخت تلویزیون"], answer: 0 },
    { q: "در ایران باستان، چه کسانی بیش از همه در فعالیت‌های اقتصادی نقش داشتند؟", options: ["کشاورزان و دامداران", "درباریان", "موبدان", "شاهان"], answer: 0 },
    { q: "رونق جاده ابریشم چه تأثیری بر ایران داشت؟", options: ["رونق تجارت و افزایش درآمد", "کاهش تجارت", "افزایش جنگ", "کاهش جمعیت"], answer: 0 },
    { q: "در ایران باستان، کدام محصول به عنوان یک کالای تجاری ارزشمند بود؟", options: ["ابریشم", "گندم", "جو", "پنبه"], answer: 0 },
    { q: "مالیات در ایران باستان به چه صورت پرداخت می‌شد؟", options: ["نقدی یا جنسی", "فقط نقدی", "فقط جنسی", "فقط با طلا"], answer: 0 },
    { q: "چرا در ایران باستان، شاهان و درباریان مالیات نمی‌پرداختند؟", options: ["چون از طبقه اشراف بودند و از پرداخت مالیات معاف بودند", "چون فقیر بودند", "چون مالیات نمی‌گرفتند", "چون در جنگ بودند"], answer: 0 },
    { q: "مهم‌ترین دلیل اهمیت کشاورزی در ایران باستان چه بود؟", options: ["تأمین غذای مردم و رونق اقتصاد", "صادرات به خارج", "استفاده در جنگ", "ساخت ابزار"], answer: 0 },
    { q: "کدام یک از موارد زیر از منابع درآمد حکومت ایران باستان نبود؟", options: ["نفت و گاز", "مالیات کشاورزان", "مالیات سرانه", "هدایای جشن‌ها"], answer: 0 }
  ];

  const numQuestionsToShow = 15; 
  const totalTime = 600; // ۱۰ دقیقه
  
  let selectedQuestions = [];
  let timerInterval;
  let timeLeft = totalTime;
  let studentName = "";

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    if (studentName === "") {
      alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      return;
    }
    
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    
    initQuiz();
  }

  function initQuiz() {
    const shuffledBank = shuffle([...questionBank]);
    selectedQuestions = shuffledBank.slice(0, numQuestionsToShow);

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((item, index) => {
      const correctAnswerText = item.options[item.answer];
      const shuffledOptions = shuffle([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
      
      selectedQuestions[index].options = shuffledOptions;
      selectedQuestions[index].answer = newCorrectIndex;

      let optionsHTML = '';
      shuffledOptions.forEach((opt, i) => {
        optionsHTML += `
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="q${index}" value="${i}">
            <span>${opt}</span>
          </label>
        `;
      });

      const qBox = document.createElement('div');
      qBox.className = 'question-box';
      qBox.innerHTML = `
        <div class="q-title">${index + 1}. ${item.q}</div>
        <div class="options">${optionsHTML}</div>
      `;
      container.appendChild(qBox);
    });

    startTimer();
  }

  function startTimer() {
    const display = document.getElementById('timer-display');
    
    timerInterval = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      
      display.innerHTML = `⏱ ${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

      if (timeLeft <= 60) {
        display.classList.add('warning');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        display.innerHTML = `⏱ ۰۰:۰۰`;
        document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
      }
    }, 1000);
  }

  function selectOption(label) {
    const name = label.querySelector('input').name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.parentElement.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;

    selectedQuestions.forEach((item, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (!selected) {
        wrongCount++; 
      } else if (parseInt(selected.value) === item.answer) {
        correctCount++;
      } else {
        wrongCount++;
      }
    });

    const score = Math.round((correctCount / selectedQuestions.length) * 100);
submitScoreToTelegram(score, correctCount);
if (typeof window.saveGradeToFirebase === 'function') {
  window.saveGradeToFirebase(studentName, document.title, Math.ceil((correctCount / selectedQuestions.length) * 20), correctCount);
}
    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    document.getElementById('display-student-name').innerText = `دانش‌آموز: ${studentName}`;
    
    document.getElementById('score-display').innerText = score;
    document.getElementById('stat-correct').innerText = `تعداد درست: ${correctCount}`;
    document.getElementById('stat-wrong').innerText = `تعداد غلط: ${wrongCount}`;

    const circle = document.getElementById('score-circle');
    const msg = document.getElementById('result-message');
    
    circle.className = 'score-circle';
    if (score >= 80) {
      circle.classList.add('excellent');
      msg.innerText = "🌟 عالی بود! شما درس را به خوبی یاد گرفته‌اید.";
      msg.style.color = "#2ecc71";
    } else if (score >= 50) {
      circle.classList.add('good');
      msg.innerText = "👍 خوب بود، اما با کمی مطالعه بیشتر می‌توانید بهتر شوید.";
      msg.style.color = "#f39c12";
    } else {
      circle.classList.add('fail');
      msg.innerText = "📚 نیاز به مطالعه بیشتر دارید. ناامید نشوید و درسنامه را دوباره بخوانید.";
      msg.style.color = "#e74c3c";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
