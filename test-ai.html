<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست هوش مصنوعی (Groq)</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; background: #f0f2f5; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #00acc1; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        #result { margin-top: 20px; padding: 15px; background: #e0f7fa; border-radius: 5px; white-space: pre-wrap; line-height: 1.6; display: none; }
        .error { background: #ffebee !important; color: #c62828; border: 1px solid #ef9a9a; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="text-align:center; color:#333;">🤖 تست هوش مصنوعی (Groq)</h2>
        
        <input type="text" id="userInput" placeholder="مثلاً: آبرفت چیست؟">
        <button onclick="testAI()">ارسال سوال</button>

        <div id="result"></div>
    </div>

    <script>
        async function testAI() {
            const input = document.getElementById('userInput').value;
            const resultDiv = document.getElementById('result');
            
            if (!input) {
                alert("لطفاً یک سوال بنویسید.");
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.className = ''; 
            resultDiv.innerHTML = 'در حال ارتباط با سرور... ⏳';

            // کلید API شما
            const GROQ_API_KEY = "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";

            try {
                const payload = {
                    // 👈 به‌روزرسانی به جدیدترین مدلِ فعال و پرسرعتِ Groq
                    model: "openai/gpt-oss-120b", 
                    messages: [
                        { role: "system", content: "شما یک معلم مطالعات اجتماعی هستید. به فارسی، کوتاه و ساده جواب بده." },
                        { role: "user", content: input }
                    ]
                };

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`
                    },
                    // استفاده از Blob برای جلوگیری از خطای کاراکترهای فارسی
                    body: new Blob([JSON.stringify(payload)], { type: 'application/json' })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                resultDiv.innerHTML = data.choices[0].message.content;
                
            } catch (error) {
                resultDiv.classList.add('error');
                resultDiv.innerHTML = `❌ خطا رخ داد:<br><br>${error.message}`;
            }
        }
    </script>
</body>
</html>
