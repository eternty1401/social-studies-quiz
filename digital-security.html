<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسه امنیت دیجیتال | مهارت زندگی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    min-height: 100vh; color: #fff; padding: 30px 20px;
    display: flex; flex-direction: column; align-items: center;
  }

  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 2rem; font-weight: 900; margin-bottom: 10px; color: #10b981; text-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
  .header p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; }

  /* بدنه گوشی */
  .phone-mockup {
    background: #000; border: 8px solid #334155; border-radius: 35px;
    width: 100%; max-width: 400px; height: 650px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative;
  }

  /* هدر چت */
  .chat-header {
    background: #075e54; color: white; padding: 15px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #1f2c34;
  }
  .chat-header .avatar { width: 40px; height: 40px; background: #128c7e; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
  .chat-header .info h3 { font-size: 1rem; }
  .chat-header .info p { font-size: 0.7rem; color: #8696a0; }

  /* محتوای چت */
  .chat-body {
    flex: 1; background: #0b141a;
    background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
    background-size: cover;
    padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto;
  }

  .message {
    background: #202c33; color: #e9edef; padding: 10px 12px;
    border-radius: 10px 0 10px 10px; max-width: 90%; align-self: flex-end;
    font-size: 0.9rem; line-height: 1.6; position: relative;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3); animation: popIn 0.3s ease;
  }
  .message.sender { background: #005c4b; border-radius: 0 10px 10px 10px; align-self: flex-start; }
  .message .name { font-size: 0.75rem; color: #53bdeb; margin-bottom: 4px; display: block; font-weight: bold; }

  /* فایل پیوست */
  .file-attachment {
    background: rgba(0,0,0,0.2); border-radius: 8px; padding: 12px;
    margin-top: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; border: 1px dashed #475569;
  }
  .file-attachment:hover { background: rgba(0,0,0,0.4); border-color: #10b981; }
  .file-icon { font-size: 1.8rem; color: #ef4444; }
  .file-info .file-name { font-size: 0.85rem; font-weight: bold; direction: ltr; text-align: left; }
  .file-info .file-size { font-size: 0.7rem; color: #8696a0; }

  /* دکمه‌های انتخاب */
  .choices-container { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
    padding: 12px; border-radius: 10px; font-family: inherit; font-size: 0.9rem;
    font-weight: bold; cursor: pointer; transition: 0.2s; text-align: right;
  }
  .choice-btn:hover { background: #334155; transform: translateX(-5px); }
  .choice-btn.danger:hover { border-color: #ef4444; color: #ef4444; }
  .choice-btn.safe:hover { border-color: #10b981; color: #10b981; }

  /* بخش تحلیل هوش مصنوعی */
  .ai-analysis {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(5px);
    padding: 25px; display: none; flex-direction: column; justify-content: center;
    z-index: 10; animation: fadeIn 0.4s ease; overflow-y: auto;
  }
  .ai-analysis h3 { color: #38bdf8; font-size: 1.2rem; margin-bottom: 15px; text-align: center; }
  .ai-analysis p { font-size: 0.95rem; line-height: 1.8; color: #cbd5e1; margin-bottom: 20px; text-align: justify; white-space: pre-wrap; }
  .ai-analysis .result-icon { font-size: 3rem; text-align: center; margin-bottom: 15px; }
  
  .next-btn {
    background: #38bdf8; color: #0f172a; border: none; padding: 12px;
    border-radius: 10px; font-family: inherit; font-size: 1rem; font-weight: 900;
    cursor: pointer; width: 100%; margin-top: auto; transition: 0.3s;
  }
  .next-btn:hover { background: #fff; }

  .loading-spinner { text-align: center; color: #38bdf8; font-weight: bold; display: none; margin: 20px 0; font-size: 1rem; }

  @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

  <div class="header">

    <div class="chat-body" id="chatBody">

    <!-- بخش تحلیل هوش مصنوعی -->

      <h3 id="resultTitle">تحلیل هوش مصنوعی</h3>
      <p id="resultText"></p>
      <div class="loading-spinner" id="loadingSpinner">هوش مصنوعی در حال بررسی تصمیم شماست... ⏳</div>
      <button class="next-btn" id="nextBtn" onclick="loadNextScenario()" style="display: none;">سناریوی بعدی ←</button>
    </div>
  </div>

  <script>

    // بانک ۱۰ سناریوی امنیتی

      },
      {

        file: null,
        choices: [
          { text: "سریع روی لینک می‌زنم تا حسابم باز بشه.", type: "danger" },

        ],
        promptContext: "یک پیامک جعلی از طرف بانک ارسال شده که کاربر را به یک لینک فیشینگ هدایت می‌کند."
      },
      {

        file: null,

          { text: "آره، چون دوستمه رمزمو بهش می‌دم.", type: "danger" },
          { text: "رمزمو بهش می‌دم ولی میگم به کسی نده.", type: "danger" },
          { text: "بهش میگم نمی‌تونم رمزم رو بدم و راه دیگه‌ای پیدا می‌کنیم.", type: "safe" }
        ],
        promptContext: "یک دوست درخواست رمز عبور اکانت اینستاگرام را دارد."
      },
      {
        sender: "کافه (وای‌فای رایگان)",
        title: "وای‌فای عمومی",
        message: "به وای‌فای رایگان کافه متصل شدید. لطفاً برای استفاده از اینترنت، شماره موبایل و کد ملی خود را وارد کنید.",
        file: null,
        choices: [
          { text: "اطلاعاتمو وارد می‌کنم تا اینترنت رایگان بگیرم.", type: "danger" },
          { text: "برای اتصال به وای‌فای عمومی اطلاعات حساسمو وارد نمی‌کنم.", type: "safe" },
          { text: "یک اپلیکیشن هک وای‌فای نصب می‌کنم.", type: "danger" }
        ],
        promptContext: "وای‌فای عمومی درخواست اطلاعات شخصی حساس دارد."
      },
      {
        sender: "پیام ناشناس (جایزه)",
        title: "پیام ناشناس",
        message: "تبریک! شما برنده یک گوشی آیفون ۱۵ شدید! برای دریافت جایزه، فقط کافیه ۵۰ هزار تومن هزینه ارسال رو به این شماره کارت واریز کنید.",
        file: null,
        choices: [
          { text: "۵۰ هزار تومن که پولی نیست، واریز می‌کنم تا جایزه‌مو بگیرم.", type: "danger" },
          { text: "شماره کارت رو می‌گیرم و پیگیری می‌کنم.", type: "danger" },
          { text: "این یک کلاهبرداری واضحه، پاکش می‌کنم و بلاکش می‌کنم.", type: "safe" }
        ],
        promptContext: "پیام برنده شدن جایزه و درخواست واریز پول برای هزینه ارسال (کلاهبرداری)."
      },
      {
        sender: "پشتیبانی (ناشناس)",
        title: "تماس تلفنی",
        message: "سلام، من از پشتیبانی تلگرام هستم. حساب شما هک شده. برای اینکه حسابتون رو نجات بدیم، کد ۶ رقمی که الان براتون پیامک میشه رو به من بگید.",
        file: null,
        choices: [
          { text: "کد رو بهشون می‌گم تا حسابمو نجات بدن.", type: "danger" },
          { text: "چون از پشتیبانیه، حتماً راست میگه.", type: "danger" },
          { text: "کد رو نمی‌گم و تماس رو قطع می‌کنم.", type: "safe" }
        ],
        promptContext: "تماس تلفنی جعلی از طرف پشتیبانی و درخواست کد یکبار مصرف (OTP)."
      },
      {
        sender: "گروه بازی (ناشناس)",
        title: "گروه گیمینگ",
        message: "سلام بچه‌ها! من هک بازی PUBG ساختم که با اون می‌تونید همه اسکین‌ها رو رایگان بگیری. فقط کافیه این فایل نصبی (apk) رو دانلود کنید.",
        file: "pubg_hack_mod.apk",
        choices: [
          { text: "دانلودش می‌کنم تا اسکین‌های رایگان بگیرم!", type: "danger" },
          { text: "فایل نصبی رو نصب نمی‌کنم چون ممکنه گوشیمو هک کنه.", type: "safe" },
          { text: "اول با آنتی‌ویروس چکش می‌کنم بعد نصب می‌کنم.", type: "danger" }
        ],
        promptContext: "فایل نصبی اندروید (APK) برای هک بازی که در واقع بدافزار است."
      },
      {
        sender: "پست (پیامک)",
        title: "پیامک پست",
        message: "مرسوله شما به دلیل نقص آدرس در پست برگشت خورده است. لطفاً برای اصلاح آدرس به لینک زیر مراجعه کنید: \n http://post-track.ir",
        file: null,
        choices: [
          { text: "لینک رو باز می‌کنم و آدرسم رو اصلاح می‌کنم.", type: "danger" },
          { text: "چون منتظر یه بسته بودم، حتماً درسته.", type: "danger" },
          { text: "کد رهگیری رو از سایت رسمی پست چک می‌کنم.", type: "safe" }
        ],
        promptContext: "پیامک جعلی از طرف پست برای فیشینگ اطلاعات (Phishing)."
      },
      {
        sender: "دوست (اکانت هک شده)",
        title: "پیام مستقیم (دایرکت)",
        message: "سلام! من خیلی تو دردسر افتادم، واسم ۲ میلیون پول بریز به این شماره کارت، فردا برات برمی‌گردونم.",
        file: null,
        choices: [
          { text: "سریع پول رو واریز می‌کنم چون دوستمه.", type: "danger" },
          { text: "بهش زنگ می‌زنم یا با راه دیگه‌ای احراز هویت می‌کنم.", type: "safe" },
          { text: "بهش میگم من پول ندارم.", type: "danger" }
        ],
        promptContext: "درخواست کمک مالی فوری از یک دوست که حسابش هک شده است."
      },
      {
        sender: "گروه کلاسی",
        title: "گروه عمومی",
        message: "بچه‌ها یه تست شخصیت‌شناسی خیلی باحال اومده! فقط باید اسم و شماره تلفنتون رو بدید تا شخصیتتون رو تحلیل کنه. \n http://personality-test.ir",
        file: null,
        choices: [
          { text: "شرکت می‌کنم چون کنجکاوم ببینم چه شخصیتی دارم.", type: "danger" },
          { text: "اطلاعات شخصیمو در سایت‌های ناشناس وارد نمی‌کنم.", type: "safe" },
          { text: "اسمم رو می‌نویسم ولی شماره تلفنم رو نه.", type: "danger" }
        ],
        promptContext: "تست شخصیت آنلاین که در واقع برای جمع‌آوری داده‌های شخصی (Data Harvesting) است."
      }
    ];

    function loadNextScenario() {
      document.getElementById('aiAnalysis').style.display = 'none';
      
      if (currentScenarioIndex >= scenarios.length) {
        currentScenarioIndex = 0;
        alert("شما تمام سناریوها را دیدید! از اول شروع می‌کنیم.");
      }

      const scenario = scenarios[currentScenarioIndex];
      
      document.getElementById('chatTitle').innerText = scenario.title;
      document.getElementById('chatSubtitle').innerText = "پیام جدید";

      const chatBody = document.getElementById('chatBody');
      
      // استفاده از حلقه برای ساخت دکمه‌ها بدون مشکل
      let choicesHTML = '';
      scenario.choices.forEach((choice, index) => {
          choicesHTML += `<button class="choice-btn ${choice.type}" onclick="makeChoice(${index})">${index + 1}. ${choice.text}</button>`;
      });

      chatBody.innerHTML = `
        <div class="message sender">
          <span class="name">${scenario.sender}</span>
          ${scenario.message}
          
          ${scenario.file ? `
          <div class="file-attachment" onclick="makeChoice('download')">
            <div class="file-icon">📄</div>
            <div class="file-info">
              <div class="file-name">${scenario.file}</div>
              <div class="file-size">حجم نامشخص</div>
            </div>
          </div>` : ''}
        </div>

        <!-- سوال از دانش آموز -->
        <div style="background: rgba(56, 189, 248, 0.1); border: 1px dashed #38bdf8; padding: 15px; border-radius: 10px; margin-top: 10px;">
          <p style="font-size: 0.9rem; margin-bottom: 15px; color: #38bdf8; font-weight: bold;">شما چه کار می‌کنید؟</p>
          <div class="choices-container" id="choicesContainer">
            ${choicesHTML}
          </div>
        </div>
      `;
      
      chatBody.scrollTop = 0;
    }

    async function makeChoice(choiceIdx) {
      const scenario = scenarios[currentScenarioIndex];
      
      let choiceType = "danger";
      let choiceText = "دانلود فایل";
      
      if (typeof choiceIdx === 'number') {
          choiceType = scenario.choices[choiceIdx].type;
          choiceText = scenario.choices[choiceIdx].text;
      }

      const aiAnalysis = document.getElementById('aiAnalysis');
      const resultText = document.getElementById('resultText');
      const resultTitle = document.getElementById('resultTitle');
      const resultIcon = document.getElementById('resultIcon');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const nextBtn = document.getElementById('nextBtn');

      // نمایش بخش تحلیل و لودینگ
      aiAnalysis.style.display = 'flex';
      loadingSpinner.style.display = 'block';
      nextBtn.style.display = 'none';
      resultText.innerText = "";
      
      if (choiceType === 'danger') {
        resultTitle.innerText = "⚠️ زنگ خطر!";
        resultIcon.innerText = "💀";
        resultText.style.color = "#fca5a5";
      } else {
        resultTitle.innerText = "🎉 آفرین به هوشیاری تو!";
        resultIcon.innerText = "🛡️";
        resultText.style.color = "#a7f3d0";
      }

      const prompt = `
        شما یک کارشناس امنیت سایبری هستید.
        موقعیت (Context): ${scenario.promptContext}
        دانش‌آموز این واکنش را انتخاب کرده است: "${choiceText}"
        نوع واکنش: ${choiceType === 'safe' ? 'ایمن و هوشمندانه' : 'خطرناک و پرریسک'}

        لطفاً به زبان ساده، صمیمی و آموزشی تحلیل کنید:
        ۱. اگر انتخابش خطرناک بوده، دقیقاً توضیح دهید چه بلایی سرش می‌آید.
        ۲. اگر انتخابش ایمن بوده، تشویقش کنید و بگویید چرا کارش درست بوده.
        ۳. یک نکته طلایی برای دفعات بعد به او یاد بدهید.
        پاسخ در قالب ۲ پاراگراف کوتاه و کاملاً فارسی باشد.
      `;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000); 

      try {
        const payload = {
          model: "openai/gpt-oss-120b",
          messages: [
            { role: "system", content: "شما یک متخصص امنیت سایبری هستید که با دانش‌آموز صحبت می‌کنید. لحن شما باید دلسوزانه، آموزشی و هشداردهنده باشد." },
            { role: "user", content: prompt }
          ]
        };

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${GROQ_API_KEY}` },
          body: new Blob([JSON.stringify(payload)], { type: 'application/json' }),
          signal: controller.signal 
        });

        clearTimeout(timeoutId);
        const data = await response.json();
        loadingSpinner.style.display = 'none';
        
        if (data.error) throw new Error(data.error.message);
        
        resultText.innerText = data.choices[0].message.content;
        nextBtn.style.display = 'block';
        
        currentScenarioIndex++;

      } catch (error) {
        clearTimeout(timeoutId);
        loadingSpinner.style.display = 'none';
        resultIcon.innerText = "❌";
        if (error.name === 'AbortError') {
            resultText.innerText = "⏳ زمان پاسخگویی سرور به پایان رسید. لطفاً اینترنت یا فیلترشکن خود را بررسی کرده و صفحه را رفرش کنید.";
        } else {
            resultText.innerText = "❌ خطا در ارتباط با هوش مصنوعی. لطفاً از فیلترشکن استفاده کنید.";
        }
        nextBtn.style.display = 'block';
        console.error(error);
      }
    }

    // شروع بازی
    window.onload = loadNextScenario;
  </script>
</body>
</html>
