<!DOCTYPE html>
<html lang="fa" dir="rtl">
 <script src="telegram.js"></script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون تستی درس ۲۳: عقاید و سبک زندگی مردم در ایران باستان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
  }
  
  /* صفحه شروع */
  #start-section { text-align: center; padding: 20px 0; }
  #start-section h1 { color: #303f9f; font-size: 1.6rem; margin-bottom: 15px; }
  #start-section p { color: #7f8c8d; margin-bottom: 30px; line-height: 1.8; }
  .name-input {
    width: 100%; max-width: 400px; padding: 15px; margin-bottom: 20px;
    border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit;
    font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #303f9f; box-shadow: 0 0 10px rgba(48,63,159,0.2); }
  .start-btn {
    background: #2ecc71; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
  }
  .start-btn:hover { background: #27ae60; transform: translateY(-2px); }

  /* هدر و تایمر */
  .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eef2f5; padding-bottom: 15px; margin-bottom: 25px; }
  .header-title h1 { color: #303f9f; font-size: 1.4rem; }
  .header-title p { color: #7f8c8d; font-size: 0.85rem; margin-top: 5px; }
  .timer-box {
    background: #fdedec; color: #e74c3c; padding: 8px 18px; border-radius: 50px;
    font-weight: 900; font-size: 1.1rem; border: 1px solid #fadbd8;
    display: flex; align-items: center; gap: 8px; direction: ltr;
  }
  .timer-box.warning { background: #fef9e7; color: #f39c12; border-color: #fae5d3; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* سوالات */
  .question-box {
    background: #fafbfc; border: 1px solid #eef2f5; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .q-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.6; }
  
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    cursor: pointer; transition: 0.2s; font-size: 0.95rem;
  }
  .option-label:hover { background: #e8eaf6; border-color: #303f9f; }
  .option-label input[type="radio"] { display: none; }
  .option-label.selected { background: #e8eaf6; border-color: #303f9f; font-weight: 700; color: #1a237e; }
  
  .submit-btn {
    display: block; width: 100%; padding: 15px; margin-top: 30px;
    background: #303f9f; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer;
    transition: 0.3s;
  }
  .submit-btn:hover { background: #1a237e; }

  /* کارنامه */
  .result-container { display: none; text-align: center; }
  .student-name-display {
    font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 20px;
    background: #ecf0f1; padding: 10px 20px; border-radius: 10px; display: inline-block;
  }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 8px solid #ecf0f1;
  }
  .score-circle.excellent { border-color: #2ecc71; color: #2ecc71; }
  .score-circle.good { border-color: #f39c12; color: #f39c12; }
  .score-circle.fail { border-color: #e74c3c; color: #e74c3c; }
  .score-num { font-size: 2.8rem; font-weight: 900; line-height: 1; }
  .score-text { font-size: 0.9rem; color: #7f8c8d; margin-top: 5px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .stat-box { padding: 15px 25px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
  .stat-box.correct { color: #2ecc71; background: #e8f8f5; }
  .stat-box.wrong { color: #e74c3c; background: #fdedec; }
  
  .review-btn {
    display: inline-block; background: #3498db; color: #fff; text-decoration: none;
    padding: 12px 30px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer;
    font-size: 1rem;
  }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .header-top { flex-direction: column; gap: 10px; text-align: center; }
    .result-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- صفحه شروع -->
  <div id="start-section">
    <h1>📝 آزمون تستی درس ۲۳</h1>
    <p>عقاید و سبک زندگی مردم در ایران باستان — مطالعات اجتماعی پایه هفتم<br>لطفاً نام و نام خانوادگی خود را وارد کنید تا آزمون آغاز شود.</p>
    <input type="text" id="student-name" class="name-input" placeholder="مثلاً: علی محمدی">
    <br>
    <button class="start-btn" onclick="startQuiz()">شروع آزمون</button>
  </div>

  <!-- بخش آزمون -->
  <div id="quiz-section" style="display: none;">
    <div class="header-top">
      <div class="header-title">
        <h1>📝 آزمون تستی درس ۲۳</h1>
        <p>۱۵ سوال تصادفی از بانک ۴۰ سوالی</p>
      </div>
      <div class="timer-box" id="timer-display">⏱ ۱۰:۰۰</div>
    </div>
    
    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="submit" class="submit-btn" id="submit-btn">ثبت پاسخ‌ها و مشاهده کارنامه</button>
    </form>
  </div>

  <!-- بخش کارنامه -->
  <div id="result-section" class="result-container">
    <h2 style="color:#2c3e50; margin-bottom:20px; font-weight:900;">🎓 کارنامه شما</h2>
    <div class="student-name-display" id="display-student-name">نام دانش‌آموز</div>
    
    <div id="score-circle" class="score-circle">
      <div class="score-num" id="score-display">0</div>
      <div class="score-text">از ۱۰۰</div>
    </div>
    <p id="result-message" style="font-size:1.1rem; font-weight:700; margin-bottom:25px;"></p>
    <div class="result-stats">
      <div class="stat-box correct" id="stat-correct">تعداد درست: ۰</div>
      <div class="stat-box wrong" id="stat-wrong">تعداد غلط: ۰</div>
    </div>
    <a href="haftom.html" class="review-btn" style="background:#3498db; text-decoration:none;">🔙 بازگشت به دروس</a>
  </div>

</div>

<script>
  // ==========================================
  // بانک ۴۰ سوالی درس ۲۳ (عقاید و سبک زندگی)
  // ==========================================
  const questionBank = [
    { q: "پیامبر ایران باستان که مردم را به پرستش اهورامزدا دعوت کرد چه نام داشت؟", options: ["زرتشت", "مزدک", "مانی", "بهرام"], answer: 0 },
    { q: "زرتشت مردم را به پرستش چه کسی دعوت کرد؟", options: ["اهورامزدا (خدای بزرگ و یکتا)", "خورشید", "ماه", "بت‌ها"], answer: 0 },
    { q: "در آیین زرتشت، اهورامزدا منشأ چه چیزی بود؟", options: ["خیر و خوبی", "شر و بدی", "جنگ و نزاع", "قحطی"], answer: 0 },
    { q: "در آیین زرتشت، اهریمن سرچشمه چه چیزی بود؟", options: ["شر و بدی", "خیر و خوبی", "آب و باران", "نور و روشنایی"], answer: 0 },
    { q: "سه اصل اساسی تعالیم زرتشت کدام‌اند؟", options: ["پندار نیک، گفتار نیک، کردار نیک", "پندار بد، گفتار بد، کردار بد", "جنگ، صلح، تجارت", "کشاورزی، دامداری، صنعت"], answer: 0 },
    { q: "کتاب مقدس زرتشتیان چه نام دارد؟", options: ["اوستا", "قرآن", "انجیل", "تورات"], answer: 0 },
    { q: "آتش در نزد ایرانیان باستان چه جایگاهی داشت؟", options: ["مقدس بود", "بی‌ارزش بود", "ممنوع بود", "خطرناک بود"], answer: 0 },
    { q: "در دوره ساسانیان، دین رسمی کشور چه دینی بود؟", options: ["زرتشتی", "مسیحی", "یهودی", "اسلام"], answer: 0 },
    { q: "در دوره ساسانیان، کدام ادیان در ایران وجود داشتند؟", options: ["زرتشتی، مسیحی، یهودی، بودایی و مانوی", "فقط زرتشتی", "فقط اسلام", "فقط مسیحی"], answer: 0 },
    { q: "غذای اصلی مردم ایران باستان چه بود؟", options: ["غلات مخصوصاً گندم", "برنج", "گوشت", "لبنیات"], answer: 0 },
    { q: "در ایران باستان، سخن گفتن به هنگام غذا خوردن چه حکمی داشت؟", options: ["گناه دانسته می‌شد", "مستحب بود", "واجب بود", "مباح بود"], answer: 0 },
    { q: "ایرانیان باستان از چه ظروفی برای غذا خوردن استفاده می‌کردند؟", options: ["سفالی، سنگی و فلزی", "فقط پلاستیکی", "فقط شیشه‌ای", "فقط طلایی"], answer: 0 },
    { q: "ایرانیان باستان از نخستین کسانی بودند که چه چیزی را طراحی کردند؟", options: ["شلوار", "کفش", "کلاه", "دستکش"], answer: 0 },
    { q: "پوشاک اصلی مردان در ایران باستان چه بود؟", options: ["شلوار، بالاپوش آستین‌دار و کلاه نمدی", "لباس بلند و کاله", "عبا و عمامه", "پیراهن کوتاه"], answer: 0 },
    { q: "زنان در ایران باستان از چه نوع پوششی استفاده می‌کردند؟", options: ["شلوار، پیراهن‌های بلند و نوعی سربند", "لباس کوتاه", "شلوار و پیراهن کوتاه", "لباس نظامی"], answer: 0 },
    { q: "هرودوت نوشته است که ایرانیان به فرزندان خود سه چیز را می‌آموختند. کدام‌اند؟", options: ["سوارکاری، تیراندازی و راستگویی", "خواندن، نوشتن و شنا", "تجارت، صنعت و کشاورزی", "جنگ، صلح و سیاست"], answer: 0 },
    { q: "کدام ورزش در ایران باستان ابداع شد و سپس به سایر کشورها راه یافت؟", options: ["چوگان", "فوتبال", "بسکتبال", "والیبال"], answer: 0 },
    { q: "در ورزش چوگان از چه وسایلی استفاده می‌شود؟", options: ["چوب دستی به نام چوگان و یک گوی", "توپ و دروازه", "راکت و توپ", "چوب و نیزه"], answer: 0 },
    { q: "بیشتر جشن‌های ایران باستان چه ویژگی داشتند؟", options: ["اهمیت دینی داشته و با نیایش همراه بودند", "فقط جنبه تفریحی داشتند", "فقط برای شاهان بود", "فقط در زمستان برگزار می‌شد"], answer: 0 },
    { q: "واژهٔ جشن از کدام واژه گرفته شده است؟", options: ["یَسْنه یَشْت اوستایی", "جشن فارسی", "شادمانی", "پیروزی"], answer: 0 },
    { q: "بزرگ‌ترین و مهم‌ترین جشن ایران باستان چه بود؟", options: ["جشن نوروز", "جشن مهرگان", "جشن سده", "جشن یلدا"], answer: 0 },
    { q: "جشن نوروز در چه فصلی برگزار می‌شود؟", options: ["بهار", "تابستان", "پاییز", "زمستان"], answer: 0 },
    { q: "نوروز در نزد مردم ایران باستان چه پیامی داشت؟", options: ["نو شدن سال و رویش طبیعت و شروع کشاورزی", "پایان کشاورزی", "آغاز زمستان", "پایان سال"], answer: 0 },
    { q: "در عهد باستان، خانواده‌های ایرانی بر سر سفرهٔ نوروزی چه می‌کردند؟", options: ["به درگاه آفرینندهٔ هستی دعا می‌گفتند", "آتش روشن می‌کردند", "به بت‌ها سجده می‌کردند", "قرآن می‌خواندند"], answer: 0 },
    { q: "در زمان کدام سلسله، جشن نوروز در تخت جمشید برگزار می‌شد؟", options: ["هخامنشیان", "ساسانیان", "اشکانیان", "مادها"], answer: 0 },
    { q: "پس از اسلام، ایرانیان چه کاری در مورد نوروز انجام دادند؟", options: ["ظاهر نوروز را نگه داشتند، اما محتوا و سنت‌های آن را عوض کردند", "نوروز را رها کردند", "نوروز را ممنوع کردند", "نوروز را از کشورهای دیگر گرفتند"], answer: 0 },
    { q: "امروزه مردم ایران در هنگام تحویل سال چه می‌کنند؟", options: ["مشغول دعا و سخن گفتن با خدا هستند", "آتش روشن می‌کنند", "به بت‌ها سجده می‌کنند", "موسیقی می‌نوازند"], answer: 0 },
    { q: "در سفره هفت‌سین، چه چیزی گذاشته می‌شود؟", options: ["قرآن", "انجیل", "اوستا", "تورات"], answer: 0 },
    { q: "مردم ایران باستان برای ورزش‌های رزمی و پهلوانی چه علاقه‌ای داشتند؟", options: ["علاقه‌مند بوده‌اند و پهلوانی در تاریخ کهن ما ریشه دارد", "علاقه‌ای نداشتند", "فقط شاهان ورزش می‌کردند", "ورزش ممنوع بود"], answer: 0 },
    { q: "کتاب شاهنامه اثر کدام شاعر است؟", options: ["فردوسی", "حافظ", "سعدی", "مولوی"], answer: 0 },
    { q: "شاهنامه از دلاوری چه اسطوره‌هایی سخن گفته است؟", options: ["رستم، سهراب، سیاوش، گردآفرید", "آرش، کاوه، بابک", "رستم و سهراب", "همه موارد"], answer: 0 },
    { q: "زرتشت در چه دوره‌ای می‌زیست؟", options: ["قبل از سلسله مادها", "در زمان هخامنشیان", "در زمان ساسانیان", "بعد از اسلام"], answer: 0 },
    { q: "در دوره ساسانیان، موبدان زرتشتی با گسترش چه چیزی مخالفت می‌کردند؟", options: ["ادیان دیگر", "کشاورزی", "تجارت", "صنعت"], answer: 0 },
    { q: "لباس‌های ایرانی در ایران باستان مورد توجه چه کسانی بود؟", options: ["بزرگان و درباریان روم و یونان", "فقط ایرانیان", "فقط مردم عادی", "هیچ‌کس"], answer: 0 },
    { q: "ایرانیان باستان به پوشش بدن چه اهمیتی می‌دادند؟", options: ["اهمیت زیادی می‌دادند و از برهنگی اجتناب می‌کردند", "اهمیت نمی‌دادند", "فقط در زمستان می‌پوشیدند", "برهنگی رایج بود"], answer: 0 },
    { q: "پرتاب سنگ یا فالخن در ایران باستان چه بود؟", options: ["وسیله‌ای برای پرتاب سنگ یا نیزه کوچک", "نوعی غذا", "نوعی لباس", "نوعی ظرف"], answer: 0 },
    { q: "جشن‌های ایران باستان ارتباط زیادی با چه چیزی داشتند؟", options: ["تغییر فصل‌ها و شروع و پایان کار کشاورزی", "جنگ‌ها", "تجارت", "ساخت بناها"], answer: 0 },
    { q: "پس از اسلام، نوروز چه تغییراتی کرد؟", options: ["به یک سنت مردمی و وسیله‌ای برای ارتباط قلبی با خداوند تبدیل شد", "از بین رفت", "فقط برای پادشاهان ماند", "ممنوع شد"], answer: 0 },
    { q: "طبق فرموده زرتشتیان، سه اصل اساسی چه بود؟", options: ["پندار نیک، گفتار نیک، کردار نیک", "جنگ، صلح، تجارت", "کشاورزی، دامداری، صنعت", "شادی، غم، عبادت"], answer: 0 },
    { q: "کدام یک از ورزش‌های امروزی در ایران باستان نیز وجود داشت؟", options: ["کشتی و چوگان", "فوتبال", "والیبال", "بسکتبال"], answer: 0 }
  ];

  const numQuestionsToShow = 15; 
  const totalTime = 600; // ۱۰ دقیقه
  
  let selectedQuestions = [];
  let timerInterval;
  let timeLeft = totalTime;
  let studentName = "";

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    if (studentName === "") {
      alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      return;
    }
    
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    
    initQuiz();
  }

  function initQuiz() {
    const shuffledBank = shuffle([...questionBank]);
    selectedQuestions = shuffledBank.slice(0, numQuestionsToShow);

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((item, index) => {
      const correctAnswerText = item.options[item.answer];
      const shuffledOptions = shuffle([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
      
      selectedQuestions[index].options = shuffledOptions;
      selectedQuestions[index].answer = newCorrectIndex;

      let optionsHTML = '';
      shuffledOptions.forEach((opt, i) => {
        optionsHTML += `
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="q${index}" value="${i}">
            <span>${opt}</span>
          </label>
        `;
      });

      const qBox = document.createElement('div');
      qBox.className = 'question-box';
      qBox.innerHTML = `
        <div class="q-title">${index + 1}. ${item.q}</div>
        <div class="options">${optionsHTML}</div>
      `;
      container.appendChild(qBox);
    });

    startTimer();
  }

  function startTimer() {
    const display = document.getElementById('timer-display');
    
    timerInterval = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      
      display.innerHTML = `⏱ ${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

      if (timeLeft <= 60) {
        display.classList.add('warning');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        display.innerHTML = `⏱ ۰۰:۰۰`;
        document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
      }
    }, 1000);
  }

  function selectOption(label) {
    const name = label.querySelector('input').name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.parentElement.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;

    selectedQuestions.forEach((item, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (!selected) {
        wrongCount++; 
      } else if (parseInt(selected.value) === item.answer) {
        correctCount++;
      } else {
        wrongCount++;
      }
    });

    const score = Math.round((correctCount / selectedQuestions.length) * 100);
submitScoreToTelegram(score, correctCount);
    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    document.getElementById('display-student-name').innerText = `دانش‌آموز: ${studentName}`;
    
    document.getElementById('score-display').innerText = score;
    document.getElementById('stat-correct').innerText = `تعداد درست: ${correctCount}`;
    document.getElementById('stat-wrong').innerText = `تعداد غلط: ${wrongCount}`;

    const circle = document.getElementById('score-circle');
    const msg = document.getElementById('result-message');
    
    circle.className = 'score-circle';
    if (score >= 80) {
      circle.classList.add('excellent');
      msg.innerText = "🌟 عالی بود! شما درس را به خوبی یاد گرفته‌اید.";
      msg.style.color = "#2ecc71";
    } else if (score >= 50) {
      circle.classList.add('good');
      msg.innerText = "👍 خوب بود، اما با کمی مطالعه بیشتر می‌توانید بهتر شوید.";
      msg.style.color = "#f39c12";
    } else {
      circle.classList.add('fail');
      msg.innerText = "📚 نیاز به مطالعه بیشتر دارید. ناامید نشوید و درسنامه را دوباره بخوانید.";
      msg.style.color = "#e74c3c";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
