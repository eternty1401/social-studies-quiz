<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون | مدرّس</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root { --primary: #1e40af; --bg: #f0f4f8; --card: #fff; --text: #1e293b; --border: #cbd5e1; --success: #16a34a; --error: #dc2626; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

  /* ===== استایل‌های آنلاین ===== */
  .container { max-width: 800px; margin: 0 auto; padding: 16px; }
  .name-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .name-box { background: #fff; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
  .name-box h2 { color: var(--primary); margin-bottom: 15px; font-size: 1.2rem; }
  .name-box input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 1rem; margin-bottom: 15px; text-align: center; }
  .name-box button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; }

  .exam-header { background: #fff; padding: 20px; border-radius: 12px; text-align: center; border: 2px solid var(--primary); margin-bottom: 20px; }
  .header-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 10px; color: #475569; }
  .header-title { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
  .student-name-line { margin-top: 15px; font-weight: bold; text-align: right; border-bottom: 1px dashed #94a3b8; padding-bottom: 5px; }
  
  .timer-box { position: sticky; top: 10px; background: var(--primary); color: white; padding: 12px; border-radius: 10px; text-align: center; font-size: 1.2rem; font-weight: bold; z-index: 100; margin-bottom: 20px; }
  .timer-box.warning { background: var(--error); }
  
  .question-card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .q-text { font-weight: bold; margin-bottom: 16px; font-size: 1.05rem; }
  .options-list { display: flex; flex-direction: column; gap: 10px; }
  .option-item { display: flex; align-items: center; padding: 12px; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; }
  .option-item input { margin-left: 10px; width: 18px; height: 18px; }
  input[type="text"], textarea { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; background: #fff; color: #000; }
  .btn-submit { width: 100%; padding: 16px; background: var(--success); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 20px; }
  .btn-print { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 20px; display: none; }
  .result-box { background: #fff; padding: 30px; border-radius: 12px; text-align: center; display: none; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 8px solid var(--success); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; color: var(--success); margin: 20px auto; }

  /* ===== استایل PDF (مطابق نمونه) ===== */
  #pdf-container { display: none; background: white; width: 100%; padding: 10px; }
  .exam-paper { font-family: 'B Nazanin', 'BNazanin', 'Nazanin', 'Vazirmatn', Tahoma, sans-serif; direction: rtl; color: #000; font-size: 16px; background: white; padding: 0; line-height: 1.7; width: 100%; max-width: 800px; margin: 0 auto; }
  
  /* سربرگ */
  .exam-header-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; text-align: center; }
  .exam-header-table td { border: 1.5px solid #000; padding: 4px 6px; font-size: 14px; }
  .exam-header-title { font-size: 17px; font-weight: bold; padding: 5px !important; }
  .exam-motto { text-align: center; font-weight: bold; font-size: 14px; margin: 8px 0; }
  
  /* جدول اصلی: ستون راست = سوالات، ستون چپ = بارم */
  .exam-table-main { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 0; }
  .exam-table-main td { border: 1px solid #000; vertical-align: top; }
  .exam-table-main tr { page-break-inside: avoid; break-inside: avoid; }
  
  .content-col { padding: 6px 14px 8px; }
  .score-col { width: 62px; text-align: center; vertical-align: middle !important; font-weight: bold; font-size: 17px; }
  .section-title { font-weight: bold; font-size: 16px; margin-bottom: 8px; text-align: right; }
  
  /* سوالات */
  .q-item { margin: 0 0 12px; }
  .q-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .q-line .q-t { flex: 1; text-align: right; }
  .tf-paren { white-space: nowrap; font-family: Tahoma, sans-serif; padding-left: 10px; }
  
  /* گزینه‌های تستی: چهار گزینه در یک ردیف */
  .mc-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 10px; margin-top: 6px; font-size: 15px; }
  .mc-option { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .mc-box { display: inline-block; width: 13px; height: 13px; border: 1.2px solid #000; border-radius: 2px; flex: none; }
  
  .section-gap { height: 22px; }

  /* پاسخنامه */
  .answer-key-title { text-align: center; font-weight: bold; font-size: 18px; margin: 15px 0 10px; }
  .answer-table { width: 100%; border-collapse: collapse; font-size: 15px; border: 1.5px solid #000; }
  .answer-table th, .answer-table td { border: 1px solid #000; padding: 6px; text-align: center; }
  .answer-table th { background: #f0f0f0; }
  
  .pdf-page-1, .pdf-page-2 { page-break-after: always; break-after: page; }

  @media print {
    body > *:not(#pdf-wrapper) { display: none !important; }
    html, body { margin: 0; padding: 0; height: auto; background: #fff; }
    #pdf-wrapper { display: block !important; padding: 0 !important; max-width: none !important; }
    #pdf-container { display: block !important; padding: 0; height: auto; min-height: 0; }
    @page { margin: 8mm; size: A4; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>

<div class="name-overlay" id="name-overlay" style="display:none;">
  <div class="name-box">
    <h2>لطفاً نام و نام خانوادگی خود را وارد کنید</h2>
    <input type="text" id="student-name-input" placeholder="مثلاً: علی رضایی">
    <button onclick="startExam()">ورود به آزمون</button>
  </div>
</div>

<div class="container" id="loading" style="text-align:center; padding:50px;">در حال دریافت آزمون...</div>
<div class="container" id="error-msg" style="background:#fee2e2; color:#dc2626; padding:20px; border-radius:12px; text-align:center; display:none; font-weight:bold;"></div>

<div id="exam-wrapper" class="container" style="display:none;">
  <div class="timer-box" id="timer-box">زمان: <span id="timer-text">--:--</span></div>
  <div class="exam-header" id="exam-header-online"></div>
  <form id="exam-form">
    <div id="questions-container"></div>
    <button type="submit" class="btn-submit" id="btn-submit">ارسال پاسخ‌ها</button>
  </form>
</div>

<div id="pdf-wrapper" class="container" style="display:none;">
  <div class="no-print" style="margin-bottom: 20px; text-align: center;">
    <button type="button" class="btn-print" style="display: inline-block; width: auto; padding: 12px 30px;" onclick="window.print()">🖨️ چاپ / ذخیره PDF</button>
  </div>
  <div id="pdf-container"></div>
</div>

<div class="result-box container" id="result-box">
  <h2>نتیجه آزمون</h2>
  <div class="score-circle" id="score-display">0</div>
  <p>از ۲۰ نمره</p>
  <p id="result-detail" style="color:#64748b; margin-top:10px;">تعداد پاسخ صحیح: ۰</p>
</div>

<script>
  const API_BASE = 'https://api.motadars.ir';
  const urlParams = new URLSearchParams(window.location.search);
  const examCode = urlParams.get('code');
  let examData = null, questionsData = null, examDuration = 0, timerInterval, isSubmitted = false, studentName = '';

  document.addEventListener('DOMContentLoaded', () => {
    if (!examCode) return showError('لینک نامعتبر است.');
    fetchExam();
  });

  async function fetchExam() {
    try {
      const res = await fetch(`${API_BASE}/get_exam.php?code=${examCode}`);
      const data = await res.json();
      if (!res.ok || !data.ok) return showError(data.message || 'خطا در دریافت.');
      
      document.getElementById('loading').style.display = 'none';
      examData = data.exam; questionsData = data.questions;
      
      if (examData.exam_type === 'online') {
        document.getElementById('name-overlay').style.display = 'flex';
      } else {
        renderPDFLayout();
      }
    } catch (err) { showError('خطای شبکه: ' + err.message); }
  }

  // ===== کمکی =====
  const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

  // یک بخش با بارم ادغام‌شده (الف، ب، پ، ت)
  function sectionRow(title, score, itemsHTML) {
    return `<tr>
      <td class="content-col"><div class="section-title">${title}</div>${itemsHTML}</td>
      <td class="score-col">${toFa(score)}</td>
    </tr>`;
  }

  // ===== رندر PDF (مطابق نمونه) =====
  function renderPDFLayout() {
    document.getElementById('pdf-wrapper').style.display = 'block';
    try {
      const school = examData.header_school || '.....................';
      const duration = examData.duration || '50';
      const examDate = examData.exam_date || '..........................';
      const admin = examData.header_admin || 'اداره آموزش و پرورش';
      const teacherName = examData.header_teacher_name || '.....................';

      const tfQ = questionsData.filter(q => q.type === 'truefalse');
      const jakhaliQ = questionsData.filter(q => q.type === 'jakhali');
      const testiQ = questionsData.filter(q => q.type === 'testi');
      const allEssayQ = questionsData.filter(q => q.type === 'essay');

      const shortAnswerQ = allEssayQ.slice(0, 6);
      const longAnswerQ = allEssayQ.slice(6, 14);

      // بارم هر سوال تشریحی (اگر در داده نبود، پیش‌فرض طبق نمونه)
      const defaultLongScores = [1, 1, 2, 2, 1, 1, 1, 1];

      let qCounter = 1; 
      let answerKeyHTML = '';
      
      const headerHTML = `
            <table class="exam-header-table">
                <tr><td colspan="3" class="exam-header-title">به نام خدای رنگین کمان</td></tr>
                <tr>
                    <td style="width: 33%;">نام درس: مطالعات اجتماعی</td>
                    <td style="width: 34%;">${admin}</td>
                    <td style="width: 33%;">مدرسه ${school}</td>
                </tr>
                <tr>
                    <td>پایه: ${examData.grade || 'هفتم'}</td>
                    <td>مدت امتحان: ${duration} دقیقه</td>
                    <td>تاریخ امتحان: ${examDate}</td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: right;">نام و نام خانوادگی دانش‌آموز: ......................................................</td>
                    <td><b>طراح سوال: ${teacherName}</b></td>
                </tr>
            </table>
            <div class="exam-motto">«در سکوت سخت تلاش کن، بگذار موفقیتت صدای تو باشد»</div>
      `;

      // ===== صفحه اول =====
      let page1HTML = `<div class="pdf-page-1">${headerHTML}<table class="exam-table-main">`;

      // الف) صحیح / غلط
      if (tfQ.length) {
        let items = '';
        tfQ.forEach(q => {
          const a = Array.isArray(q.answer) ? q.answer[0] : q.answer;
          answerKeyHTML += `<tr><td>${qCounter}</td><td>${a === 0 ? 'صحیح' : 'غلط'}</td></tr>`;
          items += `<div class="q-item"><div class="q-line">
            <span class="q-t"><b>${toFa(qCounter++)}-</b> ${q.question_text}</span>
            <span class="tf-paren">( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</span>
          </div></div>`;
        });
        page1HTML += sectionRow('الف) عبارات صحیح و غلط را مشخص کنید.', 2, items);
      }

      // ب) تستی
      if (testiQ.length) {
        let items = '';
        testiQ.forEach(q => {
          const ci = Array.isArray(q.answer) ? q.answer[0] : q.answer;
          answerKeyHTML += `<tr><td>${qCounter}</td><td>${q.options[ci] || 'نامشخص'}</td></tr>`;
          const opts = q.options.map((opt, j) => `<div class="mc-option"><span class="mc-box"></span> ${['الف', 'ب', 'ج', 'د'][j]}) ${opt}</div>`).join('');
          items += `<div class="q-item">
            <div class="q-line"><span class="q-t"><b>${toFa(qCounter++)}-</b> ${q.question_text}</span></div>
            <div class="mc-options">${opts}</div>
          </div>`;
        });
        page1HTML += sectionRow('ب) گزینه صحیح را انتخاب کنید.', 2, items);
      }

      // پ) جاخالی
      if (jakhaliQ.length) {
        let items = '';
        jakhaliQ.forEach(q => {
          const a = Array.isArray(q.answer) ? q.answer.join(' / ') : q.answer;
          answerKeyHTML += `<tr><td>${qCounter}</td><td>${a}</td></tr>`;
          items += `<div class="q-item"><div class="q-line">
            <span class="q-t"><b>${toFa(qCounter++)}-</b> ${q.question_text}</span>
          </div></div>`;
        });
        page1HTML += sectionRow('پ) عبارات زیر را با کلمات مناسب پر کنید.', 2, items);
      }

      page1HTML += `</table></div>`; 

      // ===== صفحه دوم =====
      let page2HTML = `<div class="pdf-page-2"><table class="exam-table-main">`;

      // ت) پاسخ کوتاه (بارم ۳ ادغام‌شده)
      if (shortAnswerQ.length) {
        let items = '';
        shortAnswerQ.forEach(q => {
          // ⭐ باگ فیکس شد: اول question_key، بعد answer
          const key = q.question_key || (Array.isArray(q.answer) ? q.answer[0] : q.answer) || 'پاسخ بررسی شود.';
          answerKeyHTML += `<tr><td>${qCounter}</td><td>${key}</td></tr>`;
          items += `<div class="q-item"><div class="q-line">
            <span class="q-t"><b>${toFa(qCounter++)}-</b> ${q.question_text}</span>
          </div></div>`;
        });
        items += `<div class="section-gap"></div>`;
        page2HTML += sectionRow('ت) به سوالات زیر پاسخ کوتاه دهید.', 3, items);
      }

      // ث) تشریحی (هر سوال یک ردیف و بارم جدا)
      if (longAnswerQ.length) {
        page2HTML += `<tr>
          <td class="content-col" style="padding-bottom:2px;"><div class="section-title" style="margin-bottom:2px;">ث) به سوالات تشریحی زیر پاسخ کامل دهید.</div></td>
          <td class="score-col"></td>
        </tr>`;
        longAnswerQ.forEach((q, i) => {
          // ⭐ باگ فیکس شد: اول question_key، بعد answer
          const key = q.question_key || (Array.isArray(q.answer) ? q.answer[0] : q.answer) || 'پاسخ بررسی شود.';
          answerKeyHTML += `<tr><td>${qCounter}</td><td>${key}</td></tr>`;
          const sc = q.score || defaultLongScores[i] || 1;
          page2HTML += `<tr>
            <td class="content-col" style="min-height:${sc * 34 + 14}px; height:${sc * 34 + 14}px;">
              <div class="q-line"><span class="q-t"><b>${toFa(qCounter++)}-</b> ${q.question_text}</span></div>
            </td>
            <td class="score-col">${toFa(sc)}</td>
          </tr>`;
        });
      }

      page2HTML += `</table></div>`; 

      // ===== صفحه سوم: پاسخنامه =====
      const page3HTML = `
        <div class="pdf-page-3">
        <h2 class="answer-key-title">پاسخنامه و کلید سوالات</h2>
        <table class="answer-table">
            <thead><tr><th style="width: 20%;">شماره سوال</th><th>پاسخ صحیح / کلید</th></tr></thead>
            <tbody>${answerKeyHTML}</tbody>
        </table>
        <div style="margin-top: 30px; text-align: center; color: #555; font-weight: bold;">طراح سوال: ${teacherName}</div>
        </div>`;

      let pdfHTML = `<div class="exam-paper">`;
      if (tfQ.length + testiQ.length + jakhaliQ.length > 0) pdfHTML += page1HTML;
      if (shortAnswerQ.length + longAnswerQ.length > 0) pdfHTML += page2HTML;
      pdfHTML += page3HTML + `</div>`; 
      
      document.getElementById('pdf-container').innerHTML = pdfHTML;
    } catch (e) {
      showError('خطا در رسم برگه PDF: ' + e.message);
      document.getElementById('pdf-wrapper').style.display = 'none';
    }
  }

  // ===== رندر آنلاین =====
  function startExam() {
    const name = document.getElementById('student-name-input').value.trim();
    if (name.length < 3) return alert('نام کامل را وارد کنید.');
    studentName = name;
    document.getElementById('name-overlay').style.display = 'none';
    renderOnlineLayout();
    examDuration = examData.duration * 60;
    startTimer();
    document.getElementById('btn-submit').style.display = 'block';
  }

  function renderOnlineLayout() {
    document.getElementById('exam-wrapper').style.display = 'block';
    document.getElementById('exam-header-online').innerHTML = `
      <div class="header-row"><span>${examData.header_admin}</span><span>تاریخ: ${examData.exam_date || '---'}</span></div>
      <div class="header-title">آزمون ${examData.header_subject}</div>
      <div class="header-row" style="justify-content:space-between; margin-top:10px;"><span>مدرسه: ${examData.header_school}</span><span>معلم: ${examData.header_teacher_name}</span></div>
      <div class="header-row" style="justify-content:center; margin-top:5px;"><span>مدت زمان: ${examData.duration} دقیقه</span></div>
      <div class="student-name-line">نام دانش‌آموز: ${studentName}</div>
    `;
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    questionsData.forEach((q, index) => {
      const card = document.createElement('div'); card.className = 'question-card';
      let inputHtml = '';
      if (q.type === 'testi' || q.type === 'truefalse') {
        inputHtml = `<div class="options-list">`;
        q.options.forEach((opt, i) => { inputHtml += `<label class="option-item"><input type="radio" name="q_${q.id}" value="${i}"><span>${opt}</span></label>`; });
        inputHtml += `</div>`;
      } else if (q.type === 'jakhali') { inputHtml = `<input type="text" name="q_${q.id}" placeholder="پاسخ خود را وارد کنید...">`; }
      else if (q.type === 'essay') { inputHtml = `<textarea name="q_${q.id}" rows="4" placeholder="پاسخ تشریحی..."></textarea>`; }
      card.innerHTML = `<div class="q-text"><span class="q-num">سوال ${index + 1}:</span> ${q.question_text}</div>${inputHtml}`;
      container.appendChild(card);
    });
  }

  function startTimer() {
    const timerText = document.getElementById('timer-text'), timerBox = document.getElementById('timer-box');
    timerInterval = setInterval(() => {
      const minutes = Math.floor(examDuration / 60), seconds = examDuration % 60;
      timerText.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      if (examDuration <= 300) timerBox.classList.add('warning');
      if (examDuration <= 0) { clearInterval(timerInterval); if (!isSubmitted) { alert('زمان تمام شد!'); submitExam(); } }
      examDuration--;
    }, 1000);
  }

  document.getElementById('exam-form')?.addEventListener('submit', (e) => {
    e.preventDefault(); if (confirm('ارسال پاسخ‌ها؟')) submitExam();
  });

  async function submitExam() {
    if (isSubmitted) return;
    isSubmitted = true;
    clearInterval(timerInterval);
    const btn = document.getElementById('btn-submit'); btn.disabled = true; btn.textContent = 'در حال تصحیح...';
    const answers = {}, formData = new FormData(document.getElementById('exam-form'));
    for (let [key, value] of formData.entries()) { if (key.startsWith('q_')) answers[key.replace('q_', '')] = value; }

    try {
      const res = await fetch(`${API_BASE}/submit_exam.php`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: examCode, student_name: studentName, answers: answers })
      });
      
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch (e) { throw new Error("پاسخ نامعتبر: " + text); }
      
      if (res.ok && data.ok) {
        document.getElementById('exam-wrapper').style.display = 'none';
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('score-display').textContent = data.score;
        document.getElementById('result-detail').textContent = `پاسخ صحیح: ${data.correct_count} از ${data.total_questions}`;
      } else { 
        alert('خطای سرور: ' + (data.message || 'ناشناخته')); 
        btn.disabled = false; btn.textContent = 'ارسال پاسخ‌ها'; 
      }
    } catch (err) { 
      alert('خطای شبکه یا فرمت نامعتبر: ' + err.message); 
      btn.disabled = false; btn.textContent = 'ارسال پاسخ‌ها'; 
    }
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error-msg').style.display = 'block';
  }
</script>
</body>
</html>
