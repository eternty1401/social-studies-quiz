<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی حدس بزن کی هستم؟</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh; color: #fff; padding: 30px 20px;
    display: flex; flex-direction: column; align-items: center;
  }

  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 10px; }
  .header p { color: rgba(255,255,255,0.8); font-size: 0.95rem; line-height: 1.6; }

  /* صفحه شروع بازی */
  #start-section { text-align: center; background: rgba(255,255,255,0.1); padding: 40px 30px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); width: 100%; max-width: 500px; }
  .start-btn {
    background: #2ecc71; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3); margin-top: 20px;
  }
  .start-btn:hover { background: #27ae60; transform: translateY(-2px); }

  /* صفحه بازی */
  #game-section { display: none; width: 100%; max-width: 600px; }
  .game-card { background: #fff; color: #333; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 20px; text-align: center; }
  .game-card h2 { font-size: 1.2rem; margin-bottom: 10px; color: #2a5298; }
  
  /* بخش سوالات */
  .question-area { display: flex; gap: 10px; margin-bottom: 20px; }
  .question-area input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 10px; outline: none; font-family: inherit; font-size: 1rem; }
  .question-area button { background: #2a5298; color: white; border: none; padding: 0 20px; border-radius: 10px; font-family: inherit; font-weight: bold; cursor: pointer; }
  
  .help-text { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 15px; line-height: 1.6; }

  /* تاریخچه سوالات */
  .chat-history { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; text-align: right; }
  .chat-item { padding: 12px; border-radius: 10px; font-size: 0.95rem; line-height: 1.5; }
  .chat-item.q { background: #e0f7fa; color: #006064; align-self: flex-start; }
  .chat-item.a { background: #f8f9fa; color: #333; align-self: flex-end; border: 1px solid #eee; }

  /* دکمه حدس نهایی */
  .guess-btn {
    width: 100%; background: #f39c12; color: white; border: none; padding: 15px;
    border-radius: 10px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; margin-top: 15px; display: none;
  }
  .guess-btn:hover { background: #d68910; }
</style>
</head>
<body>

  <div class="header">
    <h1>🕵️‍♂️ بازی حدس بزن!</h1>
  </div>

  <!-- صفحه شروع -->
  <div id="start-section">
    <p>من یک شخصیت تاریخی در ذهنم انتخاب کرده‌ام. تو باید با پرسیدن سوال‌هایی که جوابشون فقط <b>«بله»</b> یا <b>«خیر»</b> است، بفهمی کی هستم!</p>
    <p style="font-size: 0.85rem; color: #ffd700; margin-top: 15px;">(مثلاً بپرس: آیا تو پادشاه بودی؟)</p>
    <button class="start-btn" onclick="startGame()">شروع بازی</button>
  </div>

  <!-- صفحه بازی -->
  <div id="game-section">
    <div class="game-card">
      <h2>شخصیت تاریخی من کیست؟ 🤔</h2>
      <p class="help-text">سوالات خود را بپرسید. من فقط با بله یا خیر جواب می‌دهم.</p>
      
      <div class="chat-history" id="chat-history">
        <!-- تاریخچه اینجا نمایش داده می‌شود -->
      </div>

      <div class="question-area" id="input-area">
        <input type="text" id="user-question" placeholder="مثلاً: آیا در ایران باستان زندگی می‌کردی؟" onkeypress="handleEnter(event)">
        <button onclick="askAI()">بپرس</button>
      </div>

      <button class="guess-btn" id="guess-btn" onclick="finalGuess()">🎯 حدس نهایی!</button>
    </div>
  </div>

  <script>
    const GROQ_API_KEY = "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";
    let secretCharacter = "";
    let chatHistory = [];
    
    // لیست شخصیت‌ها برای انتخاب مخفیانه
    // لیست شخصیت‌ها برای انتخاب مخفیانه
const characters = [
  "کوروش کبیر", "داریوش بزرگ", "شاپور اول", "بهرام گور", "آریوبرزن", 
  "یعقوب لیث صفاری", "شاه اسماعیل صفوی", "نادرشاه افشار", "کریم خان زند", 
  "آقا محمد خان قاجار", "امیرکبیر", "ستارخان", "رضاشاه پهلوی", "محمدرضاشاه پهلوی",
  "ابن سینا", "عمر خیام", "فردوسی", "حافظ", "مولانا", "سعدی", "نظامی گنجوی", "پروین اعتصامی",
  "آتوسا", "آرتمیس", "پوراندخت", "ماندانا", "همای چهرآزاد", "ملکه سورا", "رودابه", "بانو گُشسپ"
];
    function startGame() {
      // انتخاب یک شخصیت تصادفی
      secretCharacter = characters[Math.floor(Math.random() * characters.length)];
      
      document.getElementById('start-section').style.display = 'none';
      document.getElementById('game-section').style.display = 'block';
      
      chatHistory = [];
      document.getElementById('chat-history').innerHTML = '';
      
      addMessage("من یک شخصیت تاریخی انتخاب کردم. شروع کن به پرسیدن سوال!", "a");
    }

    function handleEnter(e) {
      if (e.key === 'Enter') askAI();
    }

    function addMessage(text, type) {
      const historyDiv = document.getElementById('chat-history');
      const msg = document.createElement('div');
      msg.className = `chat-item ${type}`;
      msg.innerText = text;
      historyDiv.appendChild(msg);
      historyDiv.scrollTop = historyDiv.scrollHeight;
    }

    async function askAI() {
      const input = document.getElementById('user-question');
      const question = input.value.trim();
      if (!question) return;

      // نمایش سوال کاربر
      addMessage("👤 " + question, "q");
      input.value = '';
      
      // ذخیره در تاریخچه
      chatHistory.push({ role: "user", content: question });

      // نمایش وضعیت لودینگ
      const loadingId = 'loading-' + Date.now();
      const historyDiv = document.getElementById('chat-history');
      const loader = document.createElement('div');
      loader.className = 'chat-item a';
      loader.id = loadingId;
      loader.innerText = 'در حال فکر کردن... ⏳';
      historyDiv.appendChild(loader);
      historyDiv.scrollTop = historyDiv.scrollHeight;

      try {
        // پرامپت برای هوش مصنوعی
        const prompt = `شما در حال بازی "حدس بزن کی هستم" هستید. شخصیت مخفی شما "${secretCharacter}" است. 
        کاربر سوال می‌پرسد. شما باید فقط و فقط با کلمات "بله" یا "خیر" (یا جمله‌ای بسیار کوتاه که مفهوم بله/خیر بدهد) جواب دهید. 
        به هیچ وجه اسم خودتان را نگویید و توضیح اضافه ندهید.
        سوال کاربر: ${question}`;

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${GROQ_API_KEY}` },
          body: new Blob([JSON.stringify({
            model: "openai/gpt-oss-120b",
            messages: [{ role: "user", content: prompt }]
          })], { type: 'application/json' })
        });

        const data = await response.json();
        document.getElementById(loadingId).remove();
        
        if (data.error) throw new Error(data.error.message);
        
        const answer = data.choices[0].message.content.trim();
        addMessage("🤖 " + answer, "a");
        
        // نمایش دکمه حدس نهایی بعد از ۳ سوال
        if (chatHistory.length >= 6) {
            document.getElementById('guess-btn').style.display = 'block';
        }

      } catch (error) {
        document.getElementById(loadingId).remove();
        addMessage("❌ خطا در ارتباط. لطفاً فیلترشکن خود را روشن کنید.", "a");
      }
    }

    async function finalGuess() {
      const userGuess = prompt("به نظرت من کی هستم؟ اسم شخصیت را بنویس:");
      if (!userGuess) return;

      const inputArea = document.getElementById('input-area');
      inputArea.style.display = 'none'; // مخفی کردن کادر سوال

      if (userGuess.trim() === secretCharacter) {
        addMessage(`🎉 آفرین! درست حدس زدی. من واقعاً "${secretCharacter}" بودم!`, "a");
      } else {
        addMessage(`❌ متأسفم! حدس تو "${userGuess}" بود، اما من "${secretCharacter}" بودم.`, "a");
      }
    }
  </script>
</body>
</html>
