  { l: 23, q: "حدیث پیامبر (ص) دربارهٔ انجام کار چه می‌فرماید؟", a: "«خداوند دوست دارد اگر کسی از شما کاری انجام می‌دهد، آن را محکم و بی‌عیب انجام دهد.»" },
  { l: 24, q: "چرخهٔ اقتصادی شامل چه مراحلی است؟", a: "تولید، توزیع و مصرف." },
  { l: 24, q: "نهاده و ستانده را تعریف کنید.", a: "نهاده (ورودی): عواملی که در تولید به کار می‌روند. ستانده (خروجی): کال یا خدمتی که تولید می‌شود." },
  { l: 24, q: "بهره‌وری سبز به چه معناست؟", a: "افزایش بهره‌وری با کمترین آسیب به محیط زیست." },
  { l: 24, q: "اقتصاد مقاومتی به چه معناست؟", a: "در شرایط سخت روی پای خود بایستیم، از تولید ملی حمایت کنیم، از اسراف بپرهیزیم و از منابع حداکثر استفاده را بکنیم. محور اصلی آن بهره‌وری است." },
  { l: 24, q: "استاندارد چه نقشی در بهره‌وری دارد؟", a: "موجب افزایش کیفیت و استفادهٔ درست از منابع می‌شود. سازمان ملی استاندارد ایران متولی آن است." }
];

const allCards = cards.concat(cards2, cards3);

const faDigits = "۰۱۲۳۴۵۶۷۸۹";
const toFa = n => String(n).replace(/\d/g, d => faDigits[d]);

let current = 0;
const total = allCards.length;
const flashCard = document.getElementById("flashCard");
const frontText = document.getElementById("frontText");
const backText = document.getElementById("backText");
const frontLesson = document.getElementById("frontLesson");
const backLesson = document.getElementById("backLesson");
const counter = document.getElementById("counter");
const progressFill = document.getElementById("progressFill");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

function render() {
  flashCard.classList.remove("flipped");
  setTimeout(() => {
    const c = allCards[current];
    frontText.textContent = c.q;
    backText.textContent = c.a;
    frontLesson.textContent = `درس ${toFa(c.l)}`;
    backLesson.textContent = `درس ${toFa(c.l)}`;
    counter.textContent = `کارت ${toFa(current + 1)} از ${toFa(total)}`;
    progressFill.style.width = `${((current + 1) / total) * 100}%`;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === total - 1;
  }, 150);
}

flashCard.addEventListener("click", () => flashCard.classList.toggle("flipped"));
prevBtn.addEventListener("click", () => { if (current > 0) { current--; render(); } });
nextBtn.addEventListener("click", () => { if (current < total - 1) { current++; render(); } });
render();
</script>

</body>
</html>
