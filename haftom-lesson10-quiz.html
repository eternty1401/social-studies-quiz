<!DOCTYPE html>
<html lang="fa" dir="rtl">
 <script src="telegram.js"></script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون تستی درس ۱۰: ایران، خانه ما</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="sounds.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
  }
  
  /* صفحه شروع */
  #start-section { text-align: center; padding: 20px 0; }
  #start-section h1 { color: #558b2f; font-size: 1.6rem; margin-bottom: 15px; }
  #start-section p { color: #7f8c8d; margin-bottom: 30px; line-height: 1.8; }
  .name-input {
    width: 100%; max-width: 400px; padding: 15px; margin-bottom: 20px;
    border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit;
    font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #558b2f; box-shadow: 0 0 10px rgba(85,139,47,0.2); }
  .start-btn {
    background: #2ecc71; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
  }
  .start-btn:hover { background: #27ae60; transform: translateY(-2px); }

  /* هدر و تایمر */
  .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eef2f5; padding-bottom: 15px; margin-bottom: 25px; }
  .header-title h1 { color: #558b2f; font-size: 1.4rem; }
  .header-title p { color: #7f8c8d; font-size: 0.85rem; margin-top: 5px; }
  .timer-box {
    background: #fdedec; color: #e74c3c; padding: 8px 18px; border-radius: 50px;
    font-weight: 900; font-size: 1.1rem; border: 1px solid #fadbd8;
    display: flex; align-items: center; gap: 8px; direction: ltr;
  }
  .timer-box.warning { background: #fef9e7; color: #f39c12; border-color: #fae5d3; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* سوالات */
  .question-box {
    background: #fafbfc; border: 1px solid #eef2f5; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .q-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.6; }
  
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    cursor: pointer; transition: 0.2s; font-size: 0.95rem;
  }
  .option-label:hover { background: #f1f8e9; border-color: #558b2f; }
  .option-label input[type="radio"] { display: none; }
  .option-label.selected { background: #f1f8e9; border-color: #558b2f; font-weight: 700; color: #33691e; }
  
  .submit-btn {
    display: block; width: 100%; padding: 15px; margin-top: 30px;
    background: #558b2f; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer;
    transition: 0.3s;
  }
  .submit-btn:hover { background: #33691e; }

  /* کارنامه */
  .result-container { display: none; text-align: center; }
  .student-name-display {
    font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 20px;
    background: #ecf0f1; padding: 10px 20px; border-radius: 10px; display: inline-block;
  }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 8px solid #ecf0f1;
  }
  .score-circle.excellent { border-color: #2ecc71; color: #2ecc71; }
  .score-circle.good { border-color: #f39c12; color: #f39c12; }
  .score-circle.fail { border-color: #e74c3c; color: #e74c3c; }
  .score-num { font-size: 2.8rem; font-weight: 900; line-height: 1; }
  .score-text { font-size: 0.9rem; color: #7f8c8d; margin-top: 5px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .stat-box { padding: 15px 25px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
  .stat-box.correct { color: #2ecc71; background: #e8f8f5; }
  .stat-box.wrong { color: #e74c3c; background: #fdedec; }
  
  .review-btn {
    display: inline-block; background: #3498db; color: #fff; text-decoration: none;
    padding: 12px 30px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer;
    font-size: 1rem;
  }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .header-top { flex-direction: column; gap: 10px; text-align: center; }
    .result-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- صفحه شروع -->
  <div id="start-section">
    <h1>📝 آزمون تستی درس ۱۰</h1>
    <p>ایران، خانه ما — مطالعات اجتماعی پایه هفتم<br>لطفاً نام و نام خانوادگی خود را وارد کنید تا آزمون آغاز شود.</p>
    <input type="text" id="student-name" class="name-input" placeholder="مثلاً: علی محمدی">
    <br>
    <button class="start-btn" onclick="startQuiz()">شروع آزمون</button>
  </div>

  <!-- بخش آزمون -->
  <div id="quiz-section" style="display: none;">
    <div class="header-top">
      <div class="header-title">
        <h1>📝 آزمون تستی درس ۱۰</h1>
        <p>۱۵ سوال تصادفی از بانک ۴۰ سوالی</p>
      </div>
      <div class="timer-box" id="timer-display">⏱ ۱۰:۰۰</div>
    </div>
    
    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="submit" class="submit-btn" id="submit-btn">ثبت پاسخ‌ها و مشاهده کارنامه</button>
    </form>
  </div>

  <!-- بخش کارنامه -->
  <div id="result-section" class="result-container">
    <h2 style="color:#2c3e50; margin-bottom:20px; font-weight:900;">🎓 کارنامه شما</h2>
    <div class="student-name-display" id="display-student-name">نام دانش‌آموز</div>
    
    <div id="score-circle" class="score-circle">
      <div class="score-num" id="score-display">0</div>
      <div class="score-text">از ۱۰۰</div>
    </div>
    <p id="result-message" style="font-size:1.1rem; font-weight:700; margin-bottom:25px;"></p>
    <div class="result-stats">
      <div class="stat-box correct" id="stat-correct">تعداد درست: ۰</div>
      <div class="stat-box wrong" id="stat-wrong">تعداد غلط: ۰</div>
    </div>
    <a href="haftom.html" class="review-btn" style="background:#3498db; text-decoration:none;">🔙 بازگشت به دروس</a>
  </div>

</div>
<script>
  // ==========================================
  // بانک ۴۰ سوالی درس ۱۰ (ایران، خانه ما)
  // ==========================================
  const questionBank = [
    { q: "وسعت کشور ایران چقدر است؟", options: ["۱,۶۴۸,۱۹۵ کیلومتر مربع", "۱,۰۰۰,۰۰۰ کیلومتر مربع", "۲,۰۰۰,۰۰۰ کیلومتر مربع", "۵۰۰,۰۰۰ کیلومتر مربع"], answer: 0 },
    { q: "جمعیت ایران در سال ۱۳۹۵ حدوداً چقدر بوده است؟", options: ["۸۰ میلیون نفر", "۵۰ میلیون نفر", "۱۰۰ میلیون نفر", "۱۲۰ میلیون نفر"], answer: 0 },
    { q: "ایران در کدام قاره قرار دارد؟", options: ["آسیا", "اروپا", "آفریقا", "آمریکا"], answer: 0 },
    { q: "ایران در کدام بخش قاره آسیا واقع شده است؟", options: ["جنوب غربی", "شمال شرقی", "مرکز", "جنوب شرقی"], answer: 0 },
    { q: "برای اداره بهتر کشور، ایران به چه بخش‌هایی تقسیم شده است؟", options: ["استان", "شهرستان", "بخش", "روستا"], answer: 0 },
    { q: "هر استان به چند بخش تقسیم می‌شود؟", options: ["شهرستان", "روستا", "استان دیگر", "بخش"], answer: 0 },
    { q: "استان توسط چه نهادی اداره می‌شود؟", options: ["استانداری", "شهرداری", "دهیاری", "شورای شهر"], answer: 0 },
    { q: "شهرها توسط چه نهادهایی اداره می‌شوند؟", options: ["شورای اسلامی شهر و شهردار", "استانداری و فرمانداری", "دهیاری و شورای روستا", "دولت"], answer: 0 },
    { q: "اعضای شورای اسلامی شهر توسط چه کسانی انتخاب می‌شوند؟", options: ["مردم شهر", "شهردار", "استاندار", "دولت"], answer: 0 },
    { q: "کدام یک از وظایف شهرداری است؟", options: ["ایجاد و نگهداری فضای سبز", "تعیین استاندار", "اداره استان", "مدیریت مدارس"], answer: 0 },
    { q: "شهرداری برای انجام خدمات خود از چه منابعی درآمد کسب می‌کند؟", options: ["عوارض نوسازی و بودجه عمومی کشور", "فقط مالیات", "کمک‌های خارجی", "فقط درآمد نفتی"], answer: 0 },
    { q: "عوارض نوسازی توسط چه کسانی پرداخت می‌شود؟", options: ["شهرنشینان", "روستاییان", "فقط ثروتمندان", "فقط کارمندان"], answer: 0 },
    { q: "روستاها توسط چه نهادهایی اداره می‌شوند؟", options: ["شورای اسلامی روستا و دهیار", "شهرداری", "استانداری", "فرمانداری"], answer: 0 },
    { q: "اعضای شورای اسلامی روستا چگونه انتخاب می‌شوند؟", options: ["با رأی مردم روستا", "توسط شهردار", "توسط دولت", "توسط استاندار"], answer: 0 },
    { q: "کدام یک از وظایف شورای اسلامی روستا است؟", options: ["شناسایی نیازهای روستا و تلاش برای رفع آنها", "تعیین استاندار", "مدیریت شهرها", "اداره کشور"], answer: 0 },
    { q: "رشته کوه البرز در کدام قسمت ایران قرار دارد؟", options: ["شمال", "جنوب", "شرق", "غرب"], answer: 0 },
    { q: "رشته کوه زاگرس در کدام قسمت ایران قرار دارد؟", options: ["غرب", "شرق", "شمال", "جنوب"], answer: 0 },
    { q: "جهت رشته کوه زاگرس چگونه است؟", options: ["شمال غربی - جنوب شرقی", "شمال شرقی - جنوب غربی", "شرق - غرب", "شمال - جنوب"], answer: 0 },
    { q: "رشته کوه البرز مانند دیواری کدام دریا را از قسمت‌های داخلی کشور جدا می‌کند؟", options: ["دریای خزر", "دریای عمان", "خلیج فارس", "دریای سیاه"], answer: 0 },
    { q: "نواحی پست و هموار ایران شامل چه بخش‌هایی است؟", options: ["دشت‌ها و جلگه‌ها", "کوه‌ها و دره‌ها", "فلات‌ها", "تپه‌ها"], answer: 0 },
    { q: "دشت‌ها به دلیل داشتن چه ویژگی‌هایی حاصلخیزند؟", options: ["خاک مساعد و آب و هوای مناسب", "ارتفاع زیاد", "شیب تند", "بارش کم"], answer: 0 },
    { q: "جلگه‌ها برای چه کاری مناسب‌اند؟", options: ["کشاورزی", "معدن‌کاری", "صنعت", "دامداری"], answer: 0 },
    { q: "کوهپایه چیست؟", options: ["فاصله بین شیب تند کوه و دشت", "قله کوه", "وسط کوه", "پایین دره"], answer: 0 },
    { q: "در کوهپایه‌ها چه چیزی روییده است؟", options: ["علفزارهایی که برای چرا استفاده می‌شوند", "جنگل‌های انبوه", "درختان میوه", "گیاهان بیابانی"], answer: 0 },
    { q: "علت اصلی طمع برخی کشورها به ایران چیست؟", options: ["منابع طبیعی و استعدادهای فراوان و مقاومت مردم", "وسعت کم", "جمعیت کم", "آب و هوای سرد"], answer: 0 },
    { q: "کشور ایران از نظر فرهنگی و تمدنی چه ویژگی‌ای دارد؟", options: ["فرهنگ و تمدن چند هزار ساله", "فرهنگ تازه شکل گرفته", "تمدن کوتاه مدت", "بدون تمدن"], answer: 0 },
    { q: "پس از انقلاب اسلامی چه اتفاقی برای خاک ایران افتاده است؟", options: ["حتی یک مترمربع از آن به دست بیگانگان نیفتاده است", "بخشی از آن جدا شده است", "به چند کشور تقسیم شده است", "به اشغال بیگانگان درآمده است"], answer: 0 },
    { q: "کدام یک از موارد زیر از خدمات شهرداری نیست؟", options: ["تعیین استاندار", "احداث فضای سبز", "نظافت شهر", "صدور پروانه ساختمان"], answer: 0 },
    { q: "یکی از وظایف شهرداری در زمینه حمل و نقل چیست؟", options: ["توسعه و نظارت بر حمل و نقل عمومی", "ساخت خودرو", "فروش بنزین", "تعمیر هواپیما"], answer: 0 },
    { q: "یکی از وظایف شهرداری در زمینه دین و اخلاق چیست؟", options: ["ترویج دین‌داری و فضیلت‌های اخلاقی در فضای شهر", "ساخت مسجد", "تعیین امام جماعت", "برگزاری نماز جمعه"], answer: 0 },
    { q: "عوارض نوسازی چیست؟", options: ["مبلغی که شهرنشینان سالانه به شهرداری می‌پردازند", "مالیات بر درآمد", "حق بیمه", "هزینه آب و برق"], answer: 0 },
    { q: "کدام یک از وظایف دهیار است؟", options: ["اداره روستا با همکاری شورای اسلامی روستا", "اداره شهر", "تعیین استاندار", "اداره استان"], answer: 0 },
    { q: "دشت‌ها و جلگه‌های ایران برای چه فعالیتی مناسب هستند؟", options: ["کشاورزی", "معدن‌کاری", "صنعت سنگین", "شکار"], answer: 0 },
    { q: "قاره آسیا از نظر وسعت چه جایگاهی دارد؟", options: ["بزرگ‌ترین قاره زمین", "کوچک‌ترین قاره زمین", "دومین قاره بزرگ", "سومین قاره بزرگ"], answer: 0 },
    { q: "کدام یک از موارد زیر از وظایف شورای اسلامی شهر است؟", options: ["انتخاب شهردار و نظارت بر امور شهر", "تعیین استاندار", "اداره روستا", "مدیریت مدارس"], answer: 0 },
    { q: "کدام یک از موارد زیر از نواحی مرتفع ایران است؟", options: ["کوه‌های آذربایجان و البرز و زاگرس", "دشت خوزستان", "جلگه مازندران", "دشت کویر"], answer: 0 },
    { q: "کدام یک از موارد زیر از نواحی پست و هموار ایران است؟", options: ["دشت خوزستان و جلگه مازندران", "کوه دماوند", "رشته کوه زاگرس", "رشته کوه البرز"], answer: 0 },
    { q: "شهرداری مؤسسه‌ای است که برای چه هدفی به وجود آمده است؟", options: ["اداره بهتر شهر و ارائه خدمات به ساکنان", "اداره روستا", "مدیریت استان", "مدیریت کشور"], answer: 0 },
    { q: "شورای اسلامی روستا برای چه هدفی تشکیل می‌شود؟", options: ["اداره بهتر روستا و رفع نیازهای آن", "اداره شهر", "مدیریت استان", "تعیین شهردار"], answer: 0 },
    { q: "کدام یک از موارد زیر در مورد ایران صحیح است؟", options: ["ایران کشوری پهناور با فرهنگ و تمدن کهن است", "ایران کشوری کوچک و کم‌جمعیت است", "ایران تمدن کوتاهی دارد", "ایران منابع طبیعی ندارد"], answer: 0 }
  ];

  const numQuestionsToShow = 15; 
  const totalTime = 600; // ۱۰ دقیقه
  
  let selectedQuestions = [];
  let timerInterval;
  let timeLeft = totalTime;
  let studentName = "";

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    if (studentName === "") {
      alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      return;
    }
    
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    
    initQuiz();
  }

  function initQuiz() {
    const shuffledBank = shuffle([...questionBank]);
    selectedQuestions = shuffledBank.slice(0, numQuestionsToShow);

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((item, index) => {
      const correctAnswerText = item.options[item.answer];
      const shuffledOptions = shuffle([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
      
      selectedQuestions[index].options = shuffledOptions;
      selectedQuestions[index].answer = newCorrectIndex;

      let optionsHTML = '';
      shuffledOptions.forEach((opt, i) => {
        optionsHTML += `
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="q${index}" value="${i}">
            <span>${opt}</span>
          </label>
        `;
      });

      const qBox = document.createElement('div');
      qBox.className = 'question-box';
      qBox.innerHTML = `
        <div class="q-title">${index + 1}. ${item.q}</div>
        <div class="options">${optionsHTML}</div>
      `;
      container.appendChild(qBox);
    });

    startTimer();
  }

  function startTimer() {
    const display = document.getElementById('timer-display');
    
    timerInterval = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      
      display.innerHTML = `⏱ ${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

      if (timeLeft <= 60) {
        display.classList.add('warning');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        display.innerHTML = `⏱ ۰۰:۰۰`;
        document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
      }
    }, 1000);
  }

  function selectOption(label) {
    // 🔊 صدای کلیک روی گزینه
    if (typeof playClick === "function") playClick();

    const name = label.querySelector('input').name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.parentElement.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;

    selectedQuestions.forEach((item, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (!selected) {
        wrongCount++; 
      } else if (parseInt(selected.value) === item.answer) {
        correctCount++;
      } else {
        wrongCount++;
      }
    });

    const score = Math.round((correctCount / selectedQuestions.length) * 100);

    // ==========================================
    // 🎉 افکت صوتی و باران کاغذرنگی پایان آزمون
    // ==========================================
    setTimeout(() => {
      if (score >= 80) {
        // نمره عالی: صدای پایان + کانفتی
        if (typeof playFinish === "function") playFinish();
        if (typeof confetti === "function") {
          confetti({ particleCount: 180, spread: 90, origin: { y: 0.6 } });
          setTimeout(() => confetti({ particleCount: 120, angle: 60, spread: 70, origin: { x: 0 } }), 250);
          setTimeout(() => confetti({ particleCount: 120, angle: 120, spread: 70, origin: { x: 1 } }), 400);
        }
      } else if (score >= 50) {
        if (typeof playCorrect === "function") playCorrect();
      } else {
        if (typeof playWrong === "function") playWrong();
      }
    }, 300);
    // ==========================================

    submitScoreToTelegram(score, correctCount);

    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    document.getElementById('display-student-name').innerText = `دانش‌آموز: ${studentName}`;
    
    document.getElementById('score-display').innerText = score;
    document.getElementById('stat-correct').innerText = `تعداد درست: ${correctCount}`;
    document.getElementById('stat-wrong').innerText = `تعداد غلط: ${wrongCount}`;

    const circle = document.getElementById('score-circle');
    const msg = document.getElementById('result-message');
    
    circle.className = 'score-circle';
    if (score >= 80) {
      circle.classList.add('excellent');
      msg.innerText = "🌟 عالی بود! شما درس را به خوبی یاد گرفته‌اید.";
      msg.style.color = "#2ecc71";
    } else if (score >= 50) {
      circle.classList.add('good');
      msg.innerText = "👍 خوب بود، اما با کمی مطالعه بیشتر می‌توانید بهتر شوید.";
      msg.style.color = "#f39c12";
    } else {
      circle.classList.add('fail');
      msg.innerText = "📚 نیاز به مطالعه بیشتر دارید. ناامید نشوید و درسنامه را دوباره بخوانید.";
      msg.style.color = "#e74c3c";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
