<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود دانش‌آموز</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #667eea; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-box { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .msg { text-align: center; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>ورود به سایت</h2>
        <input type="text" id="username" placeholder="نام کاربری" required>
        <input type="password" id="password" placeholder="رمز عبور" required>
        
        <button onclick="login()">ورود</button>
        <div id="message" class="msg"></div>
        <p style="text-align:center; margin-top:15px; font-size:14px;">حساب نداری؟ <a href="register.html">ثبت‌نام کن</a></p>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            if(!username || !password) {
                msg.style.color = 'red'; msg.innerText = 'لطفاً نام کاربری و رمز را وارد کنید.'; return;
            }

            msg.style.color = 'blue'; msg.innerText = 'در حال ورود...';

            try {
                const res = await fetch('https://api.motadars.ir/login_student.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    // ذخیره اطلاعات در حافظه مرورگر
                    localStorage.setItem('student_name', data.user.full_name);
                    localStorage.setItem('school_name', data.user.school_name);
                    localStorage.setItem('student_username', data.user.username); // 👈 این خط برای تغییر رمز اضافه شد
                    
                    msg.style.color = 'green'; msg.innerText = '✅ ورود موفق! در حال انتقال...';
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    msg.style.color = 'red'; msg.innerText = '❌ ' + data.message;
                }
            } catch (e) {
                msg.style.color = 'red'; msg.innerText = 'خطا در ارتباط با سرور.';
            }
        }
    </script>
</body>
</html>
