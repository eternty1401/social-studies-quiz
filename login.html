<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود به سایت | مطالعات اجتماعی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #fff; padding: 20px;
  }

  .login-container {
    background: rgba(30, 41, 59, 0.8); border: 1px solid #475569;
    padding: 40px 30px; border-radius: 24px; width: 100%; max-width: 450px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4); backdrop-filter: blur(10px);
    text-align: center;
  }

  .login-container h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 10px; }
  .login-container p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 30px; line-height: 1.6; }

  /* دکمه گوگل */
  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff; color: #333; border: none; padding: 15px; border-radius: 12px;
    font-family: inherit; font-size: 1rem; font-weight: 900; cursor: pointer;
    width: 100%; transition: 0.3s; margin-bottom: 20px;
  }
  .google-btn:hover { background: #e2e8f0; transform: translateY(-2px); }

  /* جداکننده */
  .divider {
    display: flex; align-items: center; text-align: center; color: #64748b; margin-bottom: 20px; font-size: 0.85rem;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; border-bottom: 1px solid #475569;
  }
  .divider span { padding: 0 10px; }

  /* فرم ایمیل */
  .input-group { margin-bottom: 15px; text-align: right; }
  .input-group label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 0.9rem; }
  .input-group input {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569;
    background: rgba(0,0,0,0.2); color: #fff; font-family: inherit; font-size: 1rem; outline: none;
    transition: 0.3s;
  }
  .input-group input:focus { border-color: #38bdf8; }

  .submit-btn {
    background: #38bdf8; color: #0f172a; border: none; padding: 14px;
    border-radius: 12px; font-family: inherit; font-size: 1rem; font-weight: 900;
    cursor: pointer; width: 100%; transition: 0.3s; margin-top: 10px;
  }
  .submit-btn:hover { background: #fff; transform: translateY(-2px); }

  .toggle-text { margin-top: 20px; font-size: 0.9rem; color: #94a3b8; }
  .toggle-text span { color: #38bdf8; cursor: pointer; font-weight: bold; }
  .toggle-text span:hover { text-decoration: underline; }

  /* پیام‌ها */
  #message { margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 0.9rem; display: none; }
  .msg-error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
  .msg-success { background: rgba(16, 185, 129, 0.2); color: #a7f3d0; border: 1px solid #10b981; }
  
  .back-link {
    display: inline-block; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 0.85rem;
  }
  .back-link:hover { color: #38bdf8; }
</style>
</head>
<body>

  <div class="login-container">
    <h1>👋 خوش آمدی!</h1>
    <p>برای دسترسی به آزمون‌ها و کارنامه، وارد حساب خودت شو.</p>

    <!-- دکمه ورود با گوگل -->
    <button class="google-btn" onclick="signInWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="24" alt="Google">
      ورود با حساب گوگل
    </button>

    <div class="divider"><span>یا</span></div>

    <!-- فرم ورود/ثبت‌نام با ایمیل -->
    <div class="input-group">
      <label>ایمیل</label>
      <input type="email" id="email" placeholder="example@email.com" dir="ltr">
    </div>
    <div class="input-group">
      <label>رمز عبور</label>
      <input type="password" id="password" placeholder="حداقل ۶ کاراکتر" dir="ltr">
    </div>

    <button class="submit-btn" id="main-action-btn" onclick="handleEmailAuth()">ورود</button>

    <div class="toggle-text" id="toggle-mode-text">
      حساب کاربری نداری؟ <span onclick="toggleMode()">ثبت‌نام کن</span>
    </div>

    <div id="message"></div>
    
    <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
  </div>

  <!-- اسکریپت‌های Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAo0zfeqp_BfJEqAHLir6xiYD0N9NqQcvE",
      authDomain: "social-studies-app-6b600.firebaseapp.com",
      projectId: "social-studies-app-6b600",
      storageBucket: "social-studies-app-6b600.firebasestorage.app",
      messagingSenderId: "887286568529",
      appId: "1:887286568529:web:151feabe0c5c3c42a00a70",
      measurementId: "G-2ZZLN7ZB9N"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let isLoginMode = true; // حالت پیش‌فرض: ورود

    // تغییر بین حالت ورود و ثبت‌نام
    window.toggleMode = () => {
      isLoginMode = !isLoginMode;
      document.getElementById('main-action-btn').innerText = isLoginMode ? 'ورود' : 'ثبت‌نام';
      document.getElementById('toggle-mode-text').innerHTML = isLoginMode 
        ? 'حساب کاربری نداری؟ <span onclick="toggleMode()">ثبت‌نام کن</span>' 
        : 'قبلاً ثبت‌نام کردی؟ <span onclick="toggleMode()">وارد شو</span>';
      document.getElementById('message').style.display = 'none';
    };

    // نمایش پیام
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.innerText = text;
      msg.className = type === 'error' ? 'msg-error' : 'msg-success';
      msg.style.display = 'block';
    }

    // ورود با گوگل
    window.signInWithGoogle = () => {
      signInWithPopup(auth, provider)
        .then((result) => {
          window.location.href = 'index.html';
        })
        .catch((error) => {
          showMessage("خطا در ورود با گوگل: " + error.message, 'error');
        });
    };

    // ورود/ثبت‌نام با ایمیل
    window.handleEmailAuth = () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMessage("لطفاً ایمیل و رمز عبور را وارد کنید.", 'error');
        return;
      }
      if (password.length < 6) {
        showMessage("رمز عبور باید حداقل ۶ کاراکتر باشد.", 'error');
        return;
      }

      if (isLoginMode) {
        signInWithEmailAndPassword(auth, email, password)
          .then(() => {
            window.location.href = 'index.html';
          })
          .catch((error) => {
            showMessage("ایمیل یا رمز عبور اشتباه است!", 'error');
          });
      } else {
        createUserWithEmailAndPassword(auth, email, password)
          .then(() => {
            showMessage("✅ حساب با موفقیت ساخته شد! در حال انتقال...", 'success');
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
          })
          .catch((error) => {
            if (error.code === 'auth/email-already-in-use') {
              showMessage("این ایمیل قبلاً ثبت‌نام کرده است.", 'error');
            } else {
              showMessage("خطا در ثبت‌نام: " + error.message, 'error');
            }
          });
      }
    };
  </script>
</body>
</html>
