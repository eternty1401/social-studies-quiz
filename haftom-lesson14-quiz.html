<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون تستی درس ۱۴: منابع آب و خاک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
  }
  
  /* صفحه شروع */
  #start-section { text-align: center; padding: 20px 0; }
  #start-section h1 { color: #0288d1; font-size: 1.6rem; margin-bottom: 15px; }
  #start-section p { color: #7f8c8d; margin-bottom: 30px; line-height: 1.8; }
  .name-input {
    width: 100%; max-width: 400px; padding: 15px; margin-bottom: 20px;
    border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit;
    font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #0288d1; box-shadow: 0 0 10px rgba(2,136,209,0.2); }
  .start-btn {
    background: #2ecc71; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
  }
  .start-btn:hover { background: #27ae60; transform: translateY(-2px); }

  /* هدر و تایمر */
  .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eef2f5; padding-bottom: 15px; margin-bottom: 25px; }
  .header-title h1 { color: #0288d1; font-size: 1.4rem; }
  .header-title p { color: #7f8c8d; font-size: 0.85rem; margin-top: 5px; }
  .timer-box {
    background: #fdedec; color: #e74c3c; padding: 8px 18px; border-radius: 50px;
    font-weight: 900; font-size: 1.1rem; border: 1px solid #fadbd8;
    display: flex; align-items: center; gap: 8px; direction: ltr;
  }
  .timer-box.warning { background: #fef9e7; color: #f39c12; border-color: #fae5d3; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* سوالات */
  .question-box {
    background: #fafbfc; border: 1px solid #eef2f5; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .q-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.6; }
  
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    cursor: pointer; transition: 0.2s; font-size: 0.95rem;
  }
  .option-label:hover { background: #e1f5fe; border-color: #0288d1; }
  .option-label input[type="radio"] { display: none; }
  .option-label.selected { background: #e1f5fe; border-color: #0288d1; font-weight: 700; color: #01579b; }
  
  .submit-btn {
    display: block; width: 100%; padding: 15px; margin-top: 30px;
    background: #0288d1; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer;
    transition: 0.3s;
  }
  .submit-btn:hover { background: #01579b; }

  /* کارنامه */
  .result-container { display: none; text-align: center; }
  .student-name-display {
    font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 20px;
    background: #ecf0f1; padding: 10px 20px; border-radius: 10px; display: inline-block;
  }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 8px solid #ecf0f1;
  }
  .score-circle.excellent { border-color: #2ecc71; color: #2ecc71; }
  .score-circle.good { border-color: #f39c12; color: #f39c12; }
  .score-circle.fail { border-color: #e74c3c; color: #e74c3c; }
  .score-num { font-size: 2.8rem; font-weight: 900; line-height: 1; }
  .score-text { font-size: 0.9rem; color: #7f8c8d; margin-top: 5px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .stat-box { padding: 15px 25px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
  .stat-box.correct { color: #2ecc71; background: #e8f8f5; }
  .stat-box.wrong { color: #e74c3c; background: #fdedec; }
  
  .review-btn {
    display: inline-block; background: #3498db; color: #fff; text-decoration: none;
    padding: 12px 30px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer;
    font-size: 1rem;
  }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .header-top { flex-direction: column; gap: 10px; text-align: center; }
    .result-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- صفحه شروع -->
  <div id="start-section">
    <h1>📝 آزمون تستی درس ۱۴</h1>
    <p>منابع آب و خاک — مطالعات اجتماعی پایه هفتم<br>لطفاً نام و نام خانوادگی خود را وارد کنید تا آزمون آغاز شود.</p>
    <input type="text" id="student-name" class="name-input" placeholder="مثلاً: علی محمدی">
    <br>
    <button class="start-btn" onclick="startQuiz()">شروع آزمون</button>
  </div>

  <!-- بخش آزمون -->
  <div id="quiz-section" style="display: none;">
    <div class="header-top">
      <div class="header-title">
        <h1>📝 آزمون تستی درس ۱۴</h1>
        <p>۱۵ سوال تصادفی از بانک ۴۰ سوالی</p>
      </div>
      <div class="timer-box" id="timer-display">⏱ ۱۰:۰۰</div>
    </div>
    
    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="submit" class="submit-btn" id="submit-btn">ثبت پاسخ‌ها و مشاهده کارنامه</button>
    </form>
  </div>

  <!-- بخش کارنامه -->
  <div id="result-section" class="result-container">
    <h2 style="color:#2c3e50; margin-bottom:20px; font-weight:900;">🎓 کارنامه شما</h2>
    <div class="student-name-display" id="display-student-name">نام دانش‌آموز</div>
    
    <div id="score-circle" class="score-circle">
      <div class="score-num" id="score-display">0</div>
      <div class="score-text">از ۱۰۰</div>
    </div>
    <p id="result-message" style="font-size:1.1rem; font-weight:700; margin-bottom:25px;"></p>
    <div class="result-stats">
      <div class="stat-box correct" id="stat-correct">تعداد درست: ۰</div>
      <div class="stat-box wrong" id="stat-wrong">تعداد غلط: ۰</div>
    </div>
    <a href="haftom.html" class="review-btn" style="background:#3498db; text-decoration:none;">🔙 بازگشت به دروس</a>
  </div>

</div>

<script>
  // ==========================================
  // بانک ۴۰ سوالی درس ۱۴ (منابع آب و خاک)
  // ==========================================
  const questionBank = [
    { q: "آب مورد نیاز انسان از چه منابعی تأمین می‌شود؟", options: ["آب‌های سطحی (رودها) و آب‌های زیرزمینی (چاه، چشمه و قنات)", "فقط رودها", "فقط چاه‌ها", "فقط دریاها"], answer: 0 },
    { q: "میانگین بارش سالانه کشور ما حدوداً چقدر است؟", options: ["۲۳۰ میلی‌متر", "۵۰۰ میلی‌متر", "۱۰۰ میلی‌متر", "۸۰۰ میلی‌متر"], answer: 0 },
    { q: "علت اصلی کمبود آب در ایران چیست؟", options: ["قرار گرفتن در کمربند خشک و نیمه‌خشک جهان و کم بودن بارش", "دوری از دریا", "وجود کوه‌های بلند", "کاهش جمعیت"], answer: 0 },
    { q: "رودهای ایران از نظر جهت جریان آب به چند حوضه آبریز تقسیم می‌شوند؟", options: ["سه حوضه", "دو حوضه", "چهار حوضه", "پنج حوضه"], answer: 0 },
    { q: "رودهایی که به دریای خزر می‌ریزند، در کدام حوضه آبریز قرار دارند؟", options: ["حوضه آبریز دریای خزر", "حوضه آبریز خلیج فارس", "حوضه آبریز داخلی", "حوضه آبریز دریای عمان"], answer: 0 },
    { q: "حوضه آبریز داخلی چه ویژگی دارد؟", options: ["رودها به دریاچه‌های داخلی می‌ریزند و معمولاً موقت یا فصلی هستند", "رودها به دریای خزر می‌ریزند", "رودها به خلیج فارس می‌ریزند", "همیشه پرآب هستند"], answer: 0 },
    { q: "قنات (کاریز) از ابتکارات چه کسانی است؟", options: ["ایرانیان باستان", "یونانیان", "رومیان", "مصریان"], answer: 0 },
    { q: "قنات چیست؟", options: ["از ابداعات ایرانیان برای استفاده از آب‌های زیرزمینی", "نوعی سد", "نوعی رودخانه", "نوعی دریاچه"], answer: 0 },
    { q: "میزان مجاز مصرف آب برای یک فرد در شبانه‌روز چقدر است؟", options: ["۱۵۰ لیتر", "۲۵۰ لیتر", "۳۰۰ لیتر", "۵۰ لیتر"], answer: 0 },
    { q: "مصرف متوسط آب در ایران در شبانه‌روز چقدر است؟", options: ["۲۵۰ تا ۳۰۰ لیتر", "۱۵۰ لیتر", "۱۰۰ لیتر", "۵۰۰ لیتر"], answer: 0 },
    { q: "هر دقیقه دوش گرفتن حدوداً چقدر آب مصرف می‌کند؟", options: ["حدود ۲۰ لیتر", "حدود ۵۰ لیتر", "حدود ۱۰ لیتر", "حدود ۱۰۰ لیتر"], answer: 0 },
    { q: "کدام یک از راه‌های مصرف صحیح آب است؟", options: ["بستن شیر آب هنگام مسواک زدن", "باز گذاشتن شیر آب", "شستن اتومبیل با شیلنگ", "آبیاری در روز"], answer: 0 },
    { q: "چرا نباید زباله‌ها را در رودها ریخت؟", options: ["چون آب را آلوده می‌کند و از نظر اسلام گناه است", "چون رودها باریک می‌شوند", "چون آب زیاد می‌شود", "چون ماهی‌ها دوست ندارند"], answer: 0 },
    { q: "خاک چگونه تشکیل می‌شود؟", options: ["از خرد شدن سنگ‌ها، آب، دمای هوا و موجودات زنده", "از آب و باد", "از مواد شیمیایی", "از فعالیت‌های انسانی"], answer: 0 },
    { q: "برای تشکیل یک سانتی‌متر خاک زراعی چقدر زمان لازم است؟", options: ["صدها سال", "چند ماه", "چند سال", "چند هفته"], answer: 0 },
    { q: "کدام یک از عوامل از بین رفتن خاک است؟", options: ["قطع درختان و کندن بوته‌ها", "کاشت درخت", "آبیاری درست", "استفاده صحیح از خاک"], answer: 0 },
    { q: "استفاده نامناسب از کودهای شیمیایی چه تأثیری بر خاک دارد؟", options: ["باعث از بین رفتن خاک می‌شود", "خاک را حاصلخیزتر می‌کند", "خاک را پاک می‌کند", "تأثیری ندارد"], answer: 0 },
    { q: "سازمان مسئول حفاظت از خاک در کشور ما کدام است؟", options: ["سازمان جنگل‌ها، مراتع و آبخیزداری", "شهرداری", "وزارت آموزش و پرورش", "سازمان بیمه"], answer: 0 },
    { q: "آیا حفاظت از خاک فقط وظیفه سازمان جنگل‌ها و مراتع است؟", options: ["خیر، وظیفه همه ماست", "بله، فقط وظیفه این سازمان است", "بله، فقط وظیفه دولت است", "بله، فقط وظیفه کشاورزان است"], answer: 0 },
    { q: "کدام یک از راه‌های کاهش مصرف آب است؟", options: ["تعمیر شیرهای آب که چکه می‌کنند", "شستن ظرف‌ها با آب زیاد", "حمام طولانی", "شستن حیاط با شیلنگ"], answer: 0 },
    { q: "آب مورد نیاز انسان از کدام نوع آب است؟", options: ["آب شیرین", "آب شور", "آب دریا", "آب یخ‌زده"], answer: 0 },
    { q: "چرخه آب در طبیعت شامل چه مراحلی است؟", options: ["تبخیر، تشکیل ابر، بارش و جاری شدن آب", "فقط بارش", "فقط تبخیر", "فقط جاری شدن"], answer: 0 },
    { q: "کدام کشور از همسایگان ایران بارش بیشتری دارد؟", options: ["ترکیه", "افغانستان", "پاکستان", "عراق"], answer: 0 },
    { q: "نقش قنات در کشاورزی مناطق خشک چیست؟", options: ["تأمین آب مورد نیاز کشاورزی از آب‌های زیرزمینی", "تأمین آب شرب شهری", "تولید برق", "آبیاری دریاچه‌ها"], answer: 0 },
    { q: "کدام یک از حوضه‌های آبریز ایران به دریای عمان می‌ریزد؟", options: ["حوضه آبریز خلیج فارس و دریای عمان", "حوضه آبریز دریای خزر", "حوضه آبریز داخلی", "هیچ‌کدام"], answer: 0 },
    { q: "دریاچه ارومیه در کدام حوضه آبریز قرار دارد؟", options: ["حوضه آبریز داخلی", "حوضه آبریز دریای خزر", "حوضه آبریز خلیج فارس", "حوضه آبریز دریای عمان"], answer: 0 },
    { q: "از نظر اسلام، آلوده کردن آب‌ها چه حکمی دارد؟", options: ["گناه است", "مباح است", "مستحب است", "واجب است"], answer: 0 },
    { q: "کدام یک از کاربردهای خاک در زندگی انسان نیست؟", options: ["تولید برق", "کشاورزی", "ساختمان‌سازی", "دامپروری"], answer: 0 },
    { q: "کدام یک از عوامل مؤثر در تشکیل خاک است؟", options: ["موجودات زنده", "دست انسان", "فقط آب", "فقط باد"], answer: 0 },
    { q: "چرا خاک یک منبع محدود است؟", options: ["چون تشکیل آن صدها سال طول می‌کشد و سالانه هزاران تن از بین می‌رود", "چون در همه جا وجود دارد", "چون ارزان است", "چون تولید می‌شود"], answer: 0 },
    { q: "کدام یک از عوامل انسانی از بین رفتن خاک است؟", options: ["ساختمان‌سازی روی زمین‌های کشاورزی", "کاشت درخت", "آبیاری درست", "تناوب کشت"], answer: 0 },
    { q: "چگونه می‌توان از فرسایش خاک جلوگیری کرد؟", options: ["با کاشت درخت و حفظ پوشش گیاهی", "با قطع درختان", "با سوزاندن بوته‌ها", "با استفاده از کود نامناسب"], answer: 0 },
    { q: "کدام گزینه از راه‌های حفاظت از آب است؟", options: ["استفاده از آب باران برای آبیاری", "شستن حیاط با آب زیاد", "باز گذاشتن شیر آب", "آبیاری در گرما"], answer: 0 },
    { q: "کدام یک از منابع طبیعی تجدیدپذیر است؟", options: ["آب", "نفت", "گاز", "زغال سنگ"], answer: 0 },
    { q: "کدام یک از منابع طبیعی تجدیدناپذیر است؟", options: ["نفت", "آب", "خاک", "جنگل"], answer: 0 },
    { q: "استفاده از آب باران برای آبیاری باغچه چه فایده‌ای دارد؟", options: ["کاهش مصرف آب شهری", "افزایش مصرف آب", "کاهش محصول", "افزایش هزینه"], answer: 0 },
    { q: "کدام یک از موارد زیر از کاربردهای خاک است؟", options: ["کشاورزی و تولید غذا", "تولید برق", "ساخت هواپیما", "ساخت رایانه"], answer: 0 },
    { q: "چرا در ایران با کمبود آب مواجه هستیم؟", options: ["به دلیل کم بودن بارش و قرار گرفتن در منطقه خشک", "به دلیل زیادی بارش", "به دلیل جمعیت کم", "به دلیل نزدیکی به دریا"], answer: 0 },
    { q: "کدام یک از روش‌های آبیاری در کشاورزی به صرفه‌جویی در مصرف آب کمک می‌کند؟", options: ["آبیاری قطره‌ای", "آبیاری غرقابی", "آبیاری با شیلنگ", "آبیاری در روز"], answer: 0 },
    { q: "حفاظت از آب و خاک وظیفه چه کسانی است؟", options: ["همهٔ ما", "فقط دولت", "فقط کشاورزان", "فقط سازمان‌های مربوطه"], answer: 0 }
  ];

  const numQuestionsToShow = 15; 
  const totalTime = 600; // ۱۰ دقیقه
  
  let selectedQuestions = [];
  let timerInterval;
  let timeLeft = totalTime;
  let studentName = "";

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    if (studentName === "") {
      alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      return;
    }
    
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    
    initQuiz();
  }

  function initQuiz() {
    const shuffledBank = shuffle([...questionBank]);
    selectedQuestions = shuffledBank.slice(0, numQuestionsToShow);

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((item, index) => {
      const correctAnswerText = item.options[item.answer];
      const shuffledOptions = shuffle([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
      
      selectedQuestions[index].options = shuffledOptions;
      selectedQuestions[index].answer = newCorrectIndex;

      let optionsHTML = '';
      shuffledOptions.forEach((opt, i) => {
        optionsHTML += `
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="q${index}" value="${i}">
            <span>${opt}</span>
          </label>
        `;
      });

      const qBox = document.createElement('div');
      qBox.className = 'question-box';
      qBox.innerHTML = `
        <div class="q-title">${index + 1}. ${item.q}</div>
        <div class="options">${optionsHTML}</div>
      `;
      container.appendChild(qBox);
    });

    startTimer();
  }

  function startTimer() {
    const display = document.getElementById('timer-display');
    
    timerInterval = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      
      display.innerHTML = `⏱ ${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

      if (timeLeft <= 60) {
        display.classList.add('warning');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        display.innerHTML = `⏱ ۰۰:۰۰`;
        document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
      }
    }, 1000);
  }

  function selectOption(label) {
    const name = label.querySelector('input').name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.parentElement.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;

    selectedQuestions.forEach((item, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (!selected) {
        wrongCount++; 
      } else if (parseInt(selected.value) === item.answer) {
        correctCount++;
      } else {
        wrongCount++;
      }
    });

    const score = Math.round((correctCount / selectedQuestions.length) * 100);

    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    document.getElementById('display-student-name').innerText = `دانش‌آموز: ${studentName}`;
    
    document.getElementById('score-display').innerText = score;
    document.getElementById('stat-correct').innerText = `تعداد درست: ${correctCount}`;
    document.getElementById('stat-wrong').innerText = `تعداد غلط: ${wrongCount}`;

    const circle = document.getElementById('score-circle');
    const msg = document.getElementById('result-message');
    
    circle.className = 'score-circle';
    if (score >= 80) {
      circle.classList.add('excellent');
      msg.innerText = "🌟 عالی بود! شما درس را به خوبی یاد گرفته‌اید.";
      msg.style.color = "#2ecc71";
    } else if (score >= 50) {
      circle.classList.add('good');
      msg.innerText = "👍 خوب بود، اما با کمی مطالعه بیشتر می‌توانید بهتر شوید.";
      msg.style.color = "#f39c12";
    } else {
      circle.classList.add('fail');
      msg.innerText = "📚 نیاز به مطالعه بیشتر دارید. ناامید نشوید و درسنامه را دوباره بخوانید.";
      msg.style.color = "#e74c3c";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
