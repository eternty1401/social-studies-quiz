<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون تستی درس ۱: من حق دارم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
  }
  
  /* صفحه شروع و دریافت نام */
  #start-section { text-align: center; padding: 20px 0; }
  #start-section h1 { color: #3498db; font-size: 1.6rem; margin-bottom: 15px; }
  #start-section p { color: #7f8c8d; margin-bottom: 30px; line-height: 1.8; }
  .name-input {
    width: 100%; max-width: 400px; padding: 15px; margin-bottom: 20px;
    border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit;
    font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #3498db; box-shadow: 0 0 10px rgba(52,152,219,0.2); }
  .start-btn {
    background: #2ecc71; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
  }
  .start-btn:hover { background: #27ae60; transform: translateY(-2px); }

  /* هدر و تایمر */
  .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eef2f5; padding-bottom: 15px; margin-bottom: 25px; }
  .header-title h1 { color: #3498db; font-size: 1.4rem; }
  .header-title p { color: #7f8c8d; font-size: 0.85rem; margin-top: 5px; }
  .timer-box {
    background: #fdedec; color: #e74c3c; padding: 8px 18px; border-radius: 50px;
    font-weight: 900; font-size: 1.1rem; border: 1px solid #fadbd8;
    display: flex; align-items: center; gap: 8px; direction: ltr;
  }
  .timer-box.warning { background: #fef9e7; color: #f39c12; border-color: #fae5d3; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  .question-box {
    background: #fafbfc; border: 1px solid #eef2f5; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .q-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.6; }
  
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    cursor: pointer; transition: 0.2s; font-size: 0.95rem;
  }
  .option-label:hover { background: #ebf5fb; border-color: #3498db; }
  .option-label input[type="radio"] { display: none; }
  .option-label.selected { background: #ebf5fb; border-color: #3498db; font-weight: 700; color: #2980b9; }
  
  .submit-btn {
    display: block; width: 100%; padding: 15px; margin-top: 30px;
    background: #3498db; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer;
    transition: 0.3s;
  }
  .submit-btn:hover { background: #2980b9; }

  /* کارنامه */
  .result-container { display: none; text-align: center; }
  .student-name-display {
    font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 20px;
    background: #ecf0f1; padding: 10px 20px; border-radius: 10px; display: inline-block;
  }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 8px solid #ecf0f1;
  }
  .score-circle.excellent { border-color: #2ecc71; color: #2ecc71; }
  .score-circle.good { border-color: #f39c12; color: #f39c12; }
  .score-circle.fail { border-color: #e74c3c; color: #e74c3c; }
  .score-num { font-size: 2.8rem; font-weight: 900; line-height: 1; }
  .score-text { font-size: 0.9rem; color: #7f8c8d; margin-top: 5px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .stat-box { padding: 15px 25px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
  .stat-box.correct { color: #2ecc71; background: #e8f8f5; }
  .stat-box.wrong { color: #e74c3c; background: #fdedec; }
  
  .review-btn {
    display: inline-block; background: #f39c12; color: #fff; text-decoration: none;
    padding: 12px 30px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer;
    font-size: 1rem;
  }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .header-top { flex-direction: column; gap: 10px; text-align: center; }
    .result-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- صفحه شروع و دریافت نام -->
  <div id="start-section">
    <h1>📝 آزمون تستی درس ۱</h1>
    <p>من حق دارم — مطالعات اجتماعی پایه هفتم<br>لطفاً نام و نام خانوادگی خود را وارد کنید تا آزمون آغاز شود.</p>
    <input type="text" id="student-name" class="name-input" placeholder="مثلاً: علی محمدی">
    <br>
    <button class="start-btn" onclick="startQuiz()">شروع آزمون</button>
  </div>

  <!-- بخش آزمون -->
  <div id="quiz-section" style="display: none;">
    <div class="header-top">
      <div class="header-title">
        <h1>📝 آزمون تستی درس ۱</h1>
        <p>۱۵ سوال تصادفی از بانک ۴۰ سوالی</p>
      </div>
      <div class="timer-box" id="timer-display">⏱ ۱۰:۰۰</div>
    </div>
    
    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="submit" class="submit-btn" id="submit-btn">ثبت پاسخ‌ها و مشاهده کارنامه</button>
    </form>
  </div>

  <!-- بخش کارنامه -->
  <div id="result-section" class="result-container">

    <div class="student-name-display" id="display-student-name">نام دانش‌آموز</div>
    
    <div id="score-circle" class="score-circle">
      <div class="score-num" id="score-display">0</div>
      <div class="score-text">از ۱۰۰</div>
    </div>
    <p id="result-message" style="font-size:1.1rem; font-weight:700; margin-bottom:25px;"></p>
    <div class="result-stats">
      <div class="stat-box correct" id="stat-correct">تعداد درست: ۰</div>
      <div class="stat-box wrong" id="stat-wrong">تعداد غلط: ۰</div>
    </div>
    <a href="haftom.html" class="review-btn" style="background:#3498db; text-decoration:none;">🔙 بازگشت به دروس</a>
  </div>

</div>

<script>

    { q: "کدام یک از موارد زیر از حقوق دانش‌آموزان در مدرسه است؟", options: ["تنبیه بدنی توسط معلم", "مسخره کردن همکلاسی‌ها", "بیان نظر درباره مشکلات درسی به صورت محترمانه", "تبعیض بین دانش‌آموزان در کلاس"], answer: 2 },
    { q: "کدام مورد از حقوق انسان در محیط زندگی و کشور است؟", options: ["حق زندگی در محیطی سالم و پاک", "حق آسیب زدن به اموال عمومی", "حق محروم کردن دیگران از بهداشت", "حق برهم زدن امنیت کوچه و خیابان"], answer: 0 },
    { q: "شناسنامه نشان‌دهنده چیست؟", options: ["میزان ثروت فرد", "نام و نام خانوادگی و تعلق به یک کشور", "مدرک تحصیلی فرد", "حق رانندگی فرد"], answer: 1 },
    { q: "کدام جمله درباره حقوق طبیعی نادرست است؟", options: ["همه انسان‌ها از آن برخوردارند", "ربطی به کشور و نژاد ندارد", "فقط برای افراد باسواد است", "از ابتدای خلقت برای انسان قرار داده شده"], answer: 2 },
    { q: "طبق فرموده امامان، مسخره کردن و ناسزا گفتن به دیگران چه حکمی دارد؟", options: ["کار پسندیده‌ای است", "گناهی بزرگ است", "مشکلی ندارد", "فقط در مدرسه ممنوع است"], answer: 1 },
    { q: "در مورد حق آزادی انسان، کدام گزینه صحیح است؟", options: ["انسان حق دارد برده دیگران باشد", "خداوند انسان را آزاد آفریده است", "آزادی فقط برای ثروتمندان است", "آزادی مطلق و بدون قانون است"], answer: 1 },
    { q: "حق حیات یعنی چه؟", options: ["حق داشتن خانه", "حق زندگی کردن", "حق تحصیل کردن", "حق انتخاب شغل"], answer: 1 },
    { q: "آیا حقوق طبیعی بین انسان‌ها تبعیض قائل می‌شود؟", options: ["بله، بین ثروتمند و فقیر", "بله، بین نژادهای مختلف", "خیر، همه انسان‌ها برابرند", "بله، بین زن و مرد"], answer: 2 },

    { q: "طبق آیه ۷۰ سوره اسراء، خداوند چه چیزی را به انسان عطا کرده است؟", options: ["ثروت فراوان", "برتری بر بسیاری از مخلوقات", "قدرت نظامی", "زمین وسیع"], answer: 1 },
    { q: "کدام گزینه از حقوق طبیعی انسان نیست؟", options: ["حق حیات", "حق آزادی", "حق تحصیل در مدارس خاص برای ثروتمندان", "حق ازدواج"], answer: 2 },
    { q: "آیا خداوند انسان را آزاد آفریده است؟", options: ["بله، انسان حق دارد آزاد باشد", "خیر، انسان برده دیگران است", "آزادی فقط برای بزرگان است", "خداوند انسان را در بند آفریده"], answer: 0 },
    { q: "در خانه، شناسنامه نشان‌دهنده چیست؟", options: ["نام، نام خانوادگی و تعلق به کشور", "میزان درآمد خانواده", "تعداد اعضای خانواده", "نوع شغل پدر"], answer: 0 },
    { q: "کدام یک از موارد زیر در مدرسه ممنوع است؟", options: ["احترام به معلم", "مسخره کردن دیگران", "بیان نظر محترمانه", "رعایت نظم کلاس"], answer: 1 },
    { q: "طبق درس، چه رفتاری در مدرسه از نظر اسلام گناه بزرگی است؟", options: ["تبعیض و مسخره کردن", "کمک به دوستان", "شرکت در کلاس", "انجام تکالیف"], answer: 0 },
    { q: "حق استفاده از خدمات مناسب پزشکی و بهداشتی مربوط به کدام بخش است؟", options: ["حقوق در مدرسه", "حقوق در خانه", "حقوق در محیط زندگی", "حقوق در خانواده"], answer: 2 },
    { q: "به چه کسی حق نداریم در مدرسه تنبیه بدنی کنیم؟", options: ["هیچ دانش‌آموزی", "فقط دانش‌آموزان ضعیف", "فقط دانش‌آموزان بازیگوش", "فقط دانش‌آموزان بی‌نظم"], answer: 0 },
    { q: "کدام جمله صحیح است؟", options: ["حقوق طبیعی فقط برای افراد خاص است", "همه انسان‌ها از حقوق طبیعی برخوردارند", "حقوق طبیعی به پول بستگی دارد", "حقوق طبیعی به نژاد بستگی دارد"], answer: 1 },
    { q: "مفهوم «حقوق متقابل» چیست؟", options: ["همان‌طور که ما حق داریم، دیگران هم بر ما حق دارند", "فقط افراد ثروتمند حق دارند", "حقوق فقط برای بزرگسالان است", "حقوق با مسئولیت ارتباطی ندارد"], answer: 0 },

    { q: "مسخره کردن و ناسزا گفتن به دیگران از نظر اسلام چه حکمی دارد؟", options: ["مجاز است", "گناه بزرگی است", "فقط در مدرسه ممنوع است", "مشکلی ندارد"], answer: 1 },
    { q: "کدام یک از حقوق در مدرسه است؟", options: ["استفاده از خدمات پزشکی", "بیان نظر درباره مشکلات درسی", "حق امنیت در خیابان", "حق ازدواج"], answer: 1 },
    { q: "حق انتخاب شغل و تلاش برای تأمین نیازها از کدام نوع حقوق است؟", options: ["حقوق طبیعی", "حقوق مدنی", "حقوق کیفری", "حقوق اداری"], answer: 0 },
    { q: "طبق درس، حق حیات مهم‌ترین حق طبیعی است. چرا؟", options: ["چون با پول به دست می‌آید", "چون زندگی پایه همه حقوق است", "چون فقط برای افراد خاص است", "چون توسط دولت داده می‌شود"], answer: 1 },
    { q: "طبق درس، شناسنامه چه اطلاعاتی را نشان می‌دهد؟", options: ["نام و نام خانوادگی و نام کشور", "مدرک تحصیلی و شغل", "میزان درآمد و دارایی", "نشانی خانه و تلفن"], answer: 0 },
    { q: "کدام یک از موارد زیر حق ما در مدرسه نیست؟", options: ["احترام و عدم تبعیض", "بیان نظر محترمانه", "تنبیه بدنی", "توجه معلم"], answer: 2 },
    { q: "طبق درس، هر حقی با چه چیزی همراه است؟", options: ["مسئولیت و تکلیف", "پول و ثروت", "قدرت و زور", "مقام و منزلت"], answer: 0 },
    { q: "هدف از حقوق در محیط زندگی چیست؟", options: ["آزادی مطلق", "زندگی سالم و با امنیت", "محدود کردن مردم", "تبعیض بین افراد"], answer: 1 },
    { q: "کدام یک از حقوق طبیعی است؟", options: ["حق زندگی کردن", "حق رانندگی", "حق داشتن مدرک", "حق عضویت در باشگاه"], answer: 0 },
    { q: "طبق درس، در دین اسلام چه چیزی از گناهان بزرگ است؟", options: ["مسخره کردن دیگران", "کمک به نیازمندان", "احترام به والدین", "شرکت در نماز"], answer: 0 }
  ];

  // ==========================================
  // تنظیمات آزمون
  // ==========================================
  const numQuestionsToShow = 15; // تعداد سوالاتی که در هر آزمون نمایش داده می‌شود
  const totalTime = 600; // زمان کل آزمون به ثانیه (۱۰ دقیقه)
  
  let selectedQuestions = [];
  let timerInterval;
  let timeLeft = totalTime;
  let studentName = "";

  // ===== تابع درهم‌ریزی آرایه =====
  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  // ===== شروع آزمون (با گرفتن نام) =====
  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    if (studentName === "") {
      alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      return;
    }
    
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    
    initQuiz();
  }

  // ===== مقداردهی اولیه سوالات =====
  function initQuiz() {
    const shuffledBank = shuffle([...questionBank]);
    selectedQuestions = shuffledBank.slice(0, numQuestionsToShow);

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((item, index) => {
      const correctAnswerText = item.options[item.answer];
      const shuffledOptions = shuffle([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
      
      selectedQuestions[index].options = shuffledOptions;
      selectedQuestions[index].answer = newCorrectIndex;

      let optionsHTML = '';
      shuffledOptions.forEach((opt, i) => {
        optionsHTML += `
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="q${index}" value="${i}">
            <span>${opt}</span>
          </label>
        `;
      });

      const qBox = document.createElement('div');
      qBox.className = 'question-box';
      qBox.innerHTML = `
        <div class="q-title">${index + 1}. ${item.q}</div>
        <div class="options">${optionsHTML}</div>
      `;
      container.appendChild(qBox);
    });

    startTimer();
  }

  // ===== تایمر =====
  function startTimer() {
    const display = document.getElementById('timer-display');
    
    timerInterval = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      
      display.innerHTML = `⏱ ${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

      if (timeLeft <= 60) {
        display.classList.add('warning');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        display.innerHTML = `⏱ ۰۰:۰۰`;
        document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
      }
    }, 1000);
  }

  // ===== انتخاب گزینه =====
  function selectOption(label) {
    const name = label.querySelector('input').name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.parentElement.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  // ===== ثبت پاسخ‌ها و نمایش کارنامه =====
  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;

    selectedQuestions.forEach((item, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (!selected) {
        wrongCount++; 
      } else if (parseInt(selected.value) === item.answer) {
        correctCount++;
      } else {
        wrongCount++;
      }
    });

    const score = Math.round((correctCount / selectedQuestions.length) * 100);
