<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون درس اول - من حق دارم (هفتم)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, Vazirmatn, sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    padding: 16px;
    line-height: 1.9;
  }
  .quiz-container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 1.3rem;
    color: #2b6cb0;
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: #718096;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .student-name-box {
    background: #ebf8ff;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .student-name-box label {
    display: block;
    font-size: 0.9rem;
    margin-bottom: 6px;
    color: #2b6cb0;
    font-weight: bold;
  }
  .student-name-box input {
    width: 100%;
    padding: 10px;
    border: 2px solid #bee3f8;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
  }
  .question {
    background: #f7fafc;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    border-right: 4px solid #4299e1;
  }
  .question h3 {
    font-size: 0.95rem;
    margin-bottom: 12px;
    color: #2d3748;
  }
  .option {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: #fff;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.15s;
  }
  .option:hover { border-color: #90cdf4; }
  .option.selected {
    border-color: #2b6cb0;
    background: #ebf8ff;
  }
  .option input { margin-left: 10px; accent-color: #2b6cb0; }
  .submit-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: #38a169;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    font-family: inherit;
  }
  .submit-btn:hover { background: #2f855a; }
  .submit-btn:disabled { background: #a0aec0; cursor: not-allowed; }

  .status-msg {
    text-align: center;
    font-size: 0.85rem;
    margin-top: 10px;
    min-height: 20px;
    color: #718096;
  }
  .status-msg.error { color: #e53e3e; }
  .status-msg.success { color: #38a169; }

  .result-box {
    display: none;
    text-align: center;
    padding: 20px;
    background: #f0fff4;
    border: 2px solid #9ae6b4;
    border-radius: 12px;
    margin-top: 20px;
  }
  .result-box .score {
    font-size: 2.5rem;
    font-weight: bold;
    color: #2b6cb0;
    display: block;
    margin: 10px 0;
  }
  .result-box .msg { color: #4a5568; font-size: 0.95rem; }
  .retry-btn {
    margin-top: 14px;
    padding: 10px 24px;
    background: #2b6cb0;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .retry-btn:hover { background: #2c5282; }
</style>
</head>
<body>
<div class="quiz-container">
  <h1>📝 آزمون درس اول: من حق دارم</h1>
  <p class="subtitle">مطالعات اجتماعی پایه هفتم</p>

  <div class="student-name-box">
    <label for="studentName">نام و نام خانوادگی:</label>
    <input type="text" id="studentName" placeholder="نام خود را وارد کنید...">
  </div>

  <div id="quizArea"></div>

  <button class="submit-btn" id="submitBtn" onclick="submitQuiz()">✅ ثبت و ارسال نمره</button>
  <div class="status-msg" id="statusMsg"></div>

  <div class="result-box" id="resultBox">
    <span class="msg">نمره شما (از ۱۰):</span>
    <span class="score" id="finalScore">0</span>
    <span class="msg" id="resultMsg"></span>
    <br>
    <button class="retry-btn" onclick="location.reload()">🔄 آزمون مجدد</button>
  </div>
</div>

<!-- فایل تلگرام -->
<script src="telegram.js"></script>

<script>
// ==== بانک سوالات درس اول (من حق دارم) ====
const questions = [
  {
    q: "خداوند در قرآن درباره مقام انسان چه می‌فرماید؟",
    options: [
      "ما فرزندان آدم را بسیار گرامی داشتیم و بر بسیاری مخلوقات برتری بخشیدیم.",
      "ما فرزندان آدم را تنها مخلوق با عقل قرار دادیم.",
      "ما فرزندان آدم را مسئول تمام مخلوقات قرار دادیم.",
      "ما فرزندان آدم را به دلیل ثروت گرامی داشتیم."
    ],
    answer: 0
  },
  {
    q: "منظور از «حق» چیست؟",
    options: [
      "هر چیزی که انسان بتواند به دست آورد.",
      "چیزهایی که یک انسان به دلیل مقام انسانی‌اش شایستگی داشتن آن‌ها را دارد.",
      "چیزهایی که قانون برای انسان تعیین می‌کند.",
      "چیزهایی که دیگران به انسان می‌دهند."
    ],
    answer: 1
  },
  {
    q: "مهم‌ترین حق انسان‌ها کدام است؟",
    options: ["حق تحصیل", "حق آزادی", "حق حیات", "حق مالکیت"],
    answer: 2
  },
  {
    q: "کدام مورد از حقوق طبیعی انسان نیست؟",
    options: ["حق حیات", "حق ازدواج", "حق برخورداری از نعمت‌های الهی", "حق داشتن ماشین شخصی"],
    answer: 3
  },
  {
    q: "انسان از ابتدای خلقت با چه کسانی ارتباط برقرار می‌کند؟",
    options: [
      "با فرشتگان",
      "با پدر، مادر، خواهر، برادر و خویشاوندان",
      "با همسایگان و دوستان",
      "با حکومت و قانون"
    ],
    answer: 1
  },
  {
    q: "تبعه یک کشور بودن چه حقوقی برای افراد ایجاد می‌کند؟",
    options: [
      "حقوقی بر اساس عرف و عادت",
      "حقوقی بر مبنای قوانین آن کشور",
      "حقوقی بر اساس ثروت افراد",
      "حقوقی بر اساس نژاد و قومیت"
    ],
    answer: 1
  },
  {
    q: "کدام مورد جزو حقوق افراد در خانه و خانواده نیست؟",
    options: [
      "داشتن نام و نام خانوادگی و شناسنامه",
      "حق داشتن سواد و تحصیل",
      "داشتن تلفن همراه گران‌قیمت",
      "برخورداری از محبت پدر و مادر"
    ],
    answer: 2
  },
  {
    q: "خانواده تا چه حدی امکانات زندگی را فراهم می‌کند؟",
    options: [
      "تا حدی که توان مالی داشته باشد",
      "تا حدی که تمام آرزوها را برآورده کند",
      "تا حدی که تمام نیازها را برآورده کند",
      "بدون محدودیت"
    ],
    answer: 0
  },
  {
    q: "دانش‌آموزان در مدرسه چه حقی دارند؟",
    options: [
      "حق دارند نمرات بالایی کسب کنند",
      "حق دارند در مدرسه به آن‌ها توجه شود و تبعیضی بین آن‌ها و دیگران نباشد",
      "حق دارند هر کاری دوست دارند انجام دهند",
      "حق دارند معلم را انتخاب کنند"
    ],
    answer: 1
  },
  {
    q: "کدام مورد از حقوق افراد در محیط زندگی و کشور نیست؟",
    options: [
      "حق زندگی در محیط پاک و سالم",
      "حق استفاده از خدمات بهداشتی و پزشکی",
      "حق امنیت در کوچه و خیابان",
      "حق داشتن هر شغلی بدون توجه به تخصص"
    ],
    answer: 3
  }
];

// ==== ساخت سوالات در صفحه ====
const quizArea = document.getElementById("quizArea");
let selectedAnswers = new Array(questions.length).fill(null);

questions.forEach((item, index) => {
  const qDiv = document.createElement("div");
  qDiv.className = "question";
  qDiv.innerHTML = `<h3>${index + 1}. ${item.q}</h3>`;
  item.options.forEach((opt, optIndex) => {
    const label = document.createElement("label");
    label.className = "option";
    label.innerHTML = `
      <input type="radio" name="q${index}" value="${optIndex}" onchange="selectOption(${index}, ${optIndex}, this)">
      <span>${opt}</span>
    `;
    qDiv.appendChild(label);
  });
  quizArea.appendChild(qDiv);
});

function selectOption(qIndex, optIndex, radioEl) {
  selectedAnswers[qIndex] = optIndex;
  const parent = radioEl.closest(".question");
  parent.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
  radioEl.closest(".option").classList.add("selected");
}

// ==== نمایش پیام وضعیت ====
function showStatus(text, type) {
  const statusEl = document.getElementById("statusMsg");
  statusEl.textContent = text;
  statusEl.className = "status-msg" + (type ? " " + type : "");
}

// ==== ارسال آزمون ====
function submitQuiz() {
  const nameInput = document.getElementById("studentName");
  const studentName = nameInput.value.trim();

  if (!studentName) {
    showStatus("⚠️ لطفاً نام و نام خانوادگی خود را وارد کنید.", "error");
    nameInput.focus();
    return;
  }

  if (selectedAnswers.includes(null)) {
    showStatus("⚠️ لطفاً به همه سوالات پاسخ دهید.", "error");
    return;
  }

  // محاسبه نمره
  let correct = 0;
  questions.forEach((item, index) => {
    if (selectedAnswers[index] === item.answer) correct++;
  });

  const percentage = Math.round((correct / questions.length) * 100); // برای تلگرام (درصد)
  const finalScore = Math.ceil((correct / questions.length) * 10);  // برای نمایش (از ۱۰)

  // غیرفعال کردن دکمه
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "در حال ارسال...";
  showStatus("");

  // ارسال به تلگرام
  try {
    if (typeof submitScoreToTelegram === "function") {
      submitScoreToTelegram(percentage, correct);
      showStatus("✅ نمره شما با موفقیت ارسال شد.", "success");
    } else {
      console.warn("تابع submitScoreToTelegram پیدا نشد. telegram.js را بررسی کن.");
      showStatus("⚠️ فایل telegram.js بارگذاری نشده است.", "error");
    }
  } catch (err) {
    console.error("خطا در ارسال به تلگرام:", err);
    showStatus("⚠️ خطا در ارسال به تلگرام. لطفاً به معلم اطلاع دهید.", "error");
  }

  // نمایش نتیجه به دانش‌آموز
  document.getElementById("quizArea").style.display = "none";
  submitBtn.style.display = "none";
  document.querySelector(".student-name-box").style.display = "none";

  const resultBox = document.getElementById("resultBox");
  resultBox.style.display = "block";
  document.getElementById("finalScore").textContent = finalScore;

  let msg = "";
  if (finalScore >= 9) msg = "عالی! 🌟";
  else if (finalScore >= 7) msg = "خوب! 👏";
  else if (finalScore >= 5) msg = "قابل قبول. 💪";
  else msg = "نیاز به مطالعه بیشتر. 📚";
  document.getElementById("resultMsg").textContent = msg;
}
</script>
</body>
</html>
