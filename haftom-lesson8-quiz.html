<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون تستی درس ۸: مصرف</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
  }
  
  /* صفحه شروع */
  #start-section { text-align: center; padding: 20px 0; }
  #start-section h1 { color: #8e44ad; font-size: 1.6rem; margin-bottom: 15px; }
  #start-section p { color: #7f8c8d; margin-bottom: 30px; line-height: 1.8; }
  .name-input {
    width: 100%; max-width: 400px; padding: 15px; margin-bottom: 20px;
    border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit;
    font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #8e44ad; box-shadow: 0 0 10px rgba(142,68,173,0.2); }
  .start-btn {
    background: #2ecc71; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
  }
  .start-btn:hover { background: #27ae60; transform: translateY(-2px); }

  /* هدر و تایمر */
  .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eef2f5; padding-bottom: 15px; margin-bottom: 25px; }
  .header-title h1 { color: #8e44ad; font-size: 1.4rem; }
  .header-title p { color: #7f8c8d; font-size: 0.85rem; margin-top: 5px; }
  .timer-box {
    background: #fdedec; color: #e74c3c; padding: 8px 18px; border-radius: 50px;
    font-weight: 900; font-size: 1.1rem; border: 1px solid #fadbd8;
    display: flex; align-items: center; gap: 8px; direction: ltr;
  }
  .timer-box.warning { background: #fef9e7; color: #f39c12; border-color: #fae5d3; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* سوالات */
  .question-box {
    background: #fafbfc; border: 1px solid #eef2f5; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .q-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.6; }
  
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    cursor: pointer; transition: 0.2s; font-size: 0.95rem;
  }
  .option-label:hover { background: #f4ecf7; border-color: #8e44ad; }
  .option-label input[type="radio"] { display: none; }
  .option-label.selected { background: #f4ecf7; border-color: #8e44ad; font-weight: 700; color: #6c3483; }
  
  .submit-btn {
    display: block; width: 100%; padding: 15px; margin-top: 30px;
    background: #8e44ad; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer;
    transition: 0.3s;
  }
  .submit-btn:hover { background: #6c3483; }

  /* کارنامه */
  .result-container { display: none; text-align: center; }
  .student-name-display {
    font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 20px;
    background: #ecf0f1; padding: 10px 20px; border-radius: 10px; display: inline-block;
  }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 8px solid #ecf0f1;
  }
  .score-circle.excellent { border-color: #2ecc71; color: #2ecc71; }
  .score-circle.good { border-color: #f39c12; color: #f39c12; }
  .score-circle.fail { border-color: #e74c3c; color: #e74c3c; }
  .score-num { font-size: 2.8rem; font-weight: 900; line-height: 1; }
  .score-text { font-size: 0.9rem; color: #7f8c8d; margin-top: 5px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .stat-box { padding: 15px 25px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
  .stat-box.correct { color: #2ecc71; background: #e8f8f5; }
  .stat-box.wrong { color: #e74c3c; background: #fdedec; }
  
  .review-btn {
    display: inline-block; background: #3498db; color: #fff; text-decoration: none;
    padding: 12px 30px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer;
    font-size: 1rem;
  }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .header-top { flex-direction: column; gap: 10px; text-align: center; }
    .result-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- صفحه شروع -->
  <div id="start-section">
    <h1>📝 آزمون تستی درس ۸</h1>
    <p>مصرف — مطالعات اجتماعی پایه هفتم<br>لطفاً نام و نام خانوادگی خود را وارد کنید تا آزمون آغاز شود.</p>
    <input type="text" id="student-name" class="name-input" placeholder="مثلاً: علی محمدی">
    <br>
    <button class="start-btn" onclick="startQuiz()">شروع آزمون</button>
  </div>

  <!-- بخش آزمون -->
  <div id="quiz-section" style="display: none;">
    <div class="header-top">
      <div class="header-title">
        <h1>📝 آزمون تستی درس ۸</h1>
        <p>۱۵ سوال تصادفی از بانک ۴۰ سوالی</p>
      </div>
      <div class="timer-box" id="timer-display">⏱ ۱۰:۰۰</div>
    </div>
    
    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="submit" class="submit-btn" id="submit-btn">ثبت پاسخ‌ها و مشاهده کارنامه</button>
    </form>
  </div>

  <!-- بخش کارنامه -->
  <div id="result-section" class="result-container">
    <h2 style="color:#2c3e50; margin-bottom:20px; font-weight:900;">🎓 کارنامه شما</h2>
    <div class="student-name-display" id="display-student-name">نام دانش‌آموز</div>
    
    <div id="score-circle" class="score-circle">
      <div class="score-num" id="score-display">0</div>
      <div class="score-text">از ۱۰۰</div>
    </div>
    <p id="result-message" style="font-size:1.1rem; font-weight:700; margin-bottom:25px;"></p>
    <div class="result-stats">
      <div class="stat-box correct" id="stat-correct">تعداد درست: ۰</div>
      <div class="stat-box wrong" id="stat-wrong">تعداد غلط: ۰</div>
    </div>
    <a href="haftom.html" class="review-btn" style="background:#3498db; text-decoration:none;">🔙 بازگشت به دروس</a>
  </div>

</div>

<script>
  // ==========================================
  // بانک ۴۰ سوالی درس ۸ (مصرف)
  // ==========================================
  const questionBank = [
    { q: "مصرف‌کننده کیست؟", options: ["کسی که کالا و خدمات را برای رفع نیاز خریداری می‌کند", "کسی که کالا تولید می‌کند", "کسی که کالا توزیع می‌کند", "کسی که مالیات می‌دهد"], answer: 0 },
    { q: "در گذشته‌های دور، مبادله به چه صورتی انجام می‌شد؟", options: ["با پول کاغذی", "با کالا با کالا", "با کارت اعتباری", "با سکه طلا"], answer: 1 },
    { q: "چرا مبادله کالا با کالا مشکل بود؟", options: ["چون گاهی نیاز دو طرف به هم نمی‌خورد", "چون کالاها ارزش یکسان داشتند", "چون پول زیاد بود", "چون مردم به کالا نیاز نداشتند"], answer: 0 },
    { q: "کالاهای واسطه چه کالاهایی بودند؟", options: ["کالاهایی که مشتریان بیشتری داشتند", "کالاهایی که فاسد می‌شدند", "کالاهایی که حجم زیادی داشتند", "کالاهایی که ارزش کمی داشتند"], answer: 0 },
    { q: "پول فلزی از چه فلزاتی ساخته می‌شد؟", options: ["طلا، نقره، مس", "آهن، سرب، روی", "آلومینیوم، مس، آهن", "طلا و آلومینیوم"], answer: 0 },
    { q: "اسکناس چیست؟", options: ["پول فلزی", "پول کاغذی", "کارت اعتباری", "سکه طلا"], answer: 1 },
    { q: "امروزه علاوه بر پول کاغذی، از چه شیوه‌ای برای مبادله استفاده می‌شود؟", options: ["کارت اعتباری", "سکه طلا", "کالا با کالا", "چک"], answer: 0 },
    { q: "کدام یک از حقوق مصرف‌کننده است؟", options: ["خرید کالای سالم و باکیفیت", "خرید کالای قاچاق", "خرید کالای بدون برچسب", "خرید کالای بدون استاندارد"], answer: 0 },
    { q: "روی برچسب کالا چه اطلاعاتی نوشته می‌شود؟", options: ["شماره جواز تولید، آدرس، قیمت، تاریخ مصرف", "فقط قیمت", "فقط تاریخ تولید", "فقط نام کارخانه"], answer: 0 },
    { q: "سازمانی که کیفیت کالاها را در ایران تأیید می‌کند چه نام دارد؟", options: ["سازمان ملی استاندارد ایران", "سازمان بیمه مرکزی", "سازمان تأمین اجتماعی", "سازمان مدیریت بحران"], answer: 0 },
    { q: "استاندارد به چه معناست؟", options: ["نمونهٔ قابل قبول", "ارزان‌ترین کالا", "گران‌ترین کالا", "کالای خارجی"], answer: 0 },
    { q: "ضمانت‌نامه به چه درد می‌خورد؟", options: ["برگه‌ای که برای تعمیر یا تعویض کالا در صورت خرابی استفاده می‌شود", "برگه‌ای که قیمت کالا را نشان می‌دهد", "برگه‌ای که فقط برای کالاهای ارزان است", "برگه‌ای که مخصوص کالاهای قاچاق است"], answer: 0 },
    { q: "خرید و فروش کالاهای قاچاق چه پیامدی دارد؟", options: ["تقویت اقتصاد کشور", "ضعیف شدن اقتصاد کشور و تعطیلی مراکز تولیدی", "کاهش قیمت کالاها", "افزایش تولید داخلی"], answer: 1 },
    { q: "مصرف‌گرایی چیست؟", options: ["خرید کالا بر اساس نیاز واقعی", "خرید کالا بدون نیاز واقعی برای خودنمایی یا چشم و هم‌چشمی", "استفاده از کالاهای باکیفیت", "خرید کالای داخلی"], answer: 1 },
    { q: "مصرف‌گرایی به چه چیزی می‌انجامد؟", options: ["اسراف", "صرفه‌جویی", "اعتدال", "کاهش زباله"], answer: 0 },
    { q: "طبق آیه ۲۷ سوره اسراء، مُبَذّرین (ریخت و پاش‌کنندگان) چه کسانی هستند؟", options: ["برادران شیاطین", "دوستان خدا", "بندگان صالح", "اهل بهشت"], answer: 0 },
    { q: "اسراف در اسلام چه حکمی دارد؟", options: ["گناه بزرگ است", "حلال است", "مستحب است", "مکروه است"], answer: 0 },
    { q: "فرد مصرف‌گرا چه ویژگی‌ای دارد؟", options: ["زود تحت تأثیر تبلیغات و مد قرار می‌گیرد", "فقط کالاهای ضروری می‌خرد", "به فکر صرفه‌جویی است", "از خرید زیاد پرهیز می‌کند"], answer: 0 },
    { q: "مصرف‌گرایی چه تأثیری بر محیط زیست دارد؟", options: ["آسیب جدی به محیط زیست", "کمک به محیط زیست", "بی‌تأثیر بر محیط زیست", "افزایش فضای سبز"], answer: 0 },
    { q: "چرا امروزه زباله‌های زیادی تولید می‌شود؟", options: ["به دلیل تولید انبوه صنعتی و مصرف‌گرایی", "به دلیل کاهش جمعیت", "به دلیل کاهش تولید", "به دلیل بازیافت زیاد"], answer: 0 },
    { q: "کدام یک از راهکارهای کاهش آسیب به محیط زیست است؟", options: ["استفاده از کیسه پارچه‌ای به جای نایلون", "سوزاندن زباله", "خرید بیشتر کالا", "استفاده از ظروف یکبار مصرف"], answer: 0 },
    { q: "بازیافت زباله چیست؟", options: ["تبدیل زباله‌های قابل استفاده به مواد جدید", "سوزاندن زباله", "دفن زباله", "دور ریختن زباله"], answer: 0 },
    { q: "استفاده از ظروف یکبار مصرف چه تأثیری بر محیط زیست دارد؟", options: ["آسیب به محیط زیست", "کمک به محیط زیست", "کاهش آلودگی", "افزایش فضای سبز"], answer: 0 },
    { q: "کدام علامت روی بسته‌بندی کالا نشان‌دهنده قابل بازیافت بودن است؟", options: ["علامت بازیافت", "علامت استاندارد", "علامت قاچاق", "علامت ضمانت"], answer: 0 },
    { q: "طبق فرمایش امام سجاد (ع) در صحیفه سجادیه، انسان از خدا چه می‌خواهد؟", options: ["راه‌های صحیح داشتن در معیشت", "ثروت فراوان", "قدرت و مقام", "سلامتی"], answer: 0 },
    { q: "کدام یک از موارد زیر از مصادیق اسراف است؟", options: ["خرید بیش از نیاز", "خرید به اندازه نیاز", "استفاده مجدد از وسایل", "بازیافت زباله"], answer: 0 },
    { q: "چرا مصرف کالاهای قاچاق به اقتصاد کشور آسیب می‌زند؟", options: ["چون مراکز تولید داخلی تعطیل می‌شوند", "چون قیمت‌ها بالا می‌رود", "چون مالیات افزایش می‌یابد", "چون کالاها ارزان‌تر می‌شوند"], answer: 0 },
    { q: "کدام یک از موارد زیر از حقوق مصرف‌کننده نیست؟", options: ["خرید کالای قاچاق", "خرید کالای استاندارد", "خرید کالای دارای ضمانت", "خرید کالای دارای برچسب"], answer: 0 },
    { q: "کدام گزینه از راه‌های صرفه‌جویی در مصرف است؟", options: ["استفاده مجدد از وسایل", "خرید بی‌رویه", "اسراف", "دور ریختن کالاهای سالم"], answer: 0 },
    { q: "مصرف‌گرایی چه تأثیری بر اقتصاد خانواده دارد؟", options: ["هزینه‌های غیرضروری و کاهش پس‌انداز", "افزایش پس‌انداز", "کاهش هزینه‌ها", "افزایش درآمد"], answer: 0 },
    { q: "چرا باید از خرید کالاهای قاچاق پرهیز کنیم؟", options: ["چون به تولید داخلی و اقتصاد کشور آسیب می‌زند", "چون گران‌تر هستند", "چون کیفیت بالایی دارند", "چون در همه جا یافت می‌شوند"], answer: 0 },
    { q: "استفاده از کارت اعتباری چه مزیتی دارد؟", options: ["امکان خرید بدون حمل پول نقد", "افزایش قیمت کالاها", "کاهش تولید", "افزایش زباله"], answer: 0 },
    { q: "در ایران، چه سازمانی بر کیفیت کالاها نظارت می‌کند؟", options: ["سازمان ملی استاندارد ایران", "سازمان بیمه مرکزی", "سازمان مدیریت بحران", "سازمان تأمین اجتماعی"], answer: 0 },
    { q: "چرا برچسب کالا برای مصرف‌کننده مهم است؟", options: ["چون اطلاعات لازم درباره کالا را به مصرف‌کننده می‌دهد", "چون قیمت کالا را کاهش می‌دهد", "چون کالا را ارزان‌تر می‌کند", "چون کالا را زیباتر می‌کند"], answer: 0 },
    { q: "کدام یک از انواع مبادله در گذشته وجود داشته است؟", options: ["مبادله کالا با کالا", "مبادله با کارت اعتباری", "مبادله با اینترنت", "مبادله با رمزارز"], answer: 0 },
    { q: "پول کاغذی برای اولین بار در چه دوره‌ای رایج شد؟", options: ["پس از پول فلزی", "قبل از پول فلزی", "همزمان با مبادله کالا با کالا", "در قرن بیستم"], answer: 0 },
    { q: "طبق قرآن، اسراف و ریخت و پاش چه حکمی دارد؟", options: ["گناه بزرگ است", "حلال است", "مستحب است", "مباح است"], answer: 0 },
    { q: "کدام یک از موارد زیر از نشانه‌های مصرف‌گرایی است؟", options: ["عوض کردن هر ساله وسایل خانه برای پیروی از مد", "خرید کالاهای ضروری", "استفاده از کالا تا خراب شدن", "تعمیر کالاهای خراب"], answer: 0 },
    { q: "چه ارتباطی بین مصرف‌گرایی و محیط زیست وجود دارد؟", options: ["مصرف‌گرایی باعث آسیب به محیط زیست می‌شود", "مصرف‌گرایی به محیط زیست کمک می‌کند", "هیچ ارتباطی وجود ندارد", "مصرف‌گرایی محیط زیست را پاک می‌کند"], answer: 0 },
    { q: "برای کاهش زباله، چه اقدامی می‌توان انجام داد؟", options: ["تفکیک زباله و بازیافت", "سوزاندن زباله", "دفن زباله", "دور ریختن زباله در طبیعت"], answer: 0 }
  ];

  const numQuestionsToShow = 15; 
  const totalTime = 600; // ۱۰ دقیقه
  
  let selectedQuestions = [];
  let timerInterval;
  let timeLeft = totalTime;
  let studentName = "";

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    if (studentName === "") {
      alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      return;
    }
    
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    
    initQuiz();
  }

  function initQuiz() {
    const shuffledBank = shuffle([...questionBank]);
    selectedQuestions = shuffledBank.slice(0, numQuestionsToShow);

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((item, index) => {
      const correctAnswerText = item.options[item.answer];
      const shuffledOptions = shuffle([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
      
      selectedQuestions[index].options = shuffledOptions;
      selectedQuestions[index].answer = newCorrectIndex;

      let optionsHTML = '';
      shuffledOptions.forEach((opt, i) => {
        optionsHTML += `
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="q${index}" value="${i}">
            <span>${opt}</span>
          </label>
        `;
      });

      const qBox = document.createElement('div');
      qBox.className = 'question-box';
      qBox.innerHTML = `
        <div class="q-title">${index + 1}. ${item.q}</div>
        <div class="options">${optionsHTML}</div>
      `;
      container.appendChild(qBox);
    });

    startTimer();
  }

  function startTimer() {
    const display = document.getElementById('timer-display');
    
    timerInterval = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      
      display.innerHTML = `⏱ ${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

      if (timeLeft <= 60) {
        display.classList.add('warning');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        display.innerHTML = `⏱ ۰۰:۰۰`;
        document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
      }
    }, 1000);
  }

  function selectOption(label) {
    const name = label.querySelector('input').name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.parentElement.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;

    selectedQuestions.forEach((item, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (!selected) {
        wrongCount++; 
      } else if (parseInt(selected.value) === item.answer) {
        correctCount++;
      } else {
        wrongCount++;
      }
    });

    const score = Math.round((correctCount / selectedQuestions.length) * 100);

    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    document.getElementById('display-student-name').innerText = `دانش‌آموز: ${studentName}`;
    
    document.getElementById('score-display').innerText = score;
    document.getElementById('stat-correct').innerText = `تعداد درست: ${correctCount}`;
    document.getElementById('stat-wrong').innerText = `تعداد غلط: ${wrongCount}`;

    const circle = document.getElementById('score-circle');
    const msg = document.getElementById('result-message');
    
    circle.className = 'score-circle';
    if (score >= 80) {
      circle.classList.add('excellent');
      msg.innerText = "🌟 عالی بود! شما درس را به خوبی یاد گرفته‌اید.";
      msg.style.color = "#2ecc71";
    } else if (score >= 50) {
      circle.classList.add('good');
      msg.innerText = "👍 خوب بود، اما با کمی مطالعه بیشتر می‌توانید بهتر شوید.";
      msg.style.color = "#f39c12";
    } else {
      circle.classList.add('fail');
      msg.innerText = "📚 نیاز به مطالعه بیشتر دارید. ناامید نشوید و درسنامه را دوباره بخوانید.";
      msg.style.color = "#e74c3c";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
