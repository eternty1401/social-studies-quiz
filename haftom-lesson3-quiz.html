<head>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
  }
  
  /* صفحه شروع */
  #start-section { text-align: center; padding: 20px 0; }
  #start-section h1 { color: #00897b; font-size: 1.6rem; margin-bottom: 15px; }
  #start-section p { color: #7f8c8d; margin-bottom: 30px; line-height: 1.8; }
  .name-input {
    width: 100%; max-width: 400px; padding: 15px; margin-bottom: 20px;
    border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit;
    font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #00897b; box-shadow: 0 0 10px rgba(0,137,123,0.2); }
  .start-btn {
    background: #2ecc71; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
  }
  .start-btn:hover { background: #27ae60; transform: translateY(-2px); }

  /* هدر و تایمر */
  .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eef2f5; padding-bottom: 15px; margin-bottom: 25px; }
  .header-title h1 { color: #00897b; font-size: 1.4rem; }
  .header-title p { color: #7f8c8d; font-size: 0.85rem; margin-top: 5px; }
  .timer-box {
    background: #fdedec; color: #e74c3c; padding: 8px 18px; border-radius: 50px;
    font-weight: 900; font-size: 1.1rem; border: 1px solid #fadbd8;
    display: flex; align-items: center; gap: 8px; direction: ltr;
  }
  .timer-box.warning { background: #fef9e7; color: #f39c12; border-color: #fae5d3; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* سوالات */
  .question-box {
    background: #fafbfc; border: 1px solid #eef2f5; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .q-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.6; }
  
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    cursor: pointer; transition: 0.2s; font-size: 0.95rem;
  }
  .option-label:hover { background: #e0f2f1; border-color: #00897b; }
  .option-label input[type="radio"] { display: none; }
  .option-label.selected { background: #e0f2f1; border-color: #00897b; font-weight: 700; color: #00695c; }
  
  .submit-btn {
    display: block; width: 100%; padding: 15px; margin-top: 30px;
    background: #00897b; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer;
    transition: 0.3s;
  }
  .submit-btn:hover { background: #00695c; }

  /* کارنامه */
  .result-container { display: none; text-align: center; }
  .student-name-display {
    font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 20px;
    background: #ecf0f1; padding: 10px 20px; border-radius: 10px; display: inline-block;
  }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 8px solid #ecf0f1;
  }
  .score-circle.excellent { border-color: #2ecc71; color: #2ecc71; }
  .score-circle.good { border-color: #f39c12; color: #f39c12; }
  .score-circle.fail { border-color: #e74c3c; color: #e74c3c; }
  .score-num { font-size: 2.8rem; font-weight: 900; line-height: 1; }
  .score-text { font-size: 0.9rem; color: #7f8c8d; margin-top: 5px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .stat-box { padding: 15px 25px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
  .stat-box.correct { color: #2ecc71; background: #e8f8f5; }
  .stat-box.wrong { color: #e74c3c; background: #fdedec; }
  
  .review-btn {
    display: inline-block; background: #f39c12; color: #fff; text-decoration: none;
    padding: 12px 30px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer;
    font-size: 1rem;
  }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .header-top { flex-direction: column; gap: 10px; text-align: center; }
    .result-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- صفحه شروع و دریافت نام -->
  <div id="start-section">
    <h1>📝 آزمون تستی درس ۳</h1>
    <p>چرا به مقررات نیاز داریم؟ — مطالعات اجتماعی پایه هفتم<br>لطفاً نام و نام خانوادگی خود را وارد کنید تا آزمون آغاز شود.</p>
    <input type="text" id="student-name" class="name-input" placeholder="مثلاً: علی محمدی">

  <!-- بخش آزمون -->

    <div id="score-circle" class="score-circle">

<p id="out-of-20-text" style="font-size:1.2rem; font-weight:700; color:#00838f; margin-bottom:15px;"></p>

<script>
  // ==========================================
  // بانک ۴۰ سوالی درس ۳ (چرا به مقررات نیاز داریم؟)
  // ==========================================
  const questionBank = [
    { q: "مهم‌ترین علل پدید آمدن مقررات و قوانین در جامعه چیست؟", options: ["برقراری نظم و حفظ حقوق افراد", "افزایش ثروت دولت", "کاهش جمعیت", "گسترش تجارت"], answer: 0 },
    { q: "آیا هیچ‌یک از ما در استفاده از حقوق خود آزادی مطلق داریم؟", options: ["بله، همه آزاد هستند", "خیر، تا آنجا که مغایر قانون نباشد", "بله، اما فقط در خانه", "خیر، ما اصلاً حقی نداریم"], answer: 1 },
    { q: "علاوه بر قوانین، چه چیز دیگری را باید در انجام کارها رعایت کنیم؟", options: ["نظر دوستان", "احکام الهی", "سلیقه شخصی", "قوانین کشورهای دیگر"], answer: 1 },
    { q: "کدام یک از موارد زیر از دلایل مهم وجود قانون در جامعه نیست؟", options: ["حفظ حقوق افراد", "برقراری نظم", "ایجاد هرج و مرج", "رشد اخلاقی انسان"], answer: 2 },
    { q: "پیامد عدم رعایت قوانین و مقررات در جامعه چیست؟", options: ["ایجاد نظم بیشتر", "رشد اخلاقی", "پایمال شدن حقوق افراد", "افزایش اعتماد عمومی"], answer: 2 },
    { q: "اگر فردی بدون رعایت صف در نانوایی نان بگیرد، چه اتفاقی می‌افتد؟", options: ["همه خوشحال می‌شوند", "حق دیگران پایمال می‌شود و نزاع ایجاد می‌شود", "نان ارزان‌تر می‌شود", "هیچ اتفاقی نمی‌افتد"], answer: 1 },
    { q: "در یک آپارتمان، اگر فردی سهم مشارکت خود در هزینه‌ها را نپردازد چه پیامدی دارد؟", options: ["آپارتمان بزرگ‌تر می‌شود", "اختلال در خدمات مشترک و نارضایتی ساکنان", "هیچ پیامدی ندارد", "بقیه ساکنان خوشحال می‌شوند"], answer: 1 },
    { q: "راننده‌ای که بدون توجه به علامت عبور ممنوع وارد خیابان یک‌طرفه شود، چه پیامدی دارد؟", options: ["ایجاد ترافیک و خطر تصادف", "افزایش نظم", "کمک به عابران", "سرعت بیشتر در رسیدن به مقصد"], answer: 0 },
    { q: "حرکت موتورسوار در پیاده‌رو چه پیامدی دارد؟", options: ["کمک به عابران", "به خطر افتادن جان عابران پیاده", "کاهش ترافیک", "افزایش نظم"], answer: 1 },
    { q: "اگر شرکت ساختمانی از مصالح نامناسب استفاده کند چه پیامدی دارد؟", options: ["ساختمان ارزان‌تر می‌شود", "خطر ریزش ساختمان و آسیب به ساکنان", "هیچ پیامدی ندارد", "ساختمان زیباتر می‌شود"], answer: 1 },
    { q: "عبور عابر پیاده بدون توجه به چراغ راهنما چه خطری دارد؟", options: ["خطر تصادف و آسیب جانی", "کاهش ترافیک", "افزایش امنیت", "هیچ خطری ندارد"], answer: 0 },
    { q: "کدام یک از مکان‌های زیر مقررات مخصوص به خود را ندارد؟", options: ["کتابخانه", "سینما", "پارک", "همه مکان‌ها مقررات خاص خود را دارند"], answer: 3 },
    { q: "مقررات در کتابخانه چه چیزی را ایجاب می‌کند؟", options: ["سر و صدا کردن", "سکوت و مراقبت از کتاب‌ها", "خوردن غذا", "جابه‌جایی کتاب‌ها بدون اجازه"], answer: 1 },
    { q: "رعایت قوانین راهنمایی و رانندگی در خیابان به چه منظور است؟", options: ["ایجاد ترافیک", "احترام به حق عابران و جلوگیری از تصادف", "کاهش نظم", "افزایش سرعت"], answer: 1 },
    { q: "چرا رعایت مقررات در مدرسه ضروری است؟", options: ["برای ایجاد نظم و احترام به حقوق دیگران", "برای کاهش یادگیری", "برای ایجاد تنبیه", "برای کاهش نظم"], answer: 0 },
    { q: "پیامد رعایت نکردن مقررات مدرسه چیست؟", options: ["ایجاد نظم بیشتر", "اختلال در یادگیری و پایمال شدن حقوق دیگران", "افزایش دوستی‌ها", "افزایش نمرات"], answer: 1 },
    { q: "کدام گزینه از فواید وجود قانون در جامعه است؟", options: ["برقراری نظم و امنیت", "ایجاد هرج و مرج", "پایمال شدن حقوق افراد", "بی‌اعتمادی مردم"], answer: 0 },
    { q: "طبق آیه ۱۱ سوره بقره، بعضی افراد با اعمال نادرست خود چه می‌کنند؟", options: ["اصلاح جامعه", "ایجاد فساد در جامعه", "کمک به دیگران", "برقراری نظم"], answer: 1 },
    { q: "چرا عدم رعایت قوانین موجب بی‌اعتمادی می‌شود؟", options: ["چون باعث شکستن حقوق دیگران و بی‌نظمی می‌شود", "چون افراد بیشتر به هم اعتماد می‌کنند", "چون نظم افزایش می‌یابد", "چون قانون کمتر می‌شود"], answer: 0 },
    { q: "پارک محلی که مقررات بهداشتی را رعایت نمی‌کند چه پیامدی دارد؟", options: ["آسیب به فضای سبز و کاهش لذت استفاده از پارک برای همه", "افزایش نظم", "کمک به محیط زیست", "افزایش گیاهان"], answer: 0 },
    { q: "چرا رعایت مقررات مسجد ضروری است؟", options: ["برای احترام به نمازگزاران و حفظ پاکیزگی", "برای ایجاد سر و صدا", "برای کاهش احترام", "برای جلوگیری از عبادت"], answer: 0 },
    { q: "در استفاده از حقوق خود، چه محدودیتی داریم؟", options: ["محدودیتی نداریم", "تا جایی که مغایر قانون نباشد", "فقط در خانه محدود هستیم", "فقط در مدرسه محدود هستیم"], answer: 1 },
    { q: "رشد اخلاقی انسان‌ها چگونه با قانون مرتبط است؟", options: ["قانون مانع رشد اخلاق است", "رعایت قانون به رشد فضایل اخلاقی کمک می‌کند", "قانون هیچ ربطی به اخلاق ندارد", "قانون فقط برای مجازات است"], answer: 1 },
    { q: "کدام یک از پیامدهای عدم رعایت قانون است؟", options: ["افزایش اعتماد عمومی", "به هم زدن نظم و امنیت اجتماعی", "افزایش آسایش", "کاهش خسارت"], answer: 1 },
    { q: "چه کسی مسئول رعایت قوانین در جامعه است؟", options: ["فقط مسئولان", "فقط بزرگسالان", "همه افراد جامعه", "فقط پلیس"], answer: 2 },
    { q: "احترام به حقوق دیگران چگونه توسط قانون تضمین می‌شود؟", options: ["با تعیین مجازات برای متخلفان", "با حذف حقوق افراد", "با ایجاد هرج و مرج", "با کاهش نظم"], answer: 0 },
    { q: "در مورد مقررات ورزشگاه، کدام گزینه صحیح است؟", options: ["هیچ مقرراتی ندارد", "مقررات خاص خود را دارد", "مقررات آن با خیابان یکسان است", "فقط ورزشکاران باید رعایت کنند"], answer: 1 },
    { q: "کدام گزینه درباره «آزادی مطلق» صحیح است؟", options: ["هیچ‌کس آزادی مطلق ندارد", "همه آزادی مطلق دارند", "فقط ثروتمندان آزادی مطلق دارند", "آزادی مطلق حق همه است"], answer: 0 },
    { q: "قوانین و مقررات در جامعه برای چه کسانی است؟", options: ["فقط برای ضعیفان", "فقط برای قوی‌ها", "برای همه افراد جامعه", "فقط برای ثروتمندان"], answer: 2 },
    { q: "چرا نمی‌توان در جامعه بدون قانون زندگی کرد؟", options: ["چون حقوق افراد پایمال می‌شود و هرج و مرج ایجاد می‌شود", "چون قانون فقط برای دولت است", "چون قانون مانع آزادی است", "چون قانون فقط برای بزرگسالان است"], answer: 0 },
    { q: "کدام نمونه نشان‌دهنده رعایت حقوق دیگران است؟", options: ["حرکت در پیاده‌رو با موتور", "رعایت صف در نانوایی", "عبور از چراغ قرمز", "ایجاد سر و صدا در کتابخانه"], answer: 1 },
    { q: "قوانین و مقررات در مدرسه توسط چه کسانی باید رعایت شود؟", options: ["فقط دانش‌آموزان", "فقط معلمان", "همه (دانش‌آموزان، معلمان و مسئولان)", "فقط مدیر"], answer: 2 },
    { q: "فردی که سهم خود را در هزینه‌های ساختمان نمی‌پردازد، چه حقی را نقض می‌کند؟", options: ["حق خودش", "حق سایر ساکنان", "حق شهرداری", "حق هیچ‌کس"], answer: 1 },
    { q: "نظم و امنیت اجتماعی چگونه حفظ می‌شود؟", options: ["با رعایت قوانین توسط همه افراد", "با نادیده گرفتن قانون", "با هرج و مرج", "با کاهش قوانین"], answer: 0 },
    { q: "کدام گزینه از مهم‌ترین علل پدید آمدن مقررات است؟", options: ["برقراری نظم و حفظ حقوق افراد", "افزایش سرگرمی", "کاهش تعهد", "گسترش بی‌نظمی"], answer: 0 },
    { q: "پیامد رعایت نکردن مقررات در کتابخانه چیست؟", options: ["افزایش یادگیری", "اختلال در مطالعه دیگران و کاهش نظم", "افزایش سکوت", "هیچ پیامدی ندارد"], answer: 1 },
    { q: "چرا هنگام انجام کارهای خود باید احکام الهی را نیز رعایت کنیم؟", options: ["چون احکام الهی مانند قانون باید رعایت شوند", "چون احکام الهی اختیاری است", "چون احکام الهی فقط برای بزرگان است", "چون احکام الهی فقط در مسجد است"], answer: 0 },
    { q: "کدام گزینه نشان‌دهنده احترام به حقوق دیگران در خیابان است؟", options: ["عبور از چراغ قرمز", "رعایت حق عابران پیاده", "حرکت در پیاده‌رو با موتور", "ایجاد ترافیک"], answer: 1 },
    { q: "طبق درس، چه چیزی موجب رشد اخلاقی انسان‌ها می‌شود؟", options: ["رعایت قوانین", "نادیده گرفتن قانون", "هرج و مرج", "بی‌توجهی به دیگران"], answer: 0 },
    { q: "کدام مورد نشان می‌دهد که رعایت قانون به نفع همگان است؟", options: ["جلوگیری از هرج و مرج و حفظ امنیت", "افزایش اختلافات", "کاهش نظم", "افزایش تصادفات"], answer: 0 }
  ];

  // ==========================================
  // تنظیمات آزمون
  // ==========================================
  const numQuestionsToShow = 15; 
  const totalTime = 600; // ۱۰ دقیقه
  
  let selectedQuestions = [];
  let timerInterval;
  let timeLeft = totalTime;
  let studentName = "";

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    if (studentName === "") {
      alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      return;
    }
    
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    
    initQuiz();
  }

  function initQuiz() {
    const shuffledBank = shuffle([...questionBank]);
    selectedQuestions = shuffledBank.slice(0, numQuestionsToShow);

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((item, index) => {
      const correctAnswerText = item.options[item.answer];
      const shuffledOptions = shuffle([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
      
      selectedQuestions[index].options = shuffledOptions;
      selectedQuestions[index].answer = newCorrectIndex;

      let optionsHTML = '';
      shuffledOptions.forEach((opt, i) => {
        optionsHTML += `
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="q${index}" value="${i}">
            <span>${opt}</span>
          </label>
        `;
      });

      const qBox = document.createElement('div');
      qBox.className = 'question-box';
      qBox.innerHTML = `
        <div class="q-title">${index + 1}. ${item.q}</div>
        <div class="options">${optionsHTML}</div>
      `;
      container.appendChild(qBox);
    });

    startTimer();
  }

  function startTimer() {
    const display = document.getElementById('timer-display');
    
    timerInterval = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      
      display.innerHTML = `⏱ ${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

      if (timeLeft <= 60) {
        display.classList.add('warning');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        display.innerHTML = `⏱ ۰۰:۰۰`;
        document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
      }
    }, 1000);
  }

  function selectOption(label) {
    const name = label.querySelector('input').name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.parentElement.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;

    selectedQuestions.forEach((item, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (!selected) {
        wrongCount++; 
      } else if (parseInt(selected.value) === item.answer) {
        correctCount++;
      } else {
        wrongCount++;
      }
    });

    const score = Math.round((correctCount / selectedQuestions.length) * 100);
submitScoreToTelegram(score, correctCount);
if (typeof window.saveGradeToFirebase === 'function') {
  window.saveGradeToFirebase(studentName, document.title, Math.ceil((correctCount / selectedQuestions.length) * 20), correctCount);
}
    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    document.getElementById('display-student-name').innerText = `دانش‌آموز: ${studentName}`;
    
    document.getElementById('score-display').innerText = score;
    document.getElementById('stat-correct').innerText = `تعداد درست: ${correctCount}`;
    document.getElementById('stat-wrong').innerText = `تعداد غلط: ${wrongCount}`;

    const circle = document.getElementById('score-circle');
    const msg = document.getElementById('result-message');
    
    circle.className = 'score-circle';
    if (score >= 80) {
      circle.classList.add('excellent');
      msg.innerText = "🌟 عالی بود! شما درس را به خوبی یاد گرفته‌اید.";
      msg.style.color = "#2ecc71";
    } else if (score >= 50) {
      circle.classList.add('good');
      msg.innerText = "👍 خوب بود، اما با کمی مطالعه بیشتر می‌توانید بهتر شوید.";
      msg.style.color = "#f39c12";
    } else {
      circle.classList.add('fail');
      msg.innerText = "📚 نیاز به مطالعه بیشتر دارید. ناامید نشوید و درسنامه را دوباره بخوانید.";
      msg.style.color = "#e74c3c";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
