<!DOCTYPE html>
<html lang="fa" dir="rtl">
 <script src="telegram.js"></script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون تستی درس ۱۱: تنوع آب و هوای ایران</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="sounds.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
  }
  
  /* صفحه شروع */
  #start-section { text-align: center; padding: 20px 0; }
  #start-section h1 { color: #039be5; font-size: 1.6rem; margin-bottom: 15px; }
  #start-section p { color: #7f8c8d; margin-bottom: 30px; line-height: 1.8; }
  .name-input {
    width: 100%; max-width: 400px; padding: 15px; margin-bottom: 20px;
    border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit;
    font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #039be5; box-shadow: 0 0 10px rgba(3,155,229,0.2); }
  .start-btn {
    background: #2ecc71; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
  }
  .start-btn:hover { background: #27ae60; transform: translateY(-2px); }

  /* هدر و تایمر */
  .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eef2f5; padding-bottom: 15px; margin-bottom: 25px; }
  .header-title h1 { color: #039be5; font-size: 1.4rem; }
  .header-title p { color: #7f8c8d; font-size: 0.85rem; margin-top: 5px; }
  .timer-box {
    background: #fdedec; color: #e74c3c; padding: 8px 18px; border-radius: 50px;
    font-weight: 900; font-size: 1.1rem; border: 1px solid #fadbd8;
    display: flex; align-items: center; gap: 8px; direction: ltr;
  }
  .timer-box.warning { background: #fef9e7; color: #f39c12; border-color: #fae5d3; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* سوالات */
  .question-box {
    background: #fafbfc; border: 1px solid #eef2f5; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .q-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.6; }
  
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    cursor: pointer; transition: 0.2s; font-size: 0.95rem;
  }
  .option-label:hover { background: #e1f5fe; border-color: #039be5; }
  .option-label input[type="radio"] { display: none; }
  .option-label.selected { background: #e1f5fe; border-color: #039be5; font-weight: 700; color: #0277bd; }
  
  .submit-btn {
    display: block; width: 100%; padding: 15px; margin-top: 30px;
    background: #039be5; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer;
    transition: 0.3s;
  }
  .submit-btn:hover { background: #0277bd; }

  /* کارنامه */
  .result-container { display: none; text-align: center; }
  .student-name-display {
    font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 20px;
    background: #ecf0f1; padding: 10px 20px; border-radius: 10px; display: inline-block;
  }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 8px solid #ecf0f1;
  }
  .score-circle.excellent { border-color: #2ecc71; color: #2ecc71; }
  .score-circle.good { border-color: #f39c12; color: #f39c12; }
  .score-circle.fail { border-color: #e74c3c; color: #e74c3c; }
  .score-num { font-size: 2.8rem; font-weight: 900; line-height: 1; }
  .score-text { font-size: 0.9rem; color: #7f8c8d; margin-top: 5px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .stat-box { padding: 15px 25px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
  .stat-box.correct { color: #2ecc71; background: #e8f8f5; }
  .stat-box.wrong { color: #e74c3c; background: #fdedec; }
  
  .review-btn {
    display: inline-block; background: #3498db; color: #fff; text-decoration: none;
    padding: 12px 30px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer;
    font-size: 1rem;
  }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .header-top { flex-direction: column; gap: 10px; text-align: center; }
    .result-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- صفحه شروع -->
  <div id="start-section">
    <h1>📝 آزمون تستی درس ۱۱</h1>
    <p>تنوع آب و هوای ایران — مطالعات اجتماعی پایه هفتم<br>لطفاً نام و نام خانوادگی خود را وارد کنید تا آزمون آغاز شود.</p>
    <input type="text" id="student-name" class="name-input" placeholder="مثلاً: علی محمدی">
    <br>
    <button class="start-btn" onclick="startQuiz()">شروع آزمون</button>
  </div>

  <!-- بخش آزمون -->
  <div id="quiz-section" style="display: none;">
    <div class="header-top">
      <div class="header-title">
        <h1>📝 آزمون تستی درس ۱۱</h1>
        <p>۱۵ سوال تصادفی از بانک ۴۰ سوالی</p>
      </div>
      <div class="timer-box" id="timer-display">⏱ ۱۰:۰۰</div>
    </div>
    
    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="submit" class="submit-btn" id="submit-btn">ثبت پاسخ‌ها و مشاهده کارنامه</button>
    </form>
  </div>

  <!-- بخش کارنامه -->
  <div id="result-section" class="result-container">
    <h2 style="color:#2c3e50; margin-bottom:20px; font-weight:900;">🎓 کارنامه شما</h2>
    <div class="student-name-display" id="display-student-name">نام دانش‌آموز</div>
    
    <div id="score-circle" class="score-circle">
      <div class="score-num" id="score-display">0</div>
      <div class="score-text">از ۱۰۰</div>
    </div>
    <p id="result-message" style="font-size:1.1rem; font-weight:700; margin-bottom:25px;"></p>
    <div class="result-stats">
      <div class="stat-box correct" id="stat-correct">تعداد درست: ۰</div>
      <div class="stat-box wrong" id="stat-wrong">تعداد غلط: ۰</div>
    </div>
    <a href="haftom.html" class="review-btn" style="background:#3498db; text-decoration:none;">🔙 بازگشت به دروس</a>
  </div>

</div>
<script>
  // ==========================================
  // بانک ۴۰ سوالی درس ۱۱ (تنوع آب و هوای ایران)
  // ==========================================
  const questionBank = [
    { q: "به منطقهٔ بزرگی که در آن مجموعه‌ای از گیاهان و جانوران خاص زندگی می‌کنند، چه می‌گویند؟", options: ["زیستگاه", "اقلیم", "بیابان", "جنگل"], answer: 0 },
    { q: "یکی از مهم‌ترین عواملی که موجب گوناگونی زیستگاه‌ها در ایران شده است چیست؟", options: ["تنوع آب و هوایی", "تنوع پوشش گیاهی", "تنوع جانوری", "وسعت زیاد"], answer: 0 },
    { q: "مهم‌ترین عناصر آب و هوا چیست؟", options: ["دما و بارش", "فشار هوا و باد", "رطوبت و دما", "بارش و باد"], answer: 0 },
    { q: "میزان دمای هوای یک ناحیه را با چه نموداری و به چه رنگی نشان می‌دهند؟", options: ["نمودار خطی با رنگ قرمز", "نمودار ستونی با رنگ آبی", "نمودار دایره‌ای", "نمودار نقطه‌ای"], answer: 0 },
    { q: "میزان بارش یک ناحیه را با چه نموداری و به چه رنگی نشان می‌دهند؟", options: ["نمودار ستونی به رنگ آبی", "نمودار خطی با رنگ قرمز", "نمودار دایره‌ای", "نمودار نقطه‌ای"], answer: 0 },
    { q: "کشور ایران به چند ناحیه آب و هوایی تقسیم می‌شود؟", options: ["چهار ناحیه", "دو ناحیه", "سه ناحیه", "پنج ناحیه"], answer: 0 },
    { q: "ناحیه معتدل و مرطوب خزری در کجا واقع شده است؟", options: ["بین کوه‌های البرز و دریای خزر", "جنوب ایران", "مرکز ایران", "غرب ایران"], answer: 0 },
    { q: "مرطوب‌ترین ناحیه آب و هوایی ایران کدام است؟", options: ["ناحیه معتدل و مرطوب خزری", "ناحیه کوهستانی", "ناحیه گرم و خشک", "ناحیه سواحل جنوب"], answer: 0 },
    { q: "میزان بارندگی در ناحیه خزری از غرب به شرق چگونه است؟", options: ["کاهش می‌یابد", "افزایش می‌یابد", "تغییری نمی‌کند", "ثابت است"], answer: 0 },
    { q: "در ناحیه خزری برای کشت بیشتر محصولات کشاورزی از چه آبی استفاده می‌شود؟", options: ["آب باران (دیم)", "آب چاه", "آب رودخانه", "آب قنات"], answer: 0 },
    { q: "در ناحیه خزری، کدام محصول به آبیاری نیاز دارد؟", options: ["برنج", "گندم", "جو", "نخود"], answer: 0 },
    { q: "ناحیه معتدل و نیمه‌خشک کوهستانی چه بخش‌هایی از ایران را در برمی‌گیرد؟", options: ["کوهستان‌های مرتفع و کوهپایه‌های اطراف", "سواحل دریا", "بیابان‌های مرکزی", "جلگه‌های جنوبی"], answer: 0 },
    { q: "در ارتفاعات ناحیه کوهستانی، زمستان چگونه است؟", options: ["سرد با برف زیاد و یخبندان", "معتدل و خشک", "گرم و شرجی", "ملایم و مرطوب"], answer: 0 },
    { q: "ناحیه کوهستانی چند ماه از سال بارش دارد؟", options: ["تقریباً ۹ ماه", "تقریباً ۳ ماه", "تقریباً ۶ ماه", "تقریباً ۱۲ ماه"], answer: 0 },
    { q: "ناحیه گرم و خشک داخلی شامل کدام بخش ایران است؟", options: ["نواحی مرکزی ایران", "سواحل شمالی", "سواحل جنوبی", "غرب ایران"], answer: 0 },
    { q: "علت خشکی ناحیه گرم و خشک داخلی چیست؟", options: ["بارش کم در چند ماه از سال", "دوری از دریا", "ارتفاع زیاد", "وجود کوه‌های بلند"], answer: 0 },
    { q: "کدام بیابان در ناحیه گرم و خشک داخلی ایران قرار دارد؟", options: ["بیابان لوت", "بیابان صحرا", "بیابان گبی", "بیابان سینا"], answer: 0 },
    { q: "در ناحیه گرم و خشک داخلی، اختلاف دمای شب و روز چگونه است؟", options: ["زیاد", "کم", "متوسط", "تغییری نمی‌کند"], answer: 0 },
    { q: "پوشش گیاهی ناحیه گرم و خشک داخلی چگونه است؟", options: ["فقیر با گیاهان خشکی‌پسند", "جنگل‌های انبوه", "علفزارهای سرسبز", "درختان میوه"], answer: 0 },
    { q: "کدام گیاه در ناحیه گرم و خشک داخلی رشد می‌کند؟", options: ["تاغ و گز", "بلوط", "چنار", "کاج"], answer: 0 },
    { q: "ناحیه گرم و شرجی سواحل جنوب در کجا واقع شده است؟", options: ["کناره‌های خلیج فارس و دریای عمان", "کناره دریای خزر", "مرکز ایران", "غرب ایران"], answer: 0 },
    { q: "تابستان‌های ناحیه سواحل جنوب چگونه است؟", options: ["بسیار گرم و شرجی", "معتدل و خشک", "سرد و برفی", "بارانی و مرطوب"], answer: 0 },
    { q: "چرا ناحیه سواحل جنوب جزء نواحی خشک است؟", options: ["میزان بارندگی بسیار کم است", "دوری از دریا", "ارتفاع زیاد", "وجود کوه‌های بلند"], answer: 0 },
    { q: "علت شرجی بودن ناحیه سواحل جنوب چیست؟", options: ["رطوبت زیاد ناشی از تبخیر آب دریا", "بارش زیاد", "وجود جنگل", "ارتفاع کم"], answer: 0 },
    { q: "آیا زراعت دیم در ناحیه سواحل جنوب امکان‌پذیر است؟", options: ["خیر", "بله", "فقط در زمستان", "فقط در تابستان"], answer: 0 },
    { q: "چرا ناحیه خزری بارندگی زیادی دارد؟", options: ["به دلیل وجود دریای خزر و رشته کوه البرز", "به دلیل ارتفاع زیاد", "به دلیل نزدیکی به خط استوا", "به دلیل بیابان‌های اطراف"], answer: 0 },
    { q: "ناحیه معتدل و مرطوب خزری در کدام بخش ایران قرار دارد؟", options: ["شمال", "جنوب", "شرق", "مرکز"], answer: 0 },
    { q: "در ناحیه خزری چه نوع جنگل‌هایی وجود دارد؟", options: ["جنگل‌های انبوه", "جنگل‌های تنک", "بیابان", "علفزار"], answer: 0 },
    { q: "در ناحیه کوهستانی، کدام نوع زراعت امکان‌پذیر است؟", options: ["زراعت دیم", "زراعت آبی", "کشت برنج", "کشت پنبه"], answer: 0 },
    { q: "کدام یک از نواحی آب و هوایی ایران پوشش گیاهی فقیری دارد؟", options: ["ناحیه گرم و خشک داخلی", "ناحیه خزری", "ناحیه کوهستانی", "ناحیه سواحل جنوب"], answer: 0 },
    { q: "نمودار دما و بارش چه اطلاعاتی به ما می‌دهد؟", options: ["میزان دما و بارش در ماه‌های مختلف", "ارتفاع کوه‌ها", "وسعت ناحیه", "جمعیت ناحیه"], answer: 0 },
    { q: "کدام یک از نواحی آب و هوایی ایران در تمام ماه‌های سال بارندگی دارد؟", options: ["ناحیه معتدل و مرطوب خزری", "ناحیه گرم و خشک", "ناحیه سواحل جنوب", "ناحیه کوهستانی"], answer: 0 },
    { q: "ناحیه گرم و خشک داخلی در کدام فصل‌ها بارش دارد؟", options: ["چند ماه از سال به مقدار کم", "تمام سال", "فقط زمستان", "فقط تابستان"], answer: 0 },
    { q: "کدام یک از موارد زیر از ویژگی‌های ناحیه کوهستانی است؟", options: ["زمستان سرد با برف و یخبندان", "تابستان‌های بسیار گرم", "شرجی بودن هوا", "پوشش گیاهی فقیر"], answer: 0 },
    { q: "چرا ناحیه خزری مرطوب‌ترین ناحیه ایران است؟", options: ["به دلیل بارش زیاد در تمام ماه‌های سال", "به دلیل ارتفاع زیاد", "به دلیل دوری از دریا", "به دلیل بیابان اطراف"], answer: 0 },
    { q: "بیابان لوت در کدام ناحیه آب و هوایی ایران قرار دارد؟", options: ["ناحیه گرم و خشک داخلی", "ناحیه خزری", "ناحیه کوهستانی", "ناحیه سواحل جنوب"], answer: 0 },
    { q: "چرا در ناحیه خزری، استفاده از آب باران برای کشاورزی رایج است؟", options: ["به دلیل بارش کافی در طول سال", "به دلیل کمبود آب", "به دلیل شوری آب", "به دلیل نبود رودخانه"], answer: 0 },
    { q: "زراعت دیم در کدام ناحیه امکان‌پذیر نیست؟", options: ["ناحیه سواحل جنوب", "ناحیه کوهستانی", "ناحیه خزری", "ناحیه معتدل"], answer: 0 },
    { q: "کدام ناحیه آب و هوایی در ایران، اختلاف دمای شب و روز زیادی دارد؟", options: ["ناحیه گرم و خشک داخلی", "ناحیه خزری", "ناحیه سواحل جنوب", "ناحیه معتدل"], answer: 0 },
    { q: "کدام یک از عناصر آب و هوا را می‌توان با نمودار خطی نشان داد؟", options: ["دما", "بارش", "رطوبت", "فشار هوا"], answer: 0 }
  ];

  const numQuestionsToShow = 15; 
  const totalTime = 600; // ۱۰ دقیقه
  
  let selectedQuestions = [];
  let timerInterval;
  let timeLeft = totalTime;
  let studentName = "";

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    if (studentName === "") {
      alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      return;
    }
    
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    
    initQuiz();
  }

  function initQuiz() {
    const shuffledBank = shuffle([...questionBank]);
    selectedQuestions = shuffledBank.slice(0, numQuestionsToShow);

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((item, index) => {
      const correctAnswerText = item.options[item.answer];
      const shuffledOptions = shuffle([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
      
      selectedQuestions[index].options = shuffledOptions;
      selectedQuestions[index].answer = newCorrectIndex;

      let optionsHTML = '';
      shuffledOptions.forEach((opt, i) => {
        optionsHTML += `
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="q${index}" value="${i}">
            <span>${opt}</span>
          </label>
        `;
      });

      const qBox = document.createElement('div');
      qBox.className = 'question-box';
      qBox.innerHTML = `
        <div class="q-title">${index + 1}. ${item.q}</div>
        <div class="options">${optionsHTML}</div>
      `;
      container.appendChild(qBox);
    });

    startTimer();
  }

  function startTimer() {
    const display = document.getElementById('timer-display');
    
    timerInterval = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      
      display.innerHTML = `⏱ ${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

      if (timeLeft <= 60) {
        display.classList.add('warning');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        display.innerHTML = `⏱ ۰۰:۰۰`;
        document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
      }
    }, 1000);
  }

  function selectOption(label) {
    // 🔊 صدای کلیک روی گزینه
    if (typeof playClick === "function") playClick();

    const name = label.querySelector('input').name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.parentElement.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;

    selectedQuestions.forEach((item, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (!selected) {
        wrongCount++; 
      } else if (parseInt(selected.value) === item.answer) {
        correctCount++;
      } else {
        wrongCount++;
      }
    });

    const score = Math.round((correctCount / selectedQuestions.length) * 100);

    // ==========================================
    // 🎉 افکت صوتی و باران کاغذرنگی پایان آزمون
    // ==========================================
    setTimeout(() => {
      if (score >= 80) {
        // نمره عالی: صدای پایان + کانفتی
        if (typeof playFinish === "function") playFinish();
        if (typeof confetti === "function") {
          confetti({ particleCount: 180, spread: 90, origin: { y: 0.6 } });
          setTimeout(() => confetti({ particleCount: 120, angle: 60, spread: 70, origin: { x: 0 } }), 250);
          setTimeout(() => confetti({ particleCount: 120, angle: 120, spread: 70, origin: { x: 1 } }), 400);
        }
      } else if (score >= 50) {
        if (typeof playCorrect === "function") playCorrect();
      } else {
        if (typeof playWrong === "function") playWrong();
      }
    }, 300);
    // ==========================================

    submitScoreToTelegram(score, correctCount);

    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    document.getElementById('display-student-name').innerText = `دانش‌آموز: ${studentName}`;
    
    document.getElementById('score-display').innerText = score;
    document.getElementById('stat-correct').innerText = `تعداد درست: ${correctCount}`;
    document.getElementById('stat-wrong').innerText = `تعداد غلط: ${wrongCount}`;

    const circle = document.getElementById('score-circle');
    const msg = document.getElementById('result-message');
    
    circle.className = 'score-circle';
    if (score >= 80) {
      circle.classList.add('excellent');
      msg.innerText = "🌟 عالی بود! شما درس را به خوبی یاد گرفته‌اید.";
      msg.style.color = "#2ecc71";
    } else if (score >= 50) {
      circle.classList.add('good');
      msg.innerText = "👍 خوب بود، اما با کمی مطالعه بیشتر می‌توانید بهتر شوید.";
      msg.style.color = "#f39c12";
    } else {
      circle.classList.add('fail');
      msg.innerText = "📚 نیاز به مطالعه بیشتر دارید. ناامید نشوید و درسنامه را دوباره بخوانید.";
      msg.style.color = "#e74c3c";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
