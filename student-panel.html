<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل دانش‌آموز | مطالعات اجتماعی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
        body { 
            min-height: 100vh; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            padding: 20px; 
            color: #333; 
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        
        .container { max-width: 700px; width: 100%; margin-top: 10px; }
        
        /* کادر اطلاعیه معلم */
        .announcement-box {
            background: #fefce8; 
            border: 1px solid #fde047; 
            border-radius: 16px; 
            padding: 15px 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: none; /* به صورت پیش‌فرض مخفی است */
            border-right: 6px solid #eab308;
            animation: slideDown 0.5s ease-out;
        }
        .announcement-box h4 { color: #854d0e; margin-bottom: 8px; font-size: 1.1rem; }
        .announcement-box p { color: #713f12; font-size: 0.95rem; line-height: 1.6; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* دکمه‌های بالای صفحه */
        .top-actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-action { 
            padding: 10px 18px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-size: 0.9rem; 
            border: none; 
            cursor: pointer; 
            font-family: inherit; 
            font-weight: 700; 
            transition: 0.3s; 
            color: white; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
        .btn-logout { background: rgba(220, 53, 69, 0.9); }
        .btn-password { background: rgba(245, 158, 11, 0.9); }
        
        .btn-checkin { 
            background: linear-gradient(135deg, #10b981, #059669); 
            font-size: 1rem;
            padding: 12px 22px;
            animation: pulse-glow 2s infinite;
        }
        
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .btn-checkin.checked-in {
            background: #9ca3af;
            animation: none;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* کارت پروفایل */
        .profile-card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px; 
            padding: 30px 20px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            margin-bottom: 25px; 
            position: relative; 
            border: 1px solid rgba(255,255,255,0.4);
        }
        .avatar-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            margin: 0 auto 15px;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }
        .profile-card h2 { font-size: 1.5rem; color: #4c1d95; margin-bottom: 5px; font-weight: 900; }
        .profile-card p { color: #6b7280; font-size: 0.95rem; margin-bottom: 25px; }
        
        /* بخش آمار */
        .stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .stat-box { 
            background: white; 
            padding: 15px 10px; 
            border-radius: 16px; 
            border: 1px solid #e5e7eb; 
            flex: 1;
            min-width: 100px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .stat-box h3 { font-size: 1.8rem; color: #10b981; font-weight: 900; margin-bottom: 5px; }
        .stat-box span { font-size: 0.75rem; color: #6b7280; font-weight: 700; }
        .stat-box .emoji { font-size: 1.5rem; display: block; margin-bottom: 5px; }
        
        /* باکس امتیاز مخصوص */
        .stat-box.points-box { border-color: #fde047; background: #fefce8; }
        .stat-box.points-box h3 { color: #ca8a04; }

        /* بخش پیام انگیزشی */
        .motivation-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(243, 244, 246, 0.95));
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border-right: 6px solid #3b82f6;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .motivation-box .mot-icon { font-size: 2.5rem; }
        .motivation-box .mot-text { text-align: right; flex: 1; font-weight: 700; color: #1e3a8a; line-height: 1.6; font-size: 1rem; }
        
        .motivation-box.excellent { border-right-color: #f59e0b; background: linear-gradient(135deg, #fffbeb, #fef3c7); }
        .motivation-box.excellent .mot-text { color: #b45309; }
        
        .motivation-box.good { border-right-color: #10b981; background: linear-gradient(135deg, #ecfdf5, #d1fae5); }
        .motivation-box.good .mot-text { color: #047857; }
        
        .motivation-box.needs-work { border-right-color: #ef4444; background: linear-gradient(135deg, #fef2f2, #fee2e2); }
        .motivation-box.needs-work .mot-text { color: #b91c1c; }

        /* لیست نمرات */
        .grades-title { 
            color: #fff; 
            font-size: 1.2rem; 
            margin-bottom: 15px; 
            font-weight: 900; 
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .grades-list { display: flex; flex-direction: column; gap: 12px; }
        
        .grade-card { 
            background: white; 
            border-radius: 16px; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            transition: 0.3s; 
            border-right: 5px solid #cbd5e1;
        }
        .grade-card:hover { transform: translateX(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        
        .grade-card.score-high { border-right-color: #10b981; }
        .grade-card.score-mid { border-right-color: #f59e0b; }
        .grade-card.score-low { border-right-color: #ef4444; }

        .grade-info h4 { font-size: 1rem; color: #1f2937; margin-bottom: 5px; font-weight: 900; }
        .grade-meta { font-size: 0.8rem; color: #6b7280; display: flex; gap: 10px; align-items: center; }
        .badge { padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .badge-testi { background: #e0f2fe; color: #0284c7; }
        .badge-tashrihi { background: #fce7f3; color: #be185d; }
        
        .grade-score { 
            font-size: 1.8rem; 
            font-weight: 900; 
            padding: 8px 15px; 
            border-radius: 12px; 
            min-width: 70px;
            text-align: center;
        }
        .score-high .grade-score { background: #d1fae5; color: #047857; }
        .score-mid .grade-score { background: #fef3c7; color: #b45309; }
        .score-low .grade-score { background: #fee2e2; color: #b91c1c; }
        
        .empty-state { 
            text-align: center; 
            background: rgba(255,255,255,0.9);
            padding: 40px 20px; 
            border-radius: 20px;
            color: #4b5563; 
            font-size: 1.1rem; 
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .loading { text-align: center; color: white; font-size: 1.2rem; margin-top: 50px; font-weight: bold; }

        /* Modal تغییر رمز */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .modal-content h3 { margin-bottom: 20px; color: #1e293b; text-align: center; font-weight: 900; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #64748b; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-family: inherit; font-size: 1rem; outline: none; }
        .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
        .btn-save { flex: 1; background: #10b981; color: white; border: none; padding: 12px; border-radius: 10px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn-cancel { flex: 1; background: #e2e8f0; color: #475569; border: none; padding: 12px; border-radius: 10px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container" id="panel-content" style="display: none;">
        
        <!-- کادر اطلاعیه معلم -->
        <div class="announcement-box" id="teacher-announcement">
            <h4>📢 اطلاعیه معلم:</h4>
            <p id="announcement-text"></p>
        </div>

        <!-- دکمه‌های عملیات -->
        <div class="top-actions">
            <button class="btn-action btn-checkin" id="btn-checkin" onclick="checkIn()">📍 ثبت حاضری امروز</button>
            <button class="btn-action btn-password" onclick="openPasswordModal()">🔑 تغییر رمز</button>
            <button class="btn-action btn-logout" onclick="logout()">🚪 خروج</button>
        </div>

        <!-- کارت پروفایل -->
        <div class="profile-card">
            <div class="avatar-circle" id="student-avatar">👤</div>
            <h2 id="student-name-display">در حال بارگذاری...</h2>
            <p id="student-school-display">-</p>
            
            <div class="stats">
                <div class="stat-box">
                    <span class="emoji">🏆</span>
                    <h3 id="average-score">0</h3>
                    <span>میانگین نمرات</span>
                </div>
                <div class="stat-box">
                    <span class="emoji">📝</span>
                    <h3 id="total-exams">0</h3>
                    <span>آزمون داده شده</span>
                </div>
                <!-- باکس امتیاز -->
                <div class="stat-box points-box">
                    <span class="emoji">🎯</span>
                    <h3 id="student-points">0</h3>
                    <span>امتیاز شما</span>
                </div>
            </div>
        </div>

        <!-- پیام انگیزشی -->
        <div class="motivation-box" id="motivation-box">
            <div class="mot-icon" id="mot-icon">✨</div>
            <div class="mot-text" id="mot-text">در حال بررسی وضعیت درسی شما...</div>
        </div>

        <!-- لیست نمرات -->
        <h3 class="grades-title">📊 کارنامه من</h3>
        <div class="grades-list" id="grades-container"></div>
    </div>

    <div class="loading" id="loading-text">در حال دریافت اطلاعات...</div>

    <!-- Modal تغییر رمز -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-content">
            <h3>🔑 تغییر رمز عبور</h3>
            <div class="form-group">
                <label>رمز عبور فعلی</label>
                <input type="password" id="oldPassword" placeholder="رمز فعلی خود را وارد کنید">
            </div>
            <div class="form-group">
                <label>رمز عبور جدید</label>
                <input type="password" id="newPassword" placeholder="رمز جدید (حداقل ۶ کاراکتر)">
            </div>
            <div class="modal-actions">
                <button class="btn-save" id="savePassBtn" onclick="submitPasswordChange()">💾 ذخیره</button>
                <button class="btn-cancel" onclick="closePasswordModal()">انصراف</button>
            </div>
        </div>
    </div>

    <script src="students-data.js"></script>

    <script>
        const studentName = localStorage.getItem('student_name');
        const schoolName = localStorage.getItem('school_name');
        const studentUsername = localStorage.getItem('student_username'); // برای تغییر رمز استفاده می‌شود

        // در هنگام بارگذاری صفحه
        window.onload = () => {
            if (!studentName || !studentUsername) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('student-name-display').innerText = studentName;
                document.getElementById('student-school-display').innerText = schoolName;
                document.getElementById('student-avatar').innerText = studentName.charAt(0);
                
                fetchGrades();
                updateCheckinButton(); 
                processDailyPoints(); // سیستم امتیازدهی
                loadAnnouncement(); // لود اطلاعیه‌ها
            }
        };

        // تابع پیدا کردن پایه دانش‌آموز
        function getStudentGrade() {
            let studentGrade = "نامشخص";
            if (typeof schoolData !== 'undefined') {
                let found = false;
                for (const sKey in schoolData) {
                    const school = schoolData[sKey];
                    const isHasan = schoolName.includes("حسن بن علی") && sKey === "hasan_bin_ali";
                    const isMahdi = schoolName.includes("حضرت مهدی") && sKey === "hazrat_mahdi";
                    
                    if (isHasan || isMahdi || school.name === schoolName) {
                        for (const gNum in school.grades) {
                            if (school.grades[gNum].includes(studentName)) {
                                studentGrade = gNum;
                                found = true;
                                break;
                            }
                        }
                    }
                    if (found) break;
                }
                if (!found) { 
                    for (const sKey in schoolData) {
                        const school = schoolData[sKey];
                        for (const gNum in school.grades) {
                            if (school.grades[gNum].includes(studentName)) {
                                studentGrade = gNum;
                                found = true;
                                break;
                            }
                        }
                        if (found) break;
                    }
                }
            }
            return studentGrade;
        }

        // توابع اطلاعیه‌ها و امتیاز
        async function loadAnnouncement() {
            const grade = getStudentGrade();
            try {
                const res = await fetch('https://api.motadars.ir/get_student_announcements.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ grade: grade })
                });
                const data = await res.json();
                
                if(data.status === 'success' && data.data.length > 0) {
                    document.getElementById('announcement-text').innerText = data.data[0].message;
                    document.getElementById('teacher-announcement').style.display = 'block';
                }
            } catch(e) { console.log("خطا در لود اطلاعیه"); }
        }

        // سیستم امتیازدهی (حالا با نام دانش‌آموز)
        async function processDailyPoints() {
            const today = new Date().toLocaleDateString('fa-IR');
            const storageKey = 'last_point_date_' + studentName; 
            const lastPointDate = localStorage.getItem(storageKey);

            if (lastPointDate !== today) {
                try {
                    const res = await fetch('https://api.motadars.ir/add_points.php', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ student_name: studentName })
                    });
                    const data = await res.json();
                    
                    if(data.status === 'success') {
                        document.getElementById('student-points').innerText = data.new_points;
                        localStorage.setItem(storageKey, today);
                    } else {
                        console.log("خطا از سرور:", data.message);
                        fetchCurrentPoints();
                    }
                } catch(e) { 
                    console.log("خطای شبکه در ثبت امتیاز");
                    fetchCurrentPoints(); 
                }
            } else {
                fetchCurrentPoints();
            }
        }

        async function fetchCurrentPoints() {
            try {
                const res = await fetch('https://api.motadars.ir/get_student_points.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ student_name: studentName })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    document.getElementById('student-points').innerText = data.points || 0;
                }
            } catch(e) { console.log("خطا در دریافت امتیاز"); }
        }

        // آپدیت ظاهر دکمه حاضری
        function updateCheckinButton() {
            const btn = document.getElementById('btn-checkin');
            const today = new Date().toLocaleDateString('fa-IR'); 
            
            if (localStorage.getItem('last_checkin_date') === today) {
                btn.classList.add('checked-in');
                btn.innerHTML = '✅ حاضری امروز ثبت شد';
                btn.disabled = true;
            } else {
                btn.classList.remove('checked-in');
                btn.innerHTML = '📍 ثبت حاضری امروز';
                btn.disabled = false;
            }
        }

        async function fetchGrades() {
            try {
                const res = await fetch('https://api.motadars.ir/get_my_grades.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ student_name: studentName })
                });
                const result = await res.json();

                document.getElementById('loading-text').style.display = 'none';
                document.getElementById('panel-content').style.display = 'block';

                if (result.status === 'success') {
                    renderGrades(result.data);
                } else {
                    alert('خطا در دریافت نمرات');
                }
            } catch (e) {
                document.getElementById('loading-text').innerText = 'خطا در ارتباط با سرور';
            }
        }

        function renderGrades(grades) {
            const container = document.getElementById('grades-container');
            const motBox = document.getElementById('motivation-box');
            const motIcon = document.getElementById('mot-icon');
            const motText = document.getElementById('mot-text');
            
            if (grades.length === 0) {
                container.innerHTML = '<div class="empty-state">هنوز در هیچ آزمونی شرکت نکرده‌اید! اولین قدم را بردارید. 🚀</div>';
                motBox.className = 'motivation-box needs-work';
                motIcon.innerText = '📚';
                motText.innerText = 'برای شروع، در یکی از آزمون‌های سایت شرکت کنید!';
                return;
            }

            let totalScore = 0;
            let validExamsCount = 0;

            grades.forEach(g => {
                if (g.score > 0) { totalScore += parseInt(g.score); validExamsCount++; }

                let scoreClass = "score-low";
                if (g.score >= 17) scoreClass = "score-high";
                else if (g.score >= 10) scoreClass = "score-mid";

                let typeLabel = g.exam_type === 'tashrihi' ? '📝 تشریحی' : '✅ تستی';
                let typeBadgeClass = g.exam_type === 'tashrihi' ? 'badge-tashrihi' : 'badge-testi';

                const div = document.createElement('div');
                div.className = `grade-card ${scoreClass}`;
                div.innerHTML = `
                    <div class="grade-info">
                        <h4>${g.exam_name}</h4>
                        <div class="grade-meta">
                            <span>${g.exam_date || 'نامشخص'}</span>
                            <span class="badge ${typeBadgeClass}">${typeLabel}</span>
                        </div>
                    </div>
                    <div class="grade-score">${g.score}</div>
                `;
                container.appendChild(div);
            });

            document.getElementById('total-exams').innerText = grades.length;
            
            let average = 0;
            if (validExamsCount > 0) {
                average = (totalScore / validExamsCount).toFixed(1);
                document.getElementById('average-score').innerText = average;
            } else {
                document.getElementById('average-score').innerText = "0";
            }

            if (average >= 18) {
                motBox.className = 'motivation-box excellent';
                motIcon.innerText = '🌟';
                motText.innerText = 'عالی! تو یک ستاره درخشان هستی. با این تلاش، آینده‌ی فوق‌العاده‌ای در انتظارته!';
            } else if (average >= 15) {
                motBox.className = 'motivation-box good';
                motIcon.innerText = '👏';
                motText.innerText = 'خیلی خوب! داری عالی پیش می‌ری. فقط کمی تمرین بیشتر تا به قله برسی.';
            } else if (average >= 10) {
                motBox.className = 'motivation-box';
                motIcon.innerText = '💪';
                motText.innerText = 'قابل قبوله! اما تو می‌تونی بهتر از این باشی. یه کم بیشتر تلاش کن!';
            } else {
                motBox.className = 'motivation-box needs-work';
                motIcon.innerText = '🤝';
                motText.innerText = 'نگران نباش! هر تلاشی یک قدم به موفقیت نزدیک‌تره. با معلمت صحبت کن و از نو شروع کن.';
            }
        }

        // تابع ثبت حاضری
        async function checkIn() {
            const today = new Date().toLocaleDateString('fa-IR');
            const btn = document.getElementById('btn-checkin');

            if (localStorage.getItem('last_checkin_date') === today) {
                alert('⚠️ شما امروز حاضری خود را ثبت کرده‌اید. هر روز فقط یک بار می‌توانید حاضری بزنید.');
                return;
            }

            const studentGrade = getStudentGrade();
            const actualSchoolName = (schoolName.includes("حسن")) ? "حسن بن علی (نوشهرکلنگی)" : "حضرت مهدی (سرزه)";

            if (studentGrade === "نامشخص") {
                alert("خطا: نام شما در لیست کلاس پیدا نشد. لطفاً با معلم خود تماس بگیرید.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'در حال ثبت... ⏳';

            try {
                const res = await fetch('https://api.motadars.ir/save_attendance.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        student_name: studentName,
                        school_name: actualSchoolName, 
                        grade: studentGrade,
                        status: 'present'
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    const now = new Date();
                    const timeString = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
                    
                    localStorage.setItem('last_checkin_date', today);
                    updateCheckinButton();
                    
                    alert(`✅ حاضری شما در ساعت ${timeString} با موفقیت ثبت شد.`);
                } else {
                    alert("❌ خطا: " + data.message);
                    btn.disabled = false;
                    btn.innerHTML = '📍 ثبت حاضری امروز';
                }
            } catch (e) {
                alert("❌ خطا در ارتباط با سرور.");
                btn.disabled = false;
                btn.innerHTML = '📍 ثبت حاضری امروز';
            }
        }

        function openPasswordModal() {
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('passwordModal').style.display = 'flex';
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        async function submitPasswordChange() {
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const btn = document.getElementById('savePassBtn');

            if(!oldPass || !newPass) return alert('لطفاً هر دو فیلد را پر کنید.');
            if(newPass.length < 6) return alert('رمز جدید باید حداقل ۶ کاراکتر باشد.');

            btn.disabled = true;
            btn.innerText = 'در حال ذخیره... ⏳';

            try {
                const res = await fetch('https://api.motadars.ir/change_password.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    // اینجا از نام کاربری استفاده می‌شود (چون سیستم تغییر رمز شما احتمالا بر اساس یوزرنیم است)
                    body: JSON.stringify({ username: studentUsername, old_password: oldPass, new_password: newPass })
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    alert('✅ رمز عبور شما با موفقیت تغییر یافت.');
                    closePasswordModal();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (e) {
                alert('❌ خطا در ارتباط با سرور.');
            } finally {
                btn.disabled = false;
                btn.innerText = '💾 ذخیره';
            }
        }

        function logout() {
            localStorage.removeItem('student_name');
            localStorage.removeItem('school_name');
            localStorage.removeItem('student_username');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
