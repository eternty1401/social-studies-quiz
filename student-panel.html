<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل دانش‌آموز | مطالعات اجتماعی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; color: #333; }
        
        .container { max-width: 800px; margin: 0 auto; }
        
        /* کارت پروفایل */
        .profile-card { 
            background: rgba(255,255,255,0.95); 
            border-radius: 20px; 
            padding: 80px 20px 30px 20px; /* 👈 تغییر: پدینگ بالا زیاد شد تا دکمه‌ها روی اسم نیفتند */
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            margin-bottom: 20px; 
            position: relative; 
        }
        .profile-card h2 { font-size: 1.6rem; color: #764ba2; margin-bottom: 10px; }
        .profile-card p { color: #666; margin-bottom: 15px; font-size: 1.1rem; }
        
        .stats { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .stat-box { background: #f8f9fa; padding: 15px 25px; border-radius: 15px; border: 1px solid #e9ecef; min-width: 120px; }
        .stat-box h3 { font-size: 1.8rem; color: #28a745; }
        .stat-box span { font-size: 0.9rem; color: #666; }
        
        .header-buttons { 
            position: absolute; 
            top: 20px; 
            right: 20px; /* 👈 تغییر: دکمه‌ها به سمت راست (شروع در RTL) منتقل شدند */
            display: flex; 
            gap: 10px; 
        }
        .btn-action { padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 14px; border: none; cursor: pointer; font-family: inherit; font-weight: bold; transition: 0.3s; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-logout { background: #dc3545; }
        .btn-logout:hover { background: #c82333; }
        .btn-password { background: #f59e0b; }
        .btn-password:hover { background: #d97706; }

        /* لیست نمرات */
        .grades-title { color: #fff; font-size: 1.2rem; margin-bottom: 15px; font-weight: bold; }
        .grades-list { display: flex; flex-direction: column; gap: 15px; }
        .grade-item { background: white; border-radius: 15px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s; }
        .grade-item:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        
        .grade-info h4 { font-size: 1.1rem; color: #333; margin-bottom: 5px; }
        .grade-info span { font-size: 0.9rem; color: #888; }
        
        .grade-score { font-size: 1.5rem; font-weight: bold; color: #007bff; background: #e3f2fd; padding: 10px 20px; border-radius: 10px; }
        
        .empty-state { text-align: center; color: white; padding: 50px; font-size: 1.2rem; }
        .loading { text-align: center; color: white; font-size: 1.2rem; margin-top: 50px; }

        /* Modal تغییر رمز */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .modal-content h3 { margin-bottom: 15px; color: #1e293b; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #64748b; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 1rem; outline: none; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { flex: 1; background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn-cancel { flex: 1; background: #e2e8f0; color: #475569; border: none; padding: 12px; border-radius: 8px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; }

        /* ریسپانسیو برای موبایل */
        @media(max-width: 600px) {
            .header-buttons { width: 100%; right: 0; padding: 0 20px; justify-content: space-between; }
            .profile-card { padding-top: 70px; }
        }
    </style>
</head>
<body>

    <div class="container" id="panel-content" style="display: none;">
        
        <!-- کارت پروفایل -->
        <div class="profile-card">
            <div class="header-buttons">
                <button class="btn-action btn-password" onclick="openPasswordModal()">🔑 تغییر رمز</button>
                <button class="btn-action btn-logout" onclick="logout()">🚪 خروج</button>
            </div>
            
            <h2 id="student-name-display">در حال بارگذاری...</h2>
            <p id="student-school-display">-</p>
            
            <div class="stats">
                <div class="stat-box">
                    <h3 id="total-exams">0</h3>
                    <span>آزمون داده شده</span>
                </div>
                <div class="stat-box">
                    <h3 id="average-score">0</h3>
                    <span>میانگین نمرات</span>
                </div>
            </div>
        </div>

        <!-- لیست نمرات -->
        <h3 class="grades-title">📊 کارنامه من</h3>
        <div class="grades-list" id="grades-container">
            <!-- نمرات به صورت خودکار اینجا قرار می‌گیرند -->
        </div>
    </div>

    <div class="loading" id="loading-text">در حال دریافت اطلاعات...</div>

    <!-- Modal تغییر رمز -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-content">
            <h3>🔑 تغییر رمز عبور</h3>
            <div class="form-group">
                <label>رمز عبور فعلی</label>
                <input type="password" id="oldPassword" placeholder="رمز فعلی خود را وارد کنید">
            </div>
            <div class="form-group">
                <label>رمز عبور جدید</label>
                <input type="password" id="newPassword" placeholder="رمز جدید (حداقل ۶ کاراکتر)">
            </div>
            <div class="modal-actions">
                <button class="btn-save" id="savePassBtn" onclick="submitPasswordChange()">💾 ذخیره</button>
                <button class="btn-cancel" onclick="closePasswordModal()">انصراف</button>
            </div>
        </div>
    </div>

    <script>
        const studentName = localStorage.getItem('student_name');
        const schoolName = localStorage.getItem('school_name');
        const studentUsername = localStorage.getItem('student_username'); // نام کاربری

        if (!studentName || !studentUsername) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('student-name-display').innerText = studentName;
            document.getElementById('student-school-display').innerText = schoolName;
            fetchGrades();
        }

        async function fetchGrades() {
            try {
                const res = await fetch('https://api.motadars.ir/get_my_grades.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ student_name: studentName })
                });
                const result = await res.json();

                document.getElementById('loading-text').style.display = 'none';
                document.getElementById('panel-content').style.display = 'block';

                if (result.status === 'success') {
                    renderGrades(result.data);
                } else {
                    alert('خطا در دریافت نمرات');
                }
            } catch (e) {
                document.getElementById('loading-text').innerText = 'خطا در ارتباط با سرور';
            }
        }

        function renderGrades(grades) {
            const container = document.getElementById('grades-container');
            
            if (grades.length === 0) {
                container.innerHTML = '<div class="empty-state">هنوز در هیچ آزمونی شرکت نکرده‌اید!</div>';
                return;
            }

            let totalScore = 0;
            let validExamsCount = 0;

            grades.forEach(g => {
                if (g.score > 0) {
                    totalScore += parseInt(g.score);
                    validExamsCount++;
                }

                const div = document.createElement('div');
                div.className = 'grade-item';
                
                let typeLabel = g.exam_type === 'tashrihi' ? '📝 تشریحی' : '✅ تستی';
                
                div.innerHTML = `
                    <div class="grade-info">
                        <h4>${g.exam_name}</h4>
                        <span>تاریخ: ${g.exam_date} | نوع: ${typeLabel}</span>
                    </div>
                    <div class="grade-score">${g.score}</div>
                `;
                container.appendChild(div);
            });

            document.getElementById('total-exams').innerText = grades.length;
            if (validExamsCount > 0) {
                const average = (totalScore / validExamsCount).toFixed(1);
                document.getElementById('average-score').innerText = average;
            }
        }

        // توابع مربوط به تغییر رمز
        function openPasswordModal() {
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('passwordModal').style.display = 'flex';
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        async function submitPasswordChange() {
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const btn = document.getElementById('savePassBtn');

            if(!oldPass || !newPass) return alert('لطفاً هر دو فیلد را پر کنید.');
            if(newPass.length < 6) return alert('رمز جدید باید حداقل ۶ کاراکتر باشد.');

            btn.disabled = true;
            btn.innerText = 'در حال ذخیره... ⏳';

            try {
                const res = await fetch('https://api.motadars.ir/change_password.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        username: studentUsername, 
                        old_password: oldPass, 
                        new_password: newPass 
                    })
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    alert('✅ رمز عبور شما با موفقیت تغییر یافت.');
                    closePasswordModal();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (e) {
                alert('❌ خطا در ارتباط با سرور.');
            } finally {
                btn.disabled = false;
                btn.innerText = '💾 ذخیره';
            }
        }

        function logout() {
            localStorage.removeItem('student_name');
            localStorage.removeItem('school_name');
            localStorage.removeItem('student_username');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
