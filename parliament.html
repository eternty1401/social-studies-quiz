<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پارلمان دانش‌آموزی - حل مسائل جامعه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); /* تم رسمی و جدی */
    min-height: 100vh; color: #fff; padding: 30px 20px;
    display: flex; flex-direction: column; align-items: center;
  }

  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 10px; color: #f1c40f; }
  .header p { color: rgba(255,255,255,0.8); font-size: 0.95rem; line-height: 1.6; }

  /* صفحه شروع و انتخاب موضوع */
  #start-section { width: 100%; max-width: 600px; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
  .topics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
  .topic-card {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    padding: 15px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s;
  }
  .topic-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.2); border-color: #f1c40f; }
  .topic-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
  .topic-name { font-size: 1rem; font-weight: 900; }

  /* صفحه چت (مجلس) */
  #chat-section { display: none; width: 100%; max-width: 600px; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
  .chat-header { background: #1a252f; color: #f1c40f; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; border-bottom: 3px solid #f1c40f; }
  
  .chat-messages { height: 450px; overflow-y: auto; padding: 20px; background: #f4f6f9; display: flex; flex-direction: column; gap: 15px; color: #333; }
  .msg { padding: 12px 16px; border-radius: 15px; max-width: 85%; line-height: 1.7; font-size: 0.95rem; }
  .msg.user { background: #e0f7fa; color: #006064; align-self: flex-start; border-bottom-right-radius: 2px; }
  .msg.bot { background: #fff; color: #333; align-self: flex-end; border: 1px solid #ddd; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  .msg.bot strong { color: #2c3e50; }

  .chat-input-area { display: flex; padding: 15px; background: #fff; border-top: 1px solid #eee; }
  .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 10px; outline: none; font-family: inherit; font-size: 0.95rem; }
  .chat-input-area button { background: #f1c40f; color: #1a252f; border: none; border-radius: 10px; padding: 0 20px; margin-right: 10px; cursor: pointer; font-weight: 900; font-size: 1rem; transition: 0.3s; }
  .chat-input-area button:hover { background: #d4ac0d; }
  
  .exit-btn { background: transparent; border: 1px solid #f1c40f; color: #f1c40f; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 0.8rem; }
  
  @media(max-width: 600px) {
    .topics-grid { grid-template-columns: 1fr; }
    .chat-messages { height: 400px; }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>🏛️ پارلمان دانش‌آموزی</h1>
    <p>شما یک نماینده هستید! برای حل مشکلات جامعه طرح پیشنهاد دهید.</p>
  </div>

  <!-- صفحه انتخاب موضوع -->
  <div id="start-section">
    <h3 style="text-align:center; margin-bottom: 15px; color:#f1c40f;">یک چالش را برای بررسی انتخاب کنید:</h3>
    <div class="topics-grid">
      <div class="topic-card" onclick="startParliament('بحران کم‌آبی و خشکسالی')">
        <span class="topic-icon">🌊</span>
        <div class="topic-name">بحران کم‌آبی</div>
      </div>
      <div class="topic-card" onclick="startParliament('آلودگی هوا در کلان‌شهرها')">
        <span class="topic-icon">🏭</span>
        <div class="topic-name">آلودگی هوا</div>
      </div>
      <div class="topic-card" onclick="startParliament('ترافیک و حمل‌ونقل عمومی')">
        <span class="topic-icon">🚗</span>
        <div class="topic-name">ترافیک شهری</div>
      </div>
      <div class="topic-card" onclick="startParliament('مدیریت پسماند و زباله‌ها')">
        <span class="topic-icon">🗑️</span>
        <div class="topic-name">مدیریت زباله</div>
      </div>
    </div>
  </div>

  <!-- صفحه چت پارلمان -->
  <div id="chat-section">
    <div class="chat-header">
      <span>👨‍⚖️ رئیس مجلس</span>
      <button class="exit-btn" onclick="exitParliament()">خروج</button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <!-- پیام‌ها اینجا قرار می‌گیرند -->
    </div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="طرح پیشنهادی خود را بنویسید..." onkeypress="handleEnter(event)">
      <button onclick="sendMessage()">ارسال</button>
    </div>
  </div>

  <script>
    const GROQ_API_KEY = "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";
    let currentTopic = "";
    let chatHistory = [];

    function startParliament(topic) {
      currentTopic = topic;
      chatHistory = [];
      
      document.getElementById('start-section').style.display = 'none';
      document.getElementById('chat-section').style.display = 'block';
      document.getElementById('chat-messages').innerHTML = '';
      
      let welcomeMsg = `همکار گرامی، خوش آمدید. امروز برای حل معضل **${topic}** جلسه داریم. لطفاً طرح پیشنهادی خود را برای حل این مشکل ارائه دهید.`;
      addMessageToUI(welcomeMsg, 'bot');
      chatHistory.push({ role: "assistant", content: welcomeMsg });
    }

    function exitParliament() {
      document.getElementById('chat-section').style.display = 'none';
      document.getElementById('start-section').style.display = 'block';
      chatHistory = [];
    }

    function handleEnter(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function addMessageToUI(text, sender) {
      const messagesDiv = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      
      // پشتیبانی از بولد کردن متن
      let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      msgDiv.innerHTML = formattedText;
      
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      addMessageToUI(text, 'user');
      input.value = '';
      chatHistory.push({ role: "user", content: text });

      const loadingId = 'loading-' + Date.now();
      const messagesDiv = document.getElementById('chat-messages');
      const loader = document.createElement('div');
      loader.className = 'msg bot';
      loader.id = loadingId;
      loader.innerText = 'رئیس مجلس در حال بررسی طرح شماست... ⏳';
      messagesDiv.appendChild(loader);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const systemPrompt = `شما "رئیس مجلس شورای دانش‌آموزی" هستید. دانش‌آموز به عنوان یک نماینده در حال ارائه طرح برای حل مشکل "${currentTopic}" است. 
        شما باید نقش یک مقام رسمی، جدی اما دلسوز را بازی کنید. 
        وظیفه شما این است که به طرح دانش‌آموز گوش دهید، نقاط قوت آن را تایید کنید، اما نقاط ضعف یا پیامدهای منفی آن را با احترام به او گوشزد کنید (مثلاً هزینه‌ها، بیکاری، یا مشکلات اجرایی). 
        سپس از او بخواهید تا نقص طرح را برطرف کند یا به سوال شما پاسخ دهد.
        لحن شما باید رسمی، محترمانه و با کلماتی مثل "همکار گرامی"، "نماینده محترم" باشد. پاسخ‌ها کوتاه و در حد ۲ تا ۳ پاراگراف باشد.`;

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${GROQ_API_KEY}` },
          body: new Blob([JSON.stringify({
            model: "openai/gpt-oss-120b",
            messages: [
              { role: "system", content: systemPrompt },
              ...chatHistory
            ]
          })], { type: 'application/json' })
        });

        const data = await response.json();
        document.getElementById(loadingId).remove();
        
        if (data.error) throw new Error(data.error.message);

        const botReply = data.choices[0].message.content;
        addMessageToUI(botReply, 'bot');
        chatHistory.push({ role: "assistant", content: botReply });

      } catch (error) {
        document.getElementById(loadingId).remove();
        addMessageToUI("❌ خطا در ارتباط با مجلس. لطفاً فیلترشکن خود را روشن کنید.", 'bot');
      }
    }
  </script>
</body>
</html>
