<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی گنج‌یاب ایران | مطالعات اجتماعی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 2rem; color: #fbbf24; margin-bottom: 10px; text-shadow: 0 0 15px rgba(251,191,36,0.3); }
        .header p { color: #94a3b8; font-size: 0.95rem; }

        .game-container { max-width: 600px; width: 100%; position: relative; }
        
        /* امتیاز و سوال */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 15px 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .score { background: #10b981; color: white; padding: 5px 15px; border-radius: 20px; font-weight: 900; font-size: 1.1rem; }
        .question { font-size: 1.1rem; font-weight: 700; color: #fbbf24; text-align: center; flex: 1; padding: 0 10px; }

        /* نقشه تعاملی */
        .map-wrapper {
            background: #1e293b; border: 2px solid #475569; border-radius: 20px;
            padding: 20px; position: relative; aspect-ratio: 1 / 1;
            display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .map-zone {
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.3s;
            border: 1px dashed rgba(255,255,255,0.2); color: #94a3b8; text-align: center; padding: 10px;
        }
        .map-zone:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: #38bdf8; transform: scale(1.02); }
        
        /* موقعیت‌های جغرافیایی در گرید */
        .zone-nw { grid-column: 1; grid-row: 1; }
        .zone-n  { grid-column: 2; grid-row: 1; background: rgba(56, 189, 248, 0.1); }
        .zone-ne { grid-column: 3; grid-row: 1; }
        .zone-w  { grid-column: 1; grid-row: 2; background: rgba(168, 85, 247, 0.1); }
        .zone-c  { grid-column: 2; grid-row: 2; background: rgba(251, 191, 36, 0.1); }
        .zone-e  { grid-column: 3; grid-row: 2; background: rgba(245, 158, 11, 0.1); }
        .zone-sw { grid-column: 1; grid-row: 3; }
        .zone-s  { grid-column: 2; grid-row: 3; background: rgba(56, 189, 248, 0.1); }
        .zone-se { grid-column: 3; grid-row: 3; }

        /* پس‌زمینه نقشه */
        .map-bg-shape {
            position: absolute; top: 10%; left: 10%; width: 80%; height: 80%;
            background: rgba(255,255,255,0.03); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            pointer-events: none; z-index: 0;
        }

        /* پیام‌ها */
        .feedback {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); padding: 20px 30px; border-radius: 15px;
            font-size: 1.2rem; font-weight: bold; text-align: center; display: none; z-index: 10;
            border: 2px solid; min-width: 250px;
        }
        .feedback.correct { color: #10b981; border-color: #10b981; }
        .feedback.wrong { color: #ef4444; border-color: #ef4444; }

        /* دکمه شروع مجدد */
        .restart-btn {
            display: none; width: 100%; padding: 15px; margin-top: 20px;
            background: #fbbf24; color: #0f172a; border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer; transition: 0.3s;
        }
        .restart-btn:hover { background: #fff; transform: translateY(-2px); }

        /* صفحه شروع */
        .start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(5px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; border-radius: 20px; text-align: center; padding: 20px;
        }
        .start-screen h2 { color: #fbbf24; margin-bottom: 15px; }
        .start-screen p { color: #cbd5e1; margin-bottom: 25px; line-height: 1.8; font-size: 0.95rem; }
        .start-btn {
            background: #10b981; color: white; border: none; padding: 15px 40px;
            border-radius: 50px; font-size: 1.2rem; font-weight: 900; font-family: inherit;
            cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(16,185,129,0.4);
        }
        .start-btn:hover { background: #059669; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🗺️ گنج‌یاب ایران</h1>
        <p>مکان‌های جغرافیایی را روی نقشه پیدا کن!</p>
    </div>

    <div class="game-container">
        
        <!-- نوار بالا (امتیاز و سوال) -->
        <div class="top-bar">
            <div class="score" id="scoreDisplay">۰</div>
            <div class="question" id="questionText">در حال آماده‌سازی...</div>
        </div>

        <!-- نقشه -->
        <div class="map-wrapper" id="mapWrapper">
            <div class="map-bg-shape"></div>
            
            <!-- مناطق تعاملی -->
            <div class="map-zone zone-nw" onclick="checkAnswer('nw')">شمال‌غرب</div>
            <div class="map-zone zone-n" onclick="checkAnswer('n')">شمال</div>
            <div class="map-zone zone-ne" onclick="checkAnswer('ne')">شمال‌شرق</div>
            
            <div class="map-zone zone-w" onclick="checkAnswer('w')">غرب</div>
            <div class="map-zone zone-c" onclick="checkAnswer('c')">مرکز</div>
            <div class="map-zone zone-e" onclick="checkAnswer('e')">شرق</div>
            
            <div class="map-zone zone-sw" onclick="checkAnswer('sw')">جنوب‌غرب</div>
            <div class="map-zone zone-s" onclick="checkAnswer('s')">جنوب</div>
            <div class="map-zone zone-se" onclick="checkAnswer('se')">جنوب‌شرق</div>

            <!-- پیام درست/غلط -->
            <div class="feedback" id="feedback"></div>
        </div>

        <button class="restart-btn" id="restartBtn" onclick="startGame()">🔄 بازی مجدد</button>

        <!-- صفحه شروع -->
        <div class="start-screen" id="startScreen">
            <h2>آماده‌ای برای ماجراجویی؟</h2>
            <p>من نام یک مکان جغرافیایی را می‌گویم، تو باید روی منطقه درست روی نقشه کلیک کنی.<br>هر جواب درست ۱۰ امتیاز دارد!</p>
            <button class="start-btn" onclick="startGame()">شروع بازی</button>
        </div>

    </div>

    <script>
        const questions = [
            { text: "دریای خزر در کدام جهت ایران قرار دارد؟", answer: "n", explanation: "دریای خزر در شمال ایران قرار دارد." },
            { text: "خلیج فارس در کدام جهت ایران قرار دارد؟", answer: "s", explanation: "خلیج فارس در جنوب ایران است." },
            { text: "رشته کوه زاگرس در کدام بخش ایران است؟", answer: "w", explanation: "رشته کوه زاگرس در غرب ایران قرار دارد." },
            { text: "رشته کوه البرز در کدام بخش است؟", answer: "n", explanation: "البرز در شمال ایران قرار دارد." },
            { text: "کویر لوت در کدام بخش ایران قرار دارد؟", answer: "e", explanation: "کویر لوت در شرق و جنوب شرقی ایران است." },
            { text: "شهر تهران (پایتخت) در کدام بخش است؟", answer: "c", explanation: "تهران در شمال/مرکز ایران قرار دارد." },
            { text: "دریای عمان در کدام جهت ایران است؟", answer: "se", explanation: "دریای عمان در جنوب شرقی ایران قرار دارد." },
            { text: "جنگل‌های ارسباران در کدام بخش است؟", answer: "nw", explanation: "ارسباران در شمال غربی ایران (آذربایجان) است." }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];

        // شروع بازی
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('restartBtn').style.display = 'none';
            document.getElementById('mapWrapper').style.opacity = '1';
            document.getElementById('mapWrapper').style.pointerEvents = 'auto';
            
            score = 0;
            currentQuestionIndex = 0;
            updateScore();
            
            // درهم ریختن سوالات
            shuffledQuestions = questions.sort(() => Math.random() - 0.5);
            
            showNextQuestion();
        }

        function showNextQuestion() {
            if (currentQuestionIndex >= shuffledQuestions.length) {
                endGame();
                return;
            }

            const q = shuffledQuestions[currentQuestionIndex];
            document.getElementById('questionText').innerText = q.text;
            document.getElementById('feedback').style.display = 'none';
        }

        function checkAnswer(zoneId) {
            const q = shuffledQuestions[currentQuestionIndex];
            const feedback = document.getElementById('feedback');

            if (zoneId === q.answer) {
                // جواب درست
                score += 10;
                updateScore();
                feedback.className = 'feedback correct';
                feedback.innerHTML = `✅ عالی بود!<br><span style="font-size:0.9rem; font-weight:normal; color:#cbd5e1;">${q.explanation}</span>`;
                feedback.style.display = 'block';
                
                // رفتن به سوال بعدی بعد از ۱.۵ ثانیه
                setTimeout(() => {
                    feedback.style.display = 'none';
                    currentQuestionIndex++;
                    showNextQuestion();
                }, 1500);

            } else {
                // جواب غلط
                feedback.className = 'feedback wrong';
                feedback.innerHTML = `❌ اشتباه بود!<br><span style="font-size:0.9rem; font-weight:normal; color:#cbd5e1;">مکان درست: ${getZoneName(q.answer)}</span>`;
                feedback.style.display = 'block';

                setTimeout(() => {
                    feedback.style.display = 'none';
                    currentQuestionIndex++;
                    showNextQuestion();
                }, 2000);
            }
        }

        function updateScore() {
            document.getElementById('scoreDisplay').innerText = score;
        }

        function getZoneName(id) {
            const names = {
                'nw': 'شمال‌غرب', 'n': 'شمال', 'ne': 'شمال‌شرق',
                'w': 'غرب', 'c': 'مرکز', 'e': 'شرق',
                'sw': 'جنوب‌غرب', 's': 'جنوب', 'se': 'جنوب‌شرق'
            };
            return names[id] || '';
        }

        function endGame() {
            document.getElementById('mapWrapper').style.opacity = '0.3';
            document.getElementById('mapWrapper').style.pointerEvents = 'none';
            document.getElementById('questionText').innerText = `بازی تمام شد! امتیاز شما: ${score} از ${shuffledQuestions.length * 10}`;
            document.getElementById('restartBtn').style.display = 'block';
        }
    </script>
</body>
</html>
