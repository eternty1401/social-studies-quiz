<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون تشریحی درس ۲: من مسئول هستم</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: #f4f7f6; padding: 20px; direction: rtl; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #1e3c72; text-align: center; margin-bottom: 25px; font-weight: 900; }
        
        .question-box { background: #e0f2fe; padding: 20px; border-radius: 15px; margin-bottom: 25px; border-right: 6px solid #0284c7; }
        .question-box p { margin: 0; font-weight: 700; color: #0f172a; line-height: 1.8; font-size: 1.1rem; }
        
        textarea { width: 100%; height: 180px; padding: 15px; border: 2px solid #cbd5e1; border-radius: 12px; font-family: inherit; font-size: 1rem; resize: vertical; outline: none; transition: 0.3s; }
        textarea:focus { border-color: #0284c7; }
        
        .btn { width: 100%; padding: 15px; background: #0284c7; color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; font-family: inherit; }
        .btn:hover { background: #0369a1; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        
        .result-box { display: none; margin-top: 25px; padding: 25px; border-radius: 15px; background: #f0fdf4; border: 2px solid #22c55e; line-height: 1.9; color: #166534; }
        .result-box h3 { color: #15803d; margin-top: 0; font-weight: 900; }
        
        .loading { display: none; text-align: center; color: #0284c7; font-weight: bold; margin-top: 20px; font-size: 1.1rem; }
        
        .score-highlight { font-size: 1.3rem; font-weight: 900; color: #15803d; background: #dcfce7; padding: 10px; border-radius: 10px; text-align: center; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📝 آزمون تشریحی درس ۲</h2>
        
        <!-- سوال از قبل آماده است و آنی نمایش داده می‌شود -->
        <div class="question-box">
            <p id="questionText">بر اساس متن درس، ما در برابر چه کسانی مسئول هستیم؟ (سه مورد را نام ببرید و برای یکی توضیح دهید.)</p>
        </div>

        <textarea id="studentAnswer" placeholder="پاسخ خود را بر اساس کتاب درسی اینجا بنویسید..."></textarea>
        
        <button class="btn" id="submitBtn" onclick="submitAnswer()">ارسال پاسخ برای تصحیح هوشمند</button>
        
        <div class="loading" id="loadingText">هوش مصنوعی در حال تصحیح پاسخ شماست... ⏳</div>

        <div class="result-box" id="resultBox">
            <div class="score-highlight" id="scoreDisplay"></div>
            <h3>📊 نظر معلم هوشمند:</h3>
            <div id="aiFeedback"></div>
        </div>
    </div>

    <!-- بارگذاری فایل اصلی ارسال نمره -->
    <script src="telegram.js"></script>

    <script>
        async function submitAnswer() {
            const answer = document.getElementById('studentAnswer').value.trim();
            const question = document.getElementById('questionText').innerText;
            
            if (!answer) return alert('لطفاً پاسخ خود را بنویسید.');

            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loadingText').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';

            // 👇 پرامپت بسیار سبک برای تصحیح سریع
            const systemPrompt = `
                شما یک معلم مطالعات اجتماعی پایه هفتم هستید.
                سوال از دانش‌آموز این بوده: "${question}"
                
                نکات کلیدی که دانش‌آموز باید در پاسخ خود بیاورد (طبق کتاب):
                ۱. مسئول بودن در برابر خداوند (شکرگزاری از نعمت‌ها).
                ۲. مسئول بودن در برابر خود (مراقبت از بدن و استعدادها).
                ۳. مسئول بودن در برابر دیگران (خانواده، معلم، همکلاسی، جامعه).
                ۴. مسئول بودن در برابر محیط زیست و طبیعت.

                پاسخ دانش‌آموز را با ارفاق تصحیح کن. اگر مفهوم کلی را رسانده باشد نمره کامل بده.
                در ابتدا یک بازخورد تشویقی کوتاه (حداکثر ۲ خط) بنویس.
                سپس در خط آخر دقیقاً به این شکل نمره را بنویس: [نمره: (عدد از ۲۰)]
            `;

            try {
                const response = await fetch("https://ai.motadars.ir", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: "پاسخ دانش‌آموز: " + answer }
                        ] 
                    })
                });
                const data = await response.json();
                
                let aiText = data.choices[0].message.content;
                
                // 👇 استخراج نمره از متن هوش مصنوعی
                const scoreMatch = aiText.match(/\[نمره:\s*([۰-۹0-9]+)\]/);
                let finalScore = 0;
                
                if (scoreMatch) {
                    // تبدیل اعداد فارسی به انگلیسی
                    const persianNumbers = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
                    let scoreStr = scoreMatch[1];
                    for (let i = 0; i < 10; i++) {
                        scoreStr = scoreStr.replace(persianNumbers[i], i);
                    }
                    finalScore = parseInt(scoreStr);
                    aiText = aiText.replace(/\[نمره:.*?\]/g, ''); // حذف تگ نمره از متن نمایشی
                }

                // نمایش نتایج به دانش‌آموز
                document.getElementById('loadingText').style.display = 'none';
                document.getElementById('resultBox').style.display = 'block';
                document.getElementById('aiFeedback').innerText = aiText;
                
                if (scoreMatch) {
                    document.getElementById('scoreDisplay').style.display = 'block';
                    document.getElementById('scoreDisplay').innerText = `نمره شما: ${finalScore} از ۲۰`;
                }

                // 👇 ذخیره نمره در دیتابیس با استفاده از تابع telegram.js
                if (typeof submitScoreToTelegram === "function") {
                    submitScoreToTelegram(finalScore, 0, "tashrihi");
                } else {
                    console.error("تابع ذخیره نمره پیدا نشد. فایل telegram.js را بررسی کنید.");
                }

            } catch (error) {
                document.getElementById('loadingText').style.display = 'none';
                alert('خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.');
                document.getElementById('submitBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
