<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام دانش‌آموز | مطالعات اجتماعی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
        
        body { 
            min-height: 100vh; 
            /* پس‌زمینه گرادیانت متحرک هماهنگ با صفحه ورود */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 200% 200%;
            animation: gradientShift 10s ease infinite;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* حباب‌های تزئینی پس‌زمینه */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            animation: floatBubble 15s infinite ease-in-out;
            pointer-events: none;
        }
        .bubble:nth-child(1) { width: 100px; height: 100px; top: 10%; left: 10%; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 150px; height: 150px; bottom: 20%; right: 10%; animation-delay: 3s; }
        .bubble:nth-child(3) { width: 80px; height: 80px; bottom: 40%; left: 20%; animation-delay: 5s; }

        @keyframes floatBubble {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
            50% { transform: translateY(-30px) scale(1.1); opacity: 0.7; }
        }

        /* کارت اصلی (شیشه‌ای) */
        .register-card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 35px 30px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 450px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            border: 1px solid rgba(255,255,255,0.6);
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* هدر کارت */
        .register-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .register-icon {
            font-size: 2.8rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .register-header h2 { color: #4c1d95; font-size: 1.5rem; font-weight: 900; }
        .register-header p { color: #6b7280; font-size: 0.9rem; margin-top: 5px; }

        /* فرم و ورودی‌ها */
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        .input-group .icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #9ca3af;
            transition: 0.3s;
            pointer-events: none;
        }
        
        .input-group input, 
        .input-group select { 
            width: 100%; 
            padding: 14px 45px 14px 15px; 
            border: 2px solid #e5e7eb; 
            border-radius: 14px; 
            font-family: inherit; 
            font-size: 1rem; 
            background: #f9fafb;
            outline: none;
            transition: 0.3s;
            color: #1f2937;
            appearance: none; /* حذف فلش پیش‌فرض سلکت در برخی مرورگرها */
        }
        
        /* آیکون فلش برای سلکت */
        .select-arrow {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1rem;
            pointer-events: none;
        }

        .input-group input:focus, 
        .input-group select:focus { 
            border-color: #8b5cf6; 
            background: #fff;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }
        
        .input-group input:focus + .icon {
            color: #8b5cf6;
        }

        /* دکمه ثبت‌نام */
        .register-btn { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(135deg, #10b981, #059669); 
            color: white; 
            border: none; 
            border-radius: 14px; 
            font-size: 1.1rem; 
            font-weight: 900; 
            font-family: inherit; 
            cursor: pointer; 
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(5, 150, 105, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .register-btn:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(5, 150, 105, 0.4);
            background: linear-gradient(135deg, #059669, #047857);
        }
        .register-btn:disabled {
            background: #9ca3af;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* پیام خطا و موفقیت */
        .msg-box {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            font-weight: bold;
            min-height: 20px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .msg-error { color: #b91c1c; background: #fee2e2; border: 1px solid #fca5a5; }
        .msg-success { color: #047857; background: #d1fae5; border: 1px solid #6ee7b7; }
        .msg-info { color: #1d4ed8; background: #dbeafe; border: 1px solid #93c5fd; }

        /* لینک ورود */
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #6b7280;
        }
        .login-link a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .login-link a:hover { color: #6d28d9; text-decoration: underline; }

        /* لودر چرخان */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- حباب‌های تزئینی -->
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="register-card">
        <div class="register-header">
            <span class="register-icon">📝</span>
            <h2>ثبت‌نام دانش‌آموز</h2>
            <p>برای شروع یادگیری، اطلاعات خود را وارد کنید</p>
        </div>

        <form id="registerForm" onsubmit="event.preventDefault(); register();">
            <div class="input-group">
                <input type="text" id="fullName" placeholder="نام و نام خانوادگی" required autocomplete="name">
                <span class="icon">👤</span>
            </div>

            <div class="input-group">
                <select id="schoolName" required>
                    <option value="" disabled selected>مدرسه خود را انتخاب کنید</option>
                    <option value="مدرسه حسن بن علی نوشهر کلنگی">مدرسه حسن بن علی نوشهر کلنگی</option>
                    <option value="مدرسه حضرت مهدی سرزه">مدرسه حضرت مهدی سرزه</option>
                    <option value="متفرقه">سایر مدارس (متفرقه)</option>
                </select>
                <span class="icon">🏫</span>
                <span class="select-arrow">▼</span>
            </div>

            <div class="input-group">
                <!-- ورودی نام کاربری با تنظیمات کیبورد عددی -->
                <input type="tel" id="username" placeholder="شماره موبایل (مثلاً 09123456789)" required maxlength="11" inputmode="numeric" pattern="[0-9]*" autocomplete="username">
                <span class="icon">📱</span>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="رمز عبور (حداقل ۶ کاراکتر)" required minlength="6" autocomplete="new-password">
                <span class="icon">🔒</span>
            </div>
            
            <button type="submit" class="register-btn" id="submitBtn">
                <span id="btnText">ثبت‌نام</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
            
            <div id="message" class="msg-box"></div>
        </form>

        <p class="login-link">قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">وارد شوید</a></p>
    </div>

    <script>
        async function register() {
            const fullNameInput = document.getElementById('fullName');
            const schoolInput = document.getElementById('schoolName');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const msg = document.getElementById('message');
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            const fullName = fullNameInput.value.trim();
            const schoolName = schoolInput.value;
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // مخفی کردن پیام قبلی
            msg.style.display = 'none';
            msg.className = 'msg-box';

            // اعتبارسنجی‌های اولیه
            if(!fullName || !schoolName || !username || !password) {
                showMsg('لطفاً همه فیلدها را پر کنید.', 'error');
                return;
            }

            // 👇 اعتبارسنجی شماره موبایل (فقط اعداد و شروع با 09 و ۱۱ رقم)
            const phoneRegex = /^09\d{9}$/;
            if (!phoneRegex.test(username)) {
                showMsg('شماره موبایل نامعتبر است. باید ۱۱ رقم بوده و با 09 شروع شود.', 'error');
                usernameInput.focus();
                return;
            }

            // تغییر حالت دکمه به لودینگ
            btn.disabled = true;
            btnText.innerText = 'در حال ثبت‌نام...';
            spinner.style.display = 'block';

            try {
                const res = await fetch('https://api.motadars.ir/register.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        full_name: fullName,
                        school_name: schoolName,
                        username: username,
                        password: password
                    })
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    showMsg('✅ ثبت‌نام موفق! در حال انتقال به صفحه ورود...', 'success');
                    setTimeout(() => window.location.href = 'login.html', 1800);
                } else {
                    showMsg('❌ ' + data.message, 'error');
                    btn.disabled = false;
                    btnText.innerText = 'ثبت‌نام';
                    spinner.style.display = 'none';
                }
            } catch (e) {
                showMsg('❌ خطا در ارتباط با سرور. لطفاً اینترنت خود را بررسی کنید.', 'error');
                btn.disabled = false;
                btnText.innerText = 'ثبت‌نام';
                spinner.style.display = 'none';
            }
        }

        // تابع کمکی برای نمایش پیام
        function showMsg(text, type) {
            const msg = document.getElementById('message');
            msg.style.display = 'block';
            msg.innerText = text;
            if(type === 'error') msg.classList.add('msg-error');
            if(type === 'success') msg.classList.add('msg-success');
        }
    </script>
</body>
</html>
