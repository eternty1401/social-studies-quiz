<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فلش کارت - درس ۲: من مسئول هستم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
    text-align: center;
  }
  
  .header { margin-bottom: 30px; border-bottom: 2px dashed #eef2f5; padding-bottom: 20px; }
  .header h1 { color: #e67e22; font-size: 1.6rem; margin-bottom: 8px; }
  .header p { color: #7f8c8d; font-size: 0.95rem; }

  /* ===== بخش فلش کارت ===== */
  .flashcard-container {
    perspective: 1000px;
    width: 100%;
    height: 300px;
    margin-bottom: 30px;
    cursor: pointer;
  }

  .flashcard {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }

  .flashcard.flipped {
    transform: rotateY(180deg);
  }

  .flashcard-front, .flashcard-back {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }

  .flashcard-front {
    background: linear-gradient(135deg, #e67e22, #d35400);
    color: #fff;
  }

  .flashcard-back {
    background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
    color: #2c3e50;
    transform: rotateY(180deg);
  }

  .card-content {
    font-size: 1.3rem;
    font-weight: 900;
    line-height: 1.8;
  }

  .card-label {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 0.8rem;
    background: rgba(255,255,255,0.2);
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
  }
  .flashcard-back .card-label {
    background: rgba(0,0,0,0.05);
    color: #7f8c8d;
  }

  .click-hint {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.8rem;
    opacity: 0.7;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* ===== کنترل‌ها ===== */
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }

  .nav-btn {
    background: #e67e22; color: #fff; border: none; padding: 12px 25px;
    border-radius: 30px; font-weight: 700; font-family: inherit;
    font-size: 1rem; cursor: pointer; transition: 0.3s;
    display: flex; align-items: center; gap: 8px;
  }
  .nav-btn:hover { background: #d35400; transform: translateY(-2px); }
  .nav-btn:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; }

  .counter {
    font-weight: 900; font-size: 1.1rem; color: #7f8c8d;
    background: #ecf0f1; padding: 8px 20px; border-radius: 30px;
  }

  .back-home {
    display: inline-block; margin-top: 30px; background: #2c3e50; color: #fff;
    text-decoration: none; padding: 10px 25px; border-radius: 30px; font-weight: 700; transition: 0.3s;
  }
  .back-home:hover { background: #1a252f; }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .flashcard-container { height: 400px; }
    .card-content { font-size: 1.1rem; }
    .controls { flex-direction: column; gap: 15px; }
    .nav-btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>🎴 فلش کارت‌های درس ۲</h1>
    <p>من مسئول هستم — مطالعات اجتماعی پایه هفتم</p>
  </div>

  <!-- فلش کارت -->
  <div class="flashcard-container" onclick="flipCard()">
    <div class="flashcard" id="flashcard">
      <div class="flashcard-front">
        <span class="card-label">سوال</span>
        <div class="card-content" id="question-text">سوال اینجا قرار می‌گیرد</div>
        <span class="click-hint">👆 برای دیدن جواب کلیک کنید</span>
      </div>
      <div class="flashcard-back">
        <span class="card-label">جواب</span>
        <div class="card-content" id="answer-text">جواب اینجا قرار می‌گیرد</div>
        <span class="click-hint">👆 برای دیدن سوال کلیک کنید</span>
      </div>
    </div>
  </div>

  <!-- کنترل‌ها -->
  <div class="controls">
    <button class="nav-btn" id="prev-btn" onclick="prevCard()">▶ کارت قبلی</button>
    <div class="counter" id="counter">۱ از ۱۰</div>
    <button class="nav-btn" id="next-btn" onclick="nextCard()">کارت بعدی ◀</button>
  </div>

  <a href="haftom.html" class="back-home">🔙 بازگشت به صفحه دروس</a>

</div>

<script>
  // ==========================================
  // بانک ۱۰ فلش کارت درس ۲ (من مسئول هستم)
  // ==========================================
  const flashcards = [
    {
      q: "مسئولیت یعنی چه؟",
      a: "وظایفی که هر یک از ما به عهده داریم و انتظار می‌رود آن‌ها را انجام دهیم."
    },
    {
      q: "آیا هیچ فردی هست که مسئولیتی نداشته باشد؟",
      a: "خیر، هیچ فردی نیست که مسئولیتی نداشته باشد؛ فقط ممکن است مسئولیت‌های افراد در نقش‌های مختلف متفاوت باشد."
    },
    {
      q: "ما در برابر چه کسانی مسئول هستیم؟",
      a: "در برابر خداوند، خودمان، دیگران (خانواده، مدرسه، جامعه) و محیط زندگی و عالم آفرینش."
    },
    {
      q: "شکرگزاری از نعمت‌های خداوند یعنی چه؟",
      a: "یعنی دانستن و قدر نعمت‌ها و استفاده صحیح از آن‌ها و به هدر ندادن آن‌ها."
    },
    {
      q: "چگونه می‌توانیم از بدن خود مراقبت کنیم؟",
      a: "با خوردن غذای مناسب، پرهیز از مواد مضر، رعایت بهداشت، خواب کافی و ورزش."
    },
    {
      q: "سه مورد از مسئولیت‌های ما در خانه و خانواده چیست؟",
      a: "۱. همکاری در کارهای خانه ۲. انجام وظایف شخصی ۳. اطاعت از پدر و مادر و احترام به آن‌ها."
    },
    {
      q: "سه مورد از وظایف دانش‌آموز در مدرسه چیست؟",
      a: "۱. رعایت مقررات و نظم ۲. گوش دادن به توصیه‌های معلم و انجام تکالیف ۳. مهربانی و کمک به هم‌کلاسی‌ها."
    },
    {
      q: "در برابر اموال عمومی مدرسه چه مسئولیتی داریم؟",
      a: "باید از آن‌ها محافظت کنیم، چون متعلق به همه است و نباید به آن‌ها آسیب بزنیم."
    },
    {
      q: "سه مورد از مسئولیت‌های ما در برابر محیط زیست چیست؟",
      a: "۱. کاشت درخت ۲. رعایت بهداشت و پاکیزگی محیط ۳. آسیب نرساندن به طبیعت و حیوانات."
    },
    {
      q: "طبق فرموده امام سجاد (ع)، ما در برابر اعضای بدن خود چه مسئولیتی داریم؟",
      a: "امام سجاد (ع) در «رساله حقوق» برای اعضای بدن (مانند دست، پا، چشم و گوش) حقوقی را بیان فرموده‌اند که باید رعایت کنیم و از آن‌ها درست استفاده کنیم."
    }
  ];

  let currentIndex = 0;
  const flashcardElement = document.getElementById('flashcard');
  const questionText = document.getElementById('question-text');
  const answerText = document.getElementById('answer-text');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  function updateCard() {
    // بستن کارت در صورت باز بودن
    flashcardElement.classList.remove('flipped');
    
    // تاخیر کوچک برای اینکه انیمیشن چرخش دیده شود، سپس متن عوض شود
    setTimeout(() => {
      questionText.innerText = flashcards[currentIndex].q;
      answerText.innerText = flashcards[currentIndex].a;
      
      // آپدیت شمارنده (تبدیل عدد انگلیسی به فارسی)
      const persianNumbers = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
      const currentPersian = String(currentIndex + 1).replace(/\d/g, d => persianNumbers[d]);
      const totalPersian = String(flashcards.length).replace(/\d/g, d => persianNumbers[d]);
      counter.innerText = `${currentPersian} از ${totalPersian}`;
      
      // آپدیت دکمه‌ها
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === flashcards.length - 1;
    }, 150);
  }

  function flipCard() {
    flashcardElement.classList.toggle('flipped');
  }

  function nextCard() {
    if (currentIndex < flashcards.length - 1) {
      currentIndex++;
      updateCard();
    }
  }

  function prevCard() {
    if (currentIndex > 0) {
      currentIndex--;
      updateCard();
    }
  }

  // اجرای اولیه
  updateCard();
</script>

</body>
</html>
