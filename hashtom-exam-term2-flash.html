<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فلش کارت‌های مهم نوبت دوم - پایه هشتم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
    text-align: center;
  }
  .header { margin-bottom: 30px; border-bottom: 2px dashed #eef2f5; padding-bottom: 20px; }
  .header h1 { color: #8e44ad; font-size: 1.6rem; margin-bottom: 8px; }
  .header p { color: #7f8c8d; font-size: 0.95rem; }

  .flashcard-container { perspective: 1000px; width: 100%; height: 320px; margin-bottom: 30px; cursor: pointer; }
  .flashcard { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard-front, .flashcard-back {
    position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 30px; box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }
  .flashcard-front { background: linear-gradient(135deg, #8e44ad, #6c3483); color: #fff; }
  .flashcard-back { background: linear-gradient(135deg, #ecf0f1, #bdc3c7); color: #2c3e50; transform: rotateY(180deg); }

  .card-content { font-size: 1.15rem; font-weight: 900; line-height: 1.9; }
  .card-label { position: absolute; top: 15px; right: 20px; font-size: 0.8rem; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-weight: 700; }
  .flashcard-back .card-label { background: rgba(0,0,0,0.05); color: #7f8c8d; }
  .card-lesson { position: absolute; top: 15px; left: 20px; font-size: 0.75rem; background: rgba(0,0,0,0.15); padding: 4px 10px; border-radius: 20px; font-weight: 700; }
  .flashcard-back .card-lesson { background: rgba(0,0,0,0.05); color: #7f8c8d; }
  .click-hint { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; opacity: 0.7; }

  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .nav-btn {
    background: #8e44ad; color: #fff; border: none; padding: 12px 25px; border-radius: 30px; font-weight: 700; font-family: inherit;
    font-size: 1rem; cursor: pointer; transition: 0.3s;
  }
  .nav-btn:hover { background: #6c3483; transform: translateY(-2px); }
  .nav-btn:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; }
  .counter { font-weight: 900; font-size: 1.1rem; color: #7f8c8d; background: #ecf0f1; padding: 8px 20px; border-radius: 30px; }
  .back-home { display: inline-block; margin-top: 30px; background: #2c3e50; color: #fff; text-decoration: none; padding: 10px 25px; border-radius: 30px; font-weight: 700; transition: 0.3s; }
  .back-home:hover { background: #1a252f; }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .flashcard-container { height: 460px; }
    .card-content { font-size: 0.95rem; }
    .controls { flex-direction: column; gap: 15px; }
    .nav-btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>🎴 فلش کارت‌های مهم نوبت دوم</h1>
    <p>مرور نکات کلیدی درس ۱۳ تا ۲۴ — مطالعات اجتماعی پایه هشتم</p>
  </div>

  <div class="flashcard-container" onclick="flipCard()">
    <div class="flashcard" id="flashcard">
      <div class="flashcard-front">
        <span class="card-label">سوال</span>
        <span class="card-lesson" id="lesson-badge-front">درس ۱۳</span>
        <div class="card-content" id="question-text">سوال اینجا قرار می‌گیرد</div>
        <span class="click-hint">👆 برای دیدن جواب کلیک کنید</span>
      </div>
      <div class="flashcard-back">
        <span class="card-label">جواب</span>
        <span class="card-lesson" id="lesson-badge-back">درس ۱۳</span>
        <div class="card-content" id="answer-text">جواب اینجا قرار می‌گیرد</div>
        <span class="click-hint">👆 برای دیدن سوال کلیک کنید</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prev-btn" onclick="prevCard()">▶ کارت قبلی</button>
    <div class="counter" id="counter">۱ از ۵۰</div>
    <button class="nav-btn" id="next-btn" onclick="nextCard()">کارت بعدی ◀</button>
  </div>

  <a href="hashtom.html" class="back-home">🔙 بازگشت به صفحه دروس</a>

</div>

<script>
  const flashcards = [
    // ===== درس ۱۳: غزنویان، سلجوقیان و خوارزمشاهیان =====
    { lesson: "درس ۱۳", q: "غزنویان چه تبار بودند و نامشان از کجا گرفته شده است؟", a: "ترک‌تبار بودند و چون حکومت خود را از شهر غزنین (غزنه) آغاز کردند، به این نام مشهور شدند." },
    { lesson: "درس ۱۳", q: "نبرد مالزگرد چه بود و چه نتیجه‌ای داشت؟", a: "در سال ۴۶۳ هجری بین آلب‌ارسالن سلجوقی و قوای رومیان. رومیان شکست خوردند و امپراتور روم شرقی اسیر شد. در نتیجه بخش‌های وسیعی از آسیای صغیر به تصرف سلجوقیان درآمد." },
    { lesson: "درس ۱۳", q: "قلعهٔ الموت کجاست و چه ویژگی دارد؟", a: "در استان قزوین، معروف به دژ حسن صباح. مرکز اسماعیلیان در دورهٔ سلجوقی بود و بعدها در زمان هالکوخان مغول به آتش کشیده شد." },
    { lesson: "درس ۱۳", q: "جنگ‌های صلیبی چه بودند و چه نتیجه‌ای داشتند؟", a: "جنگ‌هایی حدود دویست سال بین مسیحیان و مسلمانان. سرانجام با پیروزی مسلمانان به پایان رسید. اما اروپاییان با پیشرفت‌های علمی مسلمانان آشنا شدند و آثار علمی آنها را به لاتین ترجمه کردند." },

    // ===== درس ۱۴: میراث فرهنگی ایران در عصر سلجوقی =====
    { lesson: "درس ۱۴", q: "چهار دیوان مهم عصر سلجوقی را نام ببرید.", a: "دیوان استیفا (مالی)، دیوان رسایل یا طغرا (نامه‌ها)، دیوان اشراف (بازرسی)، دیوان عرض (نظامی)." },
    { lesson: "درس ۱۴", q: "مدارس نظامیه چه بودند و توسط چه کسی تأسیس شدند؟", a: "مدارس مهمی که خواجه نظام‌الملک در شهرهای نیشابور، اصفهان و بغداد بنیان گذاشت. اموال زیادی را وقف آنها کرد." },
    { lesson: "درس ۱۴", q: "مهم‌ترین ابتکار در معماری مساجد دورهٔ سلجوقی چه بود؟", a: "حیاط و چهار ایوان اطراف آن. همچنین آجرکاری و کاشی‌کاری به اوج شکوفایی رسید." },
    { lesson: "درس ۱۴", q: "سه نمونه از شاهکارهای معماری دورهٔ سلجوقی را نام ببرید.", a: "میل خسروگرد (نزدیکی سبزوار)، برج‌های خرقان (استان قزوین)، کاروانسرای شرف (نزدیکی سرخس)." },

    // ===== درس ۱۵: حملهٔ چنگیز و تیمور به ایران =====
    { lesson: "درس ۱۵", q: "مغولان چه کسانی بودند و چگونه زندگی می‌کردند؟", a: "اقوام بیابانگردی در مغولستان (شمال چین و جنوب سیبری). آب و هوای سرد و خشک موجب شده بود شیوهٔ زندگی کوچ‌نشینی و دامداری را برگزینند." },
    { lesson: "درس ۱۵", q: "چه بهانه‌ای موجب هجوم مغول به ایران شد؟", a: "در زمان سلطان محمد خوارزمشاه، اعضای یک کاروان تجاری مغول در یکی از شهرهای ایران به دستور حاکم آن شهر به جرم جاسوسی دستگیر و کشته شدند. چنگیز این موضوع را بهانه قرار داد و در سال ۶۱۶ هجری به ایران هجوم آورد." },
    { lesson: "درس ۱۵", q: "هالکوخان که بود و چه اقداماتی انجام داد؟", a: "نوهٔ چنگیز. نخست اسماعیلیان ایران را از بین برد، سپس با تسخیر بغداد و کشتن خلیفه (سال ۶۵۶ هجری)، خلافت عباسی را برانداخت و حکومت ایلخانان را تأسیس کرد." },
    { lesson: "درس ۱۵", q: "قیام سربداران چگونه شکل گرفت و شعار آنان چه بود؟", a: "از روستای باشتین سبزوار آغاز شد. شعار آنان «سر به دار می‌دهیم، تن به ذلت نمی‌دهیم» بود. حکومت سربداران پشتیبان مذهب شیعه بود و پس از یورش تیمور از بین رفت." },

    // ===== درس ۱۶: پیروزی فرهنگ بر شمشیر =====
    { lesson: "درس ۱۶", q: "خواجه نصیرالدین توسی چه اقداماتی انجام داد؟", a: "مشاور هالکوخان بود و تلاش زیادی برای حفظ جان مردم و کاهش قتل و غارت مغولان کرد. رصدخانهٔ مراغه را ساخت. کتاب اخلاق ناصری از آثار اوست." },
    { lesson: "درس ۱۶", q: "خواجه رشیدالدین فضل‌الله چه بنا و کتابی از خود به یادگار گذاشت؟", a: "ربع رشیدی را در تبریز بنا کرد (شامل مسجد، مدرسه، بیمارستان، خانقاه و کتابخانه) و کتاب جامع التواریخ رشیدی را نوشت." },
    { lesson: "درس ۱۶", q: "ایلخانان چگونه مسلمان شدند؟", a: "در آغاز دین واحدی نداشتند. مبلغان مسیحی موفق نشدند زیرا مردم ایران اعتقاد محکمی به اسلام داشتند. سرانجام بر اثر کوشش عالمان و وزیران ایرانی، ایلخانان مسلمان شدند." },
    { lesson: "درس ۱۶", q: "شاهنامهٔ بایسنقری چه ویژگی مهمی دارد؟", a: "یکی از نفیس‌ترین نسخه‌های کهن شاهنامه است که به سفارش بایسنقر میرزا، شاهزادهٔ تیموری، نگارگری و تذهیب شد و از نظر کتاب‌آرایی و ارزش هنری اهمیت فراوانی دارد." },

    // ===== درس ۱۷: ویژگی‌های طبیعی آسیا =====
    { lesson: "درس ۱۷", q: "آسیا از چه جهاتی به کدام اقیانوس‌ها محدود می‌شود؟", a: "از شمال به اقیانوس منجمد شمالی، از جنوب به اقیانوس هند، از مشرق به اقیانوس آرام." },
    { lesson: "درس ۱۷", q: "آسیا از طریق چه راه‌هایی از آمریکای شمالی و افریقا جدا می‌شود؟", a: "از طریق تنگهٔ برینگ از آمریکای شمالی و از طریق کانال سوئز از افریقا." },
    { lesson: "درس ۱۷", q: "بلندترین قلّهٔ آسیا چه نام دارد و در کدام رشته‌کوه است؟", a: "قلّهٔ اورست با ارتفاع ۸۸۴۸ متر در رشته‌کوه هیمالیا. به آن لقب «بام دنیا» داده‌اند." },
    { lesson: "درس ۱۷", q: "دلتا چیست و دلتای بنگال از آبرفت کدام رودها پدید آمده است؟", a: "دلتا سرزمین‌های مثلث‌شکلی است که از انباشته شدن آبرفت‌ها در مصب رودها به وجود می‌آید. دلتای بنگال از آبرفت گنگ و برهماپوترا پدید آمده و قسمت اعظم خاک بنگلادش را تشکیل می‌دهد." },
    { lesson: "درس ۱۷", q: "بادهای موسمی چه تأثیری بر کشاورزی آسیا دارند؟", a: "در اواخر بهار و تابستان از اقیانوس به سمت خشکی می‌وزند و موجب ریزش باران فراوان می‌شوند. زندگی روستایی و کشاورزی به ریزش این باران‌ها بستگی دارد." },

    // ===== درس ۱۸: ویژگی‌های انسانی و اقتصادی آسیا =====
    { lesson: "درس ۱۸", q: "چند درصد از جمعیت جهان در آسیا زندگی می‌کند؟", a: "حدود ۶۰ درصد." },
    { lesson: "درس ۱۸", q: "پرجمعیت‌ترین کشورهای جهان کدام‌اند و در کدام منطقهٔ آسیا قرار دارند؟", a: "چین و هند (با بیش از ۲/۵ میلیارد نفر مجموعاً) در منطقهٔ جنوب و جنوب شرقی آسیا. این دو کشور تنها کشورهای جهان‌اند که هر یک بیش از یک میلیارد نفر جمعیت دارند." },
    { lesson: "درس ۱۸", q: "متراکم‌ترین منطقهٔ جهان از نظر جمعیت کجاست؟", a: "جزیرهٔ جاوه در اندونزی. در این جزیرهٔ کوچک ۱۴۱ میلیون نفر (به اندازهٔ جمعیت روسیه) سکونت دارند." },
    { lesson: "درس ۱۸", q: "حدود چند درصد از مسلمانان جهان در آسیا زندگی می‌کنند؟", a: "حدود ۶۰ درصد (حدود ۱/۸ میلیارد نفر)." },
    { lesson: "درس ۱۸", q: "ببرهای اقتصادی آسیا کدام‌اند؟", a: "کرهٔ جنوبی، تایوان، هنگ‌کنگ (بخشی از چین امروزی) و سنگاپور که صادرات را هدف اقتصادی خود قرار دادند." }
    ,

    // ===== درس ۱۹: ویژگی‌های منطقهٔ جنوب غربی آسیا =====
    { lesson: "درس ۱۹", q: "منطقهٔ جنوب غربی آسیا درون چه شکلی جای می‌گیرد؟", a: "درون یک مثلث که اضلاع آن از تنگهٔ بسفر و داردانل تا کوه‌های پامیر و از آنجا تا خلیج عدن و باب‌المندب است." },
    { lesson: "درس ۱۹", q: "جلگهٔ بین‌النهرین از آبرفت کدام رودها به وجود آمده است؟", a: "دجله و فرات." },
    { lesson: "درس ۱۹", q: "بیابان رَبع‌الخالی کجاست و چه وسعتی دارد؟", a: "در شبه‌جزیرهٔ عربستان. حدود ۶۴۰,۰۰۰ کیلومتر مربع (تقریباً ۲/۵ برابر انگلستان)." },
    { lesson: "درس ۱۹", q: "چهار نوع آب و هوای منطقهٔ جنوب غربی آسیا را نام ببرید.", a: "۱. سرد کوهستانی ۲. گرم و خشک یا نیمه‌خشک ۳. گرم و شرجی ۴. مدیترانه‌ای." },
    { lesson: "درس ۱۹", q: "مهم‌ترین مسئلهٔ آبی منطقه چیست؟", a: "کمبود آب شیرین که گاهی باعث اختلافات و نزاع‌هایی بین کشورها بر سر منابع آبی رودخانه‌ها شده است." },
    { lesson: "درس ۱۹", q: "پرجمعیت‌ترین کشورهای منطقهٔ جنوب غربی آسیا کدام‌اند؟", a: "پاکستان (پرجمعیت‌ترین)، ایران و ترکیه. وسیع‌ترین کشور منطقه عربستان است." },

    // ===== درس ۲۰: ایران و منطقهٔ جنوب غربی آسیا =====
    { lesson: "درس ۲۰", q: "چرا منطقهٔ جنوب غربی آسیا استراتژیک است؟", a: "به سه دلیل: ۱. کانون اتصال سه قاره ۲. انبار مهم منابع انرژی (دوسوم نفت و یک‌سوم گاز جهان) ۳. کانون جهان اسلام." },
    { lesson: "درس ۲۰", q: "تنگه‌های مهم منطقهٔ جنوب غربی آسیا کدام‌اند؟", a: "تنگهٔ هرمز، بسفر، داردانل و باب‌المندب." },
    { lesson: "درس ۲۰", q: "سازمان همکاری اقتصادی (اکو) را معرفی کنید.", a: "نخست در سال ۱۳۴۱ بین ایران، پاکستان و ترکیه بسته شد. هم‌اکنون ده کشور منطقه عضو آن هستند." },
    { lesson: "درس ۲۰", q: "مهم‌ترین بنادر ایران در خلیج فارس کدام‌اند؟", a: "خارک، کیش، قشم، لارک، لاوان، تنب بزرگ، تنب کوچک، ابوموسی." },
    { lesson: "درس ۲۰", q: "چهار دلیل اهمیت مسئلهٔ فلسطین را بنویسید.", a: "۱. مهد ادیان الهی ۲. محل تقاطع سه قاره ۳. تشکیل دولت جعلی اسرائیل در قلب دنیای اسلام ۴. عبور آبراه مهم (مدیترانه ــ دریای سرخ ــ اقیانوس هند)." },

    // ===== درس ۲۱: ویژگی‌های طبیعی و انسانی اروپا =====
    { lesson: "درس ۲۱", q: "اروپا از چه جهاتی به کدام دریاها و اقیانوس‌ها محدود می‌شود؟", a: "از شمال به اقیانوس منجمد شمالی، از غرب به اقیانوس اطلس و از جنوب به دریای مدیترانه." },
    { lesson: "درس ۲۱", q: "اروپای پیر و اروپای جوان چه تفاوت‌هایی دارند؟", a: "اروپای پیر (شمال): کوه‌های کم‌ارتفاع و گنبدی‌شکل، درّه‌های باز. اروپای جوان (جنوب): کوه‌های بلند با شیب تند و نوک‌تیز، درّه‌های تنگ و باریک، آتشفشان و زمین‌لرزه." },
    { lesson: "درس ۲۱", q: "بلندترین قلهٔ اروپا چه نام دارد؟", a: "قلهٔ مون‌بلان با ارتفاع ۴۸۰۸ متر در رشته‌کوه آلپ." },
    { lesson: "درس ۲۱", q: "جریان گلف‌استریم چه تأثیری بر آب و هوای اروپا دارد؟", a: "عبور جریان آب گرم گلف‌استریم از سواحل غربی اروپا در فصل زمستان موجب می‌شود هوا ملایم‌تر شود." },
    { lesson: "درس ۲۱", q: "سه گروه عمدهٔ زبانی اروپا کدام‌اند؟", a: "زبان‌های با ریشهٔ لاتین (ایتالیایی، اسپانیایی)، ژرمنی (آلمانی، انگلیسی)، اسلاو (روسی، لهستانی)." },
    { lesson: "درس ۲۱", q: "اتحادیه اروپا و پیمان شینگن چه هستند؟", a: "بیشتر کشورهای اروپایی عضو اتحادیه اروپا هستند و با پول مشترک یورو همکاری می‌کنند. با پیمان شینگن نظارت مرزها را بین خود برداشته‌اند و مردم بدون نیاز به ویزا در کشورهای اروپایی جابه‌جا می‌شوند." },

    // ===== درس ۲۲: ویژگی‌های طبیعی و انسانی افریقا =====
    { lesson: "درس ۲۲", q: "افریقا از نظر وسعت چه جایگاهی در جهان دارد؟", a: "بعد از آسیا، دومین قارهٔ وسیع جهان است." },
    { lesson: "درس ۲۲", q: "افریقا از طریق چه راه‌هایی از آسیا و اروپا جدا می‌شود؟", a: "از طریق کانال سوئز از آسیا و از طریق تنگهٔ جبل‌طارق از اروپا." },
    { lesson: "درس ۲۲", q: "صحرای بزرگ افریقا چه ویژگی‌هایی دارد؟", a: "بزرگ‌ترین بیابان جهان، ۸/۵ میلیون کیلومتر مربع (تقریباً ۵ برابر ایران). دما در روز به ۵۷ درجه و شب به زیر صفر می‌رسد." },
    { lesson: "درس ۲۲", q: "طویل‌ترین رود جهان چه نام دارد؟", a: "رود نیل (۶۶۹۵ کیلومتر) که از شهر قاهره پایتخت مصر عبور می‌کند." },
    { lesson: "درس ۲۲", q: "علل عدم پیشرفت اقتصادی افریقا را بنویسید.", a: "عوامل خارجی: استعمار اروپاییان، غارت منابع، دخالت قدرت‌های بزرگ. عوامل داخلی: شرایط سخت محیطی، شیوع بیماری، بی‌سوادی، جنگ‌های داخلی و حکومت‌های وابسته و استبدادی." },

    // ===== درس ۲۳: قارهٔ آمریکا =====
    { lesson: "درس ۲۳", q: "قارهٔ آمریکا به چند بخش تقسیم می‌شود؟", a: "به دو قارهٔ کوچک‌تر: آمریکای شمالی و آمریکای جنوبی که توسط خشکی باریکی به نام «آمریکای مرکزی» به هم متصل هستند." },
    { lesson: "درس ۲۳", q: "رشته‌کوه‌های جوان آمریکا کدام‌اند؟", a: "در آمریکای شمالی رشته‌کوه راکی (روشوز) و در آمریکای جنوبی رشته‌کوه آند." },
    { lesson: "درس ۲۳", q: "پرآب‌ترین رود دنیا چه نام دارد؟", a: "رود آمازون در آمریکای جنوبی. آب آن از مجموع چند رود بزرگ دیگر بیشتر است." },
    { lesson: "درس ۲۳", q: "نژادهای اصلی مردم آمریکا کدام‌اند؟", a: "چهار گروه: ۱. سرخ‌پوستان (بومیان) ۲. سیاه‌پوستان (نوادگان بردگان افریقایی) ۳. سفیدپوستان (مهاجران اروپایی) ۴. دورگه‌ها." },
    { lesson: "درس ۲۳", q: "علل پیشرفت آمریکای شمالی را بنویسید.", a: "۱. مهاجران اروپایی با دانش و سرمایه ۲. منابع طبیعی فراوان ۳. دور بودن از جنگ جهانی دوم ۴. جانشینی قدرت‌های اروپایی ۵. جذب متخصصان سایر کشورها." },

    // ===== درس ۲۴: قارهٔ استرالیا و اقیانوسیه =====
    { lesson: "درس ۲۴", q: "استرالیا و اقیانوسیه از نظر وسعت و جمعیت چه جایگاهی دارند؟", a: "کم‌وسعت‌ترین و کم‌جمعیت‌ترین قاره‌های مسکونی جهان هستند." },
    { lesson: "درس ۲۴", q: "صخرهٔ مرجانی بزرگ استرالیا چه ویژگی دارد؟", a: "بزرگ‌ترین صخرهٔ مرجانی دنیا، بیش از ۲۰۰۰ کیلومتر طول دارد و تنها سازهٔ زندهٔ قابل مشاهده از فضا است." },
    { lesson: "درس ۲۴", q: "آیِرز راک چیست؟", a: "بزرگ‌ترین سنگ جهان با حدود ۹ کیلومتر طول و ۳۴۳ متر ارتفاع در استرالیای مرکزی. میراث جهانی یونسکو و مقدس برای بومیان." },
    { lesson: "درس ۲۴", q: "نمادهای استرالیا و نیوزیلند کدام‌اند؟", a: "کانگورو نماد استرالیا (حدود ۶۳ گونه) و کیوی (مرغ نوک‌دراز که پرواز نمی‌کند) نماد نیوزیلند است." },
    { lesson: "درس ۲۴", q: "اقتصاد استرالیا و نیوزیلند بر چه پایه‌ای استوار است؟", a: "جزء کشورهای پیشرفتهٔ صنعتی هستند. صادرات گندم، گوشت و پشم از اقلام مهم صادراتی آنهاست. سیدنی و ملبورن از مراکز مهم صنایع کشتی‌سازی و شیمیایی هستند." }
  ];

  let currentIndex = 0;
  const flashcardElement = document.getElementById('flashcard');
  const questionText = document.getElementById('question-text');
  const answerText = document.getElementById('answer-text');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const lessonFront = document.getElementById('lesson-badge-front');
  const lessonBack = document.getElementById('lesson-badge-back');

  function updateCard() {
    flashcardElement.classList.remove('flipped');
    setTimeout(() => {
      questionText.innerText = flashcards[currentIndex].q;
      answerText.innerText = flashcards[currentIndex].a;
      lessonFront.innerText = flashcards[currentIndex].lesson;
      lessonBack.innerText = flashcards[currentIndex].lesson;
      const persianNumbers = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
      const cur = String(currentIndex + 1).replace(/\d/g, d => persianNumbers[d]);
      const tot = String(flashcards.length).replace(/\d/g, d => persianNumbers[d]);
      counter.innerText = `${cur} از ${tot}`;
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === flashcards.length - 1;
    }, 150);
  }

  function flipCard() { flashcardElement.classList.toggle('flipped'); }
  function nextCard() { if (currentIndex < flashcards.length - 1) { currentIndex++; updateCard(); } }
  function prevCard() { if (currentIndex > 0) { currentIndex--; updateCard(); } }
  updateCard();
</script>

</body>
