 <script src="telegram.js"></script>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون تستی درس ۵: همدلی و همیاری در حوادث</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
  }
  
  /* صفحه شروع */
  #start-section { text-align: center; padding: 20px 0; }
  #start-section h1 { color: #27ae60; font-size: 1.6rem; margin-bottom: 15px; }
  #start-section p { color: #7f8c8d; margin-bottom: 30px; line-height: 1.8; }
  .name-input {
    width: 100%; max-width: 400px; padding: 15px; margin-bottom: 20px;
    border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit;
    font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #27ae60; box-shadow: 0 0 10px rgba(39,174,96,0.2); }
  .start-btn {
    background: #27ae60; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(39,174,96,0.3);
  }
  .start-btn:hover { background: #1e8449; transform: translateY(-2px); }

  /* هدر و تایمر */
  .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eef2f5; padding-bottom: 15px; margin-bottom: 25px; }
  .header-title h1 { color: #27ae60; font-size: 1.4rem; }
  .header-title p { color: #7f8c8d; font-size: 0.85rem; margin-top: 5px; }
  .timer-box {
    background: #fdedec; color: #e74c3c; padding: 8px 18px; border-radius: 50px;
    font-weight: 900; font-size: 1.1rem; border: 1px solid #fadbd8;
    display: flex; align-items: center; gap: 8px; direction: ltr;
  }
  .timer-box.warning { background: #fef9e7; color: #f39c12; border-color: #fae5d3; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* سوالات */
  .question-box {
    background: #fafbfc; border: 1px solid #eef2f5; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .q-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.6; }
  
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    cursor: pointer; transition: 0.2s; font-size: 0.95rem;
  }
  .option-label:hover { background: #e8f8f5; border-color: #27ae60; }
  .option-label input[type="radio"] { display: none; }
  .option-label.selected { background: #e8f8f5; border-color: #27ae60; font-weight: 700; color: #1e8449; }
  
  .submit-btn {
    display: block; width: 100%; padding: 15px; margin-top: 30px;
    background: #27ae60; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer;
    transition: 0.3s;
  }
  .submit-btn:hover { background: #1e8449; }

  /* کارنامه */
  .result-container { display: none; text-align: center; }
  .student-name-display {
    font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 20px;
    background: #ecf0f1; padding: 10px 20px; border-radius: 10px; display: inline-block;
  }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 8px solid #ecf0f1;
  }
  .score-circle.excellent { border-color: #2ecc71; color: #2ecc71; }
  .score-circle.good { border-color: #f39c12; color: #f39c12; }
  .score-circle.fail { border-color: #e74c3c; color: #e74c3c; }
  .score-num { font-size: 2.8rem; font-weight: 900; line-height: 1; }
  .score-text { font-size: 0.9rem; color: #7f8c8d; margin-top: 5px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .stat-box { padding: 15px 25px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
  .stat-box.correct { color: #2ecc71; background: #e8f8f5; }
  .stat-box.wrong { color: #e74c3c; background: #fdedec; }
  
  .review-btn {
    display: inline-block; background: #f39c12; color: #fff; text-decoration: none;
    padding: 12px 30px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer;
    font-size: 1rem;
  }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .header-top { flex-direction: column; gap: 10px; text-align: center; }
    .result-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- صفحه شروع -->
  <div id="start-section">
    <h1>📝 آزمون تستی درس ۵</h1>
    <p>همدلی و همیاری در حوادث — مطالعات اجتماعی پایه هفتم<br>لطفاً نام و نام خانوادگی خود را وارد کنید تا آزمون آغاز شود.</p>
    <input type="text" id="student-name" class="name-input" placeholder="مثلاً: علی محمدی">
    <br>
    <button class="start-btn" onclick="startQuiz()">شروع آزمون</button>
  </div>

  <!-- بخش آزمون -->
  <div id="quiz-section" style="display: none;">
    <div class="header-top">
      <div class="header-title">

      </div>

    <div class="student-name-display" id="display-student-name">نام دانش‌آموز</div>
    
    <div id="score-circle" class="score-circle">
      <div class="score-num" id="score-display">0</div>
      <div class="score-text">از ۱۰۰</div>
<p id="out-of-20-text" style="font-size:1.2rem; font-weight:700; color:#00838f; margin-bottom:15px;"></p>
<p id="out-of-20-text" style="font-size:1.2rem; font-weight:700; color:#00838f; margin-bottom:15px;"></p>>
    </div>
    <p id="result-message" style="font-size:1.1rem; font-weight:700; margin-bottom:25px;"></p>
    <div class="result-stats">
      <div class="stat-box correct" id="stat-correct">تعداد درست: ۰</div>
      <div class="stat-box wrong" id="stat-wrong">تعداد غلط: ۰</div>
    </div>
    <a href="haftom.html" class="review-btn" style="background:#3498db; text-decoration:none;">🔙 بازگشت به دروس</a>
  </div>

</div>

<script>
  // ==========================================
  // بانک ۴۰ سوالی درس ۵ (همدلی و همیاری)
  // ==========================================
  const questionBank = [
    { q: "همدلی یعنی چه؟", options: ["کمک مالی به دیگران", "خود را به جای فرد حادثه‌دیده گذاشتن و درک شرایط او", "ناراحت شدن از حوادث", "دعا کردن برای دیگران"], answer: 1 },
    { q: "همیاری یعنی چه؟", options: ["درک احساسات فرد حادثه‌دیده", "کمک عملی به فرد حادثه‌دیده پس از درک احساس او", "دعا کردن برای فرد حادثه‌دیده", "ناراحت شدن از حادثه"], answer: 1 },
    { q: "کدام یک از حوادث طبیعی است؟", options: ["زلزله", "جنگ", "تصادف", "آتش‌سوزی عمدی"], answer: 0 },
    { q: "خداوند چه چیزی را در سرشت انسان قرار داده است؟", options: ["ترس از حوادث", "همدلی و دوستی", "بی‌تفاوتی", "خشم"], answer: 1 },
    { q: "کدام یک از موارد زیر نمونه‌ای از همدلی مردم ایران در حوادث است؟", options: ["زلزله بم", "کمک به زلزله‌زدگان", "سیل گلستان", "همه موارد"], answer: 3 },
    { q: "کدام نهاد در زمان حوادث به آسیب‌دیدگان کمک می‌کند؟", options: ["جمعیت هلال احمر", "بانک مرکزی", "سازمان مالیاتی", "اداره پست"], answer: 0 },
    { q: "جمعیت هلال احمر چه وظیفه‌ای دارد؟", options: ["تعیین قوانین کشور", "کمک به آسیب‌دیدگان و انتقال مجروحان به بیمارستان", "ساخت خانه برای مردم", "فروش دارو"], answer: 1 },
    { q: "در زمان حوادث، جمعیت هلال احمر برای آسیب‌دیدگان چه امکاناتی فراهم می‌کند؟", options: ["خانه دائمی", "چادرهای اسکان موقت", "خودرو", "شغل"], answer: 1 },
    { q: "سازمان جوانان هلال احمر برای چه کسانی برنامه دارد؟", options: ["فقط برای پزشکان", "فقط برای بزرگسالان", "برای دانش‌آموزان و دانشجویان داوطلب", "فقط برای ورزشکاران"], answer: 2 },
    { q: "در کشورهای غیرمسلمان، مؤسسه‌ای مشابه هلال احمر چه نام دارد؟", options: ["صلیب سرخ", "ستاره سرخ", "پرچم سرخ", "هلال سبز"], answer: 0 },
    { q: "کمیته بین‌المللی صلیب سرخ جهانی در کجا قرار دارد؟", options: ["ژنو، سوئیس", "تهران، ایران", "نیویورک، آمریکا", "لندن، انگلیس"], answer: 0 },
    { q: "یکی از اصول جمعیت هلال احمر چیست؟", options: ["دریافت پاداش از آسیب‌دیدگان", "بی‌طرفی در جنگ‌ها", "تبعیض بین انسان‌ها", "کمک فقط به مسلمانان"], answer: 1 },
    { q: "طبق سوره مائده، آیه ۳۲، هر کس جان یک نفر را نجات دهد مانند چه چیزی است؟", options: ["مانند نجات یک خانواده", "مانند نجات همه مردم", "مانند نجات یک شهر", "مانند نجات یک کشور"], answer: 1 },
    { q: "طبق فرموده امام رضا (ع)، هر کس اندوهی را از مؤمنی برطرف کند، خداوند در روز قیامت چه می‌کند؟", options: ["به او ثروت می‌بخشد", "اندوهش را برطرف می‌کند", "او را بهشت می‌برد بدون حساب", "به او مقام می‌دهد"], answer: 1 },
    { q: "چرا آمریکا و رژیم صهیونیستی مورد انتقاد قرار می‌گیرند؟", options: ["به خاطر مانع شدن از رسیدن دارو و خدمات درمانی به کشورهای نیازمند", "به خاطر کمک به کشورهای فقیر", "به خاطر ساخت بیمارستان", "به خاطر ارسال دارو"], answer: 0 },
    { q: "همدلی با انسان‌های مظلوم در جهان به چه معناست؟", options: ["احساس مسئولیت نسبت به همه انسان‌های مظلوم در جهان", "کمک فقط به هم‌وطنان", "بی‌توجهی به دیگران", "کمک فقط به مسلمانان"], answer: 0 },
    { q: "در حادثه زلزله، کدام نهاد وظیفه انتقال مجروحان به بیمارستان را دارد؟", options: ["سازمان آتش‌نشانی", "جمعیت هلال احمر و اورژانس", "سازمان مدیریت بحران", "شهرداری"], answer: 1 },
    { q: "کدام یک از موارد زیر نمونه‌ای از همدلی در سطح کوچک‌تر است؟", options: ["زلزله بم", "کمک به همکلاسی که دچار حادثه شده است", "سیل گلستان", "جنگ تحمیلی"], answer: 1 },
    { q: "اصول جمعیت هلال احمر و کمیته بین‌المللی صلیب سرخ چه ویژگی مشترکی دارند؟", options: ["فقط به مسلمانان کمک می‌کنند", "اصول انسانی و بی‌طرفانه دارند", "فقط به ثروتمندان کمک می‌کنند", "به هیچ‌کس کمک نمی‌کنند"], answer: 1 },
    { q: "کمک به آسیب‌دیدگان حوادث جزو کدام وظیفه اجتماعی است؟", options: ["وظیفه فقط دولت", "وظیفه همگانی و انسانی", "وظیفه فقط هلال احمر", "وظیفه فقط روحانیون"], answer: 1 },
    { q: "کدام گزینه از مصادیق همدلی نیست؟", options: ["کمک به زلزله‌زدگان", "کمک به همسایه بیمار", "بی‌توجهی به نیازمندان", "همدردی با آسیب‌دیدگان سیل"], answer: 2 },
    { q: "کدام یک از موارد زیر از حوادث غیرطبیعی است؟", options: ["سیل", "زلزله", "جنگ", "خشکسالی"], answer: 2 },
    { q: "یکی از راه‌های همدلی با آسیب‌دیدگان حوادث چیست؟", options: ["کمک نقدی یا جنسی", "تماشا کردن حوادث", "بی‌توجهی به آن‌ها", "سرزنش آن‌ها"], answer: 0 },
    { q: "جمعیت هلال احمر علاوه بر کمک‌های اولیه، چه خدمات دیگری ارائه می‌دهد؟", options: ["برپایی چادرهای اسکان موقت و جمع‌آوری کمک‌های مردمی", "ساخت خانه دائمی برای همه", "تعیین قوانین کشور", "فروش لباس و غذا"], answer: 0 },
    { q: "کدام گزینه در مورد سازمان جوانان هلال احمر صحیح است؟", options: ["فقط برای دانشجویان پزشکی است", "دانش‌آموزان و دانشجویان داوطلب می‌توانند عضو شوند", "عضوگیری از دانش‌آموزان ندارد", "مخصوص بزرگسالان است"], answer: 1 },
    { q: "همدلی و همیاری در جوامع مختلف از چه زمانی وجود داشته است؟", options: ["فقط در دوران معاصر", "از گذشته تا به امروز", "فقط در کشورهای غربی", "فقط در کشورهای اسلامی"], answer: 1 },
    { q: "چرا می‌گوییم حوادث «خبر نمی‌کنند»؟", options: ["چون همیشه اتفاق نمی‌افتند", "چون ناگهانی و غیرقابل پیش‌بینی هستند", "چون فقط در شب رخ می‌دهند", "چون خبررسانی در مورد آن‌ها ممنوع است"], answer: 1 },
    { q: "کدام گزینه در مورد کمک‌های جمعیت هلال احمر صحیح است؟", options: ["فقط به مسلمانان کمک می‌کند", "بدون توجه به نژاد، دین و ملیت کمک می‌کند", "فقط به ایرانیان کمک می‌کند", "فقط به ثروتمندان کمک می‌کند"], answer: 1 },
    { q: "طبق درس، برخی کشورها با مانع‌تراشی در رسیدن دارو چه نتیجه‌ای را به بار آورده‌اند؟", options: ["کمک به مردم نیازمند", "گرفتن جان هزاران انسان بی‌گناه", "افزایش صلح جهانی", "کاهش بیماری"], answer: 1 },
    { q: "کدام یک از موارد زیر از نمونه‌های همدلی نیست؟", options: ["جمع‌آوری کمک برای زلزله‌زدگان", "شرکت در طرح‌های خیریه", "آسیب زدن به نیازمندان", "همکاری در امدادرسانی"], answer: 2 },
    { q: "کدام مؤسسه در زمان جنگ تحمیلی عراق علیه ایران به کمک مجروحان می‌شتابید؟", options: ["جمعیت هلال احمر", "شهرداری", "بانک ملی", "سازمان مالیاتی"], answer: 0 },
    { q: "چرا جمعیت هلال احمر در جنگ‌ها بی‌طرف است؟", options: ["چون فقط به ایرانیان کمک می‌کند", "چون به همه مجروحان بدون توجه به ملیت کمک می‌کند", "چون در جنگ‌ها کمک نمی‌کند", "چون فقط به مسلمانان کمک می‌کند"], answer: 1 },
    { q: "مردم ایران در کدام حادثه اخیر همدلی گسترده‌ای نشان دادند؟", options: ["سیل سال ۱۳۹۸", "خشکسالی", "آتش‌سوزی جنگل‌های آمازون", "زلزله ژاپن"], answer: 0 },
    { q: "کدام گزینه از پیام‌های دینی درباره همدلی است؟", options: ["کمک فقط به اقوام", "هر کس جان یک نفر را نجات دهد مانند این است که جان همه مردم را نجات داده است", "کمک فقط به مسلمانان", "کمک فقط در زمان جنگ"], answer: 1 },
    { q: "طبق درس، در زمان کرونا چه کسانی مجاهدت کردند؟", options: ["ورزشکاران", "کادر درمانی (پزشکان و پرستاران)", "رانندگان تاکسی", "فروشندگان"], answer: 1 },
    { q: "کدام یک از نهادهای زیر در حوادث طبیعی کمک می‌کند؟", options: ["سازمان مدیریت بحران", "سازمان مالیاتی", "بانک مرکزی", "اداره ثبت اسناد"], answer: 0 },
    { q: "در ایران، برای ثبت نام داوطلبانه در هلال احمر چه بخشی وجود دارد؟", options: ["سازمان دانش‌آموزی", "سازمان جوانان هلال احمر", "بسیج دانشجویی", "انجمن اسلامی"], answer: 1 },
    { q: "کدام گزینه از فواید همدلی و همیاری در جامعه است؟", options: ["افزایش اتحاد و کاهش درد و رنج آسیب‌دیدگان", "افزایش اختلافات", "کاهش همکاری", "بی‌تفاوتی مردم"], answer: 0 },
    { q: "به نظر شما، همدلی با انسان‌های مظلوم در سراسر جهان چه اثری دارد؟", options: ["تقویت همبستگی انسانی در جهان", "افزایش جنگ", "کاهش کمک‌ها", "افزایش بی‌تفاوتی"], answer: 0 },

  ];

  const numQuestionsToShow = 15; 
  const totalTime = 600; // ۱۰ دقیقه
  
  let selectedQuestions = [];
  let timerInterval;
  let timeLeft = totalTime;
  let studentName = "";

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    if (studentName === "") {
      alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      return;
    }
    
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    
    initQuiz();
  }

  function initQuiz() {
    const shuffledBank = shuffle([...questionBank]);
    selectedQuestions = shuffledBank.slice(0, numQuestionsToShow);

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((item, index) => {
      const correctAnswerText = item.options[item.answer];
      const shuffledOptions = shuffle([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
      
      selectedQuestions[index].options = shuffledOptions;
      selectedQuestions[index].answer = newCorrectIndex;

      let optionsHTML = '';
      shuffledOptions.forEach((opt, i) => {
        optionsHTML += `
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="q${index}" value="${i}">
            <span>${opt}</span>
          </label>
        `;
      });

      const qBox = document.createElement('div');
      qBox.className = 'question-box';
      qBox.innerHTML = `
        <div class="q-title">${index + 1}. ${item.q}</div>
        <div class="options">${optionsHTML}</div>
      `;
      container.appendChild(qBox);
    });

    startTimer();
  }

  function startTimer() {
    const display = document.getElementById('timer-display');
    
    timerInterval = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      
      display.innerHTML = `⏱ ${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

      if (timeLeft <= 60) {
        display.classList.add('warning');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        display.innerHTML = `⏱ ۰۰:۰۰`;
        document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
      }
    }, 1000);
  }

  function selectOption(label) {
    const name = label.querySelector('input').name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.parentElement.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;

    selectedQuestions.forEach((item, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (!selected) {
        wrongCount++; 
      } else if (parseInt(selected.value) === item.answer) {
        correctCount++;
      } else {
        wrongCount++;
      }
    });

    const score = Math.round((correctCount / selectedQuestions.length) * 100);
submitScoreToTelegram(score, correctCount);
if (typeof window.saveGradeToFirebase === 'function') {
  window.saveGradeToFirebase(studentName, document.title, Math.ceil((correctCount / selectedQuestions.length) * 20), correctCount);
}
    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    document.getElementById('display-student-name').innerText = `دانش‌آموز: ${studentName}`;
    
    document.getElementById('score-display').innerText = score;
    document.getElementById('stat-correct').innerText = `تعداد درست: ${correctCount}`;
    document.getElementById('stat-wrong').innerText = `تعداد غلط: ${wrongCount}`;

    const circle = document.getElementById('score-circle');
    const msg = document.getElementById('result-message');
    
    circle.className = 'score-circle';
    if (score >= 80) {
      circle.classList.add('excellent');
      msg.innerText = "🌟 عالی بود! شما درس را به خوبی یاد گرفته‌اید.";
      msg.style.color = "#2ecc71";
    } else if (score >= 50) {
      circle.classList.add('good');
      msg.innerText = "👍 خوب بود، اما با کمی مطالعه بیشتر می‌توانید بهتر شوید.";
      msg.style.color = "#f39c12";
    } else {
      circle.classList.add('fail');
      msg.innerText = "📚 نیاز به مطالعه بیشتر دارید. ناامید نشوید و درسنامه را دوباره بخوانید.";
      msg.style.color = "#e74c3c";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
