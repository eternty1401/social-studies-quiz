<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارگاه هوش هیجانی | مهارت زندگی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
    min-height: 100vh; color: #fff; padding: 30px 20px;
    display: flex; flex-direction: column; align-items: center;
  }

  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { font-size: 2rem; font-weight: 900; margin-bottom: 10px; color: #a78bfa; text-shadow: 0 0 15px rgba(167, 139, 250, 0.3); }
  .header p { color: #cbd5e1; font-size: 0.95rem; line-height: 1.6; }

  .game-card {
    background: rgba(30, 41, 59, 0.6); border: 1px solid #475569;
    border-radius: 20px; padding: 30px 25px; width: 100%; max-width: 650px;
    backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    position: relative; overflow: hidden;
  }

  /* بخش سناریو */
  .scenario-box {
    background: #fff; color: #1e293b; padding: 25px; border-radius: 15px;
    font-size: 1.1rem; line-height: 1.9; margin-bottom: 25px; min-height: 120px;
    display: flex; flex-direction: column; justify-content: center;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
  }
  .scenario-title { color: #7c3aed; font-weight: 900; margin-bottom: 10px; display: block; font-size: 0.9rem;}

  /* دکمه‌های انتخاب */
  .choices { display: flex; flex-direction: column; gap: 12px; }
  .choice-btn {
    background: rgba(255,255,255,0.05); color: #e2e8f0; border: 1px solid #64748b;
    padding: 15px 20px; border-radius: 12px; font-family: inherit; font-size: 1rem;
    font-weight: 700; cursor: pointer; transition: 0.3s; text-align: right;
    display: flex; align-items: center; gap: 10px;
  }
  .choice-btn:hover { background: rgba(255,255,255,0.15); border-color: #a78bfa; transform: translateX(-5px); }
  .choice-btn .num {
    background: #a78bfa; color: #1e1b4b; width: 25px; height: 25px; border-radius: 50%;
    display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 0.85rem; flex-shrink: 0;
  }

  /* بخش تحلیل هوش مصنوعی */
  .ai-analysis {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(30, 27, 75, 0.98); backdrop-filter: blur(5px);
    padding: 25px; display: none; flex-direction: column; z-index: 10;
    animation: fadeIn 0.4s ease; overflow-y: auto;
  }
  .ai-analysis h3 { color: #a78bfa; font-size: 1.2rem; margin-bottom: 15px; text-align: center; }
  .ai-analysis p { font-size: 0.95rem; line-height: 1.8; color: #e2e8f0; margin-bottom: 20px; text-align: justify; white-space: pre-wrap; }
  .ai-analysis .result-icon { font-size: 3rem; text-align: center; margin-bottom: 15px; }
  
  .next-btn {
    background: #a78bfa; color: #1e1b4b; border: none; padding: 15px;
    border-radius: 12px; font-family: inherit; font-size: 1rem; font-weight: 900;
    cursor: pointer; width: 100%; transition: 0.3s; margin-top: auto;
  }
  .next-btn:hover { background: #c4b5fd; transform: translateY(-2px); }

  .loading-spinner { text-align: center; color: #a78bfa; font-weight: bold; display: none; margin: 20px 0; font-size: 1.1rem; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>

  </div>

  <div class="game-card">

        <!-- گزینه‌ها اینجا قرار میگیرن -->
      </div>
    </div>

      <button class="next-btn" id="nextBtn" onclick="loadNextScenario()" style="display: none;">موقعیت بعدی ←</button>
