<!DOCTYPE html>
<html lang="fa" dir="rtl">
 <script src="telegram.js"></script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون تستی درس ۲۱: اوضاع اجتماعی ایران باستان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
  }
  
  /* صفحه شروع */
  #start-section { text-align: center; padding: 20px 0; }
  #start-section h1 { color: #2e7d32; font-size: 1.6rem; margin-bottom: 15px; }
  #start-section p { color: #7f8c8d; margin-bottom: 30px; line-height: 1.8; }
  .name-input {
    width: 100%; max-width: 400px; padding: 15px; margin-bottom: 20px;
    border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit;
    font-size: 1rem; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #2e7d32; box-shadow: 0 0 10px rgba(46,125,50,0.2); }
  .start-btn {
    background: #2ecc71; color: #fff; border: none; padding: 15px 40px;
    border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: inherit;
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
  }
  .start-btn:hover { background: #27ae60; transform: translateY(-2px); }

  /* هدر و تایمر */
  .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eef2f5; padding-bottom: 15px; margin-bottom: 25px; }
  .header-title h1 { color: #2e7d32; font-size: 1.4rem; }
  .header-title p { color: #7f8c8d; font-size: 0.85rem; margin-top: 5px; }
  .timer-box {
    background: #fdedec; color: #e74c3c; padding: 8px 18px; border-radius: 50px;
    font-weight: 900; font-size: 1.1rem; border: 1px solid #fadbd8;
    display: flex; align-items: center; gap: 8px; direction: ltr;
  }
  .timer-box.warning { background: #fef9e7; color: #f39c12; border-color: #fae5d3; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* سوالات */
  .question-box {
    background: #fafbfc; border: 1px solid #eef2f5; border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .q-title { font-weight: 900; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.6; }
  
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: center; gap: 10px; padding: 12px 15px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    cursor: pointer; transition: 0.2s; font-size: 0.95rem;
  }
  .option-label:hover { background: #e8f5e9; border-color: #2e7d32; }
  .option-label input[type="radio"] { display: none; }
  .option-label.selected { background: #e8f5e9; border-color: #2e7d32; font-weight: 700; color: #1b5e20; }
  
  .submit-btn {
    display: block; width: 100%; padding: 15px; margin-top: 30px;
    background: #2e7d32; color: #fff; border: none; border-radius: 12px;
    font-size: 1.1rem; font-weight: 900; font-family: inherit; cursor: pointer;
    transition: 0.3s;
  }
  .submit-btn:hover { background: #1b5e20; }

  /* کارنامه */
  .result-container { display: none; text-align: center; }
  .student-name-display {
    font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 20px;
    background: #ecf0f1; padding: 10px 20px; border-radius: 10px; display: inline-block;
  }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 8px solid #ecf0f1;
  }
  .score-circle.excellent { border-color: #2ecc71; color: #2ecc71; }
  .score-circle.good { border-color: #f39c12; color: #f39c12; }
  .score-circle.fail { border-color: #e74c3c; color: #e74c3c; }
  .score-num { font-size: 2.8rem; font-weight: 900; line-height: 1; }
  .score-text { font-size: 0.9rem; color: #7f8c8d; margin-top: 5px; font-weight: 700; }
  .result-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .stat-box { padding: 15px 25px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; }
  .stat-box.correct { color: #2ecc71; background: #e8f8f5; }
  .stat-box.wrong { color: #e74c3c; background: #fdedec; }
  
  .review-btn {
    display: inline-block; background: #3498db; color: #fff; text-decoration: none;
    padding: 12px 30px; border-radius: 30px; font-weight: 700; border: none; cursor: pointer;
    font-size: 1rem;
  }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .header-top { flex-direction: column; gap: 10px; text-align: center; }
    .result-stats { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- صفحه شروع -->
  <div id="start-section">
    <h1>📝 آزمون تستی درس ۲۱</h1>
    <p>اوضاع اجتماعی ایران باستان — مطالعات اجتماعی پایه هفتم<br>لطفاً نام و نام خانوادگی خود را وارد کنید تا آزمون آغاز شود.</p>
    <input type="text" id="student-name" class="name-input" placeholder="مثلاً: علی محمدی">
    <br>
    <button class="start-btn" onclick="startQuiz()">شروع آزمون</button>
  </div>

  <!-- بخش آزمون -->
  <div id="quiz-section" style="display: none;">
    <div class="header-top">
      <div class="header-title">
        <h1>📝 آزمون تستی درس ۲۱</h1>
        <p>۱۵ سوال تصادفی از بانک ۴۰ سوالی</p>
      </div>
      <div class="timer-box" id="timer-display">⏱ ۱۰:۰۰</div>
    </div>
    
    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="submit" class="submit-btn" id="submit-btn">ثبت پاسخ‌ها و مشاهده کارنامه</button>
    </form>
  </div>

  <!-- بخش کارنامه -->
  <div id="result-section" class="result-container">
    <h2 style="color:#2c3e50; margin-bottom:20px; font-weight:900;">🎓 کارنامه شما</h2>
    <div class="student-name-display" id="display-student-name">نام دانش‌آموز</div>
    
    <div id="score-circle" class="score-circle">
      <div class="score-num" id="score-display">0</div>
      <div class="score-text">از ۱۰۰</div>
    </div>
    <p id="result-message" style="font-size:1.1rem; font-weight:700; margin-bottom:25px;"></p>
    <div class="result-stats">
      <div class="stat-box correct" id="stat-correct">تعداد درست: ۰</div>
      <div class="stat-box wrong" id="stat-wrong">تعداد غلط: ۰</div>
    </div>
    <a href="haftom.html" class="review-btn" style="background:#3498db; text-decoration:none;">🔙 بازگشت به دروس</a>
  </div>

</div>

<script>
  // ==========================================
  // بانک ۴۰ سوالی درس ۲۱ (اوضاع اجتماعی ایران باستان)
  // ==========================================
  const questionBank = [
    { q: "هستهٔ اولیه جامعه در ایران باستان چه بود؟", options: ["خانواده", "دولت", "شهر", "روستا"], answer: 0 },
    { q: "ازدواج در نزد ایرانیان باستان چه جایگاهی داشت؟", options: ["یک تکلیف دینی و پیمان مقدس", "فقط یک قرارداد اجتماعی", "یک کار اختیاری", "یک رسم غیرضروری"], answer: 0 },
    { q: "اگر کسی در ایران باستان عمداً از ازدواج سرباز می‌زد چه اتفاقی می‌افتاد؟", options: ["گناهکار شمرده می‌شد", "پاداش می‌گرفت", "به مقام بالایی می‌رسید", "چیزی نمی‌شد"], answer: 0 },
    { q: "در ایران باستان، سرپرست خانواده چه کسی بود؟", options: ["پدر", "مادر", "پدربزرگ", "برادر بزرگتر"], answer: 0 },
    { q: "ازدواج در ایران باستان بیشتر به چه صورت بود؟", options: ["درون‌گروهی (با افراد دودمان خود)", "برون‌گروهی", "با بیگانگان", "تصادفی"], answer: 0 },
    { q: "چرا ایرانیان باستان به اولاد پسر ارزش خاصی قائل بودند؟", options: ["به دلیل سلطنت موروثی و حفظ دودمان", "چون پسرها بیشتر کار می‌کردند", "چون پسرها قوی‌تر بودند", "چون دختران ارزشی نداشتند"], answer: 0 },
    { q: "چند همسری در ایران باستان چگونه بود؟", options: ["فقط در بین افراد توانگر و ثروتمند رواج داشت", "برای همه مردم رایج بود", "ممنوع بود", "فقط برای کشاورزان بود"], answer: 0 },
    { q: "زنان در ایران باستان در کنار مردان به چه کارهایی می‌پرداختند؟", options: ["نخ‌ریسی، پارچه‌بافی، قالی‌بافی و کشاورزی", "فقط خانه‌داری", "فقط تجارت", "فقط جنگ"], answer: 0 },
    { q: "پدران در خانواده‌های ایران باستان چه چیزی را به پسران می‌آموختند؟", options: ["شغل خود را", "فقط خواندن و نوشتن", "فقط موسیقی", "فقط ورزش"], answer: 0 },
    { q: "مادران در خانواده‌های ایران باستان چه چیزی را به دختران می‌آموختند؟", options: ["رسوم خانه‌داری", "فقط خواندن و نوشتن", "فقط موسیقی", "فقط ورزش"], answer: 0 },
    { q: "اغلب مردم در دوره ایران باستان در کجا زندگی می‌کردند؟", options: ["روستاها", "شهرها", "کاخ‌ها", "غارها"], answer: 0 },
    { q: "بیشترین جمعیت ایران باستان را چه کسانی تشکیل می‌دادند؟", options: ["کشاورزان", "شاهان", "بازرگانان", "صنعتگران"], answer: 0 },
    { q: "در دوره ساسانیان، شهرها چه تحولی پیدا کردند؟", options: ["تعداد شهرها افزایش یافت و جمعیت شهری زیاد شد", "شهرها از بین رفتند", "شهرها کوچک شدند", "مردم از شهرها به روستاها مهاجرت کردند"], answer: 0 },
    { q: "در شهرهای دوره ساسانی، علاوه بر مأموران حکومتی چه کسانی زندگی می‌کردند؟", options: ["صنعتگران، بازرگانان و پیشه‌وران", "فقط کشاورزان", "فقط سربازان", "فقط روحانیون"], answer: 0 },
    { q: "جامعه ایران باستان به چند طبقه تقسیم می‌شد؟", options: ["دو طبقه: بزرگان و مردم عامه", "سه طبقه", "چهار طبقه", "پنج طبقه"], answer: 0 },
    { q: "کدام یک از موارد زیر از طبقه بزرگان (اشراف) بود؟", options: ["شاه و شاهزادگان و موبدان", "کشاورزان", "دامداران", "پیشه‌وران"], answer: 0 },
    { q: "کدام یک از موارد زیر از طبقه مردم عامه بود؟", options: ["پیشه‌وران و بازرگانان و کشاورزان", "شاه و شاهزادگان", "موبدان", "فرماندهان نظامی"], answer: 0 },
    { q: "آیا بزرگان در ایران باستان مالیات می‌پرداختند؟", options: ["خیر، از پرداخت مالیات معاف بودند", "بله، مالیات سنگین می‌پرداختند", "بله، اما کم", "فقط در زمان جنگ"], answer: 0 },
    { q: "آیا عامه مردم در ایران باستان از حق تحصیل برخوردار بودند؟", options: ["تحصیل برای آنها سخت و دشوار بود", "بله، همه حق تحصیل داشتند", "فقط پسران حق تحصیل داشتند", "فقط ثروتمندان"], answer: 0 },
    { q: "در دوره ساسانیان، چه کسانی از اختلاف طبقاتی حمایت می‌کردند؟", options: ["موبدان زرتشتی", "کشاورزان", "بازرگانان", "پیشه‌وران"], answer: 0 },
    { q: "در جامعه طبقاتی ایران باستان، رفتن از یک طبقه به طبقه دیگر چگونه بود؟", options: ["بسیار سخت و تقریباً ناممکن", "آسان بود", "با تلاش امکان‌پذیر بود", "با پرداخت پول امکان‌پذیر بود"], answer: 0 },
    { q: "در دوره ساسانی، پیشه‌وران و کشاورزان در کجا ساکن می‌شدند؟", options: ["در حومه شهرها", "در مرکز شهر", "در کاخ‌ها", "در روستاهای دور"], answer: 0 },
    { q: "در دوره ساسانی، طبقات مختلف حتی چه چیزهای جداگانه‌ای داشتند؟", options: ["آتشکده", "بازار", "حمام", "مدرسه"], answer: 0 },
    { q: "چرا مردم سخت‌کوش ایران از دین اسلام استقبال کردند؟", options: ["چون در اسلام انسان‌ها در برابر خدا برابرند", "چون اسلام دین جدید بود", "چون مسلمانان به آنها پول می‌دادند", "چون از جنگ خسته شده بودند"], answer: 0 },
    { q: "در ایران باستان، پدر در خانواده چه وظیفه‌ای داشت؟", options: ["اجرای مراسم مذهبی و حفظ امنیت خانواده", "فقط کار کردن", "فقط تربیت دختران", "فقط نظافت خانه"], answer: 0 },
    { q: "در ایران باستان، اصول و ارزش‌های اخلاقی مانند راستگویی و امانت‌داری توسط چه کسانی به اعضای خانواده آموزش داده می‌شد؟", options: ["خانواده", "فقط مدرسه", "فقط حکومت", "فقط روحانیون"], answer: 0 },
    { q: "کدام یک از پادشاهان ساسانی، تاجی داشت که مقدار زیادی طلای خالص و مروارید در آن به کار رفته بود؟", options: ["خسرو پرویز", "اردشیر بابکان", "شاپور اول", "یزدگرد سوم"], answer: 0 },
    { q: "در ایران باستان، شغل‌ها از پدر به چه کسی منتقل می‌شد؟", options: ["به پسر", "به دختر", "به برادر کوچک", "به هیچ‌کس"], answer: 0 },
    { q: "در ایران باستان، مراسم ازدواج چه ویژگی داشت؟", options: ["پیمان مقدس و تکلیف دینی", "فقط یک رسم اجتماعی", "مراسمی برای تفریح", "مراسمی برای تجارت"], answer: 0 },
    { q: "در ایران باستان، مردان برای گرفتن چه چیزی نیاز به داشتن همسر داشتند؟", options: ["مقام و منصب", "ثروت", "خانه", "زمین"], answer: 0 },
    { q: "طبقات اجتماعی ایران باستان در دوره کدام سلسله به اوج خود رسید؟", options: ["ساسانیان", "هخامنشیان", "اشکانیان", "مادها"], answer: 0 },
    { q: "در دوره ساسانی، چه کسانی در حومه شهرها ساکن می‌شدند؟", options: ["پیشه‌وران و کشاورزان", "شاهان و شاهزادگان", "موبدان", "فرماندهان نظامی"], answer: 0 },
    { q: "کدام یک از موارد زیر از ویژگی‌های زندگی شاهان در ایران باستان بود؟", options: ["زندگی پرتجملی در کاخ‌های عظیم", "زندگی ساده و معمولی", "زندگی در غار", "زندگی در روستا"], answer: 0 },
    { q: "چرا در دوره ساسانی، خسرو پرویز تاج سنگینش را از سقف آویزان می‌کرد؟", options: ["چون تاج سنگین بود و نمی‌توانست آن را روی سرش نگه دارد", "چون می‌خواست تاج را تمیز نگه دارد", "چون تاج شکسته بود", "چون تاج را دوست نداشت"], answer: 0 },
    { q: "در ایران باستان، خانواده چه نقشی در تربیت اعضا داشت؟", options: ["نقش بسیار مهم و مرکز تربیت و آموزش بود", "نقش کمی داشت", "نقشی نداشت", "فقط به کار کشاورزی می‌پرداخت"], answer: 0 },
    { q: "مهم‌ترین دلیل ظلم و ستم به عامه مردم در ایران باستان چه بود؟", options: ["اختلاف طبقاتی و تبعیض", "کمبود منابع طبیعی", "جنگ‌های داخلی", "کمبود باران"], answer: 0 },
    { q: "چرا در دوره ساسانی، طبقات مختلف آتشکده‌های جداگانه داشتند؟", options: ["چون اختلاف طبقاتی به اوج رسیده بود", "چون آتشکده‌ها کم بود", "چون دین‌های مختلف بودند", "چون تعصب مذهبی داشتند"], answer: 0 },
    { q: "کدام یک از موارد زیر از طبقه بزرگان (اشراف) در دوره ساسانی است؟", options: ["دبیران", "کشاورزان", "دامداران", "پیشه‌وران"], answer: 0 },
    { q: "در ایران باستان، کدام یک از طبقات اجتماعی، فعالیت اقتصادی مهم بر دوششان بود؟", options: ["کشاورزان", "شاه و شاهزادگان", "موبدان", "دبیران"], answer: 0 },
    { q: "در ایران باستان، آیا فرزند یک کشاورز می‌توانست به طبقه اشراف برود؟", options: ["خیر، بسیار سخت و تقریباً ناممکن بود", "بله، با تلاش امکان‌پذیر بود", "بله، با پرداخت پول", "بله، با تحصیل"], answer: 0 }
  ];

  const numQuestionsToShow = 15; 
  const totalTime = 600; // ۱۰ دقیقه
  
  let selectedQuestions = [];
  let timerInterval;
  let timeLeft = totalTime;
  let studentName = "";

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function startQuiz() {
    studentName = document.getElementById('student-name').value.trim();
    if (studentName === "") {
      alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      return;
    }
    
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    
    initQuiz();
  }

  function initQuiz() {
    const shuffledBank = shuffle([...questionBank]);
    selectedQuestions = shuffledBank.slice(0, numQuestionsToShow);

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((item, index) => {
      const correctAnswerText = item.options[item.answer];
      const shuffledOptions = shuffle([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
      
      selectedQuestions[index].options = shuffledOptions;
      selectedQuestions[index].answer = newCorrectIndex;

      let optionsHTML = '';
      shuffledOptions.forEach((opt, i) => {
        optionsHTML += `
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="q${index}" value="${i}">
            <span>${opt}</span>
          </label>
        `;
      });

      const qBox = document.createElement('div');
      qBox.className = 'question-box';
      qBox.innerHTML = `
        <div class="q-title">${index + 1}. ${item.q}</div>
        <div class="options">${optionsHTML}</div>
      `;
      container.appendChild(qBox);
    });

    startTimer();
  }

  function startTimer() {
    const display = document.getElementById('timer-display');
    
    timerInterval = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      
      display.innerHTML = `⏱ ${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

      if (timeLeft <= 60) {
        display.classList.add('warning');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        display.innerHTML = `⏱ ۰۰:۰۰`;
        document.getElementById('quiz-form').dispatchEvent(new Event('submit'));
      }
    }, 1000);
  }

  function selectOption(label) {
    const name = label.querySelector('input').name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.parentElement.classList.remove('selected');
    });
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;

    selectedQuestions.forEach((item, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (!selected) {
        wrongCount++; 
      } else if (parseInt(selected.value) === item.answer) {
        correctCount++;
      } else {
        wrongCount++;
      }
    });

    const score = Math.round((correctCount / selectedQuestions.length) * 100);
submitScoreToTelegram(score, correctCount);
    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    document.getElementById('display-student-name').innerText = `دانش‌آموز: ${studentName}`;
    
    document.getElementById('score-display').innerText = score;
    document.getElementById('stat-correct').innerText = `تعداد درست: ${correctCount}`;
    document.getElementById('stat-wrong').innerText = `تعداد غلط: ${wrongCount}`;

    const circle = document.getElementById('score-circle');
    const msg = document.getElementById('result-message');
    
    circle.className = 'score-circle';
    if (score >= 80) {
      circle.classList.add('excellent');
      msg.innerText = "🌟 عالی بود! شما درس را به خوبی یاد گرفته‌اید.";
      msg.style.color = "#2ecc71";
    } else if (score >= 50) {
      circle.classList.add('good');
      msg.innerText = "👍 خوب بود، اما با کمی مطالعه بیشتر می‌توانید بهتر شوید.";
      msg.style.color = "#f39c12";
    } else {
      circle.classList.add('fail');
      msg.innerText = "📚 نیاز به مطالعه بیشتر دارید. ناامید نشوید و درسنامه را دوباره بخوانید.";
      msg.style.color = "#e74c3c";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
