<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فلش کارت - درس ۴: وظایف دولت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
    text-align: center;
  }
  
  .header { margin-bottom: 30px; border-bottom: 2px dashed #eef2f5; padding-bottom: 20px; }
  .header h1 { color: #558b2f; font-size: 1.6rem; margin-bottom: 8px; }
  .header p { color: #7f8c8d; font-size: 0.95rem; }

  .flashcard-container {
    perspective: 1000px;
    width: 100%;
    height: 300px;
    margin-bottom: 30px;
    cursor: pointer;
  }

  .flashcard {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }

  .flashcard.flipped {
    transform: rotateY(180deg);
  }

  .flashcard-front, .flashcard-back {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }

  .flashcard-front {
    background: linear-gradient(135deg, #558b2f, #33691e);
    color: #fff;
  }

  .flashcard-back {
    background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
    color: #2c3e50;
    transform: rotateY(180deg);
  }

  .card-content {
    font-size: 1.25rem;
    font-weight: 900;
    line-height: 1.9;
  }

  .card-label {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 0.8rem;
    background: rgba(255,255,255,0.2);
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
  }
  .flashcard-back .card-label {
    background: rgba(0,0,0,0.05);
    color: #7f8c8d;
  }

  .click-hint {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.8rem;
    opacity: 0.7;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }

  .nav-btn {
    background: #558b2f; color: #fff; border: none; padding: 12px 25px;
    border-radius: 30px; font-weight: 700; font-family: inherit;
    font-size: 1rem; cursor: pointer; transition: 0.3s;
    display: flex; align-items: center; gap: 8px;
  }
  .nav-btn:hover { background: #33691e; transform: translateY(-2px); }
  .nav-btn:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; }

  .counter {
    font-weight: 900; font-size: 1.1rem; color: #7f8c8d;
    background: #ecf0f1; padding: 8px 20px; border-radius: 30px;
  }

  .back-home {
    display: inline-block; margin-top: 30px; background: #2c3e50; color: #fff;
    text-decoration: none; padding: 10px 25px; border-radius: 30px; font-weight: 700; transition: 0.3s;
  }
  .back-home:hover { background: #1a252f; }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .flashcard-container { height: 400px; }
    .card-content { font-size: 1.05rem; }
    .controls { flex-direction: column; gap: 15px; }
    .nav-btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>🎴 فلش کارت‌های درس ۴</h1>
    <p>وظایف دولت — مطالعات اجتماعی پایه هشتم</p>
  </div>

  <div class="flashcard-container" onclick="flipCard()">
    <div class="flashcard" id="flashcard">
      <div class="flashcard-front">
        <span class="card-label">سوال</span>
        <div class="card-content" id="question-text">سوال اینجا قرار می‌گیرد</div>
        <span class="click-hint">👆 برای دیدن جواب کلیک کنید</span>
      </div>
      <div class="flashcard-back">
        <span class="card-label">جواب</span>
        <div class="card-content" id="answer-text">جواب اینجا قرار می‌گیرد</div>
        <span class="click-hint">👆 برای دیدن سوال کلیک کنید</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prev-btn" onclick="prevCard()">▶ کارت قبلی</button>
    <div class="counter" id="counter">۱ از ۱۵</div>
    <button class="nav-btn" id="next-btn" onclick="nextCard()">کارت بعدی ◀</button>
  </div>

  <a href="hashtom.html" class="back-home">🔙 بازگشت به صفحه دروس</a>

</div>

<script>
  const flashcards = [
    {
      q: "شهروندان یک کشور چه کسانی هستند؟",
      a: "اتباع آن کشور؛ همهٔ کسانی که تابعیت آن کشور را دارند، چه در داخل و چه در خارج از کشور."
    },
    {
      q: "دو مورد از حقوق شهروندان در برابر دولت را نام ببرید.",
      a: "۱. حق استفاده از خدمات دولت ۲. حق آزادی بیان، اظهار نظر و انتقاد."
    },
    {
      q: "دو مورد از وظایف شهروندان در برابر دولت را بنویسید.",
      a: "۱. احترام گذاشتن به قوانین ۲. پرداخت مالیات (و مشارکت با دولت، دفاع از کشور در جنگ)."
    },
    {
      q: "طبق قانون اساسی، دولت موظف است چه شرایطی را در جامعه فراهم کند؟",
      a: "سواد و آموزش، بهداشت، شغل مناسب، رفاه، امنیت، فرهنگ و اخلاق اسلامی."
    },
    {
      q: "لایحه چیست؟",
      a: "پیشنهادی است که از سوی دولت به مجلس ارائه می‌شود تا نمایندگان آن را بررسی و تصویب کنند و به قانون تبدیل شود."
    },
    {
      q: "استیضاح را تعریف کنید.",
      a: "توضیح خواستن نمایندگان مجلس از وزیر است. وزیر باید در مجلس حاضر شود و پاسخ دهد و سپس دوباره برای ادامهٔ کار از مجلس رأی اعتماد بگیرد."
    },
    {
      q: "سه مورد از منابع درآمد دولت را نام ببرید.",
      a: "۱. درآمدهای حاصل از مالیات ۲. درآمدهای حاصل از صادرات نفت ۳. سایر درآمدها (مانند ارائه خدمات آب و برق و...)."
    },
    {
      q: "مالیات را تعریف کنید.",
      a: "مالیات پولی است که بر طبق قانون، افراد و مؤسسات به دولت می‌پردازند تا در جهت ادارهٔ امور کشور مورد استفاده قرار بگیرد."
    },
    {
      q: "بودجه چیست؟",
      a: "پیش‌بینی دخل و خرج دولت (درآمدها و هزینه‌ها) برای یک سال."
    },
    {
      q: "لایحهٔ بودجه توسط چه کسی تنظیم و توسط چه کسی تصویب می‌شود؟",
      a: "تنظیم توسط دولت؛ تصویب توسط مجلس شورای اسلامی."
    },
    {
      q: "سه مورد از وظایف رئیس جمهور در قبال قراردادها و سفیران را بنویسید.",
      a: "۱. امضای قراردادهای بین‌المللی ۲. امضای استوارنامهٔ سفیران کشور ما ۳. پذیرش استوارنامهٔ سفیران کشورهای دیگر."
    },
    {
      q: "چه کسی بر درآمدها و هزینه‌های دولت نظارت می‌کند؟",
      a: "مجلس شورای اسلامی."
    },
    {
      q: "سه مورد از خدماتی که دولت باید در کشور گسترش دهد را نام ببرید.",
      a: "ساختن راه و جاده، پل، بیمارستان، مسکن، مدرسه، سد، مخابرات، آب، برق و گاز."
    },
    {
      q: "چرا نظارت مجلس بر عملکرد دولت اهمیت دارد؟",
      a: "چون موجب پاسخگو بودن دولت در برابر مردم و مجلس می‌شود و از سوءاستفاده و تخلف جلوگیری می‌کند."
    },
    {
      q: "مهم‌ترین پیام درس ۴ چیست؟",
      a: "دولت در برابر شهروندان وظایف مهمی (تأمین آموزش، بهداشت، اشتغال، امنیت، خدمات عمومی) دارد و در برابر مردم و مجلس پاسخگوست؛ شهروندان هم باید با پرداخت مالیات و رعایت قوانین با دولت همکاری کنند."
    }
  ];

  let currentIndex = 0;
  const flashcardElement = document.getElementById('flashcard');
  const questionText = document.getElementById('question-text');
  const answerText = document.getElementById('answer-text');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  function updateCard() {
    flashcardElement.classList.remove('flipped');
    
    setTimeout(() => {
      questionText.innerText = flashcards[currentIndex].q;
      answerText.innerText = flashcards[currentIndex].a;
      
      const persianNumbers = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
      const currentPersian = String(currentIndex + 1).replace(/\d/g, d => persianNumbers[d]);
      const totalPersian = String(flashcards.length).replace(/\d/g, d => persianNumbers[d]);
      counter.innerText = `${currentPersian} از ${totalPersian}`;
      
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === flashcards.length - 1;
    }, 150);
  }

  function flipCard() {
    flashcardElement.classList.toggle('flipped');
  }

  function nextCard() {
    if (currentIndex < flashcards.length - 1) {
      currentIndex++;
      updateCard();
    }
  }

  function prevCard() {
    if (currentIndex > 0) {
      currentIndex--;
      updateCard();
    }
  }

  updateCard();
</script>

</body>
</html>
