<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ویرایش آزمون | سوالینو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --hint: #64748b;
            --border: rgba(148, 163, 184, 0.2);
            --success: #10b981;
            --error: #ef4444;
            --online-color: #8b5cf6;
            --pdf-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Vazirmatn', sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 100px; }

        .page-header { padding: 16px 20px; background: #ffffff; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .page-header h1 { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        
        /* استایل جدید برای نمایش نوع آزمون */
        .type-badge { font-size: 0.8rem; font-weight: 700; padding: 6px 12px; border-radius: 8px; color: white; display: flex; align-items: center; gap: 4px; }
        .type-badge.online { background: var(--online-color); }
        .type-badge.pdf { background: var(--pdf-color); }

        .container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }

        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }

        .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .form-group { flex: 1; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--hint); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 0.95rem; background: var(--bg); color: var(--text); transition: border-color 0.2s; }
        .form-control:focus { outline: none; border-color: var(--primary); }

        .question-item { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); position: relative; }
        
        .q-badge { position: absolute; top: -10px; right: 16px; font-size: 0.75rem; font-weight: 700; padding: 2px 12px; border-radius: 20px; color: white; }
        .q-badge.testi { background: #8b5cf6; }
        .q-badge.truefalse { background: #ec4899; }
        .q-badge.jakhali { background: #f59e0b; }
        .q-badge.essay { background: #10b981; }

        .q-text-input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 0.95rem; background: var(--bg); color: var(--text); resize: vertical; min-height: 80px; margin-top: 8px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .option-input { padding: 10px; font-size: 0.9rem; }
        .key-input { margin-top: 10px; background: #f0fdf4; border: 1.5px dashed #22c55e; color: #166534; font-weight: 600; }

        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; padding: 16px; background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 100; }
        .btn-confirm { width: 100%; padding: 16px; background: var(--success); color: white; border: none; border-radius: 14px; font-family: inherit; font-size: 1.1rem; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4); display: flex; justify-content: center; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-confirm:active { transform: scale(0.98); }
        .btn-confirm:disabled { background: var(--hint); box-shadow: none; cursor: not-allowed; }

        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .loader { width: 40px; height: 40px; border: 4px solid var(--border); border-radius: 50%; border-top-color: var(--primary); animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading">
        <div class="loader"></div>
        <h3 style="color: var(--primary);">در حال دریافت پیش‌نویس...</h3>
    </div>

    <header class="page-header">
        <h1>📝 ویرایش آزمون</h1>
        <!-- این باکس با جاوااسکریپت پر می‌شود -->
        <div id="exam-type-indicator" class="type-badge" style="display: none;">...</div>
    </header>

    <div class="container" id="main-content" style="display: none;">
        
        <div class="card">
            <div class="card-title">🏢 اطلاعات سربرگ</div>
            <div class="form-row">
                <div class="form-group"><label>اداره آموزش و پرورش</label><input type="text" id="head-admin" class="form-control"></div>
                <div class="form-group"><label>نام مدرسه</label><input type="text" id="head-school" class="form-control"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>نام دبیر</label><input type="text" id="head-teacher" class="form-control"></div>
                <div class="form-group"><label>تاریخ امتحان</label><input type="text" id="head-date" class="form-control"></div>
            </div>
            <div class="form-group" style="width: 50%;"><label>مدت زمان (دقیقه)</label><input type="number" id="head-duration" class="form-control"></div>
        </div>

        <h3 style="margin-bottom: 16px; color: var(--text);">📚 ویرایش سوالات</h3>
        <div id="questions-container"></div>

    </div>

    <div class="bottom-bar" id="bottom-bar" style="display: none;">
        <!-- متن دکمه با جاوااسکریپت بر اساس نوع آزمون تغییر می‌کند -->
        <button class="btn-confirm" id="btn-confirm" onclick="submitChanges()">
            ✅ تایید نهایی و کسر ۱ اعتبار
        </button>
    </div>

    <script>
        const API_BASE = 'https://api.motadars.ir';
        const urlParams = new URLSearchParams(window.location.search);
        const examCode = urlParams.get('code');
        const teacherToken = urlParams.get('token');
        
        let examData = null;
        let questionsData = [];
        let tg = null;

        // راه‌اندازی امن تلگرام
        window.addEventListener('load', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                try { tg.expand(); } catch(e) {}
            }
            
            if (!examCode || !teacherToken) {
                document.getElementById('loading').innerHTML = "<h3 style='color:red;'>لینک نامعتبر است.</h3>";
                return;
            }
            localStorage.setItem('teacher_token', teacherToken);
            fetchDraft();
        });

        async function fetchDraft() {
            try {
                const res = await fetch(`${API_BASE}/get_draft_exam.php?code=${examCode}`);
                const data = await res.json();
                
                if (!res.ok || !data.ok) {
                    document.getElementById('loading').innerHTML = `<h3 style='color:red;'>${data.message || 'خطا'}</h3>`;
                    return;
                }

                examData = data.exam;
                questionsData = data.questions;
                renderUI();
            } catch (e) {
                document.getElementById('loading').innerHTML = "<h3 style='color:red;'>خطای شبکه در دریافت اطلاعات.</h3>";
            }
        }

        function renderUI() {
            // ⭐ نمایش برچسب نوع آزمون در هدر
            const typeIndicator = document.getElementById('exam-type-indicator');
            const btnConfirm = document.getElementById('btn-confirm');
            const isOnline = examData.exam_type === 'online';

            typeIndicator.style.display = 'flex';
            if (isOnline) {
                typeIndicator.className = 'type-badge online';
                typeIndicator.innerHTML = '🌐 آزمون آنلاین';
                btnConfirm.innerHTML = '✅ تایید نهایی، کسر ۱ اعتبار و ساخت لینک آنلاین';
            } else {
                typeIndicator.className = 'type-badge pdf';
                typeIndicator.innerHTML = '📄 آزمون چاپی (PDF)';
                btnConfirm.innerHTML = '✅ تایید نهایی، کسر ۱ اعتبار و دریافت فایل PDF';
            }

            document.getElementById('head-admin').value = examData.header_admin || '';
            document.getElementById('head-school').value = examData.header_school || '';
            document.getElementById('head-teacher').value = examData.header_teacher_name || '';
            document.getElementById('head-date').value = examData.exam_date || '';
            document.getElementById('head-duration').value = examData.duration || 60;

            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            questionsData.forEach((q, index) => {
                const div = document.createElement('div');
                div.className = 'question-item';
                
                let typeName = '', badgeClass = '';
                if (q.type === 'testi') { typeName = 'تستی'; badgeClass = 'testi'; }
                else if (q.type === 'truefalse') { typeName = 'صحیح / غلط'; badgeClass = 'truefalse'; }
                else if (q.type === 'jakhali') { typeName = 'جاخالی'; badgeClass = 'jakhali'; }
                else if (q.type === 'essay') { typeName = 'تشریحی'; badgeClass = 'essay'; }

                let optionsHtml = '';
                if (q.type === 'testi' || q.type === 'truefalse') {
                    optionsHtml = `<div class="options-grid">` + q.options.map((opt, i) => `
                        <input type="text" class="form-control option-input" data-qid="${q.id}" data-index="${i}" value="${opt || ''}">
                    `).join('') + `</div>`;
                }

                let keyHtml = '';
                if (q.type === 'essay' || q.type === 'jakhali') {
                    let currentKey = q.question_key || (Array.isArray(q.answer) ? q.answer[0] : q.answer) || '';
                    keyHtml = `<input type="text" class="form-control key-input" data-qid="${q.id}" value="${currentKey}" placeholder="پاسخ صحیح / کلید سوال">`;
                }

                div.innerHTML = `
                    <span class="q-badge ${badgeClass}">${typeName}</span>
                    <label style="font-size: 0.85rem; color: var(--hint); margin-top: 8px; display: block;">متن سوال ${index + 1}</label>
                    <textarea class="q-text-input text-input" data-qid="${q.id}" rows="2">${q.question_text || ''}</textarea>
                    ${optionsHtml}
                    ${keyHtml}
                `;
                container.appendChild(div);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('bottom-bar').style.display = 'block';
        }

        async function submitChanges() {
            const btn = document.getElementById('btn-confirm');
            const originalLabel = btn.innerHTML;
            const reset = () => { btn.disabled = false; btn.innerHTML = originalLabel; };
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loader" style="width:20px;height:20px;border-width:2px;margin:0;"></span> در حال ذخیره و کسر اعتبار...';

            // جمع‌آوری اطلاعات
            const headerData = {
                admin: document.getElementById('head-admin').value || 'نامشخص',
                school: document.getElementById('head-school').value || 'نامشخص',
                teacher: document.getElementById('head-teacher').value || 'نامشخص',
                date: document.getElementById('head-date').value || 'نامشخص',
                duration: parseInt(document.getElementById('head-duration').value) || 60,
                type: examData.exam_type // اینجا نوع آزمون به بک‌اند ارسال می‌شود
            };

            const editedQuestions = questionsData.map(q => {
                let textEl = document.querySelector(`.text-input[data-qid="${q.id}"]`);
                let text = textEl ? textEl.value : q.question_text;
                let options = q.options;
                let answer = q.answer;

                if (q.type === 'testi' || q.type === 'truefalse') {
                    options = q.options.map((_, i) => {
                        let optEl = document.querySelector(`.option-input[data-qid="${q.id}"][data-index="${i}"]`);
                        return optEl ? optEl.value : '';
                    });
                }
                
                if (q.type === 'essay' || q.type === 'jakhali') {
                    let keyEl = document.querySelector(`.key-input[data-qid="${q.id}"]`);
                    let keyVal = keyEl ? keyEl.value : '';
                    answer = [keyVal];
                }

                return { id: q.id, type: q.type, text: text, options: options, answer: answer };
            });

            // ⭐ تنظیم تایم‌اوت ۴۵ ثانیه‌ای
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 45000);

            try {
                const res = await fetch(`${API_BASE}/confirm_exam.php`, {
                    method: 'POST',
                    signal: ctrl.signal,
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Teacher-Token': teacherToken
                    },
                    body: JSON.stringify({
                        code: examCode,
                        header: headerData,
                        questions: editedQuestions
                    })
                });
                
                const textData = await res.text();
                let data;
                try {
                    data = JSON.parse(textData);
                } catch (e) {
                    throw new Error("پاسخ نامعتبر از سرور (" + res.status + "): " + textData.slice(0, 150));
                }
                
                if (res.ok && data.ok) {
                    alert('✅ آزمون با موفقیت تایید شد!');
                    // اگر تلگرام هست، لینک رو در مرورگر خارجی باز کن، وگرنه در خود صفحه
                    if (tg && tg.openLink) {
                        tg.openLink(data.final_link);
                    } else {
                        window.location.href = data.final_link;
                    }
                    reset();
                } else {
                    alert('❌ خطا: ' + (data.message || res.status));
                    reset();
                }
            } catch (e) {
                if (e.name === 'AbortError') {
                    alert('❌ سرور پاسخ نداد (Timeout). لطفاً یک بار دیگر تلاش کنید.');
                } else {
                    alert('❌ خطا: ' + e.message);
                }
                reset();
            } finally {
                clearTimeout(timer);
            }
        }
    </script>
</body>
</html>
