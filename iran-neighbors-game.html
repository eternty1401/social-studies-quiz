<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی مرزبان ایران | مطالعات اجتماعی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            min-height: 100vh; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 2rem; color: #a78bfa; margin-bottom: 10px; text-shadow: 0 0 15px rgba(167,139,250,0.3); }
        .header p { color: #cbd5e1; font-size: 0.95rem; }

        .game-container { max-width: 500px; width: 100%; position: relative; }
        
        /* نوار بالا (امتیاز و سوال) */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 15px 20px; border-radius: 15px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .score { background: #f59e0b; color: #1e1b4b; padding: 5px 15px; border-radius: 20px; font-weight: 900; font-size: 1.1rem; }
        .question-counter { font-size: 1rem; font-weight: 700; color: #cbd5e1; }

        /* کارت سوال */
        .question-card {
            background: white; color: #1e293b; padding: 30px 20px; border-radius: 20px;
            text-align: center; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative; overflow: hidden;
        }
        .question-card::before {
            content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 8px;
            background: linear-gradient(90deg, #a78bfa, #f59e0b);
        }
        .question-text { font-size: 1.2rem; font-weight: 900; line-height: 1.7; margin-top: 10px; }

        /* دکمه‌های گزینه */
        .options-container { display: flex; flex-direction: column; gap: 15px; }
        .option-btn {
            background: rgba(255,255,255,0.05); border: 2px solid #475569; color: white;
            padding: 15px 20px; border-radius: 15px; font-family: inherit; font-size: 1.1rem;
            font-weight: 700; cursor: pointer; transition: 0.3s; text-align: right;
            display: flex; align-items: center; gap: 15px;
        }
        .option-btn:hover { background: rgba(255,255,255,0.1); border-color: #a78bfa; transform: translateX(-5px); }
        .option-btn .num {
            background: #475569; color: white; width: 30px; height: 30px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 0.9rem;
        }
        
        /* حالت‌های درست و غلط */
        .option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #10b981; }
        .option-btn.correct .num { background: #10b981; }
        .option-btn.wrong { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444; }
        .option-btn.wrong .num { background: #ef4444; }
        .option-btn:disabled { cursor: not-allowed; transform: none; }

        /* صفحه شروع و پایان */
        .start-screen, .end-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(5px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; text-align: center; padding: 20px;
        }
        .start-screen h2, .end-screen h2 { color: #a78bfa; margin-bottom: 15px; font-size: 1.8rem; }
        .start-screen p, .end-screen p { color: #cbd5e1; margin-bottom: 25px; line-height: 1.8; font-size: 1rem; max-width: 400px; }
        .start-btn {
            background: #10b981; color: white; border: none; padding: 15px 40px;
            border-radius: 50px; font-size: 1.2rem; font-weight: 900; font-family: inherit;
            cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(16,185,129,0.4);
        }
        .start-btn:hover { background: #059669; transform: scale(1.05); }
        .end-screen { display: none; }
        .final-score { font-size: 3rem; font-weight: 900; color: #f59e0b; margin: 10px 0 20px 0; text-shadow: 0 0 20px rgba(245,158,11,0.4); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🗺️ مرزبان ایران</h1>
        <p>همسایه‌ها و دریاهای ایران را بشناس!</p>
    </div>

    <div class="game-container">
        <!-- نوار بالا -->
        <div class="top-bar">
            <div class="score" id="scoreDisplay">۰</div>
            <div class="question-counter" id="questionCounter">سوال ۱ از ۸</div>
        </div>

        <!-- کارت سوال -->
        <div class="question-card">
            <div class="question-text" id="questionText">در حال بارگذاری...</div>
        </div>

        <!-- گزینه‌ها -->
        <div class="options-container" id="optionsContainer">
            <!-- دکمه‌ها اینجا قرار می‌گیرند -->
        </div>
    </div>

    <!-- صفحه شروع -->
    <div class="start-screen" id="startScreen">
        <h2>آماده‌ای برای مرزداری؟</h2>
        <p>من درباره همسایه‌ها و دریاهای ایران از تو سوال می‌پرسم.<br>تو باید گزینه درست را انتخاب کنی.<br>هر جواب درست ۱۰ امتیاز دارد!</p>
        <button class="start-btn" onclick="startGame()">شروع بازی</button>
    </div>

    <!-- صفحه پایان -->
    <div class="end-screen" id="endScreen">
        <h2>مأموریت تمام شد!</h2>
        <p>تو توانستی از مرزهای دانشت محافظت کنی.</p>
        <div class="final-score" id="finalScoreDisplay">۰</div>
        <button class="start-btn" onclick="startGame()">🔄 بازی مجدد</button>
    </div>

    <script>
        const questions = [
            {
                q: "کدام دریا در شمال ایران قرار دارد؟",
                options: ["خلیج فارس", "دریای عمان", "دریای خزر", "دریای سرخ"],
                correct: 2 // ایندکس گزینه درست (از 0 شروع میشه)
            },
            {
                q: "کدام کشور در غرب ایران قرار دارد؟",
                options: ["افغانستان", "عراق", "ترکمنستان", "پاکستان"],
                correct: 1
            },
            {
                q: "کدام کشور در شرق ایران قرار دارد؟",
                options: ["ترکیه", "آذربایجان", "عراق", "افغانستان"],
                correct: 3
            },
            {
                q: "کدام خلیج در جنوب ایران قرار دارد؟",
                options: ["خلیج فارس", "خلیج مکزیک", "خلیج عدن", "خلیج بنگال"],
                correct: 0
            },
            {
                q: "کدام کشور در شمال ایران قرار دارد؟",
                options: ["عربستان", "ترکمنستان", "عمان", "کویت"],
                correct: 1
            },
            {
                q: "ایران در کدام قاره قرار دارد؟",
                options: ["اروپا", "آفریقا", "آسیا", "آمریکا"],
                correct: 2
            },
            {
                q: "کدام کشور در شمال‌غرب ایران قرار دارد؟",
                options: ["پاکستان", "ترکیه", "افغانستان", "عمان"],
                correct: 1
            },
            {
                q: "کدام اقیانوس به جنوب‌شرقی ایران نزدیک است؟",
                options: ["اقیانوس اطلس", "اقیانوس آرام", "اقیانوس هند", "اقیانوس منجمد شمالی"],
                correct: 2
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('endScreen').style.display = 'none';
            
            score = 0;
            currentQuestionIndex = 0;
            updateScore();
            
            // درهم ریختن سوالات
            shuffledQuestions = questions.sort(() => Math.random() - 0.5);
            
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= shuffledQuestions.length) {
                endGame();
                return;
            }

            const q = shuffledQuestions[currentQuestionIndex];
            
            // آپدیت شمارنده
            document.getElementById('questionCounter').innerText = `سوال ${currentQuestionIndex + 1} از ${shuffledQuestions.length}`;
            document.getElementById('questionText').innerText = q.q;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="num">${index + 1}</span> <span>${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            const q = shuffledQuestions[currentQuestionIndex];
            const allButtons = document.querySelectorAll('.option-btn');

            // غیرفعال کردن همه دکمه‌ها
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === q.correct) {
                // جواب درست
                score += 10;
                updateScore();
                btnElement.classList.add('correct');
            } else {
                // جواب غلط
                btnElement.classList.add('wrong');
                // نمایش جواب درست
                allButtons[q.correct].classList.add('correct');
            }

            // رفتن به سوال بعدی بعد از ۱.۵ ثانیه
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 1500);
        }

        function updateScore() {
            document.getElementById('scoreDisplay').innerText = score;
        }

        function endGame() {
            document.getElementById('endScreen').style.display = 'flex';
            document.getElementById('finalScoreDisplay').innerText = `${score} از ${shuffledQuestions.length * 10}`;
        }
    </script>
</body>
</html>
