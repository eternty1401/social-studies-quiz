<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فلش کارت - درس ۹: ظهور اسلام در شبه‌جزیرهٔ عربستان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
    text-align: center;
  }
  
  .header { margin-bottom: 30px; border-bottom: 2px dashed #eef2f5; padding-bottom: 20px; }
  .header h1 { color: #00acc1; font-size: 1.6rem; margin-bottom: 8px; }
  .header p { color: #7f8c8d; font-size: 0.95rem; }

  .flashcard-container {
    perspective: 1000px;
    width: 100%;
    height: 300px;
    margin-bottom: 30px;
    cursor: pointer;
  }

  .flashcard {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }

  .flashcard.flipped {
    transform: rotateY(180deg);
  }

  .flashcard-front, .flashcard-back {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }

  .flashcard-front {
    background: linear-gradient(135deg, #00acc1, #00838f);
    color: #fff;
  }

  .flashcard-back {
    background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
    color: #2c3e50;
    transform: rotateY(180deg);
  }

  .card-content {
    font-size: 1.2rem;
    font-weight: 900;
    line-height: 1.9;
  }

  .card-label {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 0.8rem;
    background: rgba(255,255,255,0.2);
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
  }
  .flashcard-back .card-label {
    background: rgba(0,0,0,0.05);
    color: #7f8c8d;
  }

  .click-hint {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.8rem;
    opacity: 0.7;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }

  .nav-btn {
    background: #00acc1; color: #fff; border: none; padding: 12px 25px;
    border-radius: 30px; font-weight: 700; font-family: inherit;
    font-size: 1rem; cursor: pointer; transition: 0.3s;
    display: flex; align-items: center; gap: 8px;
  }
  .nav-btn:hover { background: #00838f; transform: translateY(-2px); }
  .nav-btn:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; }

  .counter {
    font-weight: 900; font-size: 1.1rem; color: #7f8c8d;
    background: #ecf0f1; padding: 8px 20px; border-radius: 30px;
  }

  .back-home {
    display: inline-block; margin-top: 30px; background: #2c3e50; color: #fff;
    text-decoration: none; padding: 10px 25px; border-radius: 30px; font-weight: 700; transition: 0.3s;
  }
  .back-home:hover { background: #1a252f; }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .flashcard-container { height: 400px; }
    .card-content { font-size: 1.05rem; }
    .controls { flex-direction: column; gap: 15px; }
    .nav-btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>🎴 فلش کارت‌های درس ۹</h1>
    <p>ظهور اسلام در شبه‌جزیرهٔ عربستان — مطالعات اجتماعی پایه هشتم</p>
  </div>

  <div class="flashcard-container" onclick="flipCard()">
    <div class="flashcard" id="flashcard">
      <div class="flashcard-front">
        <span class="card-label">سوال</span>
        <div class="card-content" id="question-text">سوال اینجا قرار می‌گیرد</div>
        <span class="click-hint">👆 برای دیدن جواب کلیک کنید</span>
      </div>
      <div class="flashcard-back">
        <span class="card-label">جواب</span>
        <div class="card-content" id="answer-text">جواب اینجا قرار می‌گیرد</div>
        <span class="click-hint">👆 برای دیدن سوال کلیک کنید</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prev-btn" onclick="prevCard()">▶ کارت قبلی</button>
    <div class="counter" id="counter">۱ از ۱۵</div>
    <button class="nav-btn" id="next-btn" onclick="nextCard()">کارت بعدی ◀</button>
  </div>

  <a href="hashtom.html" class="back-home">🔙 بازگشت به صفحه دروس</a>

</div>

<script>
  const flashcards = [
    {
      q: "شبه‌جزیرهٔ عربستان کجا واقع شده و مساحت آن چقدر است؟",
      a: "در جنوب غربی آسیا واقع شده است و حدود سه میلیون کیلومتر مربع مساحت دارد."
    },
    {
      q: "مهم‌ترین شهرهای حجاز کدام بودند؟",
      a: "مکه، یثرب (مدینه) و طائف."
    },
    {
      q: "دو ایستگاه مهم تجاری عربستان در زمان ظهور اسلام کدام بودند؟",
      a: "مکه و یثرب."
    },
    {
      q: "به دوران پیش از بعثت در عربستان چه می‌گفتند؟",
      a: "عصر جاهلیت."
    },
    {
      q: "سه ویژگی عصر جاهلیت را نام ببرید.",
      a: "۱. بت‌پرستی ۲. تعصب قبیله‌ای و جنگ و خونریزی ۳. بی‌سوادی و موقعیت پایین زنان."
    },
    {
      q: "چرا پیامبر اکرم ﷺ به «محمدامین» مشهور بودند؟",
      a: "به سبب پاکدامنی و درستکاری فراوان."
    },
    {
      q: "بعثت پیامبر اکرم ﷺ در چه تاریخی و در چه سنی رخ داد؟",
      a: "در ۲۷ رجب، در چهل سالگی، با نزول فرشتهٔ وحی در غار حرا."
    },
    {
      q: "نخستین مسلمانان چه کسانی بودند؟",
      a: "حضرت خدیجه و حضرت علی ﷺ."
    },
    {
      q: "دعوت پنهانی پیامبر چند سال طول کشید؟",
      a: "سه سال."
    },
    {
      q: "پس از دعوت پنهانی، پیامبر ابتدا چه کسانی را آشکارا دعوت کرد؟",
      a: "نخست خویشاوندان و سپس عموم مردم را."
    },
    {
      q: "مشرکان برای مقابله با پیامبر چه پیشنهادی به ایشان دادند؟",
      a: "پیشنهاد کردند ریاست قبیله و ثروت فراوان را بپذیرد و از عقاید خود دست بردارد."
    },
    {
      q: "نخستین شهیدان راه اسلام چه کسانی بودند؟",
      a: "یاسر و همسرش سمیه."
    },
    {
      q: "مسلمانان نخستین بار به کدام سرزمین مهاجرت کردند؟",
      a: "حبشه."
    },
    {
      q: "تحریم اقتصادی و اجتماعی مسلمانان چه بود و مسلمانان به کجا پناه بردند؟",
      a: "ممنوعیت خرید و فروش و ازدواج با مسلمانان؛ مسلمانان به شعب ابوطالب پناه بردند و حدود سه سال تحمل کردند."
    },
    {
      q: "پیامبر در سال‌های ۱۲ و ۱۳ بعثت با چه گروهی پیمان بست و هدف چه بود؟",
      a: "با گروهی از مردم یثرب پیمان بست؛ هدف، زمینه‌سازی برای هجرت و تشکیل حکومت اسلامی بود."
    }
  ];

  let currentIndex = 0;
  const flashcardElement = document.getElementById('flashcard');
  const questionText = document.getElementById('question-text');
  const answerText = document.getElementById('answer-text');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  function updateCard() {
    flashcardElement.classList.remove('flipped');
    
    setTimeout(() => {
      questionText.innerText = flashcards[currentIndex].q;
      answerText.innerText = flashcards[currentIndex].a;
      
      const persianNumbers = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
      const currentPersian = String(currentIndex + 1).replace(/\d/g, d => persianNumbers[d]);
      const totalPersian = String(flashcards.length).replace(/\d/g, d => persianNumbers[d]);
      counter.innerText = `${currentPersian} از ${totalPersian}`;
      
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === flashcards.length - 1;
    }, 150);
  }

  function flipCard() {
    flashcardElement.classList.toggle('flipped');
  }

  function nextCard() {
    if (currentIndex < flashcards.length - 1) {
      currentIndex++;
      updateCard();
    }
  }

  function prevCard() {
    if (currentIndex > 0) {
      currentIndex--;
      updateCard();
    }
  }

  updateCard();
</script>

</body>
</html>
