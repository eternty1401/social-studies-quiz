<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فلش کارت‌های مهم نوبت اول - پایه هشتم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
  body {
    background-color: #f4f7f6;
    background-image: radial-gradient(#d1e0e0 1px, transparent 1px);
    background-size: 20px 20px;
    color: #2c3e50; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  .container {
    background: #fff; width: 100%; max-width: 800px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; border: 1px solid #eef2f5;
    text-align: center;
  }
  .header { margin-bottom: 30px; border-bottom: 2px dashed #eef2f5; padding-bottom: 20px; }
  .header h1 { color: #2980b9; font-size: 1.6rem; margin-bottom: 8px; }
  .header p { color: #7f8c8d; font-size: 0.95rem; }

  .flashcard-container { perspective: 1000px; width: 100%; height: 320px; margin-bottom: 30px; cursor: pointer; }
  .flashcard { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard-front, .flashcard-back {
    position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 30px; box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }
  .flashcard-front { background: linear-gradient(135deg, #2980b9, #1f618d); color: #fff; }
  .flashcard-back { background: linear-gradient(135deg, #ecf0f1, #bdc3c7); color: #2c3e50; transform: rotateY(180deg); }

  .card-content { font-size: 1.15rem; font-weight: 900; line-height: 1.9; }
  .card-label { position: absolute; top: 15px; right: 20px; font-size: 0.8rem; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-weight: 700; }
  .flashcard-back .card-label { background: rgba(0,0,0,0.05); color: #7f8c8d; }
  .card-lesson { position: absolute; top: 15px; left: 20px; font-size: 0.75rem; background: rgba(0,0,0,0.15); padding: 4px 10px; border-radius: 20px; font-weight: 700; }
  .flashcard-back .card-lesson { background: rgba(0,0,0,0.05); color: #7f8c8d; }
  .click-hint { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; opacity: 0.7; }

  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .nav-btn {
    background: #2980b9; color: #fff; border: none; padding: 12px 25px; border-radius: 30px; font-weight: 700; font-family: inherit;
    font-size: 1rem; cursor: pointer; transition: 0.3s;
  }
  .nav-btn:hover { background: #1f618d; transform: translateY(-2px); }
  .nav-btn:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; }
  .counter { font-weight: 900; font-size: 1.1rem; color: #7f8c8d; background: #ecf0f1; padding: 8px 20px; border-radius: 30px; }
  .back-home { display: inline-block; margin-top: 30px; background: #2c3e50; color: #fff; text-decoration: none; padding: 10px 25px; border-radius: 30px; font-weight: 700; transition: 0.3s; }
  .back-home:hover { background: #1a252f; }

  @media(max-width:600px) {
    .container { padding: 20px; }
    .flashcard-container { height: 460px; }
    .card-content { font-size: 0.95rem; }
    .controls { flex-direction: column; gap: 15px; }
    .nav-btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>🎴 فلش کارت‌های مهم نوبت اول</h1>
    <p>مرور نکات کلیدی درس ۱ تا ۱۲ — مطالعات اجتماعی پایه هشتم</p>
  </div>

  <div class="flashcard-container" onclick="flipCard()">
    <div class="flashcard" id="flashcard">
      <div class="flashcard-front">
        <span class="card-label">سوال</span>
        <span class="card-lesson" id="lesson-badge-front">درس ۱</span>
        <div class="card-content" id="question-text">سوال اینجا قرار می‌گیرد</div>
        <span class="click-hint">👆 برای دیدن جواب کلیک کنید</span>
      </div>
      <div class="flashcard-back">
        <span class="card-label">جواب</span>
        <span class="card-lesson" id="lesson-badge-back">درس ۱</span>
        <div class="card-content" id="answer-text">جواب اینجا قرار می‌گیرد</div>
        <span class="click-hint">👆 برای دیدن سوال کلیک کنید</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prev-btn" onclick="prevCard()">▶ کارت قبلی</button>
    <div class="counter" id="counter">۱ از ۵۰</div>
    <button class="nav-btn" id="next-btn" onclick="nextCard()">کارت بعدی ◀</button>
  </div>

  <a href="hashtom.html" class="back-home">🔙 بازگشت به صفحه دروس</a>

</div>

<script>
  const flashcards = [
    // ===== درس ۱: تعاون (۱) =====
    { lesson: "درس ۱", q: "تعاون را تعریف کنید.", a: "تعاون یعنی همکاری و یاری رساندن به یکدیگر." },
    { lesson: "درس ۱", q: "آیهٔ تعاون در قرآن کریم چه می‌فرماید؟", a: "«وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ» — در کارهای نیک و پرهیزکاری یکدیگر را یاری کنید و در گناه و ستمکاری همکاری نکنید. (مائده، ۲)" },
    { lesson: "درس ۱", q: "سه نمونه از جلوه‌های تعاون را نام ببرید.", a: "اظهار دوستی و محبت، همدلی و خوشحال کردن یکدیگر، هدیه دادن، صلح و آشتی، قرض دادن، رفع مشکلات مردم، مشارکت برای فقرا." },
    { lesson: "درس ۱", q: "حدیث پیامبر ﷺ دربارهٔ اهمیت به امور مسلمانان چه بود؟", a: "«مَنْ أَصْبَحَ لَا یَهْتَمُّ بِأُمُورِ الْمُسْلِمِینَ فَلَیْسَ مِنْهُمْ» — هر کس صبح کند و به امور مسلمانان اهمیت ندهد، از آن‌ها نیست. (وسائل الشیعه، ۱۱)" },
    { lesson: "درس ۱", q: "تعاون در خانه و مدرسه چه فایده‌ای دارد؟", a: "باعث صمیمیت و محبت بیشتر بین اعضا می‌شود، کارها بهتر پیش می‌رود و هر عضو احساس مفید بودن می‌کند." },

    // ===== درس ۲: تعاون (۲) =====
    { lesson: "درس ۲", q: "انفاق را تعریف کنید.", a: "بخشش مال، علم، توانایی‌ها و وقت خود به کسانی که نیازمند هستند، انفاق نامیده می‌شود." },
    { lesson: "درس ۲", q: "وقف چیست؟", a: "بخشیدن اموال و دارایی‌ها به منظور استفادهٔ عمومی و خیرات است که تا ابد باید به همان صورت معین استفاده شود." },
    { lesson: "درس ۲", q: "واقف کیست؟", a: "کسی که چیزی را وقف می‌کند." },
    { lesson: "درس ۲", q: "شرکت تعاونی چه ویژگی‌هایی دارد؟", a: "همهٔ اعضا با هم برابرند (هر کس یک حق رأی دارد)، هدف حل مشکلات اقتصادی و ایجاد رفاه است، منافع به‌طور برابر توزیع می‌شود." },
    { lesson: "درس ۲", q: "مؤسسات خیریه چه نقشی در جامعه دارند؟", a: "به افراد نیازمند و آسیب‌دیده کمک می‌کنند و در اموری مانند حمایت از بیماران خاص، معلولان، سالمندان، ایتام، ساخت مدرسه و درمانگاه فعالیت دارند." },

    // ===== درس ۳: ساختار و تشکیلات دولت =====
    { lesson: "درس ۳", q: "سه قوّهٔ حاکم در کشور ما کدام‌اند؟", a: "قوّهٔ مقننه، قوّهٔ قضائیه، قوّهٔ مجریّه — که همه زیر نظر مقام رهبری اداره می‌شوند." },
    { lesson: "درس ۳", q: "قوّهٔ مجریه همان چیست؟", a: "دولت. ریاست قوّهٔ مجریه بر عهدهٔ رئیس‌جمهور است." },
    { lesson: "درس ۳", q: "رئیس‌جمهور چگونه انتخاب می‌شود؟", a: "با رأی مستقیم مردم، برای مدت چهار سال. انتخاب مجدد او برای یک دورهٔ چهارسالهٔ دیگر مانعی ندارد." },
    { lesson: "درس ۳", q: "شرایط رئیس‌جمهور طبق قانون اساسی چیست؟", a: "ایرانی‌الاصل، تابع ایران، مدیر و مدبّر، دارای حسن سابقه و امانت و تقوا، مؤمن و معتقد به مبانی جمهوری اسلامی ایران و مذهب رسمی کشور." },
    { lesson: "درس ۳", q: "تنفیذ و تحلیف رئیس‌جمهور یعنی چه؟", a: "تنفیذ: امضای حکم رئیس‌جمهور توسط رهبر. تحلیف: سوگند رئیس‌جمهور در مجلس شورای اسلامی." },
    { lesson: "درس ۳", q: "کابینه (هیئت دولت) از چه کسانی تشکیل می‌شود؟", a: "از رئیس‌جمهور، معاونان و وزیران." },
    { lesson: "درس ۳", q: "رأی اعتماد مجلس به وزیران یعنی چه؟", a: "پس از معرفی وزیر از سوی رئیس‌جمهور به مجلس، نمایندگان دربارهٔ صلاحیت او اظهارنظر و رأی می‌دهند. وزیر با رأی اعتماد مجلس کار خود را شروع می‌کند." },

    // ===== درس ۴: وظایف دولت =====
    { lesson: "درس ۴", q: "شهروندان در برابر دولت چه وظایفی دارند؟", a: "احترام به قوانین و مقررات، مشارکت و همکاری صمیمانه با دولت، پرداخت مالیات، دفاع از کشور در هنگام جنگ." },
    { lesson: "درس ۴", q: "طبق قانون اساسی، دولت چه وظایفی دارد؟", a: "فراهم کردن شرایط سواد و آموزش، بهداشت، شغل مناسب، رفاه، امنیت، فرهنگ و اخلاق اسلامی؛ تجهیزات زیربنایی و خدمات عمومی مانند راه، پل، بیمارستان، مدرسه، سد، آب، برق و گاز." },
    { lesson: "درس ۴", q: "رئیس‌جمهور علاوه بر هدایت وزیران چه وظایف دیگری دارد؟", a: "امضای قراردادهای بین‌المللی، امضای استوارنامهٔ سفیران، پذیرش استوارنامهٔ سفیران دیگر کشورها، اعطای نشان‌های دولتی." },
    { lesson: "درس ۴", q: "لایحه چیست؟", a: "پیشنهادی است که از سوی دولت به مجلس ارائه می‌شود و اگر مجلس آن را تأیید کند، به قانون تبدیل می‌شود." },
    { lesson: "درس ۴", q: "استیضاح یعنی چه؟", a: "توضیح خواستن نمایندگان از وزیر. وزیر باید در مجلس حاضر شود و توضیح دهد و دوباره از مجلس رأی اعتماد بگیرد." },
    { lesson: "درس ۴", q: "بودجه چیست؟", a: "سندی که دولت در آن درآمدها و هزینه‌های یک کشور را برای یک سال پیش‌بینی می‌کند و باید در مجلس تصویب شود." },
    { lesson: "درس ۴", q: "درآمدهای دولت از چه راه‌هایی تأمین می‌شود؟", a: "۱. درآمدهای حاصل از صادرات نفت ۲. درآمدهای حاصل از مالیات ۳. سایر درآمدها (خدمات برق، آب، گاز، تلفن، گذرنامه و…)." },
    { lesson: "درس ۴", q: "مالیات چیست؟", a: "پولی است که بر طبق قانون، افراد و مؤسسات به دولت می‌پردازند تا در جهت ادارهٔ امور کشور مورد استفاده قرار بگیرد." },

    // ===== درس ۵: آسیب‌های اجتماعی و پیشگیری از آنها =====
    { lesson: "درس ۵", q: "دورهٔ نوجوانی چه دوره‌ای است؟", a: "دورهٔ بین ۱۲ تا ۱۸ سال که در آن افراد از نظر جسمانی و ذهنی و اجتماعی دچار تغییرات می‌شوند (بلوغ)." },
    { lesson: "درس ۵", q: "چند ویژگی دوران نوجوانی را نام ببرید.", a: "هویت‌جویی، هیجان‌طلبی و میل به تجربه کردن، استقلال‌طلبی، حساسیت نسبت به خود، شک و تردید." },
    { lesson: "درس ۵", q: "پرخاشگری چیست؟", a: "پرخاشگری نتیجهٔ کنترل (مهار) نکردن خشم است و می‌تواند به اشکال مختلف مانند آزار و اذیت، کتک زدن، مسخره کردن، شکستن وسایل و ناسزا گفتن بروز کند." },
    { lesson: "درس ۵", q: "سه قاعدهٔ مهم در هنگام خشم و عصبانیت چیست؟", a: "۱. نباید به وسایل یا اموال خودم و دیگران صدمه بزنم. ۲. نباید به دیگران صدمه بزنم. ۳. نباید به خودم صدمه بزنم." },
    { lesson: "درس ۵", q: "موادّ مخدّر چه تأثیری بر انسان دارند؟", a: "موادی هستند که تغییراتی روی دستگاه عصبی ایجاد می‌کنند و باعث کاهش هوشیاری می‌شوند. فرد پس از مدتی به آن‌ها وابستگی پیدا می‌کند و برای به دست آوردنشان هر کاری می‌کند." },
    { lesson: "درس ۵", q: "چند مورد از علل گرایش افراد به موادّ مخدّر را نام ببرید.", a: "فرار از مشکلات، نداشتن مهارت «نه گفتن»، تأثیر دوستان ناباب، کنجکاوی، خودنمایی." },

    // ===== درس ۶: قوّهٔ قضائیه =====
    { lesson: "درس ۶", q: "قوّهٔ قضائیه چه وظیفه‌ای دارد؟", a: "برقراری عدالت اجتماعی، نظارت بر اجرای قوانین، برخورد با تخلفات، مجازات متخلفان و پشتیبانی از حقوق فردی و اجتماعی افراد." },
    { lesson: "درس ۶", q: "رئیس قوّهٔ قضائیه چگونه انتخاب می‌شود؟", a: "از سوی رهبر جمهوری اسلامی به مدت پنج سال انتخاب می‌شود. باید فردی مجتهد، عادل، آگاه به امور قضایی، مدیر و مدبّر باشد." },
    { lesson: "درس ۶", q: "وظایف قوّهٔ قضائیه را نام ببرید.", a: "رسیدگی به شکایت‌های مردم و حل اختلافات، کشف جرم و تعقیب و مجازات مجرمان، پیشگیری از وقوع جرم، گسترش عدل و آزادی‌های مشروع، نظارت بر حسن اجرای قوانین." },
    { lesson: "درس ۶", q: "شورای حل اختلاف چه نقشی دارد؟", a: "برای حل اختلافات کوچک و محلی، افراد می‌توانند به شورای حل اختلاف مراجعه کنند تا از راه گفت‌وگو و مسالمت‌آمیز اختلاف حل شود." },
    { lesson: "درس ۶", q: "دعاوی کیفری چیست؟", a: "دعاوی مربوط به اعمالی که دادگاه برای فردی که مرتکب جرمی شده است، مجازات تعیین می‌کند. مثال: فحاشی، افترا، غصب عنوان." },
    { lesson: "درس ۶", q: "دعاوی حقوقی چیست؟", a: "دعاوی مربوط به اعمالی که دادگاه مجازاتی تعیین نمی‌کند، بلکه افراد را ملزم می‌کند که تکالیفشان را انجام دهند یا حقوق قانونی دیگران را بدهند." },
    { lesson: "درس ۶", q: "وکیل کیست؟", a: "کسی که در رشتهٔ حقوق درس خوانده و به قوانین آشناست و پروانهٔ وکالت دارد. افراد می‌توانند در دادگاه او را برای دفاع از حقوق خود انتخاب کنند." },
    { lesson: "درس ۶", q: "جرم چیست؟", a: "هر عملی که قانون را نقض کند و برای آن مجازاتی تعیین شده باشد (مجازاتی در پی داشته باشد)." },

    // ===== درس ۷: ارتباط و رسانه =====
    { lesson: "درس ۷", q: "سه عنصر اصلی ارتباط کدام‌اند؟", a: "فرستنده (ارسال‌کننده پیام)، گیرنده (دریافت‌کننده پیام)، پیام (محتوای ارتباط)." },
    { lesson: "درس ۷", q: "بازخورد را تعریف کنید.", a: "اگر گیرنده به فرستنده پیامی بفرستد و او را متوجه کند که معنی پیام را دریافت کرده، به این عمل «بازخورد» می‌گویند." },
    { lesson: "درس ۷", q: "رسانه را تعریف کنید.", a: "هر وسیله‌ای که پیامی را از فرستنده به گیرنده منتقل کند، رسانه نام دارد. مانند زبان، کتاب، روزنامه، تلفن، رادیو، تلویزیون، اینترنت." },
    { lesson: "درس ۷", q: "چاپارخانه چه بود؟", a: "از ابتکارات ایرانیان باستان. در مسیر راه‌ها ساخته می‌شد و در آن اسب‌های تازه‌نفس نگهداری می‌شد تا چاپارها (پیک‌ها) پیام‌ها را در فاصله‌های دور انتقال دهند." },
    { lesson: "درس ۷", q: "ماشین چاپ توسط چه کسی اختراع شد؟", a: "گوتنبرگ آلمانی (در قرن ۱۵ میلادی). این اختراع موجب تحول بزرگی در تولید کتاب و انتشار علوم و فنون در همه‌جا شد." },
    { lesson: "درس ۷", q: "چه کسی تلفن را اختراع کرد و در چه سالی؟", a: "گراهام بل، در سال ۱۸۷۶ میلادی." },
    { lesson: "درس ۷", q: "چه کسی رادیو را اختراع کرد و در چه سالی؟", a: "مارکونی، در سال ۱۸۹۵ میلادی." },
    { lesson: "درس ۷", q: "نخستین ماهواره جهان چه نام داشت؟", a: "«اسپوتنیک ۱» که توسط روس‌ها در سال ۱۹۵۷ میلادی به فضا فرستاده شد." },
    { lesson: "درس ۷", q: "فناوری اطلاعات و ارتباطات (ICT) را تعریف کنید.", a: "روندهای گردآوری، ذخیره‌سازی، پردازش و مبادله و انتقال اطلاعات است." },
    { lesson: "درس ۷", q: "اینترنت چیست؟", a: "شبکه‌ای از اتصال هزاران رایانه که افراد می‌توانند با یکدیگر ارتباط برقرار کنند، گفت‌وگو کنند، وارد کتابخانه‌ها شوند و اطلاعات خود را در اختیار دیگران قرار دهند." },

    // ===== درس ۸: رسانه‌ها در زندگی ما =====
    { lesson: "درس ۸", q: "دولت الکترونیکی چیست؟", a: "ارائهٔ خدمات دولتی از طریق اینترنت، مانند پرداخت قبض، ثبت‌نام حج و زیارت، ثبت‌نام کنکور، صدور گواهینامه." },
    { lesson: "درس ۸", q: "دو مورد از آثار منفی رسانه‌ها را نام ببرید.", a: "ترویج خشونت در فیلم‌ها، ترویج بی‌بندوباری در فضای مجازی، آگهی‌های بازرگانی گمراه‌کننده، بازی‌های رایانه‌ای مضر، کم‌شدن ارتباط چهره‌به‌چهره." },
    { lesson: "درس ۸", q: "چرا نباید عکس‌ها و فیلم‌های خانوادگی را در اینترنت منتشر کرد؟", a: "زیرا ممکن است مورد سرقت و سوءاستفاده قرار بگیرد. حتی نباید برای دوستان ارسال کرد." }
   ,
// ===== درس ۹: ظهور اسلام در شبه‌جزیرهٔ عربستان =====
{ lesson: "درس ۹", q: "شبه‌جزیرهٔ عربستان کجا واقع شده و مساحت آن چقدر است؟", a: "در جنوب غربی آسیا، حدود سه میلیون کیلومتر مربع." },
{ lesson: "درس ۹", q: "مهم‌ترین شهرهای حجاز کدام بودند؟", a: "مکه، یثرب (مدینه) و طائف." },
{ lesson: "درس ۹", q: "به دوران پیش از بعثت در عربستان چه می‌گفتند؟", a: "عصر جاهلیت." },
{ lesson: "درس ۹", q: "سه ویژگی عصر جاهلیت را نام ببرید.", a: "۱. بت‌پرستی ۲. تعصب قبیله‌ای و جنگ و خونریزی ۳. بی‌سوادی و موقعیت پایین زنان." },
{ lesson: "درس ۹", q: "بعثت پیامبر اکرم ﷺ در چه تاریخی و در چه سنی رخ داد؟", a: "۲۷ رجب، در ۴۰ سالگی، با نزول فرشتهٔ وحی در غار حرا." },
{ lesson: "درس ۹", q: "نخستین مسلمانان چه کسانی بودند؟", a: "حضرت خدیجه و حضرت علی ﷺ." },
{ lesson: "درس ۹", q: "نخستین شهیدان راه اسلام چه کسانی بودند؟", a: "یاسر و همسرش سمیه." },
{ lesson: "درس ۹", q: "مسلمانان نخستین بار به کدام سرزمین مهاجرت کردند؟", a: "حبشه." },
{ lesson: "درس ۹", q: "تحریم اقتصادی و اجتماعی مسلمانان چه بود؟", a: "ممنوعیت خرید و فروش و ازدواج با مسلمانان؛ مسلمانان به شعب ابوطالب پناه بردند و حدود سه سال تحمل کردند." },
{ lesson: "درس ۹", q: "پیامبر در سال‌های ۱۲ و ۱۳ بعثت با چه گروهی پیمان بست و هدف چه بود؟", a: "با گروهی از مردم یثرب پیمان بست؛ هدف، زمینه‌سازی برای هجرت و تشکیل حکومت اسلامی بود." },

// ===== درس ۱۰: از رحلت پیامبر تا قیام کربلا =====
{ lesson: "درس ۱۰", q: "رحلت پیامبر اکرم ﷺ در چه تاریخی رخ داد؟", a: "۲۸ صفر سال ۱۱ هجری در مدینه." },
{ lesson: "درس ۱۰", q: "ماجرای سقیفه چه بود؟", a: "پس از رحلت پیامبر، گروهی از مسلمانان در سقیفهٔ بنی‌ساعده گرد آمدند و با ابوبکر بیعت کردند و او را خلیفهٔ اول شناختند." },
{ lesson: "درس ۱۰", q: "خلفای سه‌گانه چه کسانی بودند؟", a: "ابوبکر (۲ سال)، عمر (۱۰ سال)، عثمان." },
{ lesson: "درس ۱۰", q: "امام علی ﷺ چگونه به خلافت رسید؟", a: "پس از کشته شدن عثمان، با اصرار زیاد مردم و بیعت مهاجرین و انصار، خلافت را پذیرفت." },
{ lesson: "درس ۱۰", q: "مرکز خلافت امام علی ﷺ کدام شهر بود؟", a: "کوفه." },
{ lesson: "درس ۱۰", q: "سه جنگ تحمیلی بر امام علی ﷺ کدام‌اند؟", a: "جنگ جمل، جنگ صفین، جنگ نهروان." },
{ lesson: "درس ۱۰", q: "امام حسن ﷺ با چه کسی صلح کرد؟", a: "معاویه." },
{ lesson: "درس ۱۰", q: "معاویه چه سیاست‌هایی در پیش گرفت؟", a: "بدگویی به امام علی ﷺ بر منبر، آزار یاران امام، شهادت امام حسن ﷺ و موروثی کردن خلافت با انتخاب یزید." },
{ lesson: "درس ۱۰", q: "واقعهٔ کربلا در چه روزی رخ داد؟", a: "روز عاشورا، در سرزمین کربلا (نینوا)، امام حسین ﷺ و یارانش به شهادت رسیدند." },
{ lesson: "درس ۱۰", q: "هدف قیام امام حسین ﷺ چه بود؟", a: "اصلاح امت جدّش رسول الله ﷺ، امر به معروف و نهی از منکر، پیاده کردن سیرهٔ پیامبر ﷺ و امام علی ﷺ." },

// ===== درس ۱۱: ورود اسلام به ایران =====
{ lesson: "درس ۱۱", q: "در زمان ظهور اسلام، چه کسی بر ایران حکومت می‌کرد و با نامهٔ پیامبر چه کرد؟", a: "خسروپرویز؛ او نامهٔ پیامبر اکرم ﷺ را پاره کرد و دعوت اسلام را نپذیرفت." },
{ lesson: "درس ۱۱", q: "سه مورد از علل ضعف و سقوط حکومت ساسانی را نام ببرید.", a: "۱. شورش‌های سیاسی و رقابت‌های درباری ۲. نارضایتی مردم از نظام طبقاتی و مالیات‌های سنگین ۳. خرابی زمین‌های کشاورزی، قحطی و شیوع بیماری." },
{ lesson: "درس ۱۱", q: "نبرد قادسیه چه نتیجه‌ای داشت؟", a: "شکست ارتش ساسانی، کشته شدن رستم فرخ‌زاد و تصرف تیسفون (پایتخت ساسانیان) با غنائم بسیار." },
{ lesson: "درس ۱۱", q: "نبرد نهاوند چه نتیجه‌ای داشت؟", a: "ضربهٔ نهایی بر پیکر ارتش ساسانی وارد شد و یزدگرد سوم دیگر نتوانست سپاهی برای مقابله با اعراب مسلمان گردآوری کند." },
{ lesson: "درس ۱۱", q: "آخرین پادشاه ساسانی چه کسی بود و چه سرنوشتی پیدا کرد؟", a: "یزدگرد سوم؛ او به دست آسیابانی در مرو به قتل رسید (سال ۳۱ هجری)." },
{ lesson: "درس ۱۱", q: "در دوران امویان، ایرانیان چه وضعیتی داشتند؟", a: "مورد تحقیر و توهین قرار می‌گرفتند و اجازه نداشتند مقام و منصب مهمی مانند حکومت ولایات یا فرماندهی سپاه را عهده‌دار شوند." },
{ lesson: "درس ۱۱", q: "سرنوشت ابومسلم خراسانی و برمکیان چه شد؟", a: "منصور عباسی ابومسلم را ناجوانمردانه به قتل رساند. هارون‌الرشید نیز برمکیان را از قدرت برکنار و به قتل رساند." },
{ lesson: "درس ۱۱", q: "سلمان فارسی که بود؟", a: "به گفتهٔ برخی مورخان، نخستین ایرانی مسلمان بود. در جنگ احزاب (خندق) پیشنهاد کندن خندق را داد. پیامبر ﷺ فرمود: «سلمان از ما اهل بیت است.»" },
{ lesson: "درس ۱۱", q: "چند مورد از علل گرایش ایرانیان به دین اسلام را بنویسید.", a: "پیام برابری و برادری اسلام، اخلاق و رفتار پیامبر و امامان، عدالت امام علی ﷺ، حضور امام رضا ﷺ و حضرت معصومه ﷺ در ایران." },

// ===== درس ۱۲: عصر طلایی فرهنگ و تمدن ایرانی ــ اسلامی =====
{ lesson: "درس ۱۲", q: "«عصر طلایی فرهنگ و تمدن ایرانی ــ اسلامی» به چه دوره‌ای گفته می‌شود؟", a: "به دورهٔ قرن سوم تا پنجم هجری که در آن فرهنگ و تمدن ایرانی ــ اسلامی به اوج شکوفایی رسید." },
{ lesson: "درس ۱۲", q: "حدیث پیامبر اکرم ﷺ دربارهٔ ایرانیان چه بود؟", a: "«اگر علم در ستارهٔ ثریا و در آسمان‌ها باشد، مردانی از سرزمین پارس (ایرانیان) به آن دست پیدا خواهند کرد.»" },
{ lesson: "درس ۱۲", q: "سه تن از دانشمندان ایرانی در رشتهٔ حدیث و فقه را با آثارشان نام ببرید.", a: "بخاری (صحیح بخاری)، کلینی (کافی)، شیخ طوسی (تهذیب الاحکام)." },
{ lesson: "درس ۱۲", q: "ابوعلی سینا و فارابی در چه رشته‌ای بودند و چه آثاری دارند؟", a: "هر دو در فلسفه بودند. ابوعلی سینا: شفا و دانشنامهٔ علایی. فارابی: رساله فلسفه (و در موسیقی نیز تبحر داشت)." },
{ lesson: "درس ۱۲", q: "چهار تن از مورخان ایرانی را با آثارشان نام ببرید.", a: "طبری (تاریخ طبری)، دینوری (اخبارالطوال)، بلعمی (تاریخ بلعمی)، حمزهٔ اصفهانی (تاریخ پیامبران و پادشاهان)." },
{ lesson: "درس ۱۲", q: "پنج تن از جغرافی‌دانان ایرانی را با آثارشان نام ببرید.", a: "ابن خردادبه (مسالک و ممالک)،
